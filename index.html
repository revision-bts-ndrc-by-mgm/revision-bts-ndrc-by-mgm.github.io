e5q64","q":"Face à un avis négatif, il faut d'abord…","o":["Le supprimer","Remercier le client pour son retour","Accuser le client","L'ignorer"],"a":1,"e":"Remercier, reconnaître, s'excuser, proposer une solution, inviter à revenir."},{"id":"e5q65","q":"En cas de bad buzz, il faut…","o":["Supprimer toutes les critiques","Réagir vite, reconnaître, corriger et communiquer clairement","Attendre que ça passe","Fermer les comptes"],"a":1,"e":"Ne jamais supprimer les critiques légitimes."},{"id":"e5q66","q":"La portée d'une publication, c'est…","o":["Le nombre total d'affichages","Le nombre de personnes qui l'ont vue","Le nombre de clics","Le nombre d'abonnés"],"a":1,"e":"Les impressions comptent tous les affichages (une personne peut voir plusieurs fois)."},{"id":"e5q67","q":"Une communauté passe de 2 000 à 2 500 abonnés. Sa croissance est de…","o":["20 %","25 %","50 %","500 %"],"a":1,"e":"(2 500 − 2 000) / 2 000 × 100 = 25 %."},{"id":"e5q68","q":"Le SEM regroupe…","o":["SEO + SEA","SMO + SMA","CRM + ERP","CTI + SVI"],"a":0,"e":"Le marketing des moteurs de recherche."},{"id":"e5q69","q":"Le SMO consiste à…","o":["Payer des annonces Google","Optimiser sa présence sur les réseaux sociaux","Optimiser le site pour les moteurs","Envoyer des SMS"],"a":1,"e":"La SMA est la publicité sur les réseaux."},{"id":"e5q70","q":"Avantage principal du SEA par rapport au SEO ?","o":["Il est gratuit","Il est rapide","Il dure toujours","Il ne demande aucun mot-clé"],"a":1,"e":"Le SEO est gratuit mais lent ; le SEA est payant mais immédiat."},{"id":"e5q71","q":"Combien de balises H1 par page ?","o":["Aucune","Une seule, avec le mot-clé","Au moins cinq","Autant que de paragraphes"],"a":1,"e":"Une H1, puis des H2, H3… pour structurer."},{"id":"e5q72","q":"Longueur conseillée d'une balise title ?","o":["Environ 20 caractères","Environ 60 caractères","Environ 300 caractères","Aucune limite"],"a":1,"e":"Mot-clé au début. Meta description : environ 155 caractères."},{"id":"e5q73","q":"Le maillage interne, ce sont…","o":["Des liens venant d'autres sites","Des liens entre les pages d'un même site","Les câbles du serveur","Les menus déroulants"],"a":1,"e":"Les backlinks viennent d'autres sites."},{"id":"e5q74","q":"Le référencement local passe notamment par…","o":["Une fiche d'établissement sur les cartes et les avis clients","Des backlinks étrangers","Un site sans adresse","Des publicités TV"],"a":0,"e":"Être trouvé par les clients proches."},{"id":"e5q75","q":"Pour le SEO technique, un site doit être…","o":["Lent mais beau","Rapide, adapté au mobile et sécurisé (https)","Uniquement en anglais","Sans images"],"a":1,"e":"Ce sont des critères pris en compte par les moteurs."},{"id":"e5q76","q":"Le tunnel de conversion suit les étapes…","o":["Visite, fiche produit, panier, commande, paiement","Prospect, client, ambassadeur","Attirer, convertir, fidéliser","Commande, livraison, retour"],"a":0,"e":"À chaque étape, des visiteurs abandonnent : il faut réduire ces pertes."},{"id":"e5q77","q":"Le retargeting nécessite…","o":["Rien de particulier","Le consentement aux cookies","Un abonnement payant du client","Un rendez-vous en magasin"],"a":1,"e":"Il repose sur les cookies publicitaires."},{"id":"e5q78","q":"Vendre aussi sur une grande plateforme comme Amazon, c'est utiliser…","o":["Une landing page","Une place de marché (marketplace)","Un CMS","Un SVI"],"a":1,"e":"Elle apporte du trafic, mais prend une commission."},{"id":"e5q79","q":"Une relance de panier abandonné, c'est…","o":["Un e-mail de rappel, parfois avec une offre","La suppression du panier","Un appel du directeur","Un remboursement"],"a":0,"e":"Action classique pour récupérer des ventes."},{"id":"e5q80","q":"Pour rassurer l'acheteur en ligne, on met en avant…","o":["Les frais cachés","Les avis, labels, paiement sécurisé et retours faciles","Un délai de livraison flou","Un formulaire très long"],"a":1,"e":"La confiance est clé en e-commerce."},{"id":"e5q81","q":"La DSP2 impose…","o":["Les cookies","L'authentification forte du client (ex. 3D Secure)","Les mentions légales","La livraison gratuite"],"a":1,"e":"Directive européenne sur les services de paiement."},{"id":"e5q82","q":"Avant de valider une commande en ligne, le client doit voir…","o":["Une publicité","Un récapitulatif et un bouton clair « commande avec obligation de paiement »","Le stock du fournisseur","Le CA du site"],"a":1,"e":"Puis une confirmation par e-mail."},{"id":"e5q83","q":"Pour les cookies publicitaires, refuser doit être…","o":["Impossible","Aussi simple qu'accepter","Payant","Caché dans les CGV"],"a":1,"e":"Exigence de la CNIL."},{"id":"e5q84","q":"Le DSA impose aux plateformes…","o":["D'arrêter la publicité","De lutter contre les contenus illicites","D'interdire les avis","De baisser leurs prix"],"a":1,"e":"Règlement européen sur les services numériques."},{"id":"e5q85","q":"20 000 visites, 400 commandes, 24 000 € de CA : le panier moyen est de…","o":["24 €","60 €","50 €","400 €"],"a":1,"e":"24 000 / 400 = 60 €."},{"id":"e5q86","q":"Coût d'acquisition client : 3 000 € de dépenses marketing pour 150 nouveaux clients, soit…","o":["15 €","20 €","45 €","200 €"],"a":1,"e":"3 000 / 150 = 20 € par nouveau client."},{"id":"e5q87","q":"1 500 € de publicité génèrent 6 000 € de CA. Le ROAS est de…","o":["0,25","4","40 %","4 500 €"],"a":1,"e":"Retour sur dépenses publicitaires = 6 000 / 1 500 = 4."},{"id":"e5q88","q":"Un visiteur qui tape directement l'adresse du site relève du trafic…","o":["Organique","Direct","Référent","Payant"],"a":1,"e":"Le trafic direct traduit la notoriété."},{"id":"e5q89","q":"Un visiteur arrivant par un lien depuis un autre site relève du trafic…","o":["Direct","Référent","Social","E-mail"],"a":1,"e":"Organique : moteur de recherche. Payant : annonces."},{"id":"e5q90","q":"Taux de réactivité d'un e-mailing =","o":["Clics / ouvertures","Ouvertures / reçus","Reçus / envoyés","Désinscrits / reçus"],"a":0,"e":"Il mesure l'intérêt du contenu chez ceux qui ont ouvert."},{"id":"e5q91","q":"Le taux de délivrabilité, c'est…","o":["Clics / reçus","E-mails reçus / envoyés","Ouvertures / clics","Ventes / e-mails"],"a":1,"e":"Il mesure la qualité de la liste et la réputation de l'expéditeur."},{"id":"e5q92","q":"66,7 % d'abandon de panier. Quelle analyse est la meilleure ?","o":["Rien à faire, c'est normal","Frais de livraison affichés trop tard ? Les annoncer dès la fiche produit et relancer les paniers","Augmenter les prix","Supprimer le panier"],"a":1,"e":"Identifier l'étape, la cause probable, puis une action précise."},{"id":"e5q93","q":"Sur WordPress, quelle est la différence entre un article et une page ?","o":["Aucune","L'article est daté (blog), la page est fixe (ex. « À propos »)","La page est payante","L'article ne peut pas avoir d'image"],"a":1,"e":"Articles organisés par catégories et étiquettes."},{"id":"e5q94","q":"Sur PrestaShop, une « déclinaison » d'un produit, c'est…","o":["Une promotion","Une variante (taille, couleur)","Une catégorie","Un client"],"a":1,"e":"Chaque déclinaison peut avoir son stock et son prix."},{"id":"e5q95","q":"Dans la partie pratique, avant de créer un produit, il faut…","o":["Créer sa catégorie d'abord","Créer une promotion","Vider le catalogue","Changer le thème"],"a":0,"e":"Faire les opérations dans l'ordre logique."},{"id":"e5q96","q":"Pendant la partie pratique, il faut…","o":["Travailler en silence","Commenter à voix haute ce que tu fais et pourquoi","Demander la réponse à l'examinateur","Ne rien vérifier"],"a":1,"e":"Puis vérifier le résultat côté visiteur."},{"id":"e5q97","q":"La méthode RFM segmente les clients selon…","o":["Revenu, famille, métier","Récence, fréquence, montant","Région, fidélité, marge","Réseau, forum, mail"],"a":1,"e":"Pour personnaliser les actions."},{"id":"e5q98","q":"Le principe de minimisation du RGPD signifie…","o":["Collecter le plus possible","Ne demander que les données utiles","Réduire les prix","Supprimer tous les fichiers"],"a":1,"e":"Avec une finalité précise et une base légale."},{"id":"e5q99","q":"En prospection, la CNIL recommande souvent de conserver les données d'un prospect…","o":["1 mois","3 ans après le dernier contact","10 ans","Sans limite"],"a":1,"e":"Durée de conservation limitée."},{"id":"e5q100","q":"Un lead, c'est…","o":["Un client fidèle","Un contact qualifié, intéressé","Un concurrent","Un influenceur"],"a":1,"e":"Un prospect qui a montré de l'intérêt."},{"id":"e5q101","q":"Une landing page est…","o":["La page d'accueil du site","La page d'atterrissage d'une campagne","La page des mentions légales","Une page d'erreur"],"a":1,"e":"Conçue pour convertir le visiteur d'une campagne."},{"id":"e5q102","q":"Un site « responsive » est…","o":["Un site qui répond vite aux e-mails","Un site adapté à tous les écrans","Un site sécurisé","Un site payant"],"a":1,"e":"Indispensable avec le trafic mobile."},{"id":"e5q103","q":"Le phygital, c'est…","o":["Un logiciel","Le mélange du physique et du digital","Une taxe numérique","Un réseau social"],"a":1,"e":"Ex. : bornes en magasin, click and collect, QR codes."},{"id":"e5q104","q":"Opt-in signifie…","o":["Le droit de refuser ensuite","L'accord préalable","Une promotion","Un désabonnement"],"a":1,"e":"Opt-out : droit de refuser ensuite."},{"id":"e5q105","q":"Le social selling, c'est…","o":["Vendre en s'appuyant sur les réseaux sociaux","Vendre à prix social","Vendre aux associations","Vendre en magasin"],"a":0,"e":"Notamment en B2B via les réseaux professionnels."},{"id":"e5q106","q":"Depuis le 1er janvier 2026, un contrat écrit marque-influenceur est obligatoire au-delà de…","o":["100 € HT","500 € HT","1 000 € HT","10 000 € HT"],"a":2,"e":"Avantages en nature compris (décret du 28 novembre 2025)."},{"id":"e5q107","q":"Quelle mention doit accompagner un contenu sponsorisé par une marque ?","o":["« Contenu libre »","« Publicité » ou « Collaboration commerciale »","« Avis personnel »","Aucune"],"a":1,"e":"Loi du 9 juin 2023 sur l'influence commerciale."},{"id":"e5q108","q":"Une photo modifiée publiée par un influenceur doit porter la mention…","o":["« Photo d'archive »","« Image retouchée »","« Copyright »","« Filtre »"],"a":1,"e":"Et « Image virtuelle » pour une image créée par IA."},{"id":"e5q109","q":"Pourquoi choisir des micro-influenceurs ?","o":["Ils ont toujours plus d'abonnés","Communautés plus engagées et coût souvent plus faible","Ils ne sont pas soumis à la loi","Ils sont tous gratuits"],"a":1,"e":"Les macro-influenceurs servent surtout la notoriété."},{"id":"e5q110","q":"Comment mesurer les ventes générées par un influenceur ?","o":["Au nombre d'abonnés","Avec un code promo ou un lien propre à l'influenceur","À la couleur du post","On ne peut pas"],"a":1,"e":"Puis calculer un coût par vente."},{"id":"e5q111","q":"Un CRC confié à un prestataire situé dans un pays proche est…","o":["Offshore","Nearshore","Internalisé","Back office"],"a":1,"e":"Offshore : pays lointain."},{"id":"e5q112","q":"Dans un CRC, le back office…","o":["Répond au téléphone","Traite les dossiers (remboursements, litiges)","Fait la publicité","Recrute les clients"],"a":1,"e":"Le front office est en contact direct avec le client."},{"id":"e5q113","q":"Le pré-header d'un e-mail, c'est…","o":["Le logo","Le court texte affiché après l'objet dans la boîte de réception","La signature","Le lien de désinscription"],"a":1,"e":"Il complète l'objet pour donner envie d'ouvrir."},{"id":"e5q114","q":"Un test A/B en e-mailing consiste à…","o":["Envoyer deux fois le même e-mail","Comparer deux versions (objet, heure) sur une partie de la liste","Tester l'adresse e-mail","Écrire en deux langues"],"a":1,"e":"On envoie ensuite la meilleure version au reste de la liste."},{"id":"e5q115","q":"Un SMS publicitaire non désiré se signale au…","o":["15","3117","33700","17"],"a":2,"e":"Service de signalement des spams SMS."},{"id":"e5q116","q":"Quel réseau social sert surtout la relation professionnelle B2B ?","o":["TikTok","LinkedIn","Pinterest","Snapchat"],"a":1,"e":"Expertise, recrutement, relation professionnelle."},{"id":"e5q117","q":"L'arborescence d'un site, c'est…","o":["Le nom de domaine","L'organisation des pages et de leurs liens","L'hébergeur","La charte graphique"],"a":1,"e":"Ex. : accueil, offre, à propos, contact."}],"r":[{"id":"e5r0","q":"Rédige une réponse publique à cet avis : « Livrée avec 10 jours de retard et personne ne répond au téléphone ! »","p":[{"t":"Remercier pour le retour","k":["merci","remerci"]},{"t":"S'excuser, reconnaître le problème","k":["excus","desole","regret","comprenons"]},{"t":"Proposer une solution ou un contact privé","k":["solution","geste","rembours","code","message prive","contact","e-mail","email"]},{"t":"Inviter à revenir","k":["revenir","a bientot","esperons","prochaine"]}],"m":"« Bonjour Julie, merci d'avoir pris le temps de nous écrire. Nous sommes sincèrement désolés pour ce retard de livraison et pour l'attente au téléphone : ce n'est pas l'expérience que nous voulons vous offrir. Nous vous avons envoyé un message privé pour comprendre ce qui s'est passé et vous proposer un geste commercial. Nous espérons avoir l'occasion de vous satisfaire lors de votre prochaine commande. L'équipe X »"},{"id":"e5r1","q":"Quelle différence entre SEO et SEA ? Quand privilégier l'un ou l'autre ?","p":[{"t":"SEO : référencement naturel, gratuit","k":["naturel","gratuit","organique"]},{"t":"SEA : référencement payant, au clic","k":["payant","clic","annonce","cpc","sponsoris"]},{"t":"SEO pour le long terme","k":["long terme","lent","durable"]},{"t":"SEA pour un résultat rapide","k":["rapide","court terme","lancement","promotion","immediat"]}],"m":"Le SEO (référencement naturel) consiste à optimiser son site pour remonter gratuitement dans les résultats des moteurs : c'est lent mais durable. Le SEA (référencement payant) consiste à acheter des annonces, payées au clic : c'est rapide mais s'arrête dès qu'on ne paie plus. On privilégie le SEA pour un lancement ou une promotion, et on travaille le SEO en continu pour le long terme."},{"id":"e5r2","q":"Un site a reçu 25 000 visites et 500 commandes pour 30 000 € de CA. Calcule le taux de conversion et le panier moyen, puis interprète.","p":[{"t":"Taux de conversion = 2 %","k":["2 %","2%","2 pour"]},{"t":"Panier moyen = 60 €","k":["60"]},{"t":"Une interprétation ou une proposition","k":["ameliorer","augmenter","propos","moyen","faible","bon","correct"]}],"m":"Taux de conversion = 500 / 25 000 × 100 = 2 % : 2 visiteurs sur 100 achètent. Panier moyen = 30 000 / 500 = 60 €. Pour progresser, on peut travailler la conversion (rassurer, simplifier le paiement, relancer les paniers abandonnés) et le panier moyen (ventes complémentaires, livraison offerte dès 70 €)."},{"id":"e5r3","q":"Explique la différence entre multicanal, cross-canal et omnicanal.","p":[{"t":"Multicanal : canaux séparés","k":["separe","independ","isole","plusieurs canaux"]},{"t":"Cross-canal : canaux complémentaires","k":["complet","click and collect","retrait","combin"]},{"t":"Omnicanal : données partagées, sans rupture","k":["partag","donnees","sans rupture","fluide","meme information"]}],"m":"Multicanal : l'entreprise utilise plusieurs canaux (magasin, site, téléphone) qui fonctionnent séparément. Cross-canal : les canaux se complètent dans un même achat, par exemple commander en ligne et retirer en magasin. Omnicanal : tous les canaux partagent les mêmes données, le client passe de l'un à l'autre sans rupture et sans répéter sa demande."},{"id":"e5r4","q":"Propose trois actions pour réduire l'abandon de panier sur un site e-commerce.","p":[{"t":"Afficher tôt les frais et délais de livraison","k":["frais de port","livraison","frais"]},{"t":"Relancer les paniers abandonnés","k":["relance","e-mail","email","rappel"]},{"t":"Simplifier ou sécuriser le paiement","k":["paiement","securi","simplif","etape","compte invite"]},{"t":"Rassurer le client","k":["avis","rassur","retour","garantie","label"]}],"m":"1. Afficher les frais et délais de livraison dès la fiche produit, et proposer la livraison offerte à partir d'un montant. 2. Relancer par e-mail les clients qui ont laissé un panier, parfois avec un petit avantage. 3. Simplifier le paiement : peu d'étapes, achat sans créer de compte, paiement sécurisé et moyens variés, avec des avis clients et une politique de retour visibles pour rassurer."},{"id":"e5r5","q":"Quelles règles faut-il respecter pour envoyer une newsletter à des particuliers ?","p":[{"t":"Leur consentement préalable","k":["consentement","accord","opt-in","opt in"]},{"t":"Un lien de désinscription","k":["desinscri","desabonn","se retirer"]},{"t":"Le RGPD : données utiles et protégées","k":["rgpd","donnees"]},{"t":"Identifier l'expéditeur","k":["identifi","expediteur"]}],"m":"Il faut d'abord obtenir le consentement préalable des particuliers (case non pré-cochée), sauf pour des clients existants et des produits analogues. Chaque envoi doit identifier clairement l'expéditeur et proposer un lien simple de désinscription. Enfin, le RGPD impose de ne collecter que les données utiles, de les protéger et de les conserver pour une durée limitée."},{"id":"e5r6","q":"Comment motiver une équipe de téléconseillers ?","p":[{"t":"Leviers financiers : primes, challenges","k":["prime","challenge"]},{"t":"Reconnaissance","k":["reconnaiss","felicit","valoris"]},{"t":"Formation, coaching, évolution","k":["formation","coaching","evolution","form"]},{"t":"Objectifs clairs et suivi","k":["objectif","smart","suivi","tableau de bord"]}],"m":"On combine des leviers financiers (primes sur objectifs, challenges d'équipe) et non financiers : reconnaissance des réussites, formation et coaching après des écoutes d'appels, perspectives d'évolution, bonne ambiance. Selon Herzberg, la prime évite l'insatisfaction, mais ce sont la reconnaissance et les responsabilités qui motivent. Des objectifs SMART et un suivi régulier donnent du sens au travail."},{"id":"e5r7","q":"Tu dois optimiser le référencement d'une fiche produit. Que remplis-tu ?","p":[{"t":"La balise title","k":["title","titre"]},{"t":"La meta description","k":["meta","description"]},{"t":"Une URL courte avec le mot-clé","k":["url"]},{"t":"Le texte alternatif des images","k":["alt","texte alternatif"]},{"t":"Le mot-clé de la cible","k":["mot-cle","mot cle","mots-cles","mots cles"]}],"m":"Je choisis d'abord le mot-clé que tape la cible. Je remplis ensuite la balise title (mot-clé au début, environ 60 caractères), la meta description (environ 155 caractères, qui donne envie de cliquer), une URL courte avec le mot-clé, un titre H1 unique, une description utile et originale, et le texte alternatif de chaque image."}],"cs":[{"id":"e5c0","t":"La boutique en ligne Tisane & Moi","x":["Tisane & Moi vend des tisanes bio sur son site PrestaShop. En octobre : 25 000 visites, 1 500 paniers créés, 500 commandes, 17 500 € de CA.","Les frais de livraison (5,90 €) n'apparaissent qu'à la dernière étape du paiement.","La marque a reçu cet avis Google : « Colis arrivé avec 8 jours de retard, et personne ne répond au chat. 1/5. »"],"q":[{"id":"e5c0q0","q":"Calcule le taux de conversion, le panier moyen et le taux d'abandon de panier.","p":[{"t":"Taux de conversion = 500 / 25 000 = 2 %","k":["2 %","2%"]},{"t":"Panier moyen = 17 500 / 500 = 35 €","k":["35"]},{"t":"Abandon = (1 500 − 500) / 1 500 ≈ 66,7 %","k":["66,7","66.7","67 %","67%"]}],"m":"Taux de conversion = 500 / 25 000 × 100 = 2 %. Panier moyen = 17 500 / 500 = 35 €. Taux d'abandon de panier = (1 500 − 500) / 1 500 × 100 ≈ 66,7 % : deux paniers sur trois sont abandonnés."},{"id":"e5c0q1","q":"Diagnostique la cause probable de l'abandon de panier et propose deux actions.","p":[{"t":"Cause : frais de livraison affichés trop tard","k":["frais de livraison","trop tard","derniere etape","surprise"]},{"t":"Action : afficher les frais dès la fiche produit, ou livraison offerte dès un montant","k":["afficher","des la fiche","offerte","gratuite","seuil","a partir de"]},{"t":"Action : relancer les paniers abandonnés par e-mail","k":["relance","e-mail","email","panier abandonne"]}],"m":"La cause probable est la surprise des frais de livraison (5,90 €), affichés seulement à la dernière étape. Actions : afficher les frais dès la fiche produit, proposer la livraison offerte à partir de 40 € (au-dessus du panier moyen de 35 €, ce qui l'augmente), et relancer les paniers abandonnés par un e-mail automatique."},{"id":"e5c0q2","q":"Rédige la réponse publique de la marque à l'avis négatif.","p":[{"t":"Remercier le client","k":["merci","remerci"]},{"t":"S'excuser et reconnaître le problème","k":["excus","desole","regret","comprenons"]},{"t":"Proposer une solution ou un contact privé","k":["solution","geste","rembours","code","message prive","contact","e-mail"]},{"t":"Inviter à revenir","k":["revenir","a bientot","prochaine","esperons"]}],"m":"« Bonjour, merci d'avoir pris le temps de nous écrire. Nous sommes sincèrement désolés pour ce retard de 8 jours et pour l'absence de réponse sur le chat : ce n'est pas le service que nous voulons vous offrir. Nous vous avons envoyé un message privé pour vous proposer un geste commercial. Nous espérons vous retrouver bientôt autour d'une bonne tisane. L'équipe Tisane & Moi »"}]},{"id":"e5c1","t":"Le service client d'EnerSoleil","x":["EnerSoleil installe des panneaux solaires. Son centre de relation client compte 10 téléconseillers.","En janvier : 4 000 appels reçus, 3 200 décrochés. 2 400 demandes réglées au premier contact. Beaucoup d'appels portent sur « Où en est mon installation ? ».","Les téléconseillers se plaignent du stress lié aux pics d'appels du lundi matin."],"q":[{"id":"e5c1q0","q":"Calcule le taux de décroché et le taux de résolution au premier contact. Interprète.","p":[{"t":"Décroché = 3 200 / 4 000 = 80 %","k":["80 %","80%"]},{"t":"Résolution au 1er contact = 2 400 / 3 200 = 75 %","k":["75 %","75%"]},{"t":"Interprétation : 1 client sur 5 sans réponse","k":["1 sur 5","un sur cinq","20 %","20%","sans reponse","attente"]}],"m":"Taux de décroché = 3 200 / 4 000 × 100 = 80 % : 1 client sur 5 n'obtient pas de réponse. Taux de résolution au premier contact = 2 400 / 3 200 × 100 = 75 % (on peut aussi le rapporter aux demandes totales) : un quart des clients doit rappeler."},{"id":"e5c1q1","q":"Propose deux actions digitales pour réduire les appels « Où en est mon installation ? ».","p":[{"t":"Un suivi en ligne (espace client, notifications SMS ou e-mail)","k":["espace client","suivi","notification","sms","e-mail","email","application"]},{"t":"Un chatbot ou une FAQ pour les questions simples","k":["chatbot","faq","bot","selfcare","self-care"]},{"t":"Lien avec la baisse des appels et de l'attente","k":["moins d'appels","reduire","desengorger","attente","liberer"]}],"m":"EnerSoleil peut envoyer des notifications automatiques par SMS ou e-mail à chaque étape de l'installation, avec un espace client de suivi en ligne, et mettre en place un chatbot ou une FAQ pour les questions simples. Les clients s'informent seuls, ce qui libère les téléconseillers pour les demandes complexes et réduit l'attente."},{"id":"e5c1q2","q":"Comment réduire le stress des téléconseillers le lundi matin ?","p":[{"t":"Adapter le planning aux pics d'appels","k":["planning","renfort","pic","plus de conseillers","effectif"]},{"t":"Proposer le rappel automatique (callback)","k":["rappel","callback","rappeler"]},{"t":"Soutien managérial : pauses, écoute, reconnaissance","k":["pause","ecoute","soutien","reconnaissance","briefing","risques psychosociaux"]}],"m":"Il faut adapter le planning aux pics (plus de conseillers le lundi matin), proposer au client d'être rappelé plutôt que d'attendre, et soutenir l'équipe : pauses respectées, briefing, écoute et reconnaissance. L'employeur doit prévenir les risques psychosociaux."}]},{"id":"e5c2","t":"Le lancement Instagram de Pâtisserie Lou","x":["Lou ouvre une pâtisserie à Lille et veut se faire connaître auprès des 18-35 ans.","Elle hésite entre une micro-influenceuse locale (12 000 abonnés, taux d'engagement de 6 %, 300 €) et un influenceur national (450 000 abonnés, engagement 1,5 %, 4 000 €).","Son post de lancement a eu une portée de 3 000 personnes et 180 interactions."],"q":[{"id":"e5c2q0","q":"Calcule le taux d'engagement du post de lancement.","p":[{"t":"180 / 3 000 × 100 = 6 %","k":["6 %","6%"]},{"t":"Formule : interactions / portée × 100","k":["interactions","portee"]}],"m":"Taux d'engagement = interactions / portée × 100 = 180 / 3 000 × 100 = 6 %."},{"id":"e5c2q1","q":"Quelle influenceuse conseilles-tu à Lou ? Justifie.","p":[{"t":"La micro-influenceuse locale","k":["micro","locale","12 000","12000"]},{"t":"Argument : public local et engagement fort (6 % contre 1,5 %)","k":["local","lille","engagement","6 %","6%"]},{"t":"Argument : coût adapté (300 € contre 4 000 €)","k":["300","cout","budget","moins cher"]}],"m":"Je conseille la micro-influenceuse locale : sa communauté est à Lille, là où sont les clientes potentielles, son engagement est 4 fois plus fort (6 % contre 1,5 %) et elle coûte 300 € au lieu de 4 000 €. L'influenceur national toucherait surtout des gens qui ne viendront jamais à la boutique."},{"id":"e5c2q2","q":"Quelles obligations légales faut-il respecter pour ce partenariat ?","p":[{"t":"Mention « Publicité » ou « Collaboration commerciale »","k":["publicite","collaboration commerciale"]},{"t":"Mention « Image retouchée » si besoin","k":["image retouchee","retouch","image virtuelle"]},{"t":"Contrat écrit obligatoire au-delà de 1 000 € HT (pas ici à 300 €, mais conseillé)","k":["contrat","1 000","1000","ecrit"]}],"m":"La publication doit afficher clairement « Publicité » ou « Collaboration commerciale », et « Image retouchée » si les photos sont modifiées (loi du 9 juin 2023). Depuis le 1er janvier 2026, un contrat écrit est obligatoire au-delà de 1 000 € HT : à 300 €, il n'est pas obligatoire, mais il reste conseillé pour fixer les engagements."}]}]},{"k":"e6","n":"Animation de réseaux","s":"E6 · Réseaux","c":"#11916F","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 3 · Épreuve E6<\/span>\n<div style=\"font-weight:800;--big:1\"><span style=\"color:#11916F\">Relation client<\/span><br><span style=\"color:#F25C2B\">&amp; animation de réseaux<\/span><\/div>\n<p>Faire vendre ton offre par d'autres : des distributeurs, des partenaires, des vendeurs à domicile. Tout pour réussir l'oral sur ton dossier.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">épreuve orale<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">40 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">maximum, en 2 temps<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3 fiches<\/span><span class=\"sm\" style=\"color:#D6D8E6\">une par type de réseau<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">+ 1<\/span><span class=\"sm\" style=\"color:#D6D8E6\">étude réflexive réseau<\/span><\/div>\n<\/div>\n<h2>Les 3 compétences, les 3 réseaux<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1 · Distributeurs<\/span><h3>Implanter et promouvoir l'offre chez des distributeurs<\/h3><p class=\"sm\">Se faire référencer, bien placer ses produits en rayon, animer les points de vente.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C2 · Partenaires<\/span><h3>Développer et piloter un réseau de partenaires<\/h3><p class=\"sm\">Choisir des partenaires, prescripteurs ou apporteurs d'affaires, les animer, évaluer leurs résultats.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C3 · Vente directe<\/span><h3>Créer et animer un réseau de vente directe<\/h3><p class=\"sm\">Vendre à domicile et en réunion, recruter et former des vendeurs indépendants.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>08<\/b> · C2 : animer et évaluer<\/span>\n<span><b>03<\/b> · Le dossier E6<\/span><span><b>09<\/b> · C3 : la vente directe et son droit<\/span>\n<span><b>04<\/b> · Réseaux et distribution : les bases<\/span><span><b>10<\/b> · C3 : réunions et recrutement<\/span>\n<span><b>05<\/b> · C1 : référencement et négociation<\/span><span><b>11<\/b> · Manager un réseau<\/span>\n<span><b>06<\/b> · C1 : merchandising et animation<\/span><span><b>12<\/b> · Les indicateurs du réseau<\/span>\n<span><b>07<\/b> · C2 : choisir ses partenaires<\/span><span><b>13–14<\/b> · Étude réflexive, kit et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 3 · épreuve e6 relation client & animation de réseaux faire vendre ton offre par d'autres : des distributeurs, des partenaires, des vendeurs à domicile. tout pour réussir l'oral sur ton dossier. coef. 3 épreuve orale 40 min maximum, en 2 temps 3 fiches une par type de réseau + 1 étude réflexive réseau les 3 compétences, les 3 réseaux c1 · distributeurs implanter et promouvoir l'offre chez des distributeurs se faire référencer, bien placer ses produits en rayon, animer les points de vente. c2 · partenaires développer et piloter un réseau de partenaires choisir des partenaires, prescripteurs ou apporteurs d'affaires, les animer, évaluer leurs résultats. c3 · vente directe créer et animer un réseau de vente directe vendre à domicile et en réunion, recruter et former des vendeurs indépendants. 02 · le déroulement de l'épreuve 08 · c2 : animer et évaluer 03 · le dossier e6 09 · c3 : la vente directe et son droit 04 · réseaux et distribution : les bases 10 · c3 : réunions et recrutement 05 · c1 : référencement et négociation 11 · manager un réseau 06 · c1 : merchandising et animation 12 · les indicateurs du réseau 07 · c2 : choisir ses partenaires 13–14 · étude réflexive, kit et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">L'épreuve évalue ta capacité à analyser un contexte, diagnostiquer un réseau, l'animer et analyser les résultats. Elle donne une place importante aux dimensions juridique, économique et managériale.<\/p>\n<div class=\"card dark\" style=\"gap:10px\"><h3>40 minutes maximum, en 2 temps (même structure en ponctuel et en CCF)<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700\">\n<div class=\"fG\" style=\"flex:15;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">1 · Expérience réelle · 15 min<\/div>\n<div class=\"fO\" style=\"flex:25;display:flex;align-items:center;padding-left:12px;color:#16182B\">2 · Autres expériences et étude réflexive · 25 min<\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"color:#E4E5EE\"><span><b>Temps 1<\/b> : tu présentes une expérience réelle vécue dans un réseau, de ton choix (10 min max), puis entretien avec le jury (5 min max).<\/span><span><b>Temps 2<\/b> : tu présentes brièvement tes autres expériences, le jury approfondit ; puis tu exposes ton étude réflexive (5 min), suivie de questions.<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>En ponctuel<\/h3><ul class=\"sm\"><li>Jury de 2 personnes : un professeur du bloc 3 et un professionnel.<\/li><li>Tu peux utiliser les supports de ton choix pour présenter (diaporama, documents, tablette).<\/li><\/ul><\/div>\n<div class=\"card\"><h3>En CCF<\/h3><ul class=\"sm\"><li>2 situations pendant la 2e année : <b>A<\/b> (expérience réelle, 15 min) et <b>B<\/b> (autres expériences et étude réflexive, 25 min).<\/li><li>Évalué par ton professeur du bloc 3.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>À retenir<\/h3><p class=\"sm\">Seule ta <b>prestation orale<\/b> est notée, pas le dossier. Mais un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante) rend l'épreuve non valide.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\"><tr><th>Réseau<\/th><th>Critères de la grille<\/th><\/tr><tr><td data-label=\"Réseau\"><span class='tB'>Distributeurs<\/span><\/td><td data-label=\"Critères de la grille\">Suivi rigoureux des accords de référencement, techniques d'implantation et de mise en valeur pertinentes, repérage des opportunités, qualité du diagnostic (rayon, réseau, zone), propositions pour développer la présence de la marque<\/td><\/tr><tr><td data-label=\"Réseau\"><span class='tG'>Partenaires<\/span><\/td><td data-label=\"Critères de la grille\">Sélection pertinente des partenaires, actions d'animation efficaces et rentables<\/td><\/tr><tr><td data-label=\"Réseau\"><span class='tO'>Vente directe<\/span><\/td><td data-label=\"Critères de la grille\">Développement du fichier de conseillers, professionnalisme en réunion, recrutement et formation efficaces, animation cohérente avec la stratégie, respect de la réglementation et de l'éthique<\/td><\/tr><\/table>","x":"l'épreuve le déroulement de l'épreuve l'épreuve évalue ta capacité à analyser un contexte, diagnostiquer un réseau, l'animer et analyser les résultats. elle donne une place importante aux dimensions juridique, économique et managériale. 40 minutes maximum, en 2 temps (même structure en ponctuel et en ccf) 1 · expérience réelle · 15 min 2 · autres expériences et étude réflexive · 25 min temps 1 : tu présentes une expérience réelle vécue dans un réseau, de ton choix (10 min max), puis entretien avec le jury (5 min max). temps 2 : tu présentes brièvement tes autres expériences, le jury approfondit ; puis tu exposes ton étude réflexive (5 min), suivie de questions. en ponctuel jury de 2 personnes : un professeur du bloc 3 et un professionnel. tu peux utiliser les supports de ton choix pour présenter (diaporama, documents, tablette). en ccf 2 situations pendant la 2e année : a (expérience réelle, 15 min) et b (autres expériences et étude réflexive, 25 min). évalué par ton professeur du bloc 3. à retenir seule ta prestation orale est notée, pas le dossier. mais un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante) rend l'épreuve non valide. ce que le jury regarde réseau critères de la grille distributeurs suivi rigoureux des accords de référencement, techniques d'implantation et de mise en valeur pertinentes, repérage des opportunités, qualité du diagnostic (rayon, réseau, zone), propositions pour développer la présence de la marque partenaires sélection pertinente des partenaires, actions d'animation efficaces et rentables vente directe développement du fichier de conseillers, professionnalisme en réunion, recrutement et formation efficaces, animation cohérente avec la stratégie, respect de la réglementation et de l'éthique"},{"t":"Réussir son dossier E6","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Réussir son dossier E6<\/h1>\n<div class=\"g4\">\n<div class=\"card cB\"><span class=\"tag fB\">Fiche 1<\/span><h3>Réseau de distributeurs<\/h3><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">Fiche 2<\/span><h3>Réseau de partenaires<\/h3><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Fiche 3<\/span><h3>Réseau de vente directe<\/h3><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">Étude<\/span><h3>Étude réflexive réseau<\/h3><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card\"><h3>Les 3 fiches descriptives<\/h3><ul class=\"sm\"><li>Une par type de réseau, sur le modèle national, avec toutes les rubriques remplies.<\/li><li><b>Au moins une<\/b> décrit une expérience réelle que tu as vécue dans un réseau.<\/li><li>Chacune présente : le contexte, le diagnostic, les animations, les méthodes, les résultats et tes préconisations.<\/li><li>Plus les attestations de stage ou certificats de travail.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>L'étude réflexive réseau<\/h3><ul class=\"sm\"><li>Un écrit de 2 pages recto-verso maximum.<\/li><li>Sur un thème qui concerne les réseaux en général (transversal au pôle 3).<\/li><li>Elle mobilise les dimensions <b>juridique, économique et managériale<\/b>.<\/li><li>Tu l'exposes en 5 minutes à l'oral. Méthode et thèmes : page 13.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Ce qui ne rend pas le dossier non valide, mais coûte des points<\/h3><p class=\"sm\">Une fiche incomplète ou absente, pas d'étude réflexive, deux fiches du même type de réseau, une fiche hors sujet, une présentation non respectée. Le jury t'interroge quand même, mais te pénalise.<\/p><\/div>\n<p class=\"sm mut\">Vérifie avec ton professeur le modèle de fiche et les exigences de la circulaire de ta session (ex. Île-de-France 2026 : dépôt sur Cyclades début avril).<\/p>\n<h2>Les conseils qui font la différence<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li><b>Chiffre tout<\/b> : CA, nombre de points de vente, taux de référencement, coût de l'animation, résultats.<\/li><li><b>Fais un vrai diagnostic<\/b> avant chaque action : où en était le réseau ?<\/li><li><b>Termine par des préconisations<\/b> concrètes et justifiées.<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li><b>Maîtrise le droit<\/b> de chaque réseau : contrats, statuts, règles de la vente directe.<\/li><li><b>Prépare ton expérience réelle<\/b> comme une présentation de 10 min, avec un support.<\/li><li><b>Sois honnête<\/b> si une activité est simulée ou observée.<\/li><\/ul><\/div>\n<\/div>","x":"l'épreuve réussir son dossier e6 fiche 1 réseau de distributeurs fiche 2 réseau de partenaires fiche 3 réseau de vente directe étude étude réflexive réseau les 3 fiches descriptives une par type de réseau, sur le modèle national, avec toutes les rubriques remplies. au moins une décrit une expérience réelle que tu as vécue dans un réseau. chacune présente : le contexte, le diagnostic, les animations, les méthodes, les résultats et tes préconisations. plus les attestations de stage ou certificats de travail. l'étude réflexive réseau un écrit de 2 pages recto-verso maximum. sur un thème qui concerne les réseaux en général (transversal au pôle 3). elle mobilise les dimensions juridique, économique et managériale . tu l'exposes en 5 minutes à l'oral. méthode et thèmes : page 13. ce qui ne rend pas le dossier non valide, mais coûte des points une fiche incomplète ou absente, pas d'étude réflexive, deux fiches du même type de réseau, une fiche hors sujet, une présentation non respectée. le jury t'interroge quand même, mais te pénalise. vérifie avec ton professeur le modèle de fiche et les exigences de la circulaire de ta session (ex. île-de-france 2026 : dépôt sur cyclades début avril). les conseils qui font la différence chiffre tout : ca, nombre de points de vente, taux de référencement, coût de l'animation, résultats. fais un vrai diagnostic avant chaque action : où en était le réseau ? termine par des préconisations concrètes et justifiées. maîtrise le droit de chaque réseau : contrats, statuts, règles de la vente directe. prépare ton expérience réelle comme une présentation de 10 min, avec un support. sois honnête si une activité est simulée ou observée."},{"t":"Réseaux et distribution : les bases","h":"<p class=\"kick tO\">Les bases<\/p>\n<h1>Réseaux et distribution : les bases<\/h1>\n<div class=\"card\" style=\"gap:8px\"><h3>Les circuits de distribution<\/h3>\n<div class=\"g3\" style=\"gap:8px\"><div class=\"card cB\" style=\"padding:10px\"><b>Direct<\/b><span class=\"mini\">producteur → consommateur (vente à domicile, en ligne, au magasin d'usine)<\/span><\/div><div class=\"card cB\" style=\"padding:10px\"><b>Court<\/b><span class=\"mini\">producteur → détaillant → consommateur (grande distribution)<\/span><\/div><div class=\"card cB\" style=\"padding:10px\"><b>Long<\/b><span class=\"mini\">producteur → grossiste → détaillant → consommateur<\/span><\/div><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Commerce<\/span><h3>Les formes de commerce<\/h3><div class=\"mini\"><div class=\"def\"><b>Intégré<\/b> · l'enseigne possède ses magasins et sa centrale d'achat (succursales)<\/div><div class=\"def\"><b>Associé<\/b> · des commerçants indépendants se regroupent (coopératives, groupements)<\/div><div class=\"def\"><b>Indépendant<\/b> · un commerçant seul, sans enseigne<\/div><div class=\"def\"><b>Franchise<\/b> · un indépendant utilise la marque et le savoir-faire d'un franchiseur<\/div><div class=\"def\"><b>Grande distribution<\/b> · hypermarchés, supermarchés, proximité, hard discount, drive ; des centrales d'achat négocient pour tous les magasins<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Statuts<\/span><h3>Qui vend pour l'entreprise ?<\/h3><div class=\"mini\"><div class=\"def\"><b>Commercial salarié<\/b> · lien de subordination, salaire fixe et variable<\/div><div class=\"def\"><b>VRP<\/b> · salarié au statut particulier ; à la fin du contrat, il peut avoir droit à une indemnité de clientèle<\/div><div class=\"def\"><b>Agent commercial<\/b> · indépendant, mandataire : il négocie au nom de l'entreprise, payé à la commission ; indemnité en fin de contrat<\/div><div class=\"def\"><b>Apporteur d'affaires<\/b> · indépendant qui met en relation, payé à la commission<\/div><div class=\"def\"><b>VDI<\/b> · vendeur à domicile indépendant : page 09<\/div><\/div><\/div><\/div>\n<div class=\"card dark\"><h3>Pourquoi passer par un réseau ?<\/h3><div class=\"g3 sm\" style=\"color:#E4E5EE;gap:8px\"><span><b>Couverture<\/b> : être présent partout sans tout gérer soi-même.<\/span><span><b>Coûts<\/b> : partager les coûts de vente et de stockage.<\/span><span><b>Compétences<\/b> : profiter de la connaissance locale et de la relation client des partenaires.<\/span><\/div><\/div>\n<p class=\"sm\"><b>Le défi<\/b> : on ne commande pas un partenaire indépendant comme un salarié. Il faut le convaincre, le motiver et le fidéliser : c'est tout l'art de l'animation de réseau.<\/p>","x":"les bases réseaux et distribution : les bases les circuits de distribution direct producteur → consommateur (vente à domicile, en ligne, au magasin d'usine) court producteur → détaillant → consommateur (grande distribution) long producteur → grossiste → détaillant → consommateur commerce les formes de commerce intégré · l'enseigne possède ses magasins et sa centrale d'achat (succursales) associé · des commerçants indépendants se regroupent (coopératives, groupements) indépendant · un commerçant seul, sans enseigne franchise · un indépendant utilise la marque et le savoir-faire d'un franchiseur grande distribution · hypermarchés, supermarchés, proximité, hard discount, drive ; des centrales d'achat négocient pour tous les magasins statuts qui vend pour l'entreprise ? commercial salarié · lien de subordination, salaire fixe et variable vrp · salarié au statut particulier ; à la fin du contrat, il peut avoir droit à une indemnité de clientèle agent commercial · indépendant, mandataire : il négocie au nom de l'entreprise, payé à la commission ; indemnité en fin de contrat apporteur d'affaires · indépendant qui met en relation, payé à la commission vdi · vendeur à domicile indépendant : page 09 pourquoi passer par un réseau ? couverture : être présent partout sans tout gérer soi-même. coûts : partager les coûts de vente et de stockage. compétences : profiter de la connaissance locale et de la relation client des partenaires. le défi : on ne commande pas un partenaire indépendant comme un salarié. il faut le convaincre, le motiver et le fidéliser : c'est tout l'art de l'animation de réseau."},{"t":"Se faire référencer et négocier","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Distributeurs · 1/2<\/p><h1 style=\"--mid:1\">Se faire référencer et négocier<\/h1><\/div><\/div>\n<div class=\"card cB\" style=\"gap:8px\"><h3>Le référencement : entrer dans l'assortiment d'un distributeur<\/h3>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;font-weight:700\"><span class=\"chip\">Prospecter la centrale d'achat ou le magasin<\/span><span>→<\/span><span class=\"chip\">Présenter l'offre<\/span><span>→<\/span><span class=\"chip\">Négocier les conditions<\/span><span>→<\/span><span class=\"chip\">Signer l'accord<\/span><span>→<\/span><span class=\"chip\">Suivre l'application en magasin<\/span><\/div>\n<p class=\"sm\">Référencé au niveau national ne veut pas dire présent partout : le commercial doit aller dans chaque magasin pour obtenir et vérifier l'implantation. À l'inverse, un produit qui ne se vend pas peut être <b>déréférencé<\/b>.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Négocier<\/span><h3>Avec un distributeur<\/h3><div class=\"mini\"><div class=\"def\"><b>Les acteurs<\/b> · acheteur de la centrale, chef de rayon, directeur de magasin : chacun a ses objectifs (marge, rotation, image)<\/div><div class=\"def\"><b>Ce qu'on négocie<\/b> · prix et remises, place et taille en rayon, promotions, animations, délais de livraison et de paiement<\/div><div class=\"def\"><b>Arguments<\/b> · rotation du produit, marge pour le distributeur, notoriété, publicité nationale, nouveauté, attentes des clients<\/div><div class=\"def\"><b>Trade marketing<\/b> · l'industriel et le distributeur travaillent ensemble pour vendre plus (données, promotions communes)<\/div><div class=\"def\"><b>Category management<\/b> · gérer un rayon comme une catégorie de produits qui répond à un besoin client<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>La relation avec un distributeur<\/h3><div class=\"mini\"><div class=\"def\"><b>CGV<\/b> · le socle de la négociation commerciale<\/div><div class=\"def\"><b>Convention unique annuelle<\/b> · accord écrit entre fournisseur et distributeur, à signer avant le 1er mars<\/div><div class=\"def\"><b>Délais de paiement<\/b> · 60 jours après la facture, ou 45 jours fin de mois (cas général)<\/div><div class=\"def\"><b>Pratiques interdites<\/b> · déséquilibre significatif, avantage sans contrepartie, rupture brutale d'une relation établie, revente à perte<\/div><div class=\"def\"><b>Produits alimentaires<\/b> · les lois EGalim encadrent la négociation et les promotions<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Le diagnostic que le jury attend<\/h3><p class=\"sm\">Avant toute proposition : analyse du <b>rayon<\/b> (place, concurrents, prix, ruptures), du <b>réseau<\/b> (nombre de magasins où tu es référencé, taux de présence) et de la <b>zone<\/b> (potentiel, magasins non encore démarchés).<\/p><\/div>","x":"c1 distributeurs · 1/2 se faire référencer et négocier le référencement : entrer dans l'assortiment d'un distributeur prospecter la centrale d'achat ou le magasin → présenter l'offre → négocier les conditions → signer l'accord → suivre l'application en magasin référencé au niveau national ne veut pas dire présent partout : le commercial doit aller dans chaque magasin pour obtenir et vérifier l'implantation. à l'inverse, un produit qui ne se vend pas peut être déréférencé . négocier avec un distributeur les acteurs · acheteur de la centrale, chef de rayon, directeur de magasin : chacun a ses objectifs (marge, rotation, image) ce qu'on négocie · prix et remises, place et taille en rayon, promotions, animations, délais de livraison et de paiement arguments · rotation du produit, marge pour le distributeur, notoriété, publicité nationale, nouveauté, attentes des clients trade marketing · l'industriel et le distributeur travaillent ensemble pour vendre plus (données, promotions communes) category management · gérer un rayon comme une catégorie de produits qui répond à un besoin client droit la relation avec un distributeur cgv · le socle de la négociation commerciale convention unique annuelle · accord écrit entre fournisseur et distributeur, à signer avant le 1er mars délais de paiement · 60 jours après la facture, ou 45 jours fin de mois (cas général) pratiques interdites · déséquilibre significatif, avantage sans contrepartie, rupture brutale d'une relation établie, revente à perte produits alimentaires · les lois egalim encadrent la négociation et les promotions le diagnostic que le jury attend avant toute proposition : analyse du rayon (place, concurrents, prix, ruptures), du réseau (nombre de magasins où tu es référencé, taux de présence) et de la zone (potentiel, magasins non encore démarchés)."},{"t":"Merchandising et animation en magasin","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Distributeurs · 2/2<\/p><h1 style=\"--mid:1\">Merchandising et animation en magasin<\/h1><\/div><\/div>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>D'organisation<\/h3><p class=\"sm\">Organiser le rayon pour que le client trouve facilement : par marque, par usage, par prix.<\/p><\/div>\n<div class=\"card cB\"><h3>De séduction<\/h3><p class=\"sm\">Rendre le rayon attractif : PLV (publicité sur le lieu de vente), éclairage, mise en scène, théâtralisation.<\/p><\/div>\n<div class=\"card cB\"><h3>De gestion<\/h3><p class=\"sm\">Rentabiliser chaque mètre de linéaire : donner plus de place à ce qui se vend.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\" style=\"gap:8px\"><h3>Les niveaux de présentation<\/h3>\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<div style=\"background:#C9D4FA;border-radius:8px;padding:6px 10px\"><b>Chapeau<\/b> · stock, produits peu demandés<\/div>\n<div style=\"background:#2F5BEA;color:#FFFFFF;border-radius:8px;padding:6px 10px\"><b>Yeux<\/b> · le meilleur niveau : produits à forte marge, nouveautés<\/div>\n<div style=\"background:#6F86E8;color:#FFFFFF;border-radius:8px;padding:6px 10px\"><b>Mains<\/b> · très bon niveau : produits d'achat courant<\/div>\n<div style=\"background:#C9D4FA;border-radius:8px;padding:6px 10px\"><b>Sol<\/b> · produits lourds, achats réfléchis<\/div>\n<\/div>\n<p class=\"sm\"><b>Présentation verticale<\/b> (une marque sur plusieurs niveaux) ou <b>horizontale<\/b> (une marque sur un niveau). Emplacements forts : tête de gondole, îlot, zone de caisse.<\/p><\/div>\n<div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Animer<\/span><h3>Les actions en point de vente<\/h3><div class=\"mini\"><div class=\"def\"><b>Animations<\/b> · démonstration, dégustation, jeu, animateur ou animatrice<\/div><div class=\"def\"><b>Promotions<\/b> · réduction immédiate, lot, produit en plus, offre de remboursement, carte de fidélité<\/div><div class=\"def\"><b>Supports<\/b> · PLV, stop-rayon, présentoir, affiche, écran<\/div><div class=\"def\"><b>Former le personnel<\/b> · expliquer le produit aux vendeurs du magasin<\/div><div class=\"def\"><b>Expérience de consommation<\/b> · conseiller le distributeur pour que l'achat soit agréable et facile<\/div><\/div><\/div><\/div>\n<h2>Les calculs du linéaire<\/h2>\n<table class=\"tb\"><tr><th>Notion<\/th><th>Calcul ou définition<\/th><th>Exemple<\/th><\/tr><tr><td data-label=\"Notion\">Linéaire au sol<\/td><td data-label=\"Calcul ou définition\">longueur du rayon, mesurée au sol<\/td><td data-label=\"Exemple\">4 m<\/td><\/tr><tr><td data-label=\"Notion\">Linéaire développé<\/td><td data-label=\"Calcul ou définition\">linéaire au sol × nombre de niveaux<\/td><td data-label=\"Exemple\">4 × 5 = 20 m<\/td><\/tr><tr><td data-label=\"Notion\">Facing<\/td><td data-label=\"Calcul ou définition\">nombre de produits identiques visibles de face<\/td><td data-label=\"Exemple\">3 facings<\/td><\/tr><tr><td data-label=\"Notion\">Part de linéaire<\/td><td data-label=\"Calcul ou définition\">linéaire du produit / linéaire du rayon × 100<\/td><td data-label=\"Exemple\">2 / 20 = 10 %<\/td><\/tr><tr><td data-label=\"Notion\">Rentabilité du linéaire<\/td><td data-label=\"Calcul ou définition\">CA (ou marge) / mètres de linéaire<\/td><td data-label=\"Exemple\">6 000 € / 2 m = 3 000 € par mètre<\/td><\/tr><tr><td data-label=\"Notion\">Règle d'équilibre<\/td><td data-label=\"Calcul ou définition\">la part de linéaire devrait suivre la part de ventes<\/td><td data-label=\"Exemple\">10 % des ventes → environ 10 % du linéaire<\/td><\/tr><\/table>","x":"c1 distributeurs · 2/2 merchandising et animation en magasin d'organisation organiser le rayon pour que le client trouve facilement : par marque, par usage, par prix. de séduction rendre le rayon attractif : plv (publicité sur le lieu de vente), éclairage, mise en scène, théâtralisation. de gestion rentabiliser chaque mètre de linéaire : donner plus de place à ce qui se vend. les niveaux de présentation chapeau · stock, produits peu demandés yeux · le meilleur niveau : produits à forte marge, nouveautés mains · très bon niveau : produits d'achat courant sol · produits lourds, achats réfléchis présentation verticale (une marque sur plusieurs niveaux) ou horizontale (une marque sur un niveau). emplacements forts : tête de gondole, îlot, zone de caisse. animer les actions en point de vente animations · démonstration, dégustation, jeu, animateur ou animatrice promotions · réduction immédiate, lot, produit en plus, offre de remboursement, carte de fidélité supports · plv, stop-rayon, présentoir, affiche, écran former le personnel · expliquer le produit aux vendeurs du magasin expérience de consommation · conseiller le distributeur pour que l'achat soit agréable et facile les calculs du linéaire notion calcul ou définition exemple linéaire au sol longueur du rayon, mesurée au sol 4 m linéaire développé linéaire au sol × nombre de niveaux 4 × 5 = 20 m facing nombre de produits identiques visibles de face 3 facings part de linéaire linéaire du produit / linéaire du rayon × 100 2 / 20 = 10 % rentabilité du linéaire ca (ou marge) / mètres de linéaire 6 000 € / 2 m = 3 000 € par mètre règle d'équilibre la part de linéaire devrait suivre la part de ventes 10 % des ventes → environ 10 % du linéaire"},{"t":"Choisir ses partenaires et ses contrats","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partenaires · 1/2<\/p><h1 style=\"--mid:1\">Choisir ses partenaires et ses contrats<\/h1><\/div><\/div><p class=\"mut\">Partenaires, prescripteurs, apporteurs d'affaires : des acteurs indépendants qui recommandent ou vendent ton offre.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Qui ?<\/span><h3>Les types de partenaires<\/h3><div class=\"mini\"><div class=\"def\"><b>Prescripteur<\/b> · recommande sans vendre (architecte, médecin, influenceur, expert-comptable)<\/div><div class=\"def\"><b>Apporteur d'affaires<\/b> · met en relation contre une commission<\/div><div class=\"def\"><b>Revendeur, distributeur agréé<\/b> · vend tes produits<\/div><div class=\"def\"><b>Franchisé, concessionnaire<\/b> · vend sous ta marque, avec tes méthodes<\/div><div class=\"def\"><b>Partenaire de co-marquage<\/b> · une autre marque avec qui faire une offre commune<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Sélectionner<\/span><h3>Les critères<\/h3><div class=\"mini\"><div class=\"def\"><b>Cohérence<\/b> · image, valeurs et clientèle compatibles avec ta marque<\/div><div class=\"def\"><b>Compétences<\/b> · savoir-faire technique et commercial<\/div><div class=\"def\"><b>Zone<\/b> · couverture géographique, potentiel de clientèle<\/div><div class=\"def\"><b>Solidité<\/b> · santé financière, réputation<\/div><div class=\"def\"><b>Motivation<\/b> · envie de s'engager, disponibilité<\/div><\/div><\/div><\/div>\n<h2>Les contrats à connaître<\/h2>\n<table class=\"tb\"><tr><th>Contrat<\/th><th>Principe<\/th><th>À retenir<\/th><\/tr><tr><td data-label=\"Contrat\">Franchise<\/td><td data-label=\"Principe\">Le franchisé utilise la marque, le savoir-faire et reçoit l'assistance du franchiseur, contre un droit d'entrée et des redevances<\/td><td data-label=\"À retenir\">Le franchiseur doit remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi Doubin)<\/td><\/tr><tr><td data-label=\"Contrat\">Concession<\/td><td data-label=\"Principe\">Le concessionnaire a l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant<\/td><td data-label=\"À retenir\">Fréquent dans l'automobile<\/td><\/tr><tr><td data-label=\"Contrat\">Distribution sélective<\/td><td data-label=\"Principe\">Le fabricant choisit ses revendeurs selon des critères (qualité du magasin, conseil)<\/td><td data-label=\"À retenir\">Luxe, parfumerie, électronique haut de gamme<\/td><\/tr><tr><td data-label=\"Contrat\">Agent commercial<\/td><td data-label=\"Principe\">Mandataire indépendant qui négocie au nom de l'entreprise<\/td><td data-label=\"À retenir\">Payé à la commission ; indemnité à la fin du contrat<\/td><\/tr><tr><td data-label=\"Contrat\">Apport d'affaires<\/td><td data-label=\"Principe\">Mise en relation, sans pouvoir de signer<\/td><td data-label=\"À retenir\">Commission prévue au contrat<\/td><\/tr><tr><td data-label=\"Contrat\">Partenariat, co-marquage<\/td><td data-label=\"Principe\">Deux entreprises s'associent pour une offre ou une communication<\/td><td data-label=\"À retenir\">Bien définir les apports et le partage des résultats<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Les clauses utiles dans un contrat de partenariat<\/h3><p class=\"sm\">Objet et durée · territoire et exclusivité · objectifs · rémunération et commissions · obligations de chacun (formation, information, image) · confidentialité · non-concurrence · conditions de rupture.<\/p><\/div>","x":"c2 partenaires · 1/2 choisir ses partenaires et ses contrats partenaires, prescripteurs, apporteurs d'affaires : des acteurs indépendants qui recommandent ou vendent ton offre. qui ? les types de partenaires prescripteur · recommande sans vendre (architecte, médecin, influenceur, expert-comptable) apporteur d'affaires · met en relation contre une commission revendeur, distributeur agréé · vend tes produits franchisé, concessionnaire · vend sous ta marque, avec tes méthodes partenaire de co-marquage · une autre marque avec qui faire une offre commune sélectionner les critères cohérence · image, valeurs et clientèle compatibles avec ta marque compétences · savoir-faire technique et commercial zone · couverture géographique, potentiel de clientèle solidité · santé financière, réputation motivation · envie de s'engager, disponibilité les contrats à connaître contrat principe à retenir franchise le franchisé utilise la marque, le savoir-faire et reçoit l'assistance du franchiseur, contre un droit d'entrée et des redevances le franchiseur doit remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi doubin) concession le concessionnaire a l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant fréquent dans l'automobile distribution sélective le fabricant choisit ses revendeurs selon des critères (qualité du magasin, conseil) luxe, parfumerie, électronique haut de gamme agent commercial mandataire indépendant qui négocie au nom de l'entreprise payé à la commission ; indemnité à la fin du contrat apport d'affaires mise en relation, sans pouvoir de signer commission prévue au contrat partenariat, co-marquage deux entreprises s'associent pour une offre ou une communication bien définir les apports et le partage des résultats les clauses utiles dans un contrat de partenariat objet et durée · territoire et exclusivité · objectifs · rémunération et commissions · obligations de chacun (formation, information, image) · confidentialité · non-concurrence · conditions de rupture."},{"t":"Animer, stimuler, évaluer le réseau","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partenaires · 2/2<\/p><h1 style=\"--mid:1\">Animer, stimuler, évaluer le réseau<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tG\" style=\"--mid:1\">1<\/span><b>Informer<\/b><span>Nouveautés, argumentaires, prix, outils : extranet, newsletter, application.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"--mid:1\">2<\/span><b>Former<\/b><span>Sessions produits, techniques de vente, webinaires, visites.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"--mid:1\">3<\/span><b>Stimuler<\/b><span>Challenges, primes, commissions, cadeaux, voyages, classement.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"--mid:1\">4<\/span><b>Fédérer<\/b><span>Conventions, réunions, club partenaires, reconnaissance.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Outils<\/span><h3>Pour animer à distance<\/h3><div class=\"mini\"><div class=\"def\"><b>Extranet ou portail partenaires<\/b> · documents, commandes, suivi des affaires<\/div><div class=\"def\"><b>CRM partagé<\/b> · suivre les contacts apportés par chaque partenaire<\/div><div class=\"def\"><b>Réseaux sociaux, groupes privés<\/b> · échanger, partager les réussites<\/div><div class=\"def\"><b>Kits de vente<\/b> · argumentaires, PLV, échantillons, vidéos<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Dynamiser<\/span><h3>Garder le réseau actif<\/h3><div class=\"mini\"><div class=\"def\"><b>Visites régulières<\/b> · entretenir la relation, faire remonter l'information<\/div><div class=\"def\"><b>Objectifs partagés<\/b> · chaque partenaire sait ce qu'on attend de lui<\/div><div class=\"def\"><b>Écoute<\/b> · traiter vite les problèmes et les réclamations<\/div><div class=\"def\"><b>Valoriser<\/b> · mettre en avant les meilleurs, partager les bonnes pratiques<\/div><\/div><\/div><\/div>\n<h2>Évaluer la performance du réseau<\/h2>\n<table class=\"tb\"><tr><th>Indicateur<\/th><th>Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr><tr><td data-label=\"Indicateur\">CA par partenaire<\/td><td data-label=\"Calcul\">CA généré / nombre de partenaires<\/td><td data-label=\"Ce qu&#x27;il mesure\">La contribution moyenne<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de partenaires actifs<\/td><td data-label=\"Calcul\">partenaires ayant apporté au moins une affaire / total × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">La vitalité du réseau<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de transformation<\/td><td data-label=\"Calcul\">affaires conclues / affaires apportées × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">La qualité des contacts<\/td><\/tr><tr><td data-label=\"Indicateur\">Coût de l'animation<\/td><td data-label=\"Calcul\">total des dépenses d'animation (challenges, formations, outils)<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'effort consenti<\/td><\/tr><tr><td data-label=\"Indicateur\">Rentabilité de l'animation<\/td><td data-label=\"Calcul\">(marge supplémentaire − coût de l'animation) / coût × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">Si l'action a rapporté plus qu'elle n'a coûté<\/td><\/tr><tr><td data-label=\"Indicateur\">Satisfaction des partenaires<\/td><td data-label=\"Calcul\">enquête, taux de départ<\/td><td data-label=\"Ce qu&#x27;il mesure\">La solidité du réseau<\/td><\/tr><\/table>\n<div class=\"card dark\"><h3>Le mot du jury : efficience<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Ce n'est pas seulement « ça a marché » : c'est « ça a rapporté plus que ça n'a coûté ». Présente toujours le coût de ton action à côté de ses résultats.<\/p><\/div>","x":"c2 partenaires · 2/2 animer, stimuler, évaluer le réseau 1 informer nouveautés, argumentaires, prix, outils : extranet, newsletter, application. 2 former sessions produits, techniques de vente, webinaires, visites. 3 stimuler challenges, primes, commissions, cadeaux, voyages, classement. 4 fédérer conventions, réunions, club partenaires, reconnaissance. outils pour animer à distance extranet ou portail partenaires · documents, commandes, suivi des affaires crm partagé · suivre les contacts apportés par chaque partenaire réseaux sociaux, groupes privés · échanger, partager les réussites kits de vente · argumentaires, plv, échantillons, vidéos dynamiser garder le réseau actif visites régulières · entretenir la relation, faire remonter l'information objectifs partagés · chaque partenaire sait ce qu'on attend de lui écoute · traiter vite les problèmes et les réclamations valoriser · mettre en avant les meilleurs, partager les bonnes pratiques évaluer la performance du réseau indicateur calcul ce qu'il mesure ca par partenaire ca généré / nombre de partenaires la contribution moyenne taux de partenaires actifs partenaires ayant apporté au moins une affaire / total × 100 la vitalité du réseau taux de transformation affaires conclues / affaires apportées × 100 la qualité des contacts coût de l'animation total des dépenses d'animation (challenges, formations, outils) l'effort consenti rentabilité de l'animation (marge supplémentaire − coût de l'animation) / coût × 100 si l'action a rapporté plus qu'elle n'a coûté satisfaction des partenaires enquête, taux de départ la solidité du réseau le mot du jury : efficience ce n'est pas seulement « ça a marché » : c'est « ça a rapporté plus que ça n'a coûté ». présente toujours le coût de ton action à côté de ses résultats."},{"t":"La vente directe et son cadre","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Vente directe · 1/2<\/p><h1 style=\"--mid:1\">La vente directe et son cadre<\/h1><\/div><\/div><p class=\"mut\">Vendre au consommateur sans magasin : à domicile, en réunion chez une hôtesse, en porte-à-porte, sur un salon ou en ligne.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Statut<\/span><h3>Le VDI (vendeur à domicile indépendant)<\/h3><div class=\"mini\"><div class=\"def\"><b>Indépendant<\/b> · pas de lien de subordination avec l'entreprise<\/div><div class=\"def\"><b>Deux formes<\/b> · mandataire (vend au nom de l'entreprise, touche une commission) ou acheteur-revendeur (achète puis revend, gagne la différence)<\/div><div class=\"def\"><b>Avantages<\/b> · horaires libres, complément de revenu, faible investissement<\/div><div class=\"def\"><b>Pour l'entreprise<\/b> · un réseau souple, payé à la performance ; mais du turnover et un besoin d'animation constant<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Éthique<\/span><h3>Le code de la vente directe<\/h3><div class=\"mini\"><div class=\"def\"><b>Fédération de la vente directe<\/b> · code de conduite : informations honnêtes, respect du client, pas de pression<\/div><div class=\"def\"><b>Recrutement<\/b> · ne pas promettre des gains irréalistes, ne pas imposer l'achat de stocks importants<\/div><div class=\"def\"><b>Vente pyramidale<\/b> · interdite : un système où l'on gagne surtout en recrutant, pas en vendant. Le marketing de réseau est légal si la rémunération vient de vraies ventes<\/div><\/div><\/div><\/div>\n<h2>La réglementation de la vente hors établissement<\/h2>\n<table class=\"tb\"><tr><th>Règle<\/th><th>À retenir<\/th><\/tr><tr><td data-label=\"Règle\">Contrat écrit<\/td><td data-label=\"À retenir\">Remis au client, avec les informations obligatoires (vendeur, produit, prix, délais, rétractation) et un formulaire de rétractation<\/td><\/tr><tr><td data-label=\"Règle\">Rétractation<\/td><td data-label=\"À retenir\">14 jours sans motif pour le consommateur<\/td><\/tr><tr><td data-label=\"Règle\">Paiement<\/td><td data-label=\"À retenir\">Aucun paiement ne peut être exigé avant 7 jours après la signature (sauf exceptions prévues par la loi)<\/td><\/tr><tr><td data-label=\"Règle\">Abus de faiblesse<\/td><td data-label=\"À retenir\">Profiter de la vulnérabilité d'une personne est un délit<\/td><\/tr><tr><td data-label=\"Règle\">Démarchage téléphonique<\/td><td data-label=\"À retenir\">Depuis le 11 août 2026, consentement préalable du consommateur obligatoire<\/td><\/tr><tr><td data-label=\"Règle\">Données<\/td><td data-label=\"À retenir\">Fichiers clients et prospects soumis au RGPD<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Pourquoi le jury insiste<\/h3><p class=\"sm\">« Respect de la réglementation et de l'éthique » est un critère de la grille. Montre que ta vente en réunion respectait le contrat, la rétractation et l'interdiction de paiement immédiat.<\/p><\/div>","x":"c3 vente directe · 1/2 la vente directe et son cadre vendre au consommateur sans magasin : à domicile, en réunion chez une hôtesse, en porte-à-porte, sur un salon ou en ligne. statut le vdi (vendeur à domicile indépendant) indépendant · pas de lien de subordination avec l'e
