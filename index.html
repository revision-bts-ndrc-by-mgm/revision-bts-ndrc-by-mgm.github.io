lass=\"mini\"><div class=\"def\"><b>Formation<\/b> · la vente est conclue dès l'accord sur la chose et sur le prix (art. 1583 C. civ.)<\/div><div class=\"def\"><b>CGV<\/b> · conditions générales de vente : à communiquer à tout acheteur professionnel qui les demande ; elles sont le socle de la négociation<\/div><div class=\"def\"><b>Délais de paiement B2B<\/b> · 60 jours après la date de la facture, ou 45 jours fin de mois<\/div><div class=\"def\"><b>Retard de paiement B2B<\/b> · pénalités de retard et indemnité forfaitaire de 40 € pour frais de recouvrement<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Consommateur<\/span><h3>Ses protections<\/h3><div class=\"mini\"><div class=\"def\"><b>Rétractation<\/b> · 14 jours pour un achat à distance ou hors établissement, sans motif<\/div><div class=\"def\"><b>Foires et salons<\/b> · pas de droit de rétractation (sauf crédit affecté) : le vendeur doit l'afficher. À connaître pour tes évènements !<\/div><div class=\"def\"><b>Garantie légale de conformité<\/b> · 2 ans pour un bien neuf, vendu par un professionnel<\/div><div class=\"def\"><b>Prix barrés<\/b> · le prix de référence doit être le plus bas des 30 derniers jours<\/div><div class=\"def\"><b>Interdits<\/b> · pratiques commerciales trompeuses ou agressives, faux avis clients, revente à perte<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Pourquoi c'est utile à l'oral<\/h3><p class=\"sm\">Le jury peut te demander si ta prospection respectait le RGPD, ou ce que tu réponds à un client qui veut annuler un achat fait sur ton stand. Une réponse juridique juste montre ton professionnalisme.<\/p><\/div>","x":"droit le droit utile pour vendre prospecter dans les règles canal vers un particulier (b2c) vers un professionnel (b2b) e-mail, sms consentement préalable obligatoire (case non pré-cochée). exception : un client déjà existant, pour des produits analogues possible sans accord préalable si le message concerne sa profession ; il doit être informé et pouvoir s'opposer téléphone depuis le 11 août 2026 : consentement préalable obligatoire. bloctel a disparu possible, avec droit d'opposition dans tous les cas identifier l'émetteur, offrir un moyen simple de se désinscrire, collecter le minimum de données (rgpd) contrat de vente les bases formation · la vente est conclue dès l'accord sur la chose et sur le prix (art. 1583 c. civ.) cgv · conditions générales de vente : à communiquer à tout acheteur professionnel qui les demande ; elles sont le socle de la négociation délais de paiement b2b · 60 jours après la date de la facture, ou 45 jours fin de mois retard de paiement b2b · pénalités de retard et indemnité forfaitaire de 40 € pour frais de recouvrement consommateur ses protections rétractation · 14 jours pour un achat à distance ou hors établissement, sans motif foires et salons · pas de droit de rétractation (sauf crédit affecté) : le vendeur doit l'afficher. à connaître pour tes évènements ! garantie légale de conformité · 2 ans pour un bien neuf, vendu par un professionnel prix barrés · le prix de référence doit être le plus bas des 30 derniers jours interdits · pratiques commerciales trompeuses ou agressives, faux avis clients, revente à perte pourquoi c'est utile à l'oral le jury peut te demander si ta prospection respectait le rgpd, ou ce que tu réponds à un client qui veut annuler un achat fait sur ton stand. une réponse juridique juste montre ton professionnalisme."},{"t":"Réussir la simulation","h":"<p class=\"kick tO\">Simulation<\/p>\n<h1>Réussir la simulation<\/h1>\n<div class=\"card dark\" style=\"gap:8px\"><h3>Utiliser les 40 minutes de préparation<\/h3>\n<div class=\"bar\" style=\"display:flex;height:40px;border-radius:10px;overflow:hidden;font-weight:700\">\n<div class=\"fO\" style=\"flex:5;display:flex;align-items:center;justify-content:center;color:#16182B\">Lire · 5<\/div>\n<div class=\"fB\" style=\"flex:10;display:flex;align-items:center;justify-content:center;color:#FFFFFF\">Simulation · 15<\/div>\n<div class=\"fG\" style=\"flex:10;display:flex;align-items:center;justify-content:center;color:#FFFFFF\">Prospection · 10<\/div>\n<div class=\"fP\" style=\"flex:10;display:flex;align-items:center;justify-content:center;color:#FFFFFF\">Information · 10<\/div>\n<\/div>\n<p class=\"sm\" style=\"color:#E4E5EE\">En minutes. Repère d'abord ce que la fiche-sujet a changé par rapport à ta fiche, puis adapte tout le reste à ce changement.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\"><h3>La préparation de la simulation<\/h3><ul class=\"sm\"><li>Ton objectif idéal et ton objectif minimum.<\/li><li>5 ou 6 questions de découverte.<\/li><li>3 ou 4 arguments CAP, avec preuves.<\/li><li>Les objections probables et leurs réponses.<\/li><li>Ton prix, tes concessions et leurs contreparties.<\/li><li>Ta technique de conclusion et la suite (vente additionnelle, suivi).<\/li><li>Tes supports : catalogue, tablette, simulation chiffrée.<\/li><\/ul><\/div>\n<div class=\"card cO\"><h3>Pendant la simulation<\/h3><ul class=\"sm\"><li>Entre dans le rôle dès la première seconde : 4 × 20.<\/li><li>Écoute vraiment : le jury glisse des indices dans ses réponses.<\/li><li>Reformule avant d'argumenter.<\/li><li>Ne récite pas : adapte tes arguments à ce que dit le client.<\/li><li>Ne lâche pas sur le prix sans contrepartie.<\/li><li>Conclus : un rendez-vous, une commande ou un accord, même partiel.<\/li><\/ul><\/div>\n<\/div>\n<h2>Les questions que le jury pose souvent<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li>Pourquoi avez-vous ciblé ce client ou ce segment ?<\/li><li>Combien a coûté votre prospection, et qu'a-t-elle rapporté ?<\/li><li>Comment avez-vous qualifié vos prospects ?<\/li><li>Quelle était votre marge de négociation ?<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li>Que feriez-vous différemment ?<\/li><li>Comment avez-vous suivi les contacts de l'évènement ?<\/li><li>Quelles informations avez-vous transmises, à qui, comment ?<\/li><li>Qu'avez-vous proposé à votre entreprise ?<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>L'analyse réflexive après la simulation<\/h3><p class=\"sm\">Le jury te demande ce que tu as pensé de ta prestation. Sois lucide : un point fort, un point à améliorer, et ce que tu aurais fait autrement. Reconnaître une erreur bien analysée rapporte des points.<\/p><\/div>","x":"simulation réussir la simulation utiliser les 40 minutes de préparation lire · 5 simulation · 15 prospection · 10 information · 10 en minutes. repère d'abord ce que la fiche-sujet a changé par rapport à ta fiche, puis adapte tout le reste à ce changement. la préparation de la simulation ton objectif idéal et ton objectif minimum. 5 ou 6 questions de découverte. 3 ou 4 arguments cap, avec preuves. les objections probables et leurs réponses. ton prix, tes concessions et leurs contreparties. ta technique de conclusion et la suite (vente additionnelle, suivi). tes supports : catalogue, tablette, simulation chiffrée. pendant la simulation entre dans le rôle dès la première seconde : 4 × 20. écoute vraiment : le jury glisse des indices dans ses réponses. reformule avant d'argumenter. ne récite pas : adapte tes arguments à ce que dit le client. ne lâche pas sur le prix sans contrepartie. conclus : un rendez-vous, une commande ou un accord, même partiel. les questions que le jury pose souvent pourquoi avez-vous ciblé ce client ou ce segment ? combien a coûté votre prospection, et qu'a-t-elle rapporté ? comment avez-vous qualifié vos prospects ? quelle était votre marge de négociation ? que feriez-vous différemment ? comment avez-vous suivi les contacts de l'évènement ? quelles informations avez-vous transmises, à qui, comment ? qu'avez-vous proposé à votre entreprise ? l'analyse réflexive après la simulation le jury te demande ce que tu as pensé de ta prestation. sois lucide : un point fort, un point à améliorer, et ce que tu aurais fait autrement. reconnaître une erreur bien analysée rapporte des points."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><p class=\"sm\">Analyse ABC du portefeuille · critères de segmentation · objectif SMART · plan d'appel CROC · taux de transformation et coût par contact.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C2<\/span><p class=\"sm\">4 × 20 · QQOQCCP · SONCAS · CAP · traitement des objections · défense du prix · techniques de conclusion · centre d'achat · réclamation.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C3<\/span><p class=\"sm\">Objectifs, budget, rétroplanning · communication avant / pendant / après · bilan quantitatif et qualitatif · suivi des contacts.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C4<\/span><p class=\"sm\">Veille et sources · CRM · compte rendu et reporting · sélectionner et hiérarchiser · une proposition chiffrée.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Connaître tes 2 fiches par cœur, chiffres compris<\/span>\n<span>☐ Connaître ton offre : prix, caractéristiques, concurrents<\/span>\n<span>☐ Savoir refaire tous les calculs de la page 12<\/span>\n<span>☐ Préparer une présentation de 10 min pour la partie 1 et pour la partie 3<\/span>\n<span>☐ Faire 3 simulations chronométrées avec quelqu'un qui joue le client<\/span>\n<span>☐ Préparer ton analyse réflexive pour chaque fiche<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li>Apporte ton dossier, tes supports et tes outils numériques chargés.<\/li>\n<li>Tenue professionnelle, adaptée à ton secteur.<\/li>\n<li>En préparation : repère ce qui change dans la fiche-sujet.<\/li>\n<li>Pendant l'oral : regarde les deux membres du jury, parle avec des chiffres.<\/li>\n<li>Pendant la simulation : écoute, reformule, argumente, conclus.<\/li>\n<li>À la fin : remercie le jury.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cO\" style=\"padding:18px 20px\"><p class=\"quote\">Le jury ne cherche pas un vendeur parfait : il cherche quelqu'un qui écoute, qui s'adapte et qui sait expliquer ses choix.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E4, compétences et savoirs du bloc 1 · guide du dossier E4, SIEC session 2026 · DGCCRF et loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique) · CNIL (prospection électronique). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j c1 analyse abc du portefeuille · critères de segmentation · objectif smart · plan d'appel croc · taux de transformation et coût par contact. c2 4 × 20 · qqoqccp · soncas · cap · traitement des objections · défense du prix · techniques de conclusion · centre d'achat · réclamation. c3 objectifs, budget, rétroplanning · communication avant / pendant / après · bilan quantitatif et qualitatif · suivi des contacts. c4 veille et sources · crm · compte rendu et reporting · sélectionner et hiérarchiser · une proposition chiffrée. plan de révision ☐ connaître tes 2 fiches par cœur, chiffres compris ☐ connaître ton offre : prix, caractéristiques, concurrents ☐ savoir refaire tous les calculs de la page 12 ☐ préparer une présentation de 10 min pour la partie 1 et pour la partie 3 ☐ faire 3 simulations chronométrées avec quelqu'un qui joue le client ☐ préparer ton analyse réflexive pour chaque fiche le jour j apporte ton dossier, tes supports et tes outils numériques chargés. tenue professionnelle, adaptée à ton secteur. en préparation : repère ce qui change dans la fiche-sujet. pendant l'oral : regarde les deux membres du jury, parle avec des chiffres. pendant la simulation : écoute, reformule, argumente, conclus. à la fin : remercie le jury. le jury ne cherche pas un vendeur parfait : il cherche quelqu'un qui écoute, qui s'adapte et qui sait expliquer ses choix. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e4, compétences et savoirs du bloc 1 · guide du dossier e4, siec session 2026 · dgccrf et loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique) · cnil (prospection électronique). vérifié le 16 novembre 2026."},{"t":"Vendre du financement","h":"<div class=\"cx\" style=\"--cx:#2F5BEA\"><p class=\"cx-k\">Complément · C2 négocier<\/p><h1 class=\"cx-h\">Vendre du financement<\/h1><p class=\"cx-lead\">Proposer un crédit au client aide à conclure une vente importante. Mais c'est très encadré, et les règles ont changé le <b>20 novembre 2026<\/b>.<\/p><section class=\"cx-b\"><h2>Les formules à connaître<\/h2><ul><li><b>Crédit affecté<\/b> · lié à un achat précis (voiture, cuisine). Si la vente est annulée, le crédit l'est aussi, et inversement.<\/li><li><b>Prêt personnel<\/b> · une somme libre d'utilisation, remboursée par mensualités fixes.<\/li><li><b>Crédit renouvelable<\/b> · une réserve d'argent qui se reconstitue au fur et à mesure des remboursements.<\/li><li><b>LOA<\/b> · location avec option d'achat : le client loue, puis peut acheter à la fin.<\/li><li><b>LLD<\/b> · location longue durée, sans option d'achat.<\/li><li><b>Paiement fractionné<\/b> · payer en 3 ou 4 fois.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Ce qui change depuis le 20 novembre 2026<\/h2><ul><li><b>Plus de crédits concernés<\/b> · les mini-crédits de moins de 200 €, les crédits de moins de 3 mois (paiement fractionné ou différé), les crédits gratuits, ceux de 75 000 à 100 000 € et la LOA entrent dans le régime du crédit à la consommation.<\/li><li><b>Nouvelle mention obligatoire<\/b> · « Attention ! Un crédit coûte de l'argent et doit être remboursé ! »<\/li><li><b>Publicité<\/b> · elle doit être claire, loyale et non trompeuse. Il est interdit de vanter la facilité d'obtenir un crédit.<\/li><li><b>Solvabilité<\/b> · le prêteur doit pouvoir montrer comment il a évalué la situation de l'emprunteur.<\/li><li><b>Rétractation<\/b> · 14 jours calendaires, sans motif. Le délai est prolongé si le prêteur n'a pas donné toutes les informations obligatoires.<\/li><li><b>Contrats anciens<\/b> · les crédits déjà en cours au 20 novembre 2026 restent soumis aux anciennes règles.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Les mots du devis<\/h2><ul><li><b>TAEG<\/b> · taux annuel effectif global : le coût total du crédit (intérêts et frais), exprimé en pourcentage par an. C'est le chiffre qui permet de comparer deux offres.<\/li><li><b>Coût total du crédit<\/b> · ce que le client paie en plus du prix emprunté.<\/li><li><b>Mensualité<\/b> · la somme remboursée chaque mois.<\/li><\/ul><\/section><section class=\"cx-note\"><b>À l'oral E4 :<\/b> si ta vente s'est faite avec un financement, montre que tu as présenté le TAEG, rappelé la rétractation de 14 jours et vérifié que la mensualité était supportable pour le client. C'est un vrai argument de professionnalisme.<\/section><section class=\"cx-note\"><b>Sur un stand de foire ou de salon :<\/b> l'achat n'ouvre pas de droit de rétractation, sauf s'il est financé par un crédit affecté.<\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : service-public.gouv.fr (« Crédits à la consommation : les règles évoluent pour prévenir le surendettement », mis à jour le 27/10/2026) · economie.gouv.fr, Direction des affaires juridiques (29/10/2026) · ordonnances n° 2025-880 du 3/09/2025 et n° 2025-1154 du 2/12/2025 · décret n° 2026-105 du 19/02/2026.<\/p><\/div>","x":"  complément · c2 négocier  vendre du financement  proposer un crédit au client aide à conclure une vente importante. mais c'est très encadré, et les règles ont changé le  20 novembre 2026 .   les formules à connaître    crédit affecté  · lié à un achat précis (voiture, cuisine). si la vente est annulée, le crédit l'est aussi, et inversement.   prêt personnel  · une somme libre d'utilisation, remboursée par mensualités fixes.   crédit renouvelable  · une réserve d'argent qui se reconstitue au fur et à mesure des remboursements.   loa  · location avec option d'achat : le client loue, puis peut acheter à la fin.   lld  · location longue durée, sans option d'achat.   paiement fractionné  · payer en 3 ou 4 fois.     ce qui change depuis le 20 novembre 2026    plus de crédits concernés  · les mini-crédits de moins de 200 €, les crédits de moins de 3 mois (paiement fractionné ou différé), les crédits gratuits, ceux de 75 000 à 100 000 € et la loa entrent dans le régime du crédit à la consommation.   nouvelle mention obligatoire  · « attention ! un crédit coûte de l'argent et doit être remboursé ! »   publicité  · elle doit être claire, loyale et non trompeuse. il est interdit de vanter la facilité d'obtenir un crédit.   solvabilité  · le prêteur doit pouvoir montrer comment il a évalué la situation de l'emprunteur.   rétractation  · 14 jours calendaires, sans motif. le délai est prolongé si le prêteur n'a pas donné toutes les informations obligatoires.   contrats anciens  · les crédits déjà en cours au 20 novembre 2026 restent soumis aux anciennes règles.     les mots du devis    taeg  · taux annuel effectif global : le coût total du crédit (intérêts et frais), exprimé en pourcentage par an. c'est le chiffre qui permet de comparer deux offres.   coût total du crédit  · ce que le client paie en plus du prix emprunté.   mensualité  · la somme remboursée chaque mois.     à l'oral e4 :  si ta vente s'est faite avec un financement, montre que tu as présenté le taeg, rappelé la rétractation de 14 jours et vérifié que la mensualité était supportable pour le client. c'est un vrai argument de professionnalisme.   sur un stand de foire ou de salon :  l'achat n'ouvre pas de droit de rétractation, sauf s'il est financé par un crédit affecté.  sources vérifiées le 17 novembre 2026 : service-public.gouv.fr (« crédits à la consommation : les règles évoluent pour prévenir le surendettement », mis à jour le 27/10/2026) · economie.gouv.fr, direction des affaires juridiques (29/10/2026) · ordonnances n° 2025-880 du 3/09/2025 et n° 2025-1154 du 2/12/2025 · décret n° 2026-105 du 19/02/2026.  "},{"t":"Analyser le risque client","h":"<div class=\"cx\" style=\"--cx:#2F5BEA\"><p class=\"cx-k\">Complément · C2 négocier<\/p><h1 class=\"cx-h\">Analyser le risque client<\/h1><p class=\"cx-lead\">Une vente n'est réussie que si elle est payée. Avant d'accorder des conditions (délai, remise, gros volume), on évalue le risque que le client ne paie pas.<\/p><section class=\"cx-b\"><h2>Évaluer la solvabilité d'un client professionnel<\/h2><ul><li><b>Historique<\/b> · retards ou impayés passés, réclamations, ancienneté de la relation.<\/li><li><b>Santé financière<\/b> · lire ses comptes publiés (chiffre d'affaires, résultat, endettement, trésorerie).<\/li><li><b>Informations externes<\/b> · cotation de la Banque de France, sociétés de renseignement commercial, procédures collectives (redressement, liquidation).<\/li><li><b>Signaux d'alerte<\/b> · paiements de plus en plus tardifs, changements fréquents d'interlocuteur, commandes inhabituelles.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Se protéger : les garanties<\/h2><ul><li><b>Acompte<\/b> · un premier paiement à la commande. La vente est ferme : ni le vendeur ni le client ne peuvent se dédire.<\/li><li><b>Arrhes<\/b> · le client peut renoncer en perdant les arrhes ; le vendeur peut renoncer en rendant le double. Entre un professionnel et un consommateur, une somme versée d'avance est présumée être des arrhes, sauf mention contraire.<\/li><li><b>Clause de réserve de propriété<\/b> · le vendeur reste propriétaire tant que le prix n'est pas payé.<\/li><li><b>Caution<\/b> · une personne s'engage à payer si le client ne paie pas.<\/li><li><b>Assurance-crédit<\/b> · un assureur rembourse une partie des impayés.<\/li><li><b>Affacturage<\/b> · on cède ses factures à une société (le factor) qui avance l'argent et se charge du recouvrement.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Les règles de paiement entre professionnels<\/h2><ul><li><b>Délai maximum<\/b> · 60 jours après la date de facture, ou 45 jours fin de mois (cas général).<\/li><li><b>Retard<\/b> · pénalités de retard (au moins 3 fois le taux d'intérêt légal) et indemnité forfaitaire de 40 € pour frais de recouvrement.<\/li><li><b>Escompte<\/b> · une réduction accordée si le client paie avant l'échéance.<\/li><\/ul><\/section><section class=\"cx-note\"><b>Réflexe en négociation :<\/b> plus le client est risqué, plus tu demandes de garanties (acompte, paiement comptant) en échange des avantages accordés.<\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : Code de commerce (art. L441-10, délais et pénalités) · Code de la consommation (art. L214-1, acompte et arrhes) · Banque de France (cotation des entreprises).<\/p><\/div>","x":"  complément · c2 négocier  analyser le risque client  une vente n'est réussie que si elle est payée. avant d'accorder des conditions (délai, remise, gros volume), on évalue le risque que le client ne paie pas.   évaluer la solvabilité d'un client professionnel    historique  · retards ou impayés passés, réclamations, ancienneté de la relation.   santé financière  · lire ses comptes publiés (chiffre d'affaires, résultat, endettement, trésorerie).   informations externes  · cotation de la banque de france, sociétés de renseignement commercial, procédures collectives (redressement, liquidation).   signaux d'alerte  · paiements de plus en plus tardifs, changements fréquents d'interlocuteur, commandes inhabituelles.     se protéger : les garanties    acompte  · un premier paiement à la commande. la vente est ferme : ni le vendeur ni le client ne peuvent se dédire.   arrhes  · le client peut renoncer en perdant les arrhes ; le vendeur peut renoncer en rendant le double. entre un professionnel et un consommateur, une somme versée d'avance est présumée être des arrhes, sauf mention contraire.   clause de réserve de propriété  · le vendeur reste propriétaire tant que le prix n'est pas payé.   caution  · une personne s'engage à payer si le client ne paie pas.   assurance-crédit  · un assureur rembourse une partie des impayés.   affacturage  · on cède ses factures à une société (le factor) qui avance l'argent et se charge du recouvrement.     les règles de paiement entre professionnels    délai maximum  · 60 jours après la date de facture, ou 45 jours fin de mois (cas général).   retard  · pénalités de retard (au moins 3 fois le taux d'intérêt légal) et indemnité forfaitaire de 40 € pour frais de recouvrement.   escompte  · une réduction accordée si le client paie avant l'échéance.     réflexe en négociation :  plus le client est risqué, plus tu demandes de garanties (acompte, paiement comptant) en échange des avantages accordés.  sources vérifiées le 17 novembre 2026 : code de commerce (art. l441-10, délais et pénalités) · code de la consommation (art. l214-1, acompte et arrhes) · banque de france (cotation des entreprises).  "},{"t":"Prévoir ses ventes, écrire, vendre à distance","h":"<div class=\"cx\" style=\"--cx:#2F5BEA\"><p class=\"cx-k\">Complément · C1 et C4<\/p><h1 class=\"cx-h\">Prévoir, écrire, animer à distance<\/h1><p class=\"cx-lead\">Trois savoir-faire souvent demandés et absents des fiches de base : prévoir les ventes, rédiger un écrit commercial, organiser un évènement en ligne.<\/p><section class=\"cx-b\"><h2>Prévoir ses ventes<\/h2><ul><li><b>Moyenne mobile<\/b> · lisse les variations en faisant la moyenne de plusieurs périodes qui se suivent.<\/li><li><b>Ajustement linéaire<\/b> · on trace la droite de tendance y = ax + b et on la prolonge.<\/li><li><b>Coefficients saisonniers<\/b> · on corrige la tendance selon la saison (ex. ventes de décembre plus fortes).<\/li><\/ul><\/section><section class=\"cx-ex\"><b>Exemple :<\/b> ventes trimestrielles de 100, 120, 140 et 160 unités : la tendance est de + 20 par trimestre, donc la prévision du trimestre suivant est d'environ 180 unités.<\/section><section class=\"cx-b\"><h2>Fixer des objectifs aux vendeurs<\/h2><ul><li><b>Quantitatifs<\/b> · CA, volume, marge, nombre de nouveaux clients, nombre de visites.<\/li><li><b>Qualitatifs<\/b> · satisfaction client, qualité des comptes rendus, mise à jour du CRM.<\/li><li><b>Quota<\/b> · la part de l'objectif global attribuée à chaque vendeur ou secteur.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Rédiger un e-mail commercial<\/h2><ol class=\"cx-steps\"><li><span>1<\/span><div><b>Un objet court<\/b> qui donne envie d'ouvrir et annonce le bénéfice.<\/div><\/li><li><span>2<\/span><div><b>Une accroche personnalisée<\/b> centrée sur le client, pas sur l'entreprise.<\/div><\/li><li><span>3<\/span><div><b>Un message bref<\/b> le besoin, la solution, une preuve.<\/div><\/li><li><span>4<\/span><div><b>Un appel à l'action clair<\/b> ex. « Réservez votre démonstration ».<\/div><\/li><li><span>5<\/span><div><b>Une signature complète<\/b> nom, fonction, coordonnées, et un moyen de se désinscrire si c'est de la prospection.<\/div><\/li><\/ol><\/section><section class=\"cx-b\"><h2>Évènement en ligne (webinaire, salon virtuel)<\/h2><ul><li><b>Atouts<\/b> · coût réduit, public sans limite géographique, replay, collecte facile des contacts (avec consentement).<\/li><li><b>Limites<\/b> · moins de contact humain, attention plus difficile à retenir, dépendance à la technique.<\/li><li><b>Indicateurs<\/b> · inscrits, taux de présence (présents / inscrits × 100), durée moyenne de visionnage, questions posées, contacts qualifiés, ventes après l'évènement.<\/li><\/ul><\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : méthodes de prévision et d'objectifs du programme de BTS NDRC (bloc 1) · CNIL, « La prospection commerciale par courrier électronique » (10/06/2026).<\/p><\/div>","x":"  complément · c1 et c4  prévoir, écrire, animer à distance  trois savoir-faire souvent demandés et absents des fiches de base : prévoir les ventes, rédiger un écrit commercial, organiser un évènement en ligne.   prévoir ses ventes    moyenne mobile  · lisse les variations en faisant la moyenne de plusieurs périodes qui se suivent.   ajustement linéaire  · on trace la droite de tendance y = ax + b et on la prolonge.   coefficients saisonniers  · on corrige la tendance selon la saison (ex. ventes de décembre plus fortes).     exemple :  ventes trimestrielles de 100, 120, 140 et 160 unités : la tendance est de + 20 par trimestre, donc la prévision du trimestre suivant est d'environ 180 unités.   fixer des objectifs aux vendeurs    quantitatifs  · ca, volume, marge, nombre de nouveaux clients, nombre de visites.   qualitatifs  · satisfaction client, qualité des comptes rendus, mise à jour du crm.   quota  · la part de l'objectif global attribuée à chaque vendeur ou secteur.     rédiger un e-mail commercial    1   un objet court  qui donne envie d'ouvrir et annonce le bénéfice.    2   une accroche personnalisée  centrée sur le client, pas sur l'entreprise.    3   un message bref  le besoin, la solution, une preuve.    4   un appel à l'action clair  ex. « réservez votre démonstration ».    5   une signature complète  nom, fonction, coordonnées, et un moyen de se désinscrire si c'est de la prospection.      évènement en ligne (webinaire, salon virtuel)    atouts  · coût réduit, public sans limite géographique, replay, collecte facile des contacts (avec consentement).   limites  · moins de contact humain, attention plus difficile à retenir, dépendance à la technique.   indicateurs  · inscrits, taux de présence (présents / inscrits × 100), durée moyenne de visionnage, questions posées, contacts qualifiés, ventes après l'évènement.    sources vérifiées le 17 novembre 2026 : méthodes de prévision et d'objectifs du programme de bts ndrc (bloc 1) · cnil, « la prospection commerciale par courrier électronique » (10/06/2026).  "}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,1,2,13,14]},{"n":"Cibler et prospecter","tag":"C1","e":false,"p":[3,4]},{"n":"Négocier, vendre, fidéliser","tag":"C2","e":false,"p":[5,6,7,8]},{"n":"L'évènement commercial","tag":"C3","e":false,"p":[9]},{"n":"L'information commerciale","tag":"C4","e":false,"p":[10]},{"n":"Calculs commerciaux","tag":"","e":false,"p":[11]},{"n":"Le droit pour vendre","tag":"","e":false,"p":[12]},{"n":"Notions en plus, à jour 2026","tag":"Compléments","e":false,"p":[15,16,17]}],"q":[{"id":"e4q0","q":"Que désigne la règle des 4 × 20 ?","o":["Les 20 premières secondes, mots, gestes et 20 cm du visage","4 rendez-vous de 20 minutes","20 % de remise sur 4 produits","4 objections en 20 secondes"],"a":0,"e":"Tout se joue au moment de la prise de contact."},{"id":"e4q1","q":"QQOQCCP sert à…","o":["conclure la vente","découvrir les besoins du client","calculer la marge","traiter une réclamation"],"a":1,"e":"Qui, quoi, où, quand, comment, combien, pourquoi."},{"id":"e4q2","q":"La technique du « boomerang » consiste à…","o":["ignorer l'objection","retourner l'objection en argument","baisser le prix","changer de sujet"],"a":1,"e":"« C'est justement pour cela que… »"},{"id":"e4q3","q":"L'up-selling, c'est…","o":["vendre un produit complémentaire","faire monter le client en gamme","baisser le prix","relancer un prospect"],"a":1,"e":"Le cross-selling, lui, vend un produit complémentaire."},{"id":"e4q4","q":"Un objectif SMART est…","o":["Spécifique, Mesurable, Atteignable, Réaliste, Temporel","Simple, Moderne, Ambitieux, Rapide, Total","Stratégique, Marketing, Annuel, Rentable, Testé","Sûr, Mesuré, Adapté, Rapide, Tenu"],"a":0,"e":"Ex. : 10 rendez-vous en 3 semaines."},{"id":"e4q5","q":"Dans SONCAS, que signifie le A ?","o":["Amitié","Argent","Avantage","Action"],"a":1,"e":"Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie."},{"id":"e4q6","q":"Que signifie CAP dans l'argumentation ?","o":["Client, Achat, Prix","Caractéristique, Avantage, Preuve","Contact, Argument, Proposition","Conclusion, Accord, Paiement"],"a":1,"e":"Caractéristique, Avantage pour le client, Preuve."},{"id":"e4q7","q":"Que signifie CROC pour un appel de prospection ?","o":["Contact, Raison, Objectif, Conclusion","Client, Rendez-vous, Offre, Commande","Cible, Relance, Objection, Contrat","Contact, Remise, Offre, Clôture"],"a":0,"e":"Contact, Raison de l'appel, Objectif (rendez-vous), Conclusion."},{"id":"e4q8","q":"Taux de marque =","o":["marge / coût d'achat HT × 100","marge / prix de vente HT × 100","PV TTC / coût d'achat HT","CA / clients"],"a":1,"e":"Le taux de marge, lui, divise par le coût d'achat."},{"id":"e4q9","q":"Un produit acheté 40 € HT et vendu 60 € HT : taux de marge ?","o":["20 %","33,3 %","50 %","60 %"],"a":2,"e":"Marge 20 € / coût d'achat 40 € = 50 %."},{"id":"e4q10","q":"Deux remises successives de 10 % donnent au total…","o":["20 %","19 %","21 %","10 %"],"a":1,"e":"100 → 90 → 81 : soit 19 %."},{"id":"e4q11","q":"Depuis le 11 août 2026, démarcher un particulier par téléphone exige…","o":["une inscription sur Bloctel","son consentement préalable","un courrier préalable","rien de particulier"],"a":1,"e":"Loi du 30 juin 2025 : consentement préalable, Bloctel a disparu."},{"id":"e4q12","q":"Un client achète sur ton stand d'une foire. A-t-il un droit de rétractation ?","o":["Oui, 14 jours","Oui, 7 jours","Non (sauf crédit affecté), et le vendeur doit l'afficher","Oui, 30 jours"],"a":2,"e":"Pas de rétractation en foire ou salon, sauf crédit affecté."},{"id":"e4q13","q":"Délai de rétractation pour un achat à distance ?","o":["7 jours","10 jours","14 jours","30 jours"],"a":2,"e":"14 jours sans motif."},{"id":"e4q14","q":"Délais de paiement B2B (cas général) ?","o":["30 jours","60 jours après facture ou 45 jours fin de mois","90 jours","Libres"],"a":1,"e":"60 jours date de facture, ou 45 jours fin de mois."},{"id":"e4q15","q":"Selon la règle de Pareto, environ 20 % des clients font…","o":["20 % du CA","50 % du CA","80 % du CA","100 % du CA"],"a":2,"e":"Règle empirique à vérifier sur tes chiffres."},{"id":"e4q16","q":"Dans le centre d'achat, le prescripteur est celui qui…","o":["signe","recommande","utilise","paie"],"a":1,"e":"Il recommande (technicien, consultant) ; le décideur signe."},{"id":"e4q17","q":"La négociation raisonnée (Harvard) consiste à se concentrer sur…","o":["les positions","les intérêts","le rapport de force","le prix uniquement"],"a":1,"e":"Intérêts plutôt que positions, options mutuelles, critères objectifs."},{"id":"e4q18","q":"La reformulation « écho » consiste à…","o":["résumer tout l'entretien","reprendre les mots du client","changer de sujet","conclure"],"a":1,"e":"Elle montre au client qu'il est écouté."},{"id":"e4q19","q":"Laquelle est une question alternative ?","o":["Comment l'utilisez-vous ?","Préférez-vous mardi ou jeudi ?","C'est-à-dire ?","Êtes-vous satisfait ?"],"a":1,"e":"Deux choix : utile pour obtenir un rendez-vous ou conclure."},{"id":"e4q20","q":"En analyse transactionnelle, le vendeur vise une relation…","o":["Parent-Enfant","Adulte-Adulte","Enfant-Enfant","Parent-Parent"],"a":1,"e":"Calme, factuelle, d'égal à égal."},{"id":"e4q21","q":"La méthode « sandwich » sert à présenter…","o":["une objection","le prix entre deux avantages","le vendeur","un concurrent"],"a":1,"e":"Avantage, prix, avantage."},{"id":"e4q22","q":"Lequel est un signal d'achat ?","o":["Le client regarde l'heure","Le client demande les délais de livraison","Le client fronce les sourcils","Le client se tait"],"a":1,"e":"Questions sur la livraison, le paiement, ou client qui reprend le produit en main."},{"id":"e4q23","q":"La conclusion « implicite » consiste à…","o":["demander une signature","faire comme si l'achat était décidé (« Je vous la livre mardi ? »)","proposer deux choix","baisser le prix"],"a":1,"e":"On présume l'accord du client."},{"id":"e4q24","q":"Le cross-selling, c'est…","o":["vendre un produit complémentaire","faire monter en gamme","vendre à l'étranger","vendre à perte"],"a":0,"e":"Ex. : une housse avec une tablette."},{"id":"e4q25","q":"La MESORE, c'est…","o":["un indicateur de vente","ta meilleure solution de rechange si l'accord échoue","une technique de conclusion","un contrat"],"a":1,"e":"Plus elle est bonne, plus tu es fort dans la négociation."},{"id":"e4q26","q":"300 visiteurs et 45 acheteurs : taux de transformation ?","o":["10 %","15 %","20 %","45 %"],"a":1,"e":"45 / 300 × 100 = 15 %."},{"id":"e4q27","q":"Coût d'achat 40 € HT, prix de vente 72 € TTC : coefficient multiplicateur ?","o":["1,5","1,8","2","0,55"],"a":1,"e":"72 / 40 = 1,8."},{"id":"e4q28","q":"Un rabais est accordé…","o":["pour une grosse quantité","pour un défaut de qualité ou de conformité","pour un paiement anticipé","en fin d'année"],"a":1,"e":"Remise : quantité ou fidélité. Escompte : paiement anticipé."},{"id":"e4q29","q":"Une ristourne est accordée…","o":["sur chaque facture","en fin de période, sur le CA cumulé","pour un défaut","pour un paiement comptant"],"a":1,"e":"Elle récompense le volume d'achats sur une période."},{"id":"e4q30","q":"Charges fixes 30 000 €, taux de marge sur coût variable 40 % : seuil de rentabilité ?","o":["12 000 €","70 000 €","75 000 €","120 000 €"],"a":2,"e":"30 000 / 0,40 = 75 000 € de CA."},{"id":"e4q31","q":"Montant de l'indemnité forfaitaire pour retard de paiement entre professionnels ?","o":["10 €","40 €","100 €","Aucune"],"a":1,"e":"En plus des pénalités de retard."},{"id":"e4q32","q":"Une négociation « distributive » est…","o":["gagnant-gagnant","gagnant-perdant","perdant-perdant","sans enjeu"],"a":1,"e":"On se partage un gâteau fixe."},{"id":"e4q33","q":"Pour un prix barré, le prix de référence doit être…","o":["le prix conseillé","le plus bas pratiqué dans les 30 derniers jours","le prix d'un concurrent","libre"],"a":1,"e":"Règle de l'annonce de réduction de prix."},{"id":"e4q34","q":"Quelles sont les 4 compétences du bloc 1 (E4) ?","o":["Cibler et prospecter, négocier, animer un évènement, exploiter l'information","Vendre, encaisser, livrer, facturer","Manager, recruter, former, évaluer","Communiquer, digitaliser, référencer, animer un réseau"],"a":0,"e":"C1 cibler/prospecter, C2 négocier et accompagner, C3 évènement commercial, C4 information commerciale."},{"id":"e4q35","q":"Que contient la fiche 2 du dossier E4 ?","o":["Une vente","L'organisation et l'animation d'un évènement commercial","Une campagne d'e-mailing","Une étude de marché"],"a":1,"e":"Fiche 1 : négociation-vente. Fiche 2 : évènement commercial."},{"id":"e4q36","q":"Quelles sont les 3 analyses attendues dans chaque fiche E4 ?","o":["Amont (ciblage/prospection), information, réflexive","SWOT, PESTEL, BCG","Financière, juridique, sociale","Prix, produit, place"],"a":0,"e":"L'analyse réflexive (ce que tu ferais autrement) compte beaucoup pour le jury."},{"id":"e4q37","q":"Une activité seulement observée en entreprise peut-elle figurer dans les fiches E4 ?","o":["Non, jamais","Oui, si tu le dis honnêtement","Oui, en la présentant comme la tienne","Seulement en B2B"],"a":1,"e":"Une activité observée est acceptée, à condition de le dire."},{"id":"e4q38","q":"Que fait la fiche-sujet de la simulation ?","o":["Elle te donne un produit inconnu","Elle modifie des paramètres d'une de tes fiches (client, objection, budget…)","Elle te demande un exposé théorique","Elle remplace ton dossier"],"a":1,"e":"Changements importants mais réalistes : d'où l'intérêt de connaître tes fiches par cœur."},{"id":"e4q39","q":"Le marketing stratégique consiste à…","o":["Fixer les prix","Choisir ses marchés : segmentation, ciblage, positionnement","Faire des promotions","Gérer les stocks"],"a":1,"e":"Le marketing opérationnel met en œuvre le mix (4P)."},{"id":"e4q40","q":"Les 4P du mix marketing sont…","o":["Prix, produit, place (distribution), promotion (communication)","Prospect, profil, potentiel, prix","Plan, process, people, profit","Prix, publicité, panier, part de marché"],"a":0,"e":"Product, Price, Place, Promotion."},{"id":"e4q41","q":"Le positionnement, c'est…","o":["L'emplacement du magasin","La place que l'on veut occuper dans l'esprit du client face aux concurrents","Le classement Google","Le rang dans la matrice BCG"],"a":1,"e":"Ex. : premium, discount, écologique…"},{"id":"e4q42","q":"Pourquoi le marketing relationnel insiste-t-il sur la fidélisation ?","o":["Parce que c'est obligatoire","Parce qu'il coûte moins cher de garder un client que d'en trouver un nouveau","Parce que les prospects n'achètent jamais","Pour éviter le RGPD"],"a":1,"e":"Conquérir puis fidéliser."},{"id":"e4q43","q":"Le style de vie est un critère de segmentation…","o":["Géographique","Sociodémographique","Psychographique","Comportemental"],"a":2,"e":"La fréquence d'achat ou la fidélité sont des critères comportementaux."},{"id":"e4q44","q":"En B2B, lequel est un critère de segmentation courant ?","o":["L'âge du client","La taille de l'entreprise (effectif, CA)","Le signe astrologique","La couleur préférée"],"a":1,"e":"Secteur, taille, localisation, potentiel, statut (client, ancien client, prospect)."},{"id":"e4q45","q":"Le taux d'attrition mesure…","o":["Les nouveaux clients","Les clients perdus sur une période","Le panier moyen","La marge"],"a":1,"e":"À l'inverse du taux de fidélité."},{"id":"e4q46","q":"Dans la méthode ABC, les clients A sont…","o":["À abandonner","À choyer (ils font l'essentiel du CA)","À rentabiliser","Des prospects"],"a":1,"e":"A à choyer, B à développer, C à rentabiliser."},{"id":"e4q47","q":"La valeur client, c'est…","o":["Le prix d'un produit","Ce qu'un client rapporte sur toute la durée de la relation","Son panier moyen d'un jour","Sa note de satisfaction"],"a":1,"e":"D'où l'intérêt de fidéliser."},{"id":"e4q48","q":"Le jury demande « Pourquoi ce client ? ». La meilleure réponse s'appuie sur…","o":["Ton intuition","Des chiffres : part du CA, potentiel, ancienneté, segment","Le fait qu'il est sympathique","Le hasard du fichier"],"a":1,"e":"Réflexe jury : justifier par les chiffres."},{"id":"e4q49","q":"Un prospect qualifié, c'est un prospect dont on connaît…","o":["Le nom seulement","Le besoin, le budget, le décideur et le délai","L'adresse e-mail seulement","La date de naissance"],"a":1,"e":"Besoin, budget, décideur, délai."},{"id":"e4q50","q":"Quelle source de prospects est souvent la plus efficace ?","o":["L'achat de fichiers","La recommandation via les réseaux professionnels","Le porte-à-porte au hasard","Les pop-ups"],"a":1,"e":"CCI, clubs d'entreprises, LinkedIn, parrainage : la recommandation rassure."},{"id":"e4q51","q":"Taux de joignabilité =","o":["Ventes / rendez-vous × 100","Contacts joints / appels passés × 100","Rendez-vous / contacts joints × 100","Coût / contacts"],"a":1,"e":"Il mesure la qualité du fichier."},{"id":"e4q52","q":"Taux de rendez-vous =","o":["Rendez-vous obtenus / contacts joints × 100","Ventes / visiteurs × 100","Appels / jours","Contacts / coût"],"a":0,"e":"Il mesure l'efficacité de ton discours au téléphone."},{"id":"e4q53","q":"Une action coûte 4 000 € et génère 6 000 € de marge. Le ROI est de…","o":["25 %","50 %","150 %","2 000 %"],"a":1,"e":"(6 000 − 4 000) / 4 000 × 100 = 50 %."},{"id":"e4q54","q":"Face au barrage d'une assistante, il faut…","o":["Mentir sur l'objet de l'appel","Rester courtois, être précis et demander le meilleur moment pour rappeler","Raccrocher","Insister jusqu'à passer"],"a":1,"e":"Le filtre fait partie du centre d'achat : il faut le respecter."},{"id":"e4q55","q":"Dans le schéma de la communication, les « bruits » sont…","o":["Uniquement les sons","Tout ce qui déforme le message (fatigue, jargon, environnement)","Les réponses du client","Les silences"],"a":1,"e":"D'où l'intérêt de reformuler et vérifier la compréhension."},{"id":"e4q56","q":"Le ton et le débit de la voix relèvent du…","o":["Verbal","Paraverbal","Non-verbal","Écrit"],"a":1,"e":"Verbal : les mots. Paraverbal : la voix. Non-verbal : posture, regard, gestes."},{"id":"e4q57","q":"Que faut-il savoir sur la règle de Mehrabian (7 %, 38 %, 55 %) ?","o":["Elle s'applique à toute communication","Elle n'est valable que pour exprimer des émotions : à citer avec prudence","Elle a été abolie","Elle concerne les e-mails"],"a":1,"e":"Souvent mal citée."},{"id":"e4q58","q":"« Si je comprends bien, vous cherchez… » est une reformulation…","o":["Écho","Résumé","Alternative","Relais"],"a":1,"e":"La reformulation écho reprend simplement les mots du client."},{"id":"e4q59","q":"« C'est-à-dire ? » est une question…","o":["Fermée","Alternative","Relais","Entonnoir"],"a":2,"e":"Elle relance le client pour qu'il précise."},{"id":"e4q60","q":"Aller du général au précis dans ses questions, c'est la technique de…","o":["L'entonnoir","L'écho","Le boomerang","La compensation"],"a":0,"e":"On ouvre largement, puis on resserre."},{"id":"e4q61","q":"En analyse transactionnelle, les trois états du moi selon Berne sont…","o":["Parent, adulte, enfant","Client, vendeur, acheteur","Ça, moi, surmoi","Sécurité, orgueil, nouveauté"],"a":0,"e":"Le vendeur vise la relation adulte-adulte."},{"id":"e4q62","q":"« Je suis OK, tu es OK » correspond à une relation…","o":["Gagnant-perdant","Gagnant-gagnant","Perdant-perdant","Dominant-dominé"],"a":1,"e":"Position de vie favorable à la négociation."},{"id":"e4q63","q":"Lors de la préparation, l'objectif minimum, c'est…","o":["Ce qu'on espère au mieux","Ce qu'on accepte au pire","Le prix catalogue","Le CA annuel"],"a":1,"e":"On prépare un objectif idéal et un objectif minimum."},{"id":"e4q64","q":"Pendant la découverte, combien de temps le client doit-il parler ?","o":["10 %","30 %","50 %","70 %"],"a":3,"e":"La découverte est l'étape la plus importante : le client parle environ 70 % du temps."},{"id":"e4q65","q":"Dans SONCAS, le mobile « Orgueil » renvoie à…","o":["Le prix","Le prestige et l'image","La garantie","La simplicité"],"a":1,"e":"S sécurité, O orgueil, N nouveauté, C confort, A argent, S sympathie."},{"id":"e4q66","q":"Que désigne le E de SONCASE ?","o":["L'économie","L'environnement","L'émotion","L'efficacité"],"a":1,"e":"Produits durables, éthiques."},{"id":"e4q67","q":"Quand peut-on commencer à argumenter ?","o":["Dès le bonjour","Après une reformulation validée par le client","Après avoir annoncé le prix","Jamais avant la conclusion"],"a":1,"e":"Le client dit « oui, c'est bien cela » : tu peux argumenter."},{"id":"e4q68","q":"Dans la méthode CAP, le P signifie…","o":["Prix","Preuve","Produit","Promotion"],"a":1,"e":"Caractéristique, Avantage, Preuve (démonstration, chiffre, label, avis)."},{"id":"e4q69","q":"Comment considérer une objection ?","o":["Comme un refus définitif","Comme un signe d'intérêt","Comme une insulte","Comme une perte de temps"],"a":1,"e":"Écouter, reformuler ou questionner, répondre, valider."},{"id":"e4q70","q":"Reconnaître un défaut puis mettre en avant un avantage plus fort, c'est…","o":["Le boomerang","La compensation","Le report","Le oui, mais"],"a":1,"e":"Ex. : « Il est plus cher, mais il dure deux fois plus longtemps. »"},{"id":"e4q71","q":"Le client parle du prix dès le début. Tu réponds « j'y reviens dans un instant » : c'est…","o":["Le report","La preuve","La division","Le boomerang"],"a":0,"e":"On annonce le prix après les avantages."},{"id":"e4q72","q":"« Soit 1,20 € par jour » est une technique de présentation du prix appelée…","o":["Sandwich","Division (fractionnement)","Comparaison","Addition"],"a":1,"e":"On ramène le prix à une petite unité."},{"id":"e4q73","q":"Comment faire une concession pendant une négociation ?","o":["Gratuitement pour faire plaisir","Toujours contre une contrepartie","En commençant par la plus grosse","En passant sous le prix plancher si besoin"],"a":1,"e":"« Si vous commandez aujourd'hui, alors… ». Des concessions de plus en plus petites."},{"id":"e4q74","q":"Résumer les avantages acceptés par le client puis demander son accord est une conclusion…","o":["Alternative","Récapitulative","Implicite","Par dernier argument"],"a":1,"e":"On rappelle les « oui » obtenus."},{"id":"e4q75","q":"Après la vente, féliciter le client pour son choix sert à…","o":["Gagner du temps","Le rassurer et éviter les regrets","Augmenter le prix","Clore le dossier"],"a":1,"e":"Puis rappeler la suite (livraison, installation) et préparer la fidélisation."},{"id":"e4q76","q":"Dans le centre d'achat, celui qui signe est…","o":["L'acheteur","Le décideur","L'utilisateur","Le filtre"],"a":1,"e":"L'acheteur négocie et passe commande ; le décideur tranche."},{"id":"e4q77","q":"Qui a modélisé le centre d'achat ?","o":["Fisher et Ury","Webster et Wind","Berne","Pareto"],"a":1,"e":"Webster et Wind : plusieurs personnes participent à la décision en B2B."},{"id":"e4q78","q":"Les marchés publics reposent sur…","o":["La relation personnelle avec l'élu","L'appel d'offres, l'égalité de traitement et la transparence","Le prix le plus élevé","Le tirage au sort"],"a":1,"e":"Vendre au public (B2G) obéit à des règles strictes."},{"id":"e4q79","q":"Une négociation intégrative cherche à…","o":["Partager un gâteau fixe","Agrandir le gâteau : gagnant-gagnant","Écraser l'autre","Rompre au plus vite"],"a":1,"e":"À l'inverse de la négociation distributive (gagnant-perdant)."},{"id":"e4q80","q":"Qui sont les auteurs de la négociation raisonnée (Harvard) ?","o":["Fisher et Ury","Webster et Wind","Porter et Barney","Berne et Mehrabian"],"a":0,"e":"Séparer personnes et problème, intérêts plutôt que positions, options multiples, critères objectifs."},{"id":"e4q81","q":"Plus ta MESORE est bonne…","o":["Plus tu es en position de faiblesse","Plus tu es en position de force","Plus tu dois céder","Moins elle compte"],"a":1,"e":"Meilleure solution de rechange : ce que tu feras si l'accord échoue."},{"id":"e4q82","q":"Première étape du traitement d'une réclamation ?","o":["Se justifier","Écouter le client sans se justifier","Proposer un avoir","Transmettre au SAV"],"a":1,"e":"Écouter, montrer de l'empathie, comprendre, proposer, suivre."},{"id":"e4q83","q":"Le NPS se calcule ainsi :","o":["% de promoteurs − % de détracteurs","Nombre de clients × panier moyen","Note moyenne sur 5","% de clients satisfaits"],"a":0,"e":"Net Promoter Score : mesure la recommandation."},{"id":"e4q84","q":"Le rétroplanning d'un évènement se construit…","o":["Du jour J vers aujourd'hui","Au hasard","Après l'évènement","Seulement pour le budget"],"a":0,"e":"Toutes les tâches, avec un responsable et une date."},{"id":"e4q85","q":"Collecter les coordonnées des visiteurs pendant un salon nécessite…","o":["Rien de particulier","Leur consentement","Une autorisation de la mairie","Un paiement"],"a":1,"e":"RGPD : collecte avec consentement, minimum de données."},{"id":"e4q86","q":"Lequel relève du bilan qualitatif d'un évènement ?","o":["Le nombre de visiteurs","La satisfaction des visiteurs et les retombées d'image","Le coût par contact","Le CA réalisé"],"a":1,"e":"Le quantitatif : visiteurs, contacts, ventes, CA, coût, ROI."},{"id":"e4q87","q":"Pour un évènement, qu'évalue particulièrement le jury ?","o":["La décoration du stand","La rigueur du suivi des contacts après l'évènement","Le nombre de goodies","La tenue vestimentaire"],"a":1,"e":"Saisie CRM, relances, rendez-vous et ventes conclues après."},{"id":"e4q88","q":"Les réclamations et le SAV sont des sources d'information…","o":["Externes","Internes","Concurrentielles","Juridiques"],"a":1,"e":"Internes : CRM, ventes, comptes rendus, SAV, réclamations."},{"id":"e4q89","q":"Un compte rendu de visite contient…","o":["Le récit complet de la journée","Les faits, les informations nouvelles et la suite à donner","Seulement le CA","L'avis personnel du commercial sur le client"],"a":1,"e":"Il sert à faire remonter l'information utile."},{"id":"e4q90","q":"L'écart-type mesure…","o":["La tendance","La dispersion des valeurs autour de la moyenne","La part de marché","La saisonnalité"],"a":1,"e":"Valeurs proches ou éloignées de la moyenne ?"},{"id":"e4q91","q":"Pour représenter une répartition (parts de CA par produit), on utilise…","o":["Une courbe","Des secteurs (camembert)","Un nuage de points","Un tableau de bord"],"a":1,"e":"Courbe : évolution. Barres : comparaison. Secteurs : répartition."},{"id":"e4q92","q":"Les ventes passent de 200 à 230. L'évolution est de…","o":["+ 13 %","+ 15 %","+ 30 %","+ 23 %"],"a":1,"e":"(230 − 200) / 200 × 100 = 15 %."},{"id":"e4q93","q":"CA de 4 500 € pour 150 ventes : le panier moyen est de…","o":["15 €","30 €","45 €","300 €"],"a":1,"e":"4 500 / 150 = 30 €."},{"id":"e4q94","q":"Une entreprise réalise 2 M€ sur un marché de 20 M€. Sa part de marché est de…","o":["2 %","10 %","20 %","40 %"],"a":1,"e":"2 / 20 × 100 = 10 %."},{"id":"e4q95","q":"Un prix TTC de 72 € (TVA 20 %) correspond à un prix HT de…","o":["57,60 €","60 €","62 €","86,40 €"],"a":1,"e":"72 / 1,20 = 60 €. Piège : ne pas retirer 20 % du TTC."},{"id":"e4q96","q":"Un escompte est accordé…","o":["Pour un défaut de qualité","Pour un paiement anticipé","En fin d'année sur le CA","Pour une grosse quantité"],"a":1,"e":"Rabais : défaut. Remise : quantité ou fidélité. Ristourne : fin de période."},{"id":"e4q97","q":"Envoyer un e-mail de prospection à un particulier nécessite…","o":["Rien, c'est libre","Son consentement préalable (sauf client existant, produits analogues)","Un courrier recommandé","L'accord de la CNIL"],"a":1,"e":"Case non pré-cochée. En B2B, c'est possible si le message concerne sa profession, avec droit d'opposition."},{"id":"e4q98","q":"Quand une vente est-elle conclue selon l'article 1583 du Code civil ?","o":["À la livraison","Dès l'accord sur la chose et sur le prix","Au paiement complet","À la signature d'un écrit"],"a":1,"e":"Le contrat de vente est consensuel."},{"id":"e4q99","q":"Les CGV doivent être communiquées…","o":["Jamais","À tout acheteur professionnel qui les demande","Seulement aux particuliers","Uniquement en cas de litige"],"a":1,"e":"Elles sont le socle de la négociation commerciale."},{"id":"e4q100","q":"La garantie légale de conformité d'un bien neuf vendu par un professionnel dure…","o":["6 mois","1 an","2 ans","5 ans"],"a":2,"e":"2 ans pour un bien neuf."},{"id":"e4q101","q":"Revendre un produit en dessous de son prix d'achat, c'est…","o":["Une promotion autorisée","La revente à perte, interdite","Un rabais","Une ristourne"],"a":1,"e":"La revente à perte est interdite (sauf exceptions comme les soldes)."},{"id":"e4q102","q":"Pendant la simulation, que faire avant d'argumenter ?","o":["Annoncer le prix","Reformuler les besoins du client","Réciter tout l'argumentaire","Conclure"],"a":1,"e":"Écouter vraiment : le jury glisse des indices dans ses réponses."},{"id":"e4q103","q":"Lors de l'analyse réflexive après la simulation, il vaut mieux…","o":["Dire que tout était parfait","Être lucide : un point fort, un point à améliorer, ce que tu ferais autrement","Critiquer le jury","Ne rien dire"],"a":1,"e":"Reconnaître une erreur bien analysée rapporte des points."},{"id":"e4q104","q":"Un crédit affecté est…","o":["Un crédit libre d'utilisation","Un crédit lié à un achat précis : si la vente est annulée, le crédit l'est aussi","Une réserve d'argent renouvelable","Une location sans option d'achat"],"a":1,"e":"Vente et crédit affecté sont liés."},{"id":"e4q105","q":"La LOA, c'est…","o":["Une location avec option d'achat","Une location longue durée sans achat","Un prêt immobilier","Un paiement en 3 fois"],"a":0,"e":"La LLD, elle, n'a pas d'option d'achat."},{"id":"e4q106","q":"Le TAEG exprime…","o":["Le prix du produit","Le coût total du crédit (intérêts et frais) en pourcentage annuel","Le montant de la mensualité","La TVA du crédit"],"a":1,"e":"C'est le chiffre qui permet de comparer deux offres de crédit."},{"id":"e4q107","q":"Depuis le 20 novembre 2026, le paiement en 3 ou 4 fois…","o":["Est interdit","Entre dans le régime du crédit à la consommation","N'a plus de délai de rétractation","Est réservé aux professionnels"],"a":1,"e":"Les mini-crédits de moins de 200 € et la LOA aussi."},{"id":"e4q108","q":"Quelle mention est obligatoire dans une publicité pour un crédit depuis le 20 novembre 2026 ?","o":["« Offre sans engagement »","« Attention ! Un crédit coûte de l'argent et doit être remboursé ! »","« Paiement 100 % sécurisé »","« Crédit gratuit »"],"a":1,"e":"Et il est interdit de vanter la facilité d'obtenir un crédit."},{"id":"e4q109","q":"Délai de rétractation d'un crédit à la consommation ?","o":["3 jours","7 jours","14 jours calendaires","30 jours"],"a":2,"e":"Prolongé si le prêteur n'a pas fourni toutes les informations obligatoires."},{"id":"e4q110","q":"Un client achète sur un stand de foire avec un crédit affecté. Peut-il se rétracter ?","o":["Non, jamais en foire","Oui, grâce au crédit affecté","Seulement s'il paie comptant","Seulement le premier jour"],"a":1,"e":"C'est l'exception à l'absence de rétractation en foire et salon."},{"id":"e4q111","q":"Un acompte signifie que…","o":["Le client peut renoncer en perdant la somme","La vente est ferme : aucune partie ne peut se dédire","Le vendeur doit rendre le double","Le paiement est facultatif"],"a":1,"e":"Avec des arrhes, au contraire, on peut renoncer (perte des arrhes ou restitution du double)."},{"id":"e4q112","q":"Entre un professionnel et un consommateur, une somme versée d'avance est présumée être…","o":["Un acompte","Des arrhes, sauf mention contraire","Un dépôt de garantie","Une caution"],"a":1,"e":"Code de la consommation, art. L214-1."},{"id":"e4q113","q":"L'affacturage consiste à…","o":["Vendre ses factures à une société qui avance l'argent et recouvre les créances","Assurer ses stocks","Négocier un rabais","Facturer en avance"],"a":0,"e":"La société s'appelle le factor."},{"id":"e4q114","q":"Les pénalités de retard entre professionnels sont au minimum de…","o":["1 fois le taux d'intérêt légal","3 fois le taux d'intérêt légal","10 % de la facture","40 € fixes"],"a":1,"e":"S'ajoute une indemnité forfaitaire de 40 € pour frais de recouvrement."},{"id":"e4q115","q":"Ventes de 100, 120, 140 puis 160 unités. Prévision du trimestre suivant ?","o":["160","170","180","200"],"a":2,"e":"La tendance est de + 20 par trimestre."},{"id":"e4q116","q":"Le taux de présence d'un webinaire se calcule…","o":["Présents / inscrits × 100","Inscrits / invités × 100","Ventes / présents","Durée / présents"],"a":0,"e":"Autres indicateurs : durée de visionnage, questions, contacts qualifiés, ventes."}],"r":[{"id":"e4r0","q":"Un client te dit : « C'est trop cher. » Rédige ta réponse.","p":[{"t":"Reformuler ou questionner","k":["qu'entendez","comprends","si je comprends","par rapport","compare"]},{"t":"Valoriser les avantages","k":["avantage","qualite","durable","garantie","econom"]},{"t":"Une technique de prix (division, comparaison)","k":["par jour","par mois","soit","seulement","rentabil"]},{"t":"Valider ou proposer avec une contrepartie","k":["cela repond","qu'en pensez","si vous","est-ce que","contrepartie"]}],"m":"« Je comprends, c'est un vrai budget. Qu'entendez-vous par trop cher : par rapport à quoi ? (…) Ce modèle est garanti 5 ans et consomme moitié moins d'énergie : sur sa durée de vie, il vous revient à environ 1,20 € par jour et vous fait économiser sur vos factures. Cela répond-il à votre inquiétude ? Si vous commandez aujourd'hui, je peux vous offrir la livraison. »"},{"id":"e4r1","q":"Rédige un plan d'appel CROC pour obtenir un rendez-vous avec un prospect.","p":[{"t":"Contact : se présenter, vérifier l'interlocuteur","k":["bonjour","je suis","je m'appelle","contact"]},{"t":"Raison de l'appel, centrée sur le client","k":["je vous appelle","raison","parce que","afin de"]},{"t":"Objectif : un rendez-vous avec 2 créneaux","k":["rendez-vous","rdv","mardi","jeudi","creneau","ou"]},{"t":"Conclusion : reformuler, remercier, confirmer","k":["confirm","merci","recap","je vous envoie"]}],"m":"Contact : « Bonjour, je suis Léa, de la société X. Suis-je bien avec M. Martin, responsable des achats ? » Raison : « Je vous appelle car nous aidons des entreprises comme la vôtre à réduire leurs coûts d'impression de 20 %. » Objectif : « Je vous propose d'en parler 20 minutes : préférez-vous mardi 10 h ou jeudi 14 h ? » Conclusion : « C'est noté pour jeudi 14 h, je vous envoie une confirmation par e-mail. Merci et bonne journée. »"},{"id":"e4r2","q":"Présente un argument avec la méthode CAP pour un produit de ton choix.","p":[{"t":"Une caractéristique","k":["caracteristique","c'est","il est","elle est","dote","equipe"]},{"t":"Un avantage pour le client","k":["avantage","vous permet","pour vous","vous pourrez","grace"]},{"t":"Une preuve","k":["preuve","garanti","demonstr","test","avis","label","essay"]}],"m":"Caractéristique : « Ce vélo électrique a une batterie de 600 Wh. » Avantage : « Vous pourrez faire vos trajets de la semaine sans le recharger. » Preuve : « Notre test sur route a mesuré 110 km d'autonomie, et je vous propose de l'essayer maintenant. »"},{"id":"e4r3","q":"Quelles questions poses-tu en découverte à un client qui veut un ordinateur portable ?","p":[{"t":"Une question ouverte sur l'usage","k":["usage","utilis","pour quoi","pourquoi","faire"]},{"t":"Le budget","k":["budget","combien"]},{"t":"Les critères techniques ou les contraintes","k":["autonom","poids","ecran","performance","stockage","transport","deplac"]},{"t":"Une reformulation pour valider","k":["si je resume","si je comprends","donc vous","c'est bien"]}],"m":"« Pour quoi allez-vous utiliser cet ordinateur ? » « Le transporterez-vous souvent ? » « Quelle autonomie vous faut-il ? » « Quels logiciels utilisez-vous ? » « Quel budget avez-vous prévu ? » « Pour quand en avez-vous besoin ? » Puis reformuler : « Si je résume, vous cherchez un ordinateur léger, avec une longue autonomie, pour moins de 800 € : c'est bien cela ? »"},{"id":"e4r4","q":"Comment évaluer la rentabilité d'une action de prospection ? Donne les indicateurs et un exemple de calcul.","p":[{"t":"Le taux de transformation","k":["transformation"]},{"t":"Le coût par contact ou d'acquisition","k":["cout par contact","cout d'acquisition","cout"]},{"t":"Le retour sur investissement","k":["retour sur investissement","roi","rentabilite"]},{"t":"Un calcul chiffré","k":["%","="]}],"m":"On mesure le taux de transformation (ventes / contacts × 100), le coût par contact (coût de l'action / nombre de contacts) et le retour sur investissement : (marge générée − coût) / coût × 100. Exemple : une action coûte 4 000 € et génère 6 000 € de marge ; ROI = (6 000 − 4 000) / 4 000 × 100 = 50 % : l'action est rentable."},{"id":"e4r5","q":"Comment traites-tu la réclamation d'un client mécontent ?","p":[{"t":"Écouter sans couper ni se justifier","k":["ecout"]},{"t":"Montrer de l'empathie, s'excuser","k":["empath","comprends","excus","desole"]},{"t":"Proposer une solution","k":["solution","rembours","echange","geste","remplac"]},{"t":"Assurer le suivi pour fidéliser","k":["suivi","rappel","fideli","recontact"]}],"m":"1. J'écoute le client sans le couper ni me justifier. 2. Je montre de l'empathie : « Je comprends votre mécontentement, je suis désolé. » 3. Je questionne pour comprendre et vérifier les faits. 4. Je propose une solution : échange, réparation, remboursement ou geste commercial. 5. Je le rappelle ensuite pour vérifier qu'il est satisfait : une réclamation bien traitée peut fidéliser le client."},{"id":"e4r6","q":"Un produit est acheté 50 € HT et vendu 80 € HT. Calcule la marge, le taux de marge et le taux de marque.","p":[{"t":"Marge = 30 €","k":["30"]},{"t":"Taux de marge = 60 %","k":["60"]},{"t":"Taux de marque = 37,5 %","k":["37,5","37.5"]},{"t":"Les bonnes formules","k":["achat","vente","/"]}],"m":"Marge = 80 − 50 = 30 €. Taux de marge = marge / coût d'achat × 100 = 30 / 50 × 100 = 60 %. Taux de marque = marge / prix de vente HT × 100 = 30 / 80 × 100 = 37,5 %."},{"id":"e4r7","q":"Un client a acheté sur ton stand pendant une foire et veut annuler le lendemain. Que lui réponds-tu ?","p":[{"t":"Pas de droit de rétractation en foire ou salon","k":["pas de droit","pas du droit","ne beneficie pas","pas de retract","aucun droit","ne peut pas","pas possible"]},{"t":"Sauf crédit affecté","k":["credit"]},{"t":"Le vendeur doit l'afficher","k":["affich","panneau","inform"]}],"m":"En foire ou en salon, le consommateur ne bénéficie pas du droit de rétractation (sauf si l'achat est financé par un crédit affecté). Le vendeur doit l'indiquer clairement par un affichage sur le stand. Je l'explique au client avec courtoisie, et je peux chercher un geste commercial pour garder une bonne relation."}],"cs":[{"id":"e4c0","t":"Le salon Habitat de Nantes","x":["Tu es commercial chez SoliCuisine, fabricant de cuisines. Ton stand au salon Habitat coûte 4 500 € en tout.","Pendant 3 jours : 600 visiteurs sur le stand, 90 contacts qualifiés, 12 ventes. Panier moyen : 6 000 € HT. Taux de marge : 30 % du prix de vente HT.","Une cliente, Mme Roux, veut annuler la cuisine qu'elle a signée sur le stand hier."],"q":[{"id":"e4c0q0","q":"Calcule le taux de transformation (ventes / contacts qualifiés) et le CA du salon.","p":[{"t":"Taux de transformation = 12 / 90 × 100 ≈ 13,3 %","k":["13,3","13.3","13 %","13%"]},{"t":"CA = 12 × 6 000 = 72 000 € HT","k":["72 000","72000"]},{"t":"Une phrase d'interprétation","k":["sur 100","contacts","bon","correct","faible","signifie"]}],"m":"Taux de transformation = 12 / 90 × 100 ≈ 13,3 % : environ 13 contacts qualifiés sur 100 ont acheté. CA = 12 × 6 000 = 72 000 € HT."},{"id":"e4c0q1","q":"Le salon est-il rentable ? Calcule la marge et le retour sur investissement.","p":[{"t":"Marge = 30 % × 72 000 = 21 600 €","k":["21 600","21600"]},{"t":"ROI = (21 600 − 4 500) / 4 500 × 100 = 380 %","k":["380","17 100","17100"]},{"t":"Conclusion : oui, rentable","k":["rentable","oui","rapporte"]}],"m":"Marge = 30 % × 72 000 = 21 600 €. Retour sur investissement = (21 600 − 4 500) / 4 500 × 100 = 380 %. Le salon est très rentable : chaque euro investi a rapporté 3,80 € de marge en plus. Et les 78 contacts non transformés peuvent encore donner des ventes."},{"id":"e4c0q2","q":"Que réponds-tu à Mme Roux, qui veut annuler l'achat signé sur le stand ?","p":[{"t":"Pas de droit de rétractation en foire et salon","k":["pas de retractation","pas de droit","aucun droit","foire","salon"]},{"t":"Sauf si l'achat est financé par un crédit affecté","k":["credit affecte","credit","finance"]},{"t":"Rester commercial : écouter, rassurer, proposer une solution","k":["ecouter","rassurer","comprendre","solution","geste"]}],"m":"Juridiquement, un achat signé sur un stand de foire ou de salon n'ouvre pas de droit de rétractation (le vendeur doit l'afficher), sauf si l'achat est financé par un crédit affecté. Mais je reste commercial : j'écoute ses raisons, je la rassure sur son choix et, si besoin, je cherche une solution (modification du projet, report de pose) pour garder une cliente satisfaite."}]},{"id":"e4c1","t":"La négociation avec Bureau Pro","x":["Tu vends des fauteuils de bureau. Bureau Pro, une PME de 40 salariés, veut équiper tout son open space : 40 fauteuils à 250 € HT l'unité.","L'acheteur trouve le prix trop élevé et demande 15 % de remise. Ton prix plancher est de 220 € HT. Ton coût d'achat est de 150 € HT.","L'utilisateur principal, le responsable RH, s'inquiète surtout des maux de dos des salariés."],"q":[{"id":"e4c1q0","q":"Quelle remise maximale peux-tu accorder ? Accorder 15 % est-il possible ?","p":[{"t":"Remise max = (250 − 220) / 250 = 12 %","k":["12 %","12%","30 €","30€"]},{"t":"15 % donne 212,50 €, sous le prix plancher : impossible","k":["212","sous le prix plancher","en dessous","impossible","non"]},{"t":"Contrepartie si concession","k":["contrepartie","en echange","si vous","engagement"]}],"m":"Remise maximale = (250 − 220) / 250 × 100 = 12 %. Une remise de 15 % ramènerait le prix à 212,50 €, sous le prix plancher : c'est impossible. Je peux concéder jusqu'à 12 %, mais toujours contre une contrepartie (commande ferme aujourd'hui, paiement rapide, contrat d'entretien)."},{"id":"e4c1q1","q":"Quel mobile SONCAS vises-tu chez le responsable RH ? Formule un argument CAP.","p":[{"t":"Mobile : sécurité ou confort (santé des salariés)","k":["securite","confort","sante"]},{"t":"Caractéristique (ex. soutien lombaire réglable)","k":["lombaire","reglable","ergonom","dossier"]},{"t":"Avantage pour le client (moins de maux de dos, d'absences)","k":["mal de dos","maux de dos","absence","bien-etre","productiv"]},{"t":"Preuve (essai, garantie, norme, avis)","k":["essai","essayer","garantie","norme","certifi","temoignage","avis"]}],"m":"Le responsable RH est sensible à la sécurité et au confort (santé des salariés). Argument CAP : ce fauteuil a un soutien lombaire réglable (C) qui réduit les maux de dos et donc les absences (A) ; il est certifié pour un usage de 8 h par jour et je vous en laisse deux à l'essai pendant une semaine (P)."},{"id":"e4c1q2","q":"Ta marge unitaire si tu vends à 225 € HT ? Et ton taux de marque ?","p":[{"t":"Marge unitaire = 225 − 150 = 75 €","k":["75"]},{"t":"Taux de marque = 75 / 225 × 100 ≈ 33,3 %","k":["33,3","33.3","33 %","33%"]},{"t":"Marge totale = 75 × 40 = 3 000 €","k":["3 000","3000"]}],"m":"Marge unitaire = 225 − 150 = 75 € HT. Taux de marque = 75 / 225 × 100 ≈ 33,3 %. Sur 40 fauteuils, la marge totale est de 3 000 €."}]},{"id":"e4c2","t":"La prospection de Fit&Go","x":["Tu es en stage chez Fit&Go, une salle de sport. Objectif : recruter des entreprises voisines pour proposer des abonnements à leurs salariés.","Ton fichier : 200 entreprises. Tu passes 200 appels, tu joins 120 décideurs et obtiens 18 rendez-vous. 6 contrats sont signés.","La campagne a coûté 1 200 € (fichier et temps passé)."],"q":[{"id":"e4c2q0","q":"Calcule le taux de joignabilité, le taux de rendez-vous et le taux de transformation.","p":[{"t":"Joignabilité = 120 / 200 = 60 %","k":["60 %","60%"]},{"t":"Rendez-vous = 18 / 120 = 15 %","k":["15 %","15%"]},{"t":"Transformation = 6 / 18 ≈ 33,3 %","k":["33,3","33.3","33 %","33%"]}],"m":"Taux de joignabilité = 120 / 200 × 100 = 60 %. Taux de rendez-vous = 18 / 120 × 100 = 15 %. Taux de transformation = 6 / 18 × 100 ≈ 33,3 %."},{"id":"e4c2q1","q":"Rédige l'accroche de ton appel (méthode CROC : contact et raison).","p":[{"t":"Se présenter et vérifier l'interlocuteur","k":["bonjour","je suis","je m'appelle","fit&go","fit and go","fit & go"]},{"t":"Une accroche centrée sur le bénéfice pour l'entreprise","k":["salaries","bien-etre","absenteisme","sante","avantage","motivation"]},{"t":"Proposer un rendez-vous avec deux créneaux","k":["rendez-vous","mardi","jeudi","ou","creneau","rencontrer"]}],"m":"« Bonjour, je suis Lina, de la salle Fit&Go située à deux rues de vos bureaux. Je souhaite parler à la personne en charge des avantages salariés. Nous aidons les entreprises du quartier à réduire le stress et l'absentéisme grâce à des abonnements à tarif réduit pour leurs salariés. Je vous propose de vous présenter l'offre en 20 minutes : seriez-vous disponible mardi à 10 h ou jeudi à 14 h ? »"},{"id":"e4c2q2","q":"Depuis août 2026, pourrais-tu appeler les salariés chez eux, sur leur portable personnel, pour leur vendre un abonnement ? Explique.","p":[{"t":"Non sans consentement préalable","k":["non","consentement","accord prealable","interdit"]},{"t":"Règle en vigueur depuis le 11 août 2026, Bloctel disparaît","k":["11 aout","2026","bloctel"]},{"t":"En B2B (appeler l'entreprise), c'est possible avec droit d'opposition","k":["b2b","professionnel","entreprise","opposition"]}],"m":"Non : depuis le 11 août 2026, prospecter un particulier par téléphone exige son consentement préalable (Bloctel a disparu). Appeler l'entreprise sur sa ligne professionnelle pour une offre liée à son activité reste possible, avec un droit d'opposition. C'est pour cela qu'on passe par l'employeur."}]}]},{"k":"e5","n":"Digitalisation","s":"E5 · Relation à distance","c":"#7B4FD6","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 2 · Épreuve E5<\/span>\n<div style=\"font-weight:800;--big:1\"><span style=\"color:#2F5BEA\">Relation client à distance<\/span><br><span style=\"color:#7B4FD6\">&amp; digitalisation<\/span><\/div>\n<p>La relation client par téléphone, sur les réseaux et sur un site e-commerce. Tout pour réussir l'écrit et la partie pratique sur ordinateur.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 4<\/span><span class=\"sm\" style=\"color:#D6D8E6\">2 + 2<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">écrit : une étude de cas<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">40 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">pratique sur ordinateur<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Ponctuel<\/span><span class=\"sm\" style=\"color:#D6D8E6\">pour tous, pas de CCF<\/span><\/div>\n<\/div>\n<h2>Les 3 compétences évaluées<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><h3>Maîtriser la relation omnicanale<\/h3><p class=\"sm\">Vendre et accompagner à distance, suivre les indicateurs, encadrer une équipe de téléconseillers.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C2<\/span><h3>Animer la relation client digitale<\/h3><p class=\"sm\">Produire et publier des contenus, les rendre visibles, animer une communauté, surveiller l'e-réputation.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C3<\/span><h3>Développer la relation client en e-commerce<\/h3><p class=\"sm\">Dynamiser le site, sécuriser la vente, analyser les résultats.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>09<\/b> · C2 : le référencement<\/span>\n<span><b>03<\/b> · Méthode de l'écrit et de la pratique<\/span><span><b>10<\/b> · C3 : dynamiser le site<\/span>\n<span><b>04<\/b> · C1 : l'omnicanal et les outils<\/span><span><b>11<\/b> · C3 : sécuriser la vente en ligne<\/span>\n<span><b>05<\/b> · C1 : les indicateurs à distance<\/span><span><b>12<\/b> · C3 : les indicateurs e-commerce<\/span>\n<span><b>06<\/b> · C1 : manager une équipe<\/span><span><b>13<\/b> · Les outils de la pratique<\/span>\n<span><b>07<\/b> · C2 : la stratégie de contenu<\/span><span><b>14<\/b> · Données client et lexique<\/span>\n<span><b>08<\/b> · C2 : réseaux sociaux, e-réputation<\/span><span><b>15<\/b> · Kit minimum et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 2 · épreuve e5 relation client à distance & digitalisation la relation client par téléphone, sur les réseaux et sur un site e-commerce. tout pour réussir l'écrit et la partie pratique sur ordinateur. coef. 4 2 + 2 3 h écrit : une étude de cas 40 min pratique sur ordinateur ponctuel pour tous, pas de ccf les 3 compétences évaluées c1 maîtriser la relation omnicanale vendre et accompagner à distance, suivre les indicateurs, encadrer une équipe de téléconseillers. c2 animer la relation client digitale produire et publier des contenus, les rendre visibles, animer une communauté, surveiller l'e-réputation. c3 développer la relation client en e-commerce dynamiser le site, sécuriser la vente, analyser les résultats. 02 · le déroulement de l'épreuve 09 · c2 : le référencement 03 · méthode de l'écrit et de la pratique 10 · c3 : dynamiser le site 04 · c1 : l'omnicanal et les outils 11 · c3 : sécuriser la vente en ligne 05 · c1 : les indicateurs à distance 12 · c3 : les indicateurs e-commerce 06 · c1 : manager une équipe 13 · les outils de la pratique 07 · c2 : la stratégie de contenu 14 · données client et lexique 08 · c2 : réseaux sociaux, e-réputation 15 · kit minimum et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">Pas de CCF pour l'E5 : quel que soit ton statut, l'épreuve est ponctuelle, en deux parties qui comptent autant l'une que l'autre.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\" style=\"gap:8px\"><span class=\"tag fB\">Partie 1 · Écrit · 3 h · coef. 2<\/span><h2>Une étude de cas<\/h2>\n<ul class=\"sm\"><li>Une organisation réelle et ses problèmes commerciaux, avec des documents en annexe.<\/li><li>Une relation client omnicanale, avec des outils digitaux.<\/li><li>Les questions sont souvent regroupées en 2 ou 3 dossiers (ex. 2025 : « construire une image et veiller à l'e-réputation »).<\/li><li>Tu peux devoir mobiliser de l'économie, du droit et du management, et une vraie réflexion commerciale.<\/li><li>Corrigé par deux professeurs.<\/li><\/ul><\/div>\n<div class=\"card cP\" style=\"gap:8px\"><span class=\"tag fP\">Partie 2 · Pratique · 40 min · coef. 2<\/span><h2>Sur ordinateur, sans préparation<\/h2>\n<ul class=\"sm\"><li>Un « contexte digital de référence » : un site web ou un site e-commerce créé au niveau national, diffusé en début de session.<\/li><li>Un sujet tiré de ce contexte : questions, situations à gérer, opérations à faire, contenus à produire.<\/li><li>Tu travailles sous le regard d'un examinateur, qui peut suivre jusqu'à 3 candidats en même temps.<\/li><li>Tu dois <b>expliquer et justifier<\/b> tes choix et tes actions.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Le conseil le plus utile<\/h3><p class=\"sm\">Le contexte digital est connu à l'avance. Entraîne-toi dessus avec ton professeur : connaître le site, ses produits et l'interface te fait gagner un temps précieux le jour J.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\"><tr><th>Compétence<\/th><th>Critères de la grille<\/th><\/tr><tr><td data-label=\"Compétence\"><span class='tB'>C1 · Omnicanal<\/span><\/td><td data-label=\"Critères de la grille\">Usage efficace des outils à distance, appropriation du dossier client, rapidité et proactivité, rigueur du reporting, évaluation de la performance, organisation et animation d'une équipe<\/td><\/tr><tr><td data-label=\"Compétence\"><span class='tP'>C2 · Digital<\/span><\/td><td data-label=\"Critères de la grille\">Qualité des contenus, référencement suivi et optimisé, cohérence entre outils, contenus et canaux, rythme de publication, contrôle de l'image<\/td><\/tr><tr><td data-label=\"Compétence\"><span class='tG'>C3 · E-commerce<\/span><\/td><td data-label=\"Critères de la grille\">Actions pertinentes pour développer ventes et valeur, qualité de l'assistance, prise en compte des risques et de la réglementation, indicateurs pertinents<\/td><\/tr><\/table>","x":"l'épreuve le déroulement de l'épreuve pas de ccf pour l'e5 : quel que soit ton statut, l'épreuve est ponctuelle, en deux parties qui comptent autant l'une que l'autre. partie 1 · écrit · 3 h · coef. 2 une étude de cas une organisation réelle et ses problèmes commerciaux, avec des documents en annexe. une relation client omnicanale, avec des outils digitaux. les questions sont souvent regroupées en 2 ou 3 dossiers (ex. 2025 : « construire une image et veiller à l'e-réputation »). tu peux devoir mobiliser de l'économie, du droit et du management, et une vraie réflexion commerciale. corrigé par deux professeurs. partie 2 · pratique · 40 min · coef. 2 sur ordinateur, sans préparation un « contexte digital de référence » : un site web ou un site e-commerce créé au niveau national, diffusé en début de session. un sujet tiré de ce contexte : questions, situations à gérer, opérations à faire, contenus à produire. tu travailles sous le regard d'un examinateur, qui peut suivre jusqu'à 3 candidats en même temps. tu dois expliquer et justifier tes choix et tes actions. le conseil le plus utile le contexte digital est connu à l'avance. entraîne-toi dessus avec ton professeur : connaître le site, ses produits et l'interface te fait gagner un temps précieux le jour j. ce que le jury regarde compétence critères de la grille c1 · omnicanal usage efficace des outils à distance, appropriation du dossier client, rapidité et proactivité, rigueur du reporting, évaluation de la performance, organisation et animation d'une équipe c2 · digital qualité des contenus, référencement suivi et optimisé, cohérence entre outils, contenus et canaux, rythme de publication, contrôle de l'image c3 · e-commerce actions pertinentes pour développer ventes et valeur, qualité de l'assistance, prise en compte des risques et de la réglementation, indicateurs pertinents"},{"t":"Méthode de l'écrit et de la pratique","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>Méthode de l'écrit et de la pratique<\/h1>\n<h2>L'écrit : 3 heures<\/h2>\n<div class=\"g4\"><div class=\"step\"><span class=\"bign tO\" style=\"--mid:1\">1<\/span><b>Lire le contexte<\/b><span>L'entreprise, sa cible, ses canaux, son problème. 15 min.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"--mid:1\">2<\/span><b>Lire les annexes<\/b><span>Note quelle annexe sert à quelle question. Repère les chiffres.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"--mid:1\">3<\/span><b>Traiter les dossiers<\/b><span>Dans l'ordre, en gardant du temps pour chacun. Environ 2 h 15.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"--mid:1\">4<\/span><b>Relire<\/b><span>Calculs, unités, orthographe. 15 min.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\"><h3>Les types de questions<\/h3><div class=\"mini\"><div class=\"def\"><b>Calculer<\/b> · un indicateur, avec la formule, le calcul et une phrase qui interprète<\/div><div class=\"def\"><b>Analyser<\/b> · un diagnostic avec des preuves tirées des annexes<\/div><div class=\"def\"><b>Proposer<\/b> · des actions concrètes, justifiées, adaptées à la cible<\/div><div class=\"def\"><b>Rédiger<\/b> · un post, un e-mail, un script d'appel, une réponse à un avis, une fiche produit<\/div><div class=\"def\"><b>Justifier un choix<\/
