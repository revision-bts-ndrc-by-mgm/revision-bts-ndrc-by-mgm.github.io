% : proposer une démonstration plus courte et un produit d'appel pour augmenter le panier."},{"t":"Réussir l'étude réflexive réseau","h":"<p class=\"kick tP\">L'étude réflexive<\/p>\n<h1>Réussir l'étude réflexive réseau<\/h1>\n<div class=\"card dark\" style=\"padding:16px 20px\"><p>Un écrit de <b>2 pages recto-verso maximum<\/b>, sur un thème qui concerne les réseaux en général, avec les trois dimensions <b>juridique, économique et managériale<\/b>. Tu l'exposes en <b>5 minutes<\/b> à l'oral, puis le jury te questionne.<\/p><\/div>\n<h2>Exemples de thèmes<\/h2>\n<div class=\"g2\">\n<div class=\"card cP\"><ul class=\"sm\"><li>La motivation des acteurs des différents réseaux.<\/li><li>La transmission des valeurs de l'entreprise grâce aux réseaux.<\/li><li>La prospection au sein des réseaux.<\/li><\/ul><\/div>\n<div class=\"card cP\"><ul class=\"sm\"><li>L'utilité des réseaux sociaux dans l'animation d'un réseau.<\/li><li>Le recrutement dans les réseaux de vente.<\/li><li>Comment fidéliser un partenaire indépendant ?<\/li><\/ul><\/div>\n<\/div>\n<p class=\"sm mut\">Le choix du thème peut te permettre de couvrir une compétence que tes fiches n'ont pas montrée (par exemple le recrutement).<\/p>\n<h2>Un plan qui fonctionne<\/h2>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">1<\/span><b>Introduction<\/b><span>Le thème, pourquoi il compte, ta problématique en une question.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">2<\/span><b>Analyse<\/b><span>Juridique, économique, managériale : une partie ou un angle chacune.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">3<\/span><b>Exemples<\/b><span>Tes expériences en entreprise et des exemples d'actualité ou de marques.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">4<\/span><b>Préconisations<\/b><span>Ce que tu recommandes, de façon concrète.<\/span><\/div>\n<\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple de problématique et d'angles<\/p><p class=\"sm\"><b>Thème :<\/b> la motivation des acteurs des réseaux. <b>Problématique :<\/b> comment motiver des acteurs indépendants que l'on ne peut pas commander ? <b>Juridique :<\/b> le statut d'indépendant (agent, VDI, franchisé) interdit le lien de subordination ; on ne peut qu'inciter, par le contrat. <b>Économique :<\/b> commissions, primes, coût et rentabilité des challenges. <b>Managérial :<\/b> reconnaissance, formation, appartenance (Herzberg, Maslow). <b>Préconisation :<\/b> un programme qui combine rémunération variable, formation et reconnaissance publique des meilleurs.<\/p><\/div>\n<div class=\"card cY\"><h3>À l'oral<\/h3><p class=\"sm\">5 minutes, c'est court : problématique, 3 idées fortes, 1 préconisation. Ne lis pas ton texte. Prépare-toi aux questions sur les limites de ton analyse.<\/p><\/div>","x":"l'étude réflexive réussir l'étude réflexive réseau un écrit de 2 pages recto-verso maximum , sur un thème qui concerne les réseaux en général, avec les trois dimensions juridique, économique et managériale . tu l'exposes en 5 minutes à l'oral, puis le jury te questionne. exemples de thèmes la motivation des acteurs des différents réseaux. la transmission des valeurs de l'entreprise grâce aux réseaux. la prospection au sein des réseaux. l'utilité des réseaux sociaux dans l'animation d'un réseau. le recrutement dans les réseaux de vente. comment fidéliser un partenaire indépendant ? le choix du thème peut te permettre de couvrir une compétence que tes fiches n'ont pas montrée (par exemple le recrutement). un plan qui fonctionne 1 introduction le thème, pourquoi il compte, ta problématique en une question. 2 analyse juridique, économique, managériale : une partie ou un angle chacune. 3 exemples tes expériences en entreprise et des exemples d'actualité ou de marques. 4 préconisations ce que tu recommandes, de façon concrète. exemple de problématique et d'angles thème : la motivation des acteurs des réseaux. problématique : comment motiver des acteurs indépendants que l'on ne peut pas commander ? juridique : le statut d'indépendant (agent, vdi, franchisé) interdit le lien de subordination ; on ne peut qu'inciter, par le contrat. économique : commissions, primes, coût et rentabilité des challenges. managérial : reconnaissance, formation, appartenance (herzberg, maslow). préconisation : un programme qui combine rémunération variable, formation et reconnaissance publique des meilleurs. à l'oral 5 minutes, c'est court : problématique, 3 idées fortes, 1 préconisation. ne lis pas ton texte. prépare-toi aux questions sur les limites de ton analyse."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">Distributeurs<\/span><p class=\"sm\">Référencement et déréférencement · diagnostic rayon, réseau, zone · niveaux de présentation · linéaire développé, facing · convention annuelle · promotions et animations.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">Partenaires<\/span><p class=\"sm\">Types de partenaires · critères de sélection · franchise, concession, agent, apporteur · informer, former, stimuler, fédérer · rentabilité de l'animation.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Vente directe<\/span><p class=\"sm\">Statut VDI · rétractation 14 jours, pas de paiement avant 7 jours · éthique, vente pyramidale interdite · étapes de la réunion · recruter, former, motiver.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Connaître tes 3 fiches par cœur, chiffres compris<\/span>\n<span>☐ Préparer la présentation de 10 min de ton expérience réelle<\/span>\n<span>☐ Préparer l'exposé de 5 min de ton étude réflexive<\/span>\n<span>☐ Savoir expliquer le droit de chaque réseau<\/span>\n<span>☐ Savoir calculer les indicateurs de la page 12<\/span>\n<span>☐ Préparer les réponses aux questions « et si c'était à refaire ? »<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li>Apporte ton dossier et tes supports de présentation.<\/li>\n<li>Tenue professionnelle.<\/li>\n<li>Temps 1 : contexte, diagnostic, actions, résultats chiffrés, préconisations.<\/li>\n<li>Temps 2 : présente brièvement les autres fiches, puis ton étude réflexive en 5 min.<\/li>\n<li>Réponds avec les 3 dimensions : juridique, économique, managériale.<\/li>\n<li>Remercie le jury.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cG\" style=\"padding:18px 20px\"><p class=\"quote\">Animer un réseau, c'est donner envie à des gens indépendants de vendre ton offre : convaincre, outiller, motiver, mesurer.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E6, compétences et savoirs du bloc 3 · guide du dossier E6, SIEC session 2026 · présentation des épreuves certificatives (académie de Versailles) · Code de commerce et Code de la consommation · loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j distributeurs référencement et déréférencement · diagnostic rayon, réseau, zone · niveaux de présentation · linéaire développé, facing · convention annuelle · promotions et animations. partenaires types de partenaires · critères de sélection · franchise, concession, agent, apporteur · informer, former, stimuler, fédérer · rentabilité de l'animation. vente directe statut vdi · rétractation 14 jours, pas de paiement avant 7 jours · éthique, vente pyramidale interdite · étapes de la réunion · recruter, former, motiver. plan de révision ☐ connaître tes 3 fiches par cœur, chiffres compris ☐ préparer la présentation de 10 min de ton expérience réelle ☐ préparer l'exposé de 5 min de ton étude réflexive ☐ savoir expliquer le droit de chaque réseau ☐ savoir calculer les indicateurs de la page 12 ☐ préparer les réponses aux questions « et si c'était à refaire ? » le jour j apporte ton dossier et tes supports de présentation. tenue professionnelle. temps 1 : contexte, diagnostic, actions, résultats chiffrés, préconisations. temps 2 : présente brièvement les autres fiches, puis ton étude réflexive en 5 min. réponds avec les 3 dimensions : juridique, économique, managériale. remercie le jury. animer un réseau, c'est donner envie à des gens indépendants de vendre ton offre : convaincre, outiller, motiver, mesurer. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e6, compétences et savoirs du bloc 3 · guide du dossier e6, siec session 2026 · présentation des épreuves certificatives (académie de versailles) · code de commerce et code de la consommation · loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique). vérifié le 16 novembre 2026."},{"t":"La grande distribution aujourd'hui","h":"<div class=\"cx\" style=\"--cx:#7B4FD6\"><p class=\"cx-k\">Complément · C1 distributeurs<\/p><h1 class=\"cx-h\">La grande distribution aujourd'hui<\/h1><p class=\"cx-lead\">Pour négocier un référencement, il faut connaître les acteurs, leurs formats et leurs centrales d'achat.<\/p><section class=\"cx-b\"><h2>Les formats<\/h2><ul><li><b>Hypermarché<\/b> · au moins 2 500 m² de surface de vente, très large assortiment.<\/li><li><b>Supermarché<\/b> · de 400 à 2 500 m², à dominante alimentaire.<\/li><li><b>Proximité<\/b> · petites surfaces de centre-ville, ouvertes tard.<\/li><li><b>Discount (EDMP)<\/b> · assortiment court et prix bas (Lidl, Aldi).<\/li><li><b>Drive et livraison<\/b> · commande en ligne, retrait ou livraison.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Les leaders en France (produits de grande consommation)<\/h2><ul><li><b>1er : E.Leclerc<\/b> · environ 24 % de part de marché (23,8 % début 2026 selon NielsenIQ).<\/li><li><b>Ensuite<\/b> · Carrefour, puis le Groupement Les Mousquetaires (Intermarché, Netto), puis Coopérative U.<\/li><li><b>Indépendants et intégrés<\/b> · Leclerc, Intermarché et U sont des groupements d'indépendants ; Carrefour et Auchan ont aussi de nombreux magasins intégrés.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Les alliances à l'achat (2024-2026)<\/h2><ul><li><b>Aura<\/b> · Intermarché, Auchan et Casino, alliance conclue en septembre 2024 pour 10 ans.<\/li><li><b>Concordis<\/b> · Carrefour et Coopérative U, à partir des négociations 2026, pour 6 ans.<\/li><li><b>Eurelec<\/b> · la centrale européenne d'E.Leclerc, avec des distributeurs étrangers.<\/li><li><b>Contrôle<\/b> · en janvier 2026, l'Autorité de la concurrence a lancé un bilan concurrentiel des alliances Aura et Concordis.<\/li><\/ul><\/section><section class=\"cx-note\"><b>Pourquoi c'est important pour toi :<\/b> le fournisseur négocie souvent avec une centrale ou une alliance, très puissante. D'où l'intérêt d'arguments forts (rotation, marge, innovation) et de la convention unique annuelle signée avant le 1er mars.<\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : LSA, données NielsenIQ P2 2026 (26 janvier-22 février 2026) · Autorité de la concurrence, communiqué du 9 janvier 2026 sur les alliances Aura et Concordis · Le Journal des entreprises (Concordis) · Insee (définitions des formats).<\/p><\/div>","x":"  complément · c1 distributeurs  la grande distribution aujourd'hui  pour négocier un référencement, il faut connaître les acteurs, leurs formats et leurs centrales d'achat.   les formats    hypermarché  · au moins 2 500 m² de surface de vente, très large assortiment.   supermarché  · de 400 à 2 500 m², à dominante alimentaire.   proximité  · petites surfaces de centre-ville, ouvertes tard.   discount (edmp)  · assortiment court et prix bas (lidl, aldi).   drive ds d'euros<\/b> · de chiffre d'affaires, en hausse de 4,9 %.<\/li><li><b>Plus d'1 million d'emplois<\/b> · directs et indirects.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Comment fonctionne un réseau de franchise<\/h2><ul><li><b>Les 3 piliers<\/b> · une marque, un savoir-faire transmis, une assistance continue du franchiseur.<\/li><li><b>L'argent<\/b> · le franchisé paie un droit d'entrée, puis des redevances (souvent un pourcentage du CA).<\/li><li><b>Avant de signer<\/b> · le franchiseur remet le document d'information précontractuelle au moins 20 jours avant (loi Doubin).<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Recruter et animer des franchisés<\/h2><ol class=\"cx-steps\"><li><span>1<\/span><div><b>Définir le profil<\/b> expérience, apport personnel, motivation, adhésion aux valeurs.<\/div><\/li><li><span>2<\/span><div><b>Trouver des candidats<\/b> salons spécialisés (Franchise Expo Paris), site de l'enseigne, presse et sites de la franchise.<\/div><\/li><li><span>3<\/span><div><b>Sélectionner<\/b> entretiens, étude du projet et de l'emplacement.<\/div><\/li><li><span>4<\/span><div><b>Former et accompagner<\/b> formation initiale, animateur réseau qui visite les franchisés, outils communs.<\/div><\/li><li><span>5<\/span><div><b>Fédérer<\/b> convention annuelle, intranet, partage des bonnes pratiques, challenges.<\/div><\/li><\/ol><\/section><section class=\"cx-b\"><h2>Se développer à l'international<\/h2><ul><li><b>Export direct ou indirect<\/b> · vendre soi-même ou passer par un importateur.<\/li><li><b>Master franchise<\/b> · un partenaire local reçoit le droit de développer tout un pays.<\/li><li><b>Joint-venture<\/b> · une société commune avec un partenaire local.<\/li><li><b>Filiale<\/b> · s'implanter soi-même : plus de contrôle, plus de risque.<\/li><li><b>Adapter l'offre<\/b> · langue, goûts, prix, réglementation, habitudes d'achat.<\/li><\/ul><\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : Fédération française de l slow, un club des meilleurs vendeurs répond surtout au besoin…","o":["Physiologique","D'estime et d'appartenance","De sécurité","De logement"],"a":1,"e":"Reconnaissance et esprit d'équipe."},{"id":"e6q82","q":"Face à un conflit de territoire entre deux partenaires, il faut d'abord…","o":["Sanctionner les deux","Écouter chaque partie et identifier le vrai problème","Supprimer un partenaire","Ignorer"],"a":1,"e":"Puis chercher une solution gagnant-gagnant et suivre."},{"id":"e6q83","q":"Comment prévenir les conflits dans un réseau ?","o":["Changer souvent les règles","Des règles claires dans le contrat et une communication régulière","Ne jamais donner d'objectifs","Réduire les commissions"],"a":1,"e":"La prévention passe par le contrat et l'information."},{"id":"e6q84","q":"Le taux de référencement (distribution numérique) se calcule…","o":["Points de vente qui proposent le produit / points de vente visés × 100","Ventes du produit / ventes de la catégorie × 100","Jours en rupture / total × 100","CA / partenaires"],"a":0,"e":"La distribution valeur pondère par le poids des magasins."},{"id":"e6q85","q":"La distribution valeur mesure…","o":["Le nombre de magasins","La part du CA de la catégorie réalisée par les magasins qui vendent le produit","Le prix moyen","La marge"],"a":1,"e":"Être dans les « gros » magasins pèse plus."},{"id":"e6q86","q":"Ventes habituelles 1 000 €, ventes pendant l'animation 1 300 €. L'effet est de…","o":["+ 13 %","+ 30 %","+ 300 %","+ 3 %"],"a":1,"e":"(1 300 − 1 000) / 1 000 × 100 = 30 %."},{"id":"e6q87","q":"Le taux de rupture mesure…","o":["La part des jours (ou relevés) où le produit manque en rayon","La part de clients perdus","Le taux de déréférencement","La casse"],"a":0,"e":"Une rupture fait perdre des ventes et peut mener au déréférencement."},{"id":"e6q88","q":"À l'oral, l'étude réflexive s'expose en…","o":["1 minute","5 minutes","20 minutes","1 heure"],"a":1,"e":"Problématique, 3 idées fortes, 1 préconisation, sans lire son texte."},{"id":"e6q89","q":"Lequel est un bon thème d'étude réflexive réseau ?","o":["L'histoire de ton lycée","Comment fidéliser un partenaire indépendant ?","La recette du gâteau au chocolat","Le dernier match de foot"],"a":1,"e":"Un thème transversal aux réseaux, qui peut couvrir une compétence absente de tes fiches."},{"id":"e6q90","q":"Sur la motivation des indépendants, quel argument juridique utiliser ?","o":["Leur statut interdit le lien de subordination : on ne peut qu'inciter par le contrat","On peut les licencier","Ils doivent obéir comme des salariés","Le Code du travail s'applique entièrement"],"a":0,"e":"D'où les leviers économiques et managériaux."},{"id":"e6q91","q":"La vente directe se digitalise par…","o":["La fin des réunions","Les réunions en ligne, boutiques personnelles et applications de commande","La suppression des VDI","Les magasins physiques"],"a":1,"e":"Elle reste fondée sur la relation personnelle."},{"id":"e6q92","q":"Un hypermarché a une surface de vente d'au moins…","o":["400 m²","1 000 m²","2 500 m²","10 000 m²"],"a":2,"e":"Supermarché : de 400 à 2 500 m²."},{"id":"e6q93","q":"Quel est le premier distributeur alimentaire en France ?","o":["Carrefour","E.Leclerc","Auchan","Lidl"],"a":1,"e":"Environ 24 % de part de marché début 2026 (NielsenIQ)."},{"id":"e6q94","q":"L'alliance à l'achat Aura réunit…","o":["Carrefour et U","Intermarché, Auchan et Casino","Leclerc et Lidl","Aldi et Netto"],"a":1,"e":"Conclue en septembre 2024 pour 10 ans."},{"id":"e6q95","q":"L'alliance Concordis réunit…","o":["Carrefour et Coopérative U","Intermarché et Auchan","Leclerc et Rewe","Casino et Lidl"],"a":0,"e":"À partir des négociations 2026, pour 6 ans."},{"id":"e6q96","q":"En janvier 2026, qui a lancé un bilan concurrentiel des alliances à l'achat ?","o":["La CNIL","L'Autorité de la concurrence","La DGCCRF","La BCE"],"a":1,"e":"Il porte sur Aura et Concordis."},{"id":"e6q97","q":"Combien de réseaux de franchise en France en 2025 ?","o":["Environ 500","Environ 2 000","Environ 10 000","Environ 93 000"],"a":1,"e":"2 035 réseaux et 93 395 points de vente franchisés."},{"id":"e6q98","q":"Quels sont les 3 piliers de la franchise ?","o":["Marque, savoir-faire, assistance","Prix, produit, place","Stock, livraison, SAV","Capital, dettes, résultat"],"a":0,"e":"Le franchisé paie un droit d'entrée et des redevances."},{"id":"e6q99","q":"Les redevances d'un franchisé sont souvent…","o":["Un salaire versé par le franchiseur","Un pourcentage de son chiffre d'affaires","Une amende","Gratuites"],"a":1,"e":"Elles rémunèrent la marque et l'assistance."},{"id":"e6q100","q":"La master franchise consiste à…","o":["Ouvrir un seul magasin","Confier à un partenaire local le développement de tout un pays","Racheter le franchiseur","Vendre en ligne"],"a":1,"e":"Mode de développement international."},{"id":"e6q101","q":"S'implanter à l'étranger en créant sa propre société, c'est…","o":["Une filiale","Un export indirect","Une master franchise","Un apporteur d'affaires"],"a":0,"e":"Plus de contrôle, mais plus de risque."}],"r":[{"id":"e6r0","q":"Explique comment un fournisseur se fait référencer chez un distributeur.","p":[{"t":"Contacter la centrale d'achat ou l'acheteur","k":["centrale","acheteur"]},{"t":"Présenter l'offre et négocier","k":["negoci","present","argument"]},{"t":"Signer un accord","k":["accord","contrat","convention"]},{"t":"Vérifier l'implantation en magasin","k":["magasin","implant","verifi","rayon"]}],"m":"Le fournisseur prospecte la centrale d'achat (ou le magasin), présente son offre avec des arguments adaptés au distributeur (rotation, marge, notoriété), puis négocie les conditions : prix, remises, promotions, place en rayon. L'accord est formalisé, par exemple dans la convention annuelle signée avant le 1er mars. Ensuite, le commercial vérifie dans chaque magasin que le produit est bien implanté."},{"id":"e6r1","q":"Quelles différences entre la franchise et la concession ?","p":[{"t":"Franchise : marque et savoir-faire","k":["marque","savoir-faire","savoir faire","assistance"]},{"t":"Franchise : droit d'entrée et redevances","k":["redevance","droit d'entree"]},{"t":"Concession : exclusivité sur un territoire","k":["exclusivit","territoire"]},{"t":"Le document d'information 20 jours avant","k":["dip","20 jours","information precontractuelle","doubin"]}],"m":"Dans la franchise, le franchisé utilise la marque et le savoir-faire du franchiseur, qui l'assiste ; il paie un droit d'entrée et des redevances. Le franchiseur doit lui remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi Doubin). Dans la concession, le concessionnaire obtient l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant, comme dans l'automobile."},{"id":"e6r2","q":"Quelles règles protègent le consommateur dans la vente à domicile ?","p":[{"t":"Un contrat écrit","k":["contrat","ecrit"]},{"t":"14 jours de rétractation","k":["14","retract"]},{"t":"Aucun paiement avant 7 jours","k":["7 jours","paiement"]},{"t":"L'abus de faiblesse sanctionné","k":["abus","faiblesse"]}],"m":"La vente hors établissement exige un contrat écrit remis au client, avec les informations obligatoires et un formulaire de rétractation. Le consommateur dispose de 14 jours pour se rétracter sans motif. Aucun paiement ne peut être exigé avant 7 jours après la signature. Enfin, abuser de la faiblesse d'une personne est un délit."},{"id":"e6r3","q":"Comment animer un réseau de partenaires ? Donne quatre actions.","p":[{"t":"Informer","k":["inform","newsletter","extranet","nouveaut"]},{"t":"Former","k":["form"]},{"t":"Stimuler : challenges, primes, commissions","k":["challenge","prime","commission","stimul"]},{"t":"Fédérer : conventions, réunions","k":["convention","reunion","club","feder"]}],"m":"1. Informer : nouveautés, argumentaires, prix, via un extranet ou une newsletter. 2. Former : sessions produits et techniques de vente. 3. Stimuler : challenges, primes, commissions, classements. 4. Fédérer : réunions, conventions, club partenaires, reconnaissance des meilleurs. On mesure ensuite la rentabilité de ces actions."},{"id":"e6r4","q":"Un rayon de 4 m fait 12 000 € de CA. Le produit X occupe 1 m et réalise 4 500 € de CA. Analyse la situation.","p":[{"t":"Part de linéaire = 25 %","k":["25"]},{"t":"Part des ventes = 37,5 %","k":["37,5","37.5"]},{"t":"Conclusion : le produit mérite plus de place","k":["plus de place","augmenter","agrandir","plus de lineaire","davantage"]},{"t":"Comparer la rentabilité au mètre","k":["4 500","4500","3 000","3000","par metre","rentab"]}],"m":"Part de linéaire du produit X : 1 / 4 = 25 %. Part des ventes : 4 500 / 12 000 = 37,5 %. Le produit fait plus de ventes que sa place en rayon : 4 500 € par mètre contre 3 000 € en moyenne pour le rayon. Il faut donc lui donner plus de linéaire (plus de facings), en le prenant aux produits les moins rentables."},{"id":"e6r5","q":"Décris le déroulement d'une vente en réunion.","p":[{"t":"Préparer avec l'hôtesse","k":["hotesse"]},{"t":"Démontrer, faire essayer","k":["demonstr","essai","essay","atelier"]},{"t":"Vendre : bons de commande","k":["commande","vente","vend"]},{"t":"Booker de nouvelles réunions et recruter","k":["booking","nouvelle","recrut"]}],"m":"On prépare la réunion avec l'hôtesse, qui invite ses proches. Le jour J, on accueille, on présente les produits et on les fait essayer (démonstrations, ateliers). On conseille chaque participant et on prend les commandes. Enfin, on obtient de nouvelles réunions (booking) et on repère de futurs vendeurs. L'hôtesse est remerciée par des cadeaux."},{"id":"e6r6","q":"Qu'est-ce qu'un VDI et quels sont ses avantages et inconvénients pour l'entreprise ?","p":[{"t":"Vendeur à domicile indépendant","k":["independant","vendeur a domicile"]},{"t":"Pas de lien de subordination","k":["subordination"]},{"t":"Mandataire ou acheteur-revendeur","k":["mandataire","acheteur","revendeur","commission"]},{"t":"Avantages et limites pour l'entreprise","k":["souple","performance","turnover","animation","motiv"]}],"m":"Le VDI est un vendeur à domicile indépendant : il n'a pas de lien de subordination avec l'entreprise. Il est soit mandataire (il vend au nom de l'entreprise contre une commission), soit acheteur-revendeur (il achète puis revend). Pour l'entreprise, c'est un réseau souple et payé à la performance, mais avec beaucoup de turnover et un besoin d'animation constant."},{"id":"e6r7","q":"Comment motiver des partenaires indépendants qu'on ne peut pas commander ?","p":[{"t":"Le contrat ne permet que d'inciter","k":["contrat","incit","independant","subordination"]},{"t":"Une rémunération incitative","k":["commission","prime","remuner"]},{"t":"La reconnaissance","k":["reconnaiss","valoris","felicit"]},{"t":"Former et outiller","k":["formation","outil","inform","former"]}],"m":"Un partenaire indépendant n'a pas de lien de subordination : on ne peut pas lui donner d'ordres, seulement l'inciter. On combine une rémunération motivante (commissions, primes, challenges), de la reconnaissance (valoriser les meilleurs, conventions), et un accompagnement (formations, outils de vente, informations régulières). Selon Herzberg, la reconnaissance motive davantage que l'argent seul."}],"cs":[{"id":"e6c0","t":"Les confitures Mamie Rose en grande surface","x":["Tu es commercial terrain pour les confitures Mamie Rose. L'enseigne SuperFrais t'a référencé dans 50 magasins de ta région ; tu es réellement présent dans 35.","Dans un magasin, le rayon confitures fait 8 m au sol sur 4 niveaux. Mamie Rose occupe 2,4 m de linéaire développé et réalise 9 % des ventes du rayon.","Tes pots sont placés au niveau du sol."],"q":[{"id":"e6c0q0","q":"Calcule le taux de présence (distribution numérique) et le linéaire développé du rayon.","p":[{"t":"Présence = 35 / 50 = 70 %","k":["70 %","70%"]},{"t":"Linéaire développé = 8 × 4 = 32 m","k":["32"]},{"t":"Interprétation : 15 magasins à démarcher","k":["15","absent","demarcher","pas presents","manque"]}],"m":"Taux de présence = 35 / 50 × 100 = 70 % : la marque manque dans 15 magasins où elle est pourtant référencée, il faut aller les voir. Linéaire développé = 8 m × 4 niveaux = 32 m."},{"id":"e6c0q1","q":"Ta part de linéaire est-elle juste par rapport à tes ventes ? Que demandes-tu ?","p":[{"t":"Part de linéaire = 2,4 / 32 = 7,5 %","k":["7,5","7.5"]},{"t":"Comparaison : 7,5 % de place pour 9 % des ventes, sous-représenté","k":["9 %","9%","moins","sous","inferieur","equilibre"]},{"t":"Demande : plus de linéaire, environ 2,9 m (9 % de 32 m)","k":["plus de place","plus de lineaire","2,9","2.9","facing","augmenter"]}],"m":"Part de linéaire = 2,4 / 32 × 100 = 7,5 %. Or Mamie Rose fait 9 % des ventes : selon la règle d'équilibre, elle est sous-représentée. Je demande au chef de rayon environ 9 % du linéaire, soit 2,9 m, par exemple avec des facings supplémentaires."},{"id":"e6c0q2","q":"Les pots sont au sol. Que proposes-tu au chef de rayon ?","p":[{"t":"Monter au niveau des yeux ou des mains","k":["yeux","mains","hauteur","monter"]},{"t":"Argument : meilleur niveau de vente, profite aussi au magasin","k":["vente","rotation","chiffre","marge","magasin"]},{"t":"Une animation ou PLV (dégustation, stop-rayon, tête de gondole)","k":["degustation","plv","stop-rayon","tete de gondole","animation"]}],"m":"Je propose de remonter les pots au niveau des yeux ou des mains, les meilleurs niveaux de vente : la rotation et donc le CA du rayon augmenteront, ce qui profite au magasin. Je peux appuyer la demande par une animation dégustation le samedi et un stop-rayon, voire une mise en avant en tête de gondole pendant une promotion."}]},{"id":"e6c1","t":"Le réseau d'apporteurs d'affaires de RénovHabitat","x":["RénovHabitat (rénovation énergétique) s'appuie sur 40 apporteurs d'affaires : agents immobiliers, artisans, architectes. Ils touchent 5 % du montant des chantiers signés.","L'an dernier : seulement 14 apporteurs ont transmis au moins un contact. 80 contacts transmis, 20 chantiers signés pour 300 000 € de CA.","RénovHabitat a organisé un challenge (voyage pour le meilleur apporteur) qui a coûté 6 000 € et a généré 8 000 € de marge supplémentaire."],"q":[{"id":"e6c1q0","q":"Calcule le taux de partenaires actifs et le taux de transformation des contacts.","p":[{"t":"Actifs = 14 / 40 = 35 %","k":["35 %","35%"]},{"t":"Transformation = 20 / 80 = 25 %","k":["25 %","25%"]},{"t":"Interprétation : réseau peu actif","k":["peu actif","faible","inactif","26","majorite"]}],"m":"Taux de partenaires actifs = 14 / 40 × 100 = 35 % : près de deux apporteurs sur trois n'ont rien apporté. Taux de transformation = 20 / 80 × 100 = 25 % : un contact sur quatre devient un chantier."},{"id":"e6c1q1","q":"Le challenge a-t-il été rentable ?","p":[{"t":"(8 000 − 6 000) / 6 000 × 100 ≈ 33,3 %","k":["33,3","33.3","33 %","33%","2 000","2000"]},{"t":"Oui, il a rapporté plus qu'il n'a coûté","k":["oui","rentable","rapporte plus"]}],"m":"Rentabilité = (8 000 − 6 000) / 6 000 × 100 ≈ 33,3 %. Le challenge est rentable : il a rapporté 2 000 € de marge de plus qu'il n'a coûté. C'est le critère d'efficience du jury."},{"id":"e6c1q2","q":"Propose un plan pour réactiver les 26 apporteurs inactifs.","p":[{"t":"Informer et outiller (kit, argumentaire, extranet)","k":["informer","kit","argumentaire","extranet","outil","newsletter"]},{"t":"Former (réunion, webinaire sur les aides à la rénovation)","k":["former","formation","webinaire","reunion"]},{"t":"Stimuler et valoriser (commission bonus, reconnaissance)","k":["stimuler","bonus","prime","commission","challenge","valoriser","reconnaissance"]},{"t":"Suivre : visites, entretien individuel, mesurer","k":["visite","rencontrer","entretien","suivi","mesurer","indicateur"]}],"m":"1. Rencontrer chaque apporteur inactif pour comprendre ses freins. 2. Informer et outiller : kit de présentation, argumentaire sur les aides à la rénovation, formulaire simple pour transmettre un contact. 3. Former lors d'un webinaire. 4. Stimuler : bonus de commission sur le premier contact signé et mise en avant des meilleurs. 5. Suivre le taux de partenaires actifs chaque trimestre."}]},{"id":"e6c2","t":"La vente en réunion de BeautéNature","x":["Tu animes des ventes en réunion pour BeautéNature (cosmétiques naturels) avec le statut de VDI.","Ce mois-ci : 8 réunions, 64 participantes, 40 acheteuses, 2 400 € de CA. Tu as obtenu 5 nouvelles réunions (booking) et recruté 1 nouvelle conseillère.","Une participante a signé un bon de commande de 180 € et veut payer tout de suite par carte."],"q":[{"id":"e6c2q0","q":"Calcule le CA moyen par réunion, le panier moyen et le taux d'achat.","p":[{"t":"CA par réunion = 2 400 / 8 = 300 €","k":["300"]},{"t":"Panier moyen = 2 400 / 40 = 60 €","k":["60"]},{"t":"Taux d'achat = 40 / 64 = 62,5 %","k":["62,5","62.5"]}],"m":"CA moyen par réunion = 2 400 / 8 = 300 €. Panier moyen = 2 400 / 40 = 60 €. Taux d'achat = 40 / 64 × 100 = 62,5 %."},{"id":"e6c2q1","q":"Peux-tu encaisser les 180 € tout de suite ? Explique.","p":[{"t":"Non : aucun paiement avant 7 jours après la signature","k":["non","7 jours","sept jours","aucun paiement"]},{"t":"Vente hors établissement : 14 jours de rétractation","k":["14 jours","retractation","hors etablissement"]},{"t":"Remettre un contrat écrit avec le formulaire de rétractation","k":["contrat","formulaire","bon de commande","ecrit"]}],"m":"Non. En vente hors établissement, aucun paiement ne peut être exigé avant 7 jours après la signature (sauf exceptions prévues par la loi), et la cliente dispose de 14 jours pour se rétracter sans motif. Je lui remets un contrat écrit avec le formulaire de rétractation."},{"id":"e6c2q2","q":"Tu es VDI : es-tu salariée de BeautéNature ? Quelles conséquences ?","p":[{"t":"Non : vendeur à domicile indépendant","k":["non","independant","independante"]},{"t":"Pas de lien de subordination","k":["subordination","pas d'ordres","libre","horaires libres"]},{"t":"Rémunération à la commission ou marge d'achat-revente","k":["commission","mandataire","acheteur-revendeur","marge","revend"]}],"m":"Non : le VDI est un vendeur à domicile indépendant, sans lien de subordination avec l'entreprise. Il organise librement son activité. Il est payé soit à la commission (mandataire), soit grâce à la marge entre prix d'achat et prix de revente (acheteur-revendeur). L'entreprise ne peut donc que l'inciter, pas lui donner des ordres."}]}]}];</script>
<script>// ---------- Configuration du classement (Supabase) ----------
const SUPA_URL = window.__SUPA_URL__ || '';
const SUPA_KEY = window.__SUPA_KEY__ || '';
const RANK_ON = !!(SUPA_URL && SUPA_KEY);

const D = window.__DATA__;
const $ = s => document.querySelector(s);
const app = $('#app'), title = $('#title'), back = $('#back'), pager = $('#pager');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// Récupère les points et stats envoyés par l'ancienne adresse (mathysmgm.github.io).
(function(){
  if(!location.hash.startsWith('#import=')) return;
  try{
    const data = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(8))))));
    Object.keys(data).forEach(k => { if(localStorage.getItem(k) === null) localStorage.setItem(k, data[k]); });
  }catch(e){}
  history.replaceState(null, '', location.pathname + '#home');
})();

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").toLowerCase();
const subj = k => D.find(s => s.k === k);
const PTS_QCM = 10, PTS_STREAK = 5, PTS_POINT = 5, EXPRESS_SEC = 300;
const DAY = 86400000, BOX_DAYS = [0, 1, 3, 7, 14, 30];
let quiz = null, timer = null;

function go(h){ if(location.hash === '#' + h) render(); else location.hash = h; }
function setTop(t, backTo){ title.textContent = t; back.style.visibility = backTo ? 'visible' : 'hidden'; back.onclick = () => go(backTo); refreshAcct(); }
function refreshAcct(){
  const b = document.getElementById('acct'); if(!b) return;
  const u = store.get('user', null);
  b.classList.toggle('on', !!u);
  document.getElementById('acctlbl').textContent = u ? u.pseudo : 'Connexion';
  b.setAttribute('aria-label', u ? 'Mon compte (' + u.pseudo + ')' : 'Connexion');
}
function setTheme(dark, keep = true){
  document.documentElement.classList.toggle('dark', dark);
  if(keep){ try{ localStorage.setItem('bts-theme', dark ? 'dark' : 'light'); }catch(e){} }
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = dark ? '#05060F' : '#16182B';
  const t = document.getElementById('theme'); if(t) t.setAttribute('aria-label', dark ? 'Mode jour' : 'Mode nuit');
}
function noPager(){ pager.hidden = true; pager.innerHTML = ''; }
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
function best(){ const b = store.get('best2', {}); b.qcm = b.qcm || {}; b.redac = b.redac || {}; b.express = b.express || {}; b.cas = b.cas || {}; return b; }
function totalPts(){ return store.get('pts', 0); }
function badge(v){ return v != null ? v + ' pts' : 'À tenter'; }
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const qById = (() => { const m = {}; D.forEach(s => s.q.forEach(q => { m[q.id] = {...q, k: s.k, from: s.n}; })); return id => m[id]; })();
const dot = s => `<span class="dot" style="background:${s.c}">${esc(s.k.toUpperCase())}</span>`;

// ---------- Statistiques ----------
function record(id, ok){
  const st = store.get('stats', {});
  const r = st[id] || {ok: 0, ko: 0};
  ok ? r.ok++ : r.ko++;
  st[id] = r; store.set('stats', st);
}
function recordRedac(k, got, max){
  const st = store.get('statsR', {});
  const r = st[k] || {got: 0, max: 0};
  r.got += got; r.max += max; st[k] = r; store.set('statsR', st);
}

// ---------- Mon planning (propre à chaque appareil / utilisateur) ----------
const COEF = {cge: 3, e2: 3, cejm: 3, e4: 5, e5: 4, e6: 3};
const MIN_PER_TASK = 10;
function todayStr(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysTo(ds){ if(!ds) return null; const t = new Date(ds + 'T00:00:00'), n = new Date(todayStr() + 'T00:00:00'); return Math.round((t - n) / 86400000); }
function planCfg(){ return store.get('plan', null); }
function nextExam(cfg){
  return Object.entries(cfg.dates || {}).map(([k, d]) => ({k, d, n: daysTo(d)})).filter(x => x.d && x.n >= 0).sort((a, b) => a.n - b.n)[0] || null;
}
function weakness(s){
  const st = store.get('stats', {}); let ok = 0, ko = 0;
  s.q.forEach(q => { const r = st[q.id]; if(r){ ok += r.ok; ko += r.ko; } });
  return ok + ko >= 5 ? ko / (ok + ko) : 0.3;
}
function pageOrder(s){ return s.g.flatMap(g => g.p); }
function kitPage(s){ const i = s.p.findIndex(p => /jour J/i.test(p.t)); return i < 0 ? 0 : i; }
function makeTask(s, type, n){
  const read = store.get('read', {}), done = store.get('casDone', {});
  if(type === 'kit'){ const i = kitPage(s); return {t: 'fiche', k: s.k, go: `fiche-${s.k}-${i+1}`, label: `Relire « ${s.p[i].t} »`, sub: s.n + ' · dernière ligne droite'}; }
  if(type === 'fiche'){
    const order = pageOrder(s);
    let i = order.find(x => !read[s.k + '-' + x]);
    if(i == null) i = order.slice().sort((a, b) => (read[s.k + '-' + a] || 0) - (read[s.k + '-' + b] || 0))[0];
    return {t: 'fiche', k: s.k, go: `fiche-${s.k}-${i+1}`, label: (read[s.k + '-' + i] ? 'Relire' : 'Lire') + ` « ${s.p[i].t} »`, sub: s.n + ' · fiche'};
  }
  if(type === 'flash'){ const due = dueList(s.k).length; if(!due) return null; return {t: 'flash', k: s.k, go: `flash-${s.k}`, label: `Flashcards (${Math.min(due, 20)} à revoir)`, sub: s.n}; }
  if(type === 'cas'){ const i = (s.cs || []).findIndex(c => done[c.id] == null); if(i < 0) return null; return {t: 'cas', k: s.k, go: `cas-${s.k}-${i+1}`, label: `Cas pratique : ${s.cs[i].t}`, sub: s.n + ' · 15 min'}; }
  return {t: 'qcm', k: s.k, go: `qcm-${s.k}`, label: 'Une série de 10 QCM', sub: s.n};
}
function buildDay(cfg){
  const subs = D.map(s => ({s, n: daysTo((cfg.dates || {})[s.k])})).filter(x => x.n != null && x.n >= 0);
  if(!subs.length) return [];
  const slots = Math.max(2, Math.round((cfg.mins || 30) / MIN_PER_TASK));
  subs.forEach(x => { x.w = COEF[x.s.k] * (1 + weakness(x.s)) / Math.pow(Math.max(x.n, 1), 0.7); });
  subs.sort((a, b) => b.w - a.w);
  const urgent = subs.filter(x => x.n <= 1);
  const tasks = [];
  if(urgent.length){ urgent.forEach(x => { tasks.push(makeTask(x.s, 'kit')); tasks.push({t: 'express', k: x.s.k, go: `express-${x.s.k}`, label: 'Un Express de 5 minutes pour te mettre en route', sub: x.s.n}); }); return tasks.slice(0, slots + 1); }
  subs.filter(x => x.n <= 7).forEach(x => tasks.push(makeTask(x.s, 'kit')));
  const top = subs.slice(0, Math.min(subs.length, slots >= 4 ? 3 : 2));
  const cycle = ['fiche', 'flash', 'qcm', 'cas', 'fiche', 'qcm'];
  let c = 0, guard = 0;
  while(tasks.length < slots && guard++ < 40){
    const x = top[c % top.length], type = cycle[Math.floor(c / top.length) % cycle.length]; c++;
    const t = makeTask(x.s, type) || makeTask(x.s, 'qcm');
    if(!tasks.some(o => o.go === t.go)) tasks.push(t);
  }
  return tasks;
}
function today(){
  const cfg = planCfg(); if(!cfg) return null;
  let day = store.get('planDay', null);
  if(!day || day.date !== todayStr() || day.v !== cfg.v){ day = {date: todayStr(), v: cfg.v, tasks: buildDay(cfg)}; day.tasks.forEach(t => t.done = false); store.set('planDay', day); }
  return day;
}
function markTask(match){
  const day = store.get('planDay', null); if(!day || day.date !== todayStr()) return;
  let ch = false; day.tasks.forEach(t => { if(!t.done && match(t)){ t.done = true; ch = true; } });
  if(ch){ store.set('planDay', day); checkStreak(day); }
}
function checkStreak(day){
  if(!day.tasks.length || !day.tasks.every(t => t.done)) return;
  const s = store.get('streak', {last: null, n: 0});
  if(s.last === day.date) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  s.n = s.last === todayStr(y) ? s.n + 1 : 1; s.last = day.date; store.set('streak', s);
}
function streakNow(){ const s = store.get('streak', {last: null, n: 0}); const y = new Date(); y.setDate(y.getDate() - 1); return (s.last === todayStr() || s.last === todayStr(y)) ? s.n : 0; }
function planBanner(){
  const cfg = planCfg();
  if(!cfg) return `<button class="item planb" data-go="planning-edit"><span class="dot" style="background:#FFD34D;color:#16182B">📅</span><span class="grow"><span class="it">Crée ton planning de révision</span><div class="is">Entre tes dates d'examen : l'app te prépare un programme chaque jour.</div></span></button>`;
  const nx = nextExam(cfg), day = today(), d = day.tasks.filter(t => t.done).length;
  return `<button class="item planb" data-go="planning"><span class="dot" style="background:#FFD34D;color:#16182B;font-size:${nx && nx.n > 99 ? 11 : 13}px">${nx ? 'J-' + nx.n : '✓'}</span><span class="grow"><span class="it">${nx ? (nx.n === 0 ? 'C\'est aujourd\'hui : ' : 'Prochaine épreuve : ') + esc(subj(nx.k).n) : 'Toutes tes épreuves sont passées'}</span><div class="is">${day.tasks.length ? `Programme du jour : ${d} / ${day.tasks.length} fait${streakNow() > 1 ? ' · 🔥 ' + streakNow() + ' jours de suite' : ''}` : 'Mets à jour tes dates'}</div></span></button>`;
}
function planning(){
  stopTimer(); setTop('Mon planning', 'home'); noPager();
  const cfg = planCfg(); if(!cfg) return go('planning-edit');
  const day = today(), done = day.tasks.filter(t => t.done).length;
  const list = D.map(s => ({s, d: (cfg.dates || {})[s.k], n: daysTo((cfg.dates || {})[s.k])})).filter(x => x.d).sort((a, b) => a.n - b.n);
  const fmt = ds => new Date(ds + 'T00:00:00').toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'long'});
  app.innerHTML = `<section class="hero" style="padding:18px 18px"><p class="kick" style="margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;color:#FFB79A">AUJOURD'HUI</p>
    <p class="big" style="font-size:24px;margin:0">${day.tasks.length ? (done === day.tasks.length ? 'Programme terminé, bravo !' : `${day.tasks.length - done} tâche${day.tasks.length - done > 1 ? 's' : ''} à faire`) : 'Rien de prévu'}</p>
    <p style="margin:6px 0 0">${cfg.mins} min par jour${streakNow() ? ' · 🔥 ' + streakNow() + ' jour' + (streakNow() > 1 ? 's' : '') + ' de suite' : ''}</p></section>
    <div class="list">${day.tasks.map((t, i) => `<div class="item task${t.done ? ' done' : ''}"><label class="tchk"><input type="checkbox" data-i="${i}" ${t.done ? 'checked' : ''} aria-label="Marquer comme fait"></label><button class="grow tgo" data-go="${t.go}" style="background:none;border:0;text-align:left;padding:0;color:inherit;cursor:pointer"><span class="it">${esc(t.label)}</span><div class="is">${esc(t.sub)}</div></button><span class="badge" aria-hidden="true">›</span></div>`).join('')}</div>
    <p class="sec">Mes épreuves</p><div class="list">${list.map(x => `<div class="item">${dot(x.s)}<span class="grow"><span class="it">${esc(x.s.n)}</span><div class="is">${fmt(x.d)}</div></span><span class="badge">${x.n < 0 ? 'Passée' : x.n === 0 ? 'Aujourd\'hui' : 'J-' + x.n}</span></div>`).join('')}</div>
    <div class="row2" style="margin-top:14px"><button class="btn ghost" data-go="planning-edit">Modifier mes dates</button></div>
    <p class="note">Le programme change chaque jour. Il donne la priorité à l'épreuve la plus proche, aux gros coefficients et à tes points faibles. La dernière semaine, il ajoute ton « kit minimum » ; la veille, seulement le kit et un Express.</p>`;
  document.querySelectorAll('.tchk input').forEach(b => b.onchange = () => { const d2 = store.get('planDay', null); d2.tasks[+b.dataset.i].done = b.checked; store.set('planDay', d2); checkStreak(d2); planning(); });
}

    <p class="is" id="pmsg" role="status"></p>

  let mins = cfg.mins || 30;

  };
  if($('#delp')) $('#delp').onclick = () => { store.set('plan', null); store.set('planDay', null); go('home'); };
}

function fichesMenu(){
  stopTimer(); setTop('Fiches', 'home'); noPager();

function themePages(k, gi){

  { const rd = store.get('read', {}); rd[k + '-' + i] = Date.now(); store.set('read', rd); markTask(t => t.t === 'fiche' && t.go === `fiche-${k}-${i+1}`); }

  } else noPager();
  window.scrollTo(0, 0);
}

  app.innerHTML = (isQ ? `<button class="item" style="background:#16182B;color:#fff;border:0" data-go="qcm-mix"><span class="dot" style="background:#F25C2B;color:#16182B">MIX</span><span class="grow"><span class="it">Toutes les matières</span><div class="is" style="color:#D6D8E6">15 questions au hasard</div></span><span class="badge">${badge(b.mix)}</span></button>` : '') +

}
function pick(pool, n){
  const seen = store.get('seen', {});
  let fresh = shuffle(pool.filter(q => !seen[q.id]));
  if(fresh.length < n){
    pool.forEach(q => { delete seen[q.id]; });
    store.set('seen', seen);
    const ids = new Set(fresh.map(q => q.id));
    fresh = fresh.concat(shuffle(pool.filter(q => !ids.has(q.id))));
  }
  return fresh.slice(0, n);
}
function unseenFirst(pool){ const seen = store.get('seen', {}); return shuffle(pool.filter(q => !seen[q.id])).concat(shuffle(pool.filter(q => seen[q.id]))); }
function markSeen(id){ const seen = store.get('seen', {}); seen[id] = 1; store.set('seen', seen); }
function mixOptions(q){ const idx = shuffle(q.o.map((_, i) => i)); return {...q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a)}; }
function poolFor(k, key){
  if(k === 'mix') return D.flatMap(s => s[key].map(q => ({...q, from: s.n, k: s.k})));
  const s = subj(k); return s ? s[key].map(q => ({...q, from: s.n, k: s.k})) : null;
}

function startQuiz(mode, k){

  mode === 'qcm' ? showQ() : showR();
}

const SYN = [

const stemW = w => w.length > 6 ? w.slice(0, w.length - 2) : w;
const words = s => norm(s).replace(/[^a-z0-9%€' -]/g, ' ').split(/[\s'-]+/).filter(w => w.length > 1);
function synOf(k){ const n = norm(k).trim(); const g = SYN.find(g => g.some(x => x === n || (n.length > 4 && x.startsWith(stemW(n))))); return g ? [n, ...g] : [n]; }
function hasTerm(txt, ws, term){
  const all = words(term), tw = all.filter(w => !STOP.has(w));
  if(!all.length) return txt.includes(norm(term).trim());
  const flat = ' ' + ws.join(' ');
  if(flat.includes(' ' + all.join(' '))) return true;          // expression exacte (début de mot)
  if(!tw.length) return false;
  // tous les mots importants présents, sous une forme proche (accord, conjugaison)
  return tw.every(t => { const s = stemW(t); return ws.some(w => w.startsWith(t) || (s.length >= 4 && w.startsWith(s)) || (w.length >= 5 && t.startsWith(stemW(w)))); });
}
function matchPoint(raw, p){
  const txt = norm(raw), ws = words(raw);
  if(ws.length < 3) return false;
  const terms = p.k.flatMap(synOf);
  if(terms.some(t => hasTerm(txt, ws, t))) return true;
  // sinon : la moitié des idées clés du libellé exprimées avec des mots proches
  const lw = [...new Set(words(p.t).filter(w => !STOP.has(w) && w.length > 3))];
  if(lw.length < 2) return false;
  const hit = lw.filter(t => synOf(t).some(s => hasTerm(txt, ws, s))).length;
  return hit >= 2 && hit / lw.length >= 0.5;
}
function correctR(){
  const z = quiz, q = z.qs[z.i];
  const raw = $('#ans').value;
  markSeen(q.id);
  $('#ans').readOnly = true; $('#check').remove();
  const auto = q.p.map(p => matchPoint(raw, p));

}

    return;
  }
  const q = z.qs[z.i], c = cards()[q.id];
  app.innerHTML = `<div class="qmeta" style="margin-bottom:8px"><span>Carte ${z.i+1} / ${z.qs.length}</span><span>${c ? 'Boîte ' + (c.b + 1) + ' / 6' : 'Nouvelle carte'}</span></div>
    <button class="flashcard" id="card" style="--c:${z.color}"><span class="fside">Question</span><span class="ftext">${esc(q.q)}</span><span class="fhint">Touche pour retourner la carte</span></button>
    <div id="fb"></div>`;
  $('#card').onclick = () => {
    $('#card').classList.add('flipped');
    $('#card').innerHTML = `<span class="fside">Réponse</span><span class="ftext">${esc(q.o[q.a])}</span><span class="fexp">${esc(q.e)}</span>`;
    $('#card').disabled = true;
    $('#fb').innerHTML = `<div class="row2" style="margin-top:14px"><button class="btn ghost" id="ko">À revoir</button><button class="btn" id="okb" style="background:#11916F">Je savais</button></div>`;
    $('#ko').onclick = () => rate(false); $('#okb').onclick = () => rate(true);
  };
}
function rate(ok){
  const z = quiz, q = z.qs[z.i], all = cards();
  const c = all[q.id] || {b: 0, due: 0};
  c.b = ok ? Math.min(c.b + 1, BOX_DAYS.length - 1) : 0;
  c.due = Date.now() + BOX_DAYS[c.b] * DAY;
  all[q.id] = c; store.set('cards', all);
  record(q.id, ok);
  if(ok) z.know++; else z.qs.push(q);
  z.i++; showF();
}

// ---------- Statistiques ----------
function stats(){
  stopTimer(); setTop('Mes stats', 'home'); noPager();
  const st = store.get('stats', {}), sr = store.get('statsR', {});
  const rows = D.map(s => {
    let ok = 0, ko = 0;
    s.q.forEach(q => { const r = st[q.id]; if(r){ ok += r.ok; ko += r.ko; } });
    const tot = ok + ko, pct = tot ? Math.round(ok / tot * 100) : null;
    const r = sr[s.k], rp = r && r.max ? Math.round(r.got / r.max * 100) : null;
    return {s, ok, tot, pct, rp};
  });
  const played = rows.filter(r => r.tot >= 5);
  const strong = played.filter(r => r.pct >= 70).sort((a, b) => b.pct - a.pct);
  const weak = played.filter(r => r.pct < 50).sort((a, b) => a.pct - b.pct);
  const missed = Object.entries(st).filter(([, r]) => r.ko > 0).map(([id, r]) => ({q: qById(id), r})).filter(x => x.q)
    .sort((a, b) => (b.r.ko - b.r.ok) - (a.r.ko - a.r.ok) || b.r.ko - a.r.ko).slice(0, 8);
  const color = p => p == null ? '#C9CCDB' : p >= 70 ? '#11916F' : p >= 50 ? '#E0A800' : '#C2410C';
  if(!Object.keys(st).length && !Object.keys(sr).length){
    app.innerHTML = `<div class="qcard"><p class="qq">Pas encore de stats</p><p class="is">Fais quelques QCM, une partie Express ou des flashcards : tes points forts et tes points faibles s'afficheront ici.</p><button class="btn" data-go="quiz" style="margin-top:8px">Faire un quiz</button></div>`;
    return;
  }
  app.innerHTML = `<div class="duo" style="margin-bottom:6px">
    <div class="qcard"><p class="sec" style="margin:0;color:#0A6A52">Points forts</p>${strong.length ? strong.map(r => `<div class="is"><b style="color:#16182B">${esc(r.s.n)}</b> · ${r.pct} %</div>`).join('') : '<div class="is">Joue encore un peu : il faut au moins 5 réponses par matière.</div>'}</div>
    <div class="qcard"><p class="sec" style="margin:0;color:#C2410C">À travailler</p>${weak.length ? weak.map(r => `<button class="linkbtn" data-go="fiches-${r.s.k}"><b>${esc(r.s.n)}</b> · ${r.pct} % → revoir la fiche</button>`).join('') : '<div class="is">Rien d\'alarmant pour l\'instant.</div>'}</div>
  </div>
  <p class="sec">Taux de réussite aux QCM, par matière</p>
  <div class="qcard">${rows.map(r => `<div class="srow"><div class="srow-h"><span><b>${esc(r.s.n)}</b></span><span>${r.pct == null ? 'pas encore joué' : r.pct + ' % · ' + r.tot + ' réponses'}</span></div>
    <div class="prog"><div style="width:${r.pct || 0}%;background:${color(r.pct)}"></div></div>
    ${r.rp != null ? `<div class="is">Questions rédigées : ${r.rp} % des points attendus</div>` : ''}</div>`).join('')}</div>
  ${missed.length ? `<p class="sec">Les questions que tu rates le plus</p><div class="qcard">${missed.map(x => `<div class="rev"><b>${esc(x.q.q)}</b><br>Réponse : ${esc(x.q.o[x.q.a])} <span class="is">· ratée ${x.r.ko} fois sur ${x.r.ok + x.r.ko}</span><br><button class="linkbtn" data-go="fiches-${x.q.k}">Revoir la fiche ${esc(x.q.from)} →</button></div>`).join('')}</div>` : ''}`;
}

// ---------- Compte et classement (Supabase) ----------
function slug(p){ return norm(p).replace(/[^a-z0-9_.-]/g, ''); }
async function api(path, opts = {}, token){
  const res = await fetch(SUPA_URL + path, {...opts, headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || SUPA_KEY), ...(opts.headers || {})}});
  const txt = await res.text(); let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok) throw new Error((data && (data.msg || data.message || data.error_description || data.error)) || ('Erreur ' + res.status));
  return data;
}
async function session(){
  const u = store.get('user', null); if(!u) return null;
  if(u.exp && Date.now() < u.exp - 60000) return u;
  try{
    const d = await api('/auth/v1/token?grant_type=refresh_token', {method: 'POST', body: JSON.stringify({refresh_token: u.refresh})});
    const nu = {...u, token: d.access_token, refresh: d.refresh_token, exp: Date.now() + d.expires_in * 1000};
    store.set('user', nu); return nu;
  }catch(e){ return null; }
}
function queuePoints(n){ if(!RANK_ON || !store.get('user', null)) return; store.set('pending', store.get('pending', 0) + n); flushPoints(); }
async function flushPoints(){
  if(!RANK_ON) return;
  let left = store.get('pending', 0); if(!left) return;
  const u = await session(); if(!u) return;
  try{
    while(left > 0){
      const n = Math.min(left, 300);
      await api('/rest/v1/rpc/add_points', {method: 'POST', body: JSON.stringify({n})}, u.token);
      left -= n; store.set('pending', left);
    }
  }catch(e){}
}
function friendly(msg){
  const m = norm(msg);
  if(m.includes('already') || m.includes('duplicate') || m.includes('registered')) return 'Ce pseudo est déjà pris. Choisis-en un autre.';
  if(m.includes('invalid login') || m.includes('invalid credentials')) return 'Pseudo ou mot de passe incorrect.';
  if(m.includes('password')) return 'Le mot de passe doit faire au moins 6 caractères.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'Pas de connexion internet.';
  return msg;
}
async function rank(){
  stopTimer(); setTop('Classement', 'home'); noPager();
  if(!RANK_ON){
    app.innerHTML = `<div class="qcard"><p class="qq">Le classement arrive bientôt</p><p class="is">Il sera disponible dès que le serveur du classement sera branché. En attendant, tes points sont bien comptés sur ton téléphone : ${totalPts()} points.</p></div>`;
    return;
  }
  const u = store.get('user', null);
  app.innerHTML = `${u ? `<div class="qcard"><div class="qmeta"><span>Connecté : <b style="color:#16182B">${esc(u.pseudo)}</b></span><button class="linkbtn" id="logout">Se déconnecter</button></div></div>` : `<button class="item" style="background:#16182B;color:#fff;border:0" data-go="login"><span class="dot" style="background:#FFD34D;color:#16182B">+</span><span class="grow"><span class="it">Crée ton compte ou connecte-toi</span><div class="is" style="color:#D6D8E6">Pour apparaître dans le classement</div></span></button>`}
  <p class="sec">Top 50</p><div class="qcard" id="board"><p class="is">Chargement…</p></div>`;
  if(u) $('#logout').onclick = () => { store.set('user', null); store.set('pending', 0); rank(); };
  try{
    await flushPoints();
    const rows = await api('/rest/v1/profiles?select=pseudo,points&order=points.desc,updated_at.asc&limit=50');
    if(!$('#board')) return;
    $('#board').innerHTML = rows.length ? rows.map((r, i) => `<div class="rank ${u && r.pseudo === u.pseudo ? 'me' : ''}"><span class="rk r${i+1}">${i + 1}</span><span class="grow">${esc(r.pseudo)}</span><b>${r.points} pts</b></div>`).join('') : '<p class="is">Personne pour l\'instant : sois le premier !</p>';
  }catch(e){ if($('#board')) $('#board').innerHTML = `<p class="is">Impossible de charger le classement (${esc(friendly(e.message))}).</p>`; }
}
function login(){
  stopTimer(); setTop('Mon compte', 'home'); noPager();
  if(!RANK_ON) return go('rank');
  const me = store.get('user', null);
  if(me){
    app.innerHTML = `<div class="qcard"><p class="is" style="margin:0">Connecté en tant que</p><p class="qq">${esc(me.pseudo)}</p>
      <div class="qmeta"><span>Tes points</span><span class="ptschip">${totalPts()} pts</span></div>
      <div class="row2"><button class="btn" data-go="rank">Voir le classement</button><button class="btn ghost" id="logout">Se déconnecter</button></div>
      <p class="note" style="margin-top:4px">Tes stats et ta progression restent sur cet appareil.</p></div>`;
    $('#logout').onclick = () => { store.set('user', null); store.set('pending', 0); login(); };
    return;
  }
  app.innerHTML = `<div class="qcard"><p class="qq">Rejoins le classement</p>
    <label class="is" for="ps">Pseudo (3 à 20 caractères : lettres, chiffres, _ . -)</label>
    <input id="ps" class="search" style="margin:0" maxlength="20" autocomplete="username" autocapitalize="none">
    <label class="is" for="pw">Mot de passe (6 caractères minimum)</label>
    <input id="pw" class="search" style="margin:0" type="password" autocomplete="current-password">
    <div class="row2"><button class="btn" id="signup">Créer mon compte</button><button class="btn ghost" id="signin">Me connecter</button></div>
    <p class="is" id="msg" role="status"></p>
    <p class="note" style="margin-top:4px">Seuls ton pseudo et tes points sont visibles par les autres. Les points gagnés à partir de maintenant comptent pour le classement.</p></div>`;
  const msg = t => { $('#msg').textContent = t; };
  const read = () => {
    const p = $('#ps').value.trim(), pw = $('#pw').value, s = slug(p);
    if(s.length < 3 || s.length > 20 || s !== p.toLowerCase()) { msg('Pseudo invalide : 3 à 20 caractères, lettres sans accent, chiffres, _ . -'); return null; }
    if(pw.length < 6){ msg('Le mot de passe doit faire au moins 6 caractères.'); return null; }
    return {p, s, pw, email: s + '@bts-ndrc.app'};
  };
  const save = (d, pseudo) => store.set('user', {pseudo, id: d.user.id, token: d.access_token, refresh: d.refresh_token, exp: Date.now() + d.expires_in * 1000});
  $('#signup').onclick = async () => {
    const f = read(); if(!f) return; msg('Création du compte…');
    try{
      const d = await api('/auth/v1/signup', {method: 'POST', body: JSON.stringify({email: f.email, password: f.pw})});
      if(!d.access_token) throw new Error('Compte créé, mais la confirmation par e-mail est encore activée dans Supabase.');
      await api('/rest/v1/profiles', {method: 'POST', headers: {'Prefer': 'return=minimal'}, body: JSON.stringify({id: d.user.id, pseudo: f.p})}, d.access_token);
      save(d, f.p); store.set('pending', 0); refreshAcct(); go('rank');
    }catch(e){ msg(friendly(e.message)); }
  };
  $('#signin').onclick = async () => {
    const f = read(); if(!f) return; msg('Connexion…');
    try{
      const d = await api('/auth/v1/token?grant_type=password', {method: 'POST', body: JSON.stringify({email: f.email, password: f.pw})});
      const rows = await api('/rest/v1/profiles?select=pseudo&id=eq.' + d.user.id, {}, d.access_token);
      if(!rows || !rows[0]) await api('/rest/v1/profiles', {method: 'POST', headers: {'Prefer': 'return=minimal'}, body: JSON.stringify({id: d.user.id, pseudo: f.p})}, d.access_token);
      save(d, rows && rows[0] ? rows[0].pseudo : f.p); store.set('pending', 0); refreshAcct(); go('rank');
    }catch(e){ msg(friendly(e.message)); }
  };
}


// ---------- Mise à jour automatique ----------
// Au lancement et à chaque retour dans l'app, on demande la version en ligne (sans cache).
// Si elle a changé, on recharge l'app sur une adresse neuve pour contourner tous les caches.
const APP_VER = window.__APP_VER__ || 'dev';
let checking = false;
async function checkUpdate(){
  if(checking || APP_VER === 'dev' || !navigator.onLine || location.protocol !== 'https:') return;
  checking = true;
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
    const v = (await r.json()).v;
    let tried = null; try{ tried = sessionStorage.getItem('upd-tried'); }catch(e){}
    if(v && v !== APP_VER && tried !== v){
      try{ sessionStorage.setItem('upd-tried', v); }catch(e){}
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Nouvelle version, mise à jour…'; document.body.appendChild(t);
      try{ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(g => g.update().catch(() => {}))); }catch(e){}
      setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash), 600);
    }
  }catch(e){}
  checking = false;
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); });
window.addEventListener('online', checkUpdate);
setTimeout(checkUpdate, 1200);

// ---------- Navigation ----------
function render(){
  const h = location.hash.replace('#', '') || 'home';
  let m;
  if(h !== 'express' && !h.startsWith('express-')) stopTimer();
  if(h === 'home') home();
  else if(h === 'fiches') fichesMenu();
  else if(h === 'ressources') ressources();
  else if((m = h.match(/^fiches-([a-z0-9]+)$/))) fichesSubject(m[1]);
  else if((m = h.match(/^fiche-([a-z0-9]+)-(\d+)$/))) fichePage(m[1], +m[2]);
  else if((m = h.match(/^theme-([a-z0-9]+)-(\d+)$/))) themePages(m[1], +m[2]);
  else if(h === 'quiz') quizHome();
  else if(h === 'qcm' || h === 'redac') subjectMenu(h);
  else if((m = h.match(/^(qcm|redac)-([a-z0-9]+)$/))) startQuiz(m[1], m[2]);
  else if((m = h.match(/^quiz-([a-z0-9]+)$/))) go('qcm-' + m[1]);
  else if(h === 'express') expressMenu();
  else if(h === 'exam') examMenu();
  else if(h === 'planning') planning();
  else if(h === 'planning-edit') planningEdit();
  else if(h === 'cas') casMenu();
  else if((m = h.match(/^cas-([a-z0-9]+)-(\d+)$/))) startCas(m[1], +m[2]);
  else if((m = h.match(/^cas-([a-z0-9]+)$/))) casSubject(m[1]);
  else if((m = h.match(/^express-([a-z0-9]+)$/))) startExpress(m[1]);
  else if(h === 'flash') flashMenu();
  else if((m = h.match(/^flash-([a-z0-9]+)$/))) startFlash(m[1]);
  else if(h === 'stats') stats();
  else if(h === 'rank') rank();
  else if(h === 'login') login();
  else home();
}
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if(t && !t.disabled) go(t.dataset.go); });
window.addEventListener('hashchange', render);
document.getElementById('theme').onclick = () => setTheme(!document.documentElement.classList.contains('dark'));
setTheme(document.documentElement.classList.contains('dark'), false);
window.addEventListener('online', flushPoints);
render();
flushPoints();

if('serviceWorker' in navigator && location.protocol === 'https:'){ let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(!reloaded){ reloaded = true; location.reload(); } }); window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {}); }); document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); }); }
</script>
