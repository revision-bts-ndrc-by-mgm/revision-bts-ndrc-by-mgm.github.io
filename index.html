b> · comparer des options sur des critères, puis trancher<\/div><\/div><\/div>\n<div class=\"card cO\"><h3>Les réflexes qui rapportent<\/h3><ul class=\"sm\"><li>Toujours relier la réponse à l'entreprise et à sa cible.<\/li><li>Un chiffre ne suffit pas : dis ce qu'il signifie et ce qu'il faut faire.<\/li><li>Une production rédigée respecte les codes du canal (longueur, ton, appel à l'action).<\/li><li>Utilise le vocabulaire précis : taux de conversion, SEO, persona…<\/li><li>Pense au droit : RGPD, consentement, mentions obligatoires.<\/li><\/ul><\/div>\n<\/div>\n<h2>La pratique : 40 minutes sur ordinateur<\/h2>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cP\"><h3>Pendant l'épreuve<\/h3><ul class=\"sm\"><li>Lis tout le sujet avant de toucher à la souris.<\/li><li>Fais les opérations dans l'ordre logique (une catégorie avant le produit qu'elle contient).<\/li><li><b>Commente à voix haute<\/b> : ce que tu fais, pourquoi, pour quelle cible.<\/li><li>Vérifie le résultat côté visiteur (la page publique).<\/li><li>Bloqué ? Explique ce que tu voulais faire et passe à la suite.<\/li><\/ul><\/div>\n<div class=\"card cP\"><h3>Ce qu'on peut te demander<\/h3><ul class=\"sm\"><li>Créer ou modifier une page, un article, une fiche produit.<\/li><li>Optimiser le référencement d'une page.<\/li><li>Créer une promotion, un code de réduction, une catégorie.<\/li><li>Rédiger un post, une newsletter, une réponse à un avis.<\/li><li>Analyser des statistiques et proposer des actions.<\/li><\/ul><\/div>\n<\/div>","x":"méthode méthode de l'écrit et de la pratique l'écrit : 3 heures 1 lire le contexte l'entreprise, sa cible, ses canaux, son problème. 15 min. 2 lire les annexes note quelle annexe sert à quelle question. repère les chiffres. 3 traiter les dossiers dans l'ordre, en gardant du temps pour chacun. environ 2 h 15. 4 relire calculs, unités, orthographe. 15 min. les types de questions calculer · un indicateur, avec la formule, le calcul et une phrase qui interprèt nal<\/b><span class=\"mini\">plusieurs canaux, qui fonctionnent séparément<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Cross-canal<\/b><span class=\"mini\">les canaux se complètent : commander en ligne, retirer en magasin<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Omnicanal<\/b><span class=\"mini\">tous les canaux partagent les mêmes données : le client passe de l'un à l'autre sans rupture<\/span><\/div><\/div>\n<p class=\"sm\"><b>Parcours client<\/b> : <i>web-to-store<\/i> (se renseigner en ligne, acheter en magasin), <i>store-to-web<\/i> ou <i>showrooming<\/i> (voir en magasin, acheter en ligne), <i>click and collect<\/i>.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Outils<\/span><h3>La communication unifiée<\/h3><div class=\"mini\"><div class=\"def\"><b>Principe<\/b> · réunir téléphone, messagerie, visio, chat et partage de documents sur une même plateforme<\/div><div class=\"def\"><b>Centre de contacts<\/b> · appels entrants (service client, commandes) et sortants (prospection, relance)<\/div><div class=\"def\"><b>CTI<\/b> · couplage téléphonie-informatique : la fiche client s'affiche quand il appelle<\/div><div class=\"def\"><b>SVI<\/b> · serveur vocal interactif : « tapez 1 pour… »<\/div><div class=\"def\"><b>ACD<\/b> · distribution automatique des appels au bon conseiller<\/div><div class=\"def\"><b>Chat, chatbot, callbot<\/b> · réponse instantanée, par un humain ou un robot<\/div><div class=\"def\"><b>Rappel<\/b> · click-to-call, callback : le client demande à être rappelé<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Vendre à distance<\/span><h3>Les spécificités<\/h3><div class=\"mini\"><div class=\"def\"><b>Au téléphone<\/b> · pas de non-verbal : le sourire s'entend, la voix compte, il faut reformuler davantage<\/div><div class=\"def\"><b>Script<\/b> · un guide d'appel (CROC) qu'on adapte, sans le réciter<\/div><div class=\"def\"><b>Réactivité<\/b> · répondre vite, sur le canal choisi par le client<\/div><div class=\"def\"><b>Dossier client<\/b> · le consulter avant ou pendant l'échange, le mettre à jour après<\/div><div class=\"def\"><b>Gérer les conflits et le stress<\/b> · écoute, empathie, ton calme, solution, suivi ; pauses et soutien de l'équipe<\/div><\/div><\/div><\/div>\n<div class=\"card dark\"><h3>Le mot-clé de la compétence : expérience client<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Le client veut une réponse rapide, cohérente et personnalisée, quel que soit le canal. Toute proposition à l'écrit doit améliorer son parcours : moins d'attente, moins d'effort, plus de personnalisation.<\/p><\/div>","x":"c1 maîtriser la relation omnicanale · 1/3 omnicanal et outils à distance du multicanal à l'omnicanal multicanal plusieurs canaux, qui fonctionnent séparément cross-canal les canaux se complètent : commander en ligne, retirer en magasin omnicanal tous les canaux partagent les mêmes données : le client passe de l'un à l'autre sans rupture parcours client : web-to-store (se renseigner en ligne, acheter en magasin), store-to-web ou showrooming (voir en magasin, acheter en ligne), click and collect . outils la communication unifiée principe · réunir téléphone, messagerie, visio, chat et partage de documents sur une même plateforme centre de contacts · appels entrants (service client, commandes) et sortants (prospection, relance) cti · couplage téléphonie-informatique : la fiche client s'affiche quand il appelle svi · serveur vocal interactif : « tapez 1 pour… » acd · distribution automatique des appels au bon conseiller chat, chatbot, callbot · réponse instantanée, par un humain ou un robot rappel · click-to-call, callback : le client demande à être rappelé vendre à distance les spécificités au téléphone · pas de non-verbal : le sourire s'entend, la voix compte, il faut reformuler davantage script · un guide d'appel (croc) qu'on adapte, sans le réciter réactivité · répondre vite, sur le canal choisi par le client dossier client · le consulter avant ou pendant l'échange, le mettre à jour après gérer les conflits et le stress · écoute, empathie, ton calme, solution, suivi ; pauses et soutien de l'équipe le mot-clé de la compétence : expérience client le client veut une réponse rapide, cohérente et personnalisée, quel que soit le canal. toute proposition à l'écrit doit améliorer son parcours : moins d'attente, moins d'effort, plus de personnalisation."},{"t":"Les indicateurs de la relation à distance","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Maîtriser la relation omnicanale · 2/3<\/p><h1 style=\"--mid:1\">Les indicateurs de la relation à distance<\/h1><\/div><\/div><p class=\"mut\">Ils servent à évaluer la performance d'un service client ou d'une équipe de téléconseillers.<\/p><table class=\"tb\"><tr><th>Indicateur<\/th><th>Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr><tr><td data-label=\"Indicateur\">Taux de décroché<\/td><td data-label=\"Calcul\">appels décrochés / appels reçus × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">La capacité à répondre aux clients<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux d'abandon<\/td><td data-label=\"Calcul\">appels abandonnés avant réponse / appels reçus × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'attente trop longue<\/td><\/tr><tr><td data-label=\"Indicateur\">Durée moyenne de traitement (DMT)<\/td><td data-label=\"Calcul\">(temps de communication + temps de traitement après l'appel) / nombre d'appels<\/td><td data-label=\"Ce qu&#x27;il mesure\">La productivité<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de résolution au premier contact<\/td><td data-label=\"Calcul\">demandes réglées au 1er contact / demandes × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'efficacité et la qualité<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de réitération<\/td><td data-label=\"Calcul\">clients qui rappellent pour la même demande / clients × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">Les problèmes mal réglés<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de joignabilité (appels sortants)<\/td><td data-label=\"Calcul\">contacts joints / appels passés × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">La qualité du fichier<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de transformation<\/td><td data-label=\"Calcul\">ventes / contacts argumentés × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'efficacité commerciale<\/td><\/tr><tr><td data-label=\"Indicateur\">Appels par heure<\/td><td data-label=\"Calcul\">nombre d'appels / heures de travail<\/td><td data-label=\"Ce qu&#x27;il mesure\">Le rythme de production<\/td><\/tr><\/table>\n<h2>Mesurer la satisfaction<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"bign tB\" style=\"--mid:1\">CSAT<\/span><p class=\"sm\">Satisfaction après un contact : « Êtes-vous satisfait ? » noté de 1 à 5.<\/p><\/div>\n<div class=\"card cB\"><span class=\"bign tB\" style=\"--mid:1\">NPS<\/span><p class=\"sm\">« Recommanderiez-vous… ? » de 0 à 10. NPS = % de promoteurs (9-10) − % de détracteurs (0-6).<\/p><\/div>\n<div class=\"card cB\"><span class=\"bign tB\" style=\"--mid:1\">CES<\/span><p class=\"sm\">L'effort client : « A-t-il été facile de régler votre demande ? »<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Exemple d'interprétation<\/h3><p class=\"sm\">300 appels reçus, 240 décrochés : taux de décroché de 80 %, donc 1 client sur 5 n'obtient pas de réponse. <b>Proposition<\/b> : renforcer l'équipe aux heures de pointe, proposer le rappel automatique ou un chatbot pour les questions simples.<\/p><\/div>","x":"c1 maîtriser la relation omnicanale · 2/3 les indicateurs de la relation à distance ils servent à évaluer la performance d'un service client ou d'une équipe de téléconseillers. indicateur calcul ce qu'il mesure taux de décroché appels décrochés / appels reçus × 100 la capacité à répondre aux clients taux d'abandon appels abandonnés avant réponse / appels reçus × 100 l'attente trop longue durée moyenne de traitement (dmt) (temps de communication + temps de traitement après l'appel) / nombre d'appels la productivité taux de résolution au premier contact demandes réglées au 1er contact / demandes × 100 l'efficacité et la qualité taux de réitération clients qui rappellent pour la même demande / clients × 100 les problèmes mal réglés taux de joignabilité (appels sortants) contacts joints / appels passés × 100 la qualité du fichier taux de transformation ventes / contacts argumentés × 100 l'efficacité commerciale appels par heure nombre d'appels / heures de travail le rythme de production mesurer la satisfaction csat satisfaction après un contact : « êtes-vous satisfait ? » noté de 1 à 5. nps « recommanderiez-vous… ? » de 0 à 10. nps = % de promoteurs (9-10) − % de détracteurs (0-6). ces l'effort client : « a-t-il été facile de régler votre demande ? » exemple d'interprétation 300 appels reçus, 240 décrochés : taux de décroché de 80 %, donc 1 client sur 5 n'obtient pas de réponse. proposition : renforcer l'équipe aux heures de pointe, proposer le rappel automatique ou un chatbot pour les questions simples."},{"t":"Encadrer une équipe de téléconseillers","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Maîtriser la relation omnicanale · 3/3<\/p><h1 style=\"--mid:1\">Encadrer une équipe de téléconseillers<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">1<\/span><b>Recruter<\/b><span>Profil de poste, annonce, entretien, mise en situation au téléphone.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">2<\/span><b>Intégrer et former<\/b><span>Produits, outils, scripts, double écoute avec un ancien.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">3<\/span><b>Organiser<\/b><span>Planning selon les pics d'appels, objectifs individuels et collectifs.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">4<\/span><b>Évaluer<\/b><span>Tableaux de bord, écoutes, entretiens, coaching.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Motiver<\/span><h3>Les leviers<\/h3><div class=\"mini\"><div class=\"def\"><b>Financiers<\/b> · primes sur objectifs, challenges avec récompenses<\/div><div class=\"def\"><b>Non financiers<\/b> · reconnaissance, autonomie, formation, perspectives d'évolution, bonne ambiance<\/div><div class=\"def\"><b>Herzberg<\/b> · le salaire évite l'insatisfaction ; la reconnaissance et les responsabilités motivent<\/div><div class=\"def\"><b>Animation<\/b> · briefing quotidien, challenges d'équipe, célébrer les réussites<\/div><div class=\"def\"><b>Communication managériale<\/b> · objectifs clairs, retours réguliers, écoute<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Piloter<\/span><h3>La performance<\/h3><div class=\"mini\"><div class=\"def\"><b>Objectifs<\/b> · SMART, individuels et collectifs<\/div><div class=\"def\"><b>Tableau de bord<\/b> · quelques indicateurs clés, suivis chaque jour ou semaine<\/div><div class=\"def\"><b>Écoute et coaching<\/b> · écouter des appels, puis faire un retour constructif : un point fort, un point à travailler<\/div><div class=\"def\"><b>Régulation<\/b> · réorganise ter), puis en clients, puis en ambassadeurs. À l'opposé, l'<b>outbound<\/b> va chercher le client (publicité, prospection).<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Préparer<\/span><h3>Les bases<\/h3><div class=\"mini\"><div class=\"def\"><b>Persona<\/b> · un portrait fictif mais précis du client type : âge, besoins, freins, canaux préférés<\/div><div class=\"def\"><b>Ligne éditoriale<\/b> · les sujets, le ton et le style de la marque<\/div><div class=\"def\"><b>Calendrier éditorial<\/b> · quoi publier, où, quand<\/div><div class=\"def\"><b>Charte graphique<\/b> · couleurs, polices, logo : une image cohérente<\/div><div class=\"def\"><b>Objectifs<\/b> · notoriété, trafic, engagement, conversion, fidélisation<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Produire<\/span><h3>Les contenus<\/h3><div class=\"mini\"><div class=\"def\"><b>Types<\/b> · articles de blog, vidéos, stories, infographies, newsletters, tutoriels, avis clients, live<\/div><div class=\"def\"><b>Storytelling<\/b> · raconter une histoire pour créer de l'émotion<\/div><div class=\"def\"><b>Contenu généré par les utilisateurs (UGC)<\/b> · photos et avis de clients : très crédibles<\/div><div class=\"def\"><b>Appel à l'action<\/b> · un bouton ou une phrase qui dit quoi faire : « Découvrir », « Commander »<\/div><div class=\"def\"><b>Image et vidéo<\/b> · respecter le droit à l'image et les droits d'auteur (banques d'images libres de droits ou achetées)<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Rédiger pour le web<\/h3><div class=\"g2 sm\" style=\"gap:4px 18px\"><span>L'essentiel d'abord (pyramide inversée).<\/span><span>Phrases courtes, paragraphes aérés, intertitres.<\/span><span>Des mots-clés que tape la cible.<\/span><span>Un ton adapté au canal et à la cible.<\/span><span>Un appel à l'action clair.<\/span><span>Des liens vers d'autres pages du site.<\/span><\/div><\/div>","x":"c2 animer la relation client digitale · 1/3 la stratégie de contenu l'inbound marketing : faire venir le client à soi attirer convertir conclure fidéliser des contenus utiles (articles, tutoriels, vidéos) attirent des visiteurs, qu'on transforme en contacts (formulaire, newsletter), puis en clients, puis en ambassadeurs. à l'opposé, l' outbound va chercher le client (publicité, prospection). préparer les bases persona · un portrait fictif mais précis du client type : âge, besoins, freins, canaux préférés ligne éditoriale · les sujets, le ton et le style de la marque calendrier éditorial · quoi publier, où, quand charte graphique · couleurs, polices, logo : une image cohérente objectifs · notoriété, trafic, engagement, conversion, fidélisation produire les contenus types · articles de blog, vidéos, stories, infographies, newsletters, tutoriels, avis clients, live storytelling · raconter une histoire pour créer de l'émotion contenu généré par les utilisateurs (ugc) · photos et avis de clients : très crédibles appel à l'action · un bouton ou une phrase qui dit quoi faire : « découvrir », « commander » image et vidéo · respecter le droit à l'image et les droits d'auteur (banques d'images libres de droits ou achetées) rédiger pour le web l'essentiel d'abord (pyramide inversée). phrases courtes, paragraphes aérés, intertitres. des mots-clés que tape la cible. un ton adapté au canal et à la cible. un appel à l'action clair. des liens vers d'autres pages du site."},{"t":"Réseaux sociaux et e-réputation","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Animer la relation client digitale · 2/3<\/p><h1 style=\"--mid:1\">Réseaux sociaux et e-réputation<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Choisir<\/span><h3>Le bon réseau<\/h3><div class=\"mini\"><div class=\"def\"><b>Selon la cible<\/b> · où est-elle ? Quel âge, quel usage (loisir ou professionnel) ?<\/div><div class=\"def\"><b>Selon le contenu<\/b> · image, vidéo courte, article, échange<\/div><div class=\"def\"><b>Selon l'objectif<\/b> · B2B : réseau professionnel ; B2C : réseaux visuels ou vidéo<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Animer<\/span><h3>Le community management<\/h3><div class=\"mini\"><div class=\"def\"><b>Rôle<\/b> · créer, publier, animer, répondre, modérer, analyser<\/div><div class=\"def\"><b>Engager<\/b> · questions, sondages, jeux-concours (avec règlement), lives, partages de clients<\/div><div class=\"def\"><b>Répondre<\/b> · vite, poliment, en personnalisant<\/div><div class=\"def\"><b>Charte de modération<\/b> · ce qui est accepté, ce qui est supprimé (insultes, spam, contenus illicites)<\/div><div class=\"def\"><b>Influenceurs<\/b> · partenariats déclarés : mention « publicité » ou « collaboration commerciale » obligatoire depuis la loi du 9 juin 2023<\/div><\/div><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Surveiller<\/span><h3>L'e-réputation<\/h3><div class=\"mini\"><div class=\"def\"><b>Définition<\/b> · l'image de la marque sur internet : avis, commentaires, articles, posts<\/div><div class=\"def\"><b>Veille<\/b> · alertes sur le nom de la marque, outils de suivi des mentions, lecture des avis<\/div><div class=\"def\"><b>Avis clients<\/b> · répondre à tous, surtout aux négatifs ; ne jamais acheter de faux avis (interdit)<\/div><div class=\"def\"><b>Indicateurs<\/b> · note moyenne, nombre d'avis, sentiment des mentions (positif, neutre, négatif)<\/div><\/div><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>Répondre à un avis négatif<\/h3><ol class=\"sm\"><li><b>Remercier<\/b> le client pour son retour.<\/li><li><b>Reconnaître<\/b> le problème, sans se justifier ni accuser.<\/li><li><b>S'excuser<\/b> et expliquer brièvement.<\/li><li><b>Proposer une solution<\/b> ou un contact privé.<\/li><li><b>Inviter<\/b> à revenir.<\/li><\/ol><p class=\"sm\"><b>Bad buzz<\/b> : réagir vite, reconnaître, corriger, communiquer clairement. Ne jamais supprimer les critiques légitimes.<\/p><\/div>\n<\/div>\n<h2>Les indicateurs des réseaux<\/h2>\n<table class=\"tb\"><tr><th>Indicateur<\/th><th>Calcul ou définition<\/th><\/tr><tr><td data-label=\"Indicateur\">Portée<\/td><td data-label=\"Calcul ou définition\">nombre de personnes qui ont vu la publication<\/td><\/tr><tr><td data-label=\"Indicateur\">Impressions<\/td><td data-label=\"Calcul ou définition\">nombre total d'affichages (une personne peut voir plusieurs fois)<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux d'engagement<\/td><td data-label=\"Calcul ou définition\">interactions (j'aime, commentaires, partages, clics) / portée × 100<\/td><\/tr><tr><td data-label=\"Indicateur\">Croissance de la communauté<\/td><td data-label=\"Calcul ou définition\">(abonnés fin − abonnés début) / abonnés début × 100<\/td><\/tr><tr><td data-label=\"Indicateur\">Taux de clic<\/td><td data-label=\"Calcul ou définition\">clics / impressions × 100<\/td><\/tr><\/table>","x":"c2 animer la relation client digitale · 2/3 réseaux sociaux et e-réputation choisir le bon réseau selon la cible · où est-elle ? quel âge, quel usage (loisir ou professionnel) ? selon le contenu · image, vidéo courte, article, échange selon l'objectif · b2b : réseau professionnel ; b2c : réseaux visuels ou vidéo animer le community management rôle · créer, publier, animer, répondre, modérer, analyser engager · questions, sondages, jeux-concours (avec règlement), lives, partages de clients répondre · vite, poliment, en personnalisant charte de modération · ce qui est accepté, ce qui est supprimé (insultes, spam, contenus illicites) influenceurs · partenariats déclarés : mention « publicité » ou « collaboration commerciale » obligatoire depuis la loi du 9 juin 2023 surveiller l'e-réputation définition · l'image de la marque sur internet : avis, commentaires, articles, posts veille · alertes sur le nom de la marque, outils de suivi des mentions, lecture des avis avis clients · répondre à tous, surtout aux négatifs ; ne jamais acheter de faux avis (interdit) indicateurs · note moyenne, nombre d'avis, sentiment des mentions (positif, neutre, négatif) répondre à un avis négatif remercier le client pour son retour. reconnaître le problème, sans se justifier ni accuser. s'excuser et expliquer brièvement. proposer une solution ou un contact privé. inviter à revenir. bad buzz : réagir vite, reconnaître, corriger, communiquer clairement. ne jamais supprimer les critiques légitimes. les indicateurs des réseaux indicateur calcul ou définition portée nombre de personnes qui ont vu la publication impressions nombre total d'affichages (une personne peut voir plusieurs fois) taux d'engagement interactions (j'aime, commentaires, partages, clics) / portée × 100 croissance de la communauté (abonnés fin − abonnés début) / abonnés début × 100 taux de clic clics / impressions × 100"},{"t":"Le référencement","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Animer la relation client digitale · 3/3<\/p><h1 style=\"--mid:1\">Le référencement<\/h1><\/div><\/div><p class=\"mut\">Être visible quand le client cherche sur un moteur de recherche.<\/p>\n<div class=\"g3\">\n<div class=\"card cP\"><span class=\"bign tP\" style=\"--mid:1\">SEO<\/span><b>Référencement naturel<\/b><p class=\"sm\">Gratuit, mais lent : optimiser le site pour remonter dans les résultats.<\/p><\/div>\n<div class=\"card cP\"><span class=\"bign tP\" style=\"--mid:1\">SEA<\/span><b>Référencement payant<\/b><p class=\"sm\">Annonces sponsorisées, rapides. On paie au clic (CPC), selon des enchères sur des mots-clés.<\/p><\/div>\n<div class=\"card cP\"><span class=\"bign tP\" style=\"--mid:1\">SMO<\/span><b>Réseaux sociaux<\/b><p class=\"sm\">Optimiser sa présence sur les réseaux (SMA : la publicité sur les réseaux).<\/p><\/div>\n<\/div>\n<p class=\"sm mut\">SEM (marketing des moteurs de recherche) = SEO + SEA.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">SEO<\/span><h3>Optimiser une page<\/h3><div class=\"mini\"><div class=\"def\"><b>Mots-clés<\/b> · ceux que tape la cible ; un mot-clé principal par page<\/div><div class=\"def\"><b>Balise title<\/b> · le titre bleu dans les résultats : mot-clé au début, environ 60 caractères<\/div><div class=\"def\"><b>Meta description<\/b> · le texte sous le titre : donne envie de cliquer, environ 155 caractères<\/div><div class=\"def\"><b>Titres H1, H2…<\/b> · un seul H1 par page, avec le mot-clé<\/div><div class=\"def\"><b>URL<\/b> · courte, lisible, avec le mot-clé<\/div><div class=\"def\"><b>Images<\/b> · nom de fichier et texte alternatif (attribut alt) descriptifs, poids léger<\/div><div class=\"def\"><b>Contenu<\/b> · original, utile, régulièrement mis à jour<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">SEO<\/span><h3>Le site dans son ensemble<\/h3><div class=\"mini\"><div class=\"def\"><b>Maillage interne<\/b> · des liens entre les pages du site<\/div><div class=\"def\"><b>Liens entrants (backlinks)<\/b> · des liens venant d'autres sites de qualité<\/div><div class=\"def\"><b>Technique<\/b> · site rapide, adapté au mobile, sécurisé (HTTPS)<\/div><div class=\"def\"><b>Référencement local<\/b> · fiche d'établissement sur les cartes et moteurs, avis clients<\/div><div class=\"def\"><b>Suivi<\/b> · position sur les mots-clés, trafic organique, taux de clic dans les résultats<\/div><\/div><\/div><\/div>\n<div class=\"card dark\"><h3>En pratique sur WordPress ou PrestaShop<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">On te demandera souvent de remplir le titre SEO, la meta description, l'URL simplifiée et le texte alternatif des images d'une page ou d'une fiche produit. Justifie chaque choix par le mot-clé de la cible.<\/p><\/div>","x":"c2 animer la relation client digitale · 3/3 le référencement être visible quand le client cherche sur un moteur de recherche. seo référencement naturel gratuit, mais lent : optimiser le site pour remonter dans les résultats. sea référencement payant annonces sponsorisées, rapides. on paie au clic (cpc), selon des enchères sur des mots-clés. smo réseaux sociaux optimiser sa présence sur les réseaux (sma : la publicité sur les réseaux). sem (marketing des moteurs de recherche) = seo + sea. seo optimiser une page mots-clés · ceux que tape la cible ; un mot-clé principal par page balise title · le titre bleu dans les résultats : mot-clé au début, environ 60 caractères meta description · le texte sous le titre : donne envie de cliquer, environ 155 caractères titres h1, h2… · un seul h1 par page, avec le mot-clé url · courte, lisible, avec le mot-clé images · nom de fichier et texte alternatif (attribut alt) descriptifs, poids léger contenu · original, utile, régulièrement mis à jour seo le site dans son ensemble maillage interne · des liens entre les pages du site liens entrants (backlinks) · des liens venant d'autres sites de qualité technique · site rapide, adapté au mobile, sécurisé (https) référencement local · fiche d'établissement sur les cartes et moteurs, avis clients suivi · position sur les mots-clés, trafic organique, taux de clic dans les résultats en pratique sur wordpress ou prestashop on te demandera souvent class=\"sm\">Créer une newsletter, segmenter la liste, programmer l'envoi, lire les statistiques.<\/p><\/div>\n<div class=\"card\"><h3>CRM et GRC<\/h3><p class=\"sm\">Fiche client, historique, segmentation, relances. Le module GRC d'un PGI partage ces données dans toute l'entreprise.<\/p><\/div>\n<div class=\"card\"><h3>Visuels<\/h3><p class=\"sm\">Retoucher, recadrer, alléger une image ; créer un visuel aux couleurs de la charte.<\/p><\/div>\n<div class=\"card\"><h3>Publication<\/h3><p class=\"sm\">Programmer des posts sur plusieurs réseaux, suivre les statistiques.<\/p><\/div>\n<div class=\"card\"><h3>Hébergement<\/h3><p class=\"sm\">Le site est stocké chez un hébergeur ; un nom de domaine permet de le trouver.<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>La méthode pour chaque tâche<\/h3><p class=\"sm\"><b>Je lis<\/b> la demande · <b>j'annonce<\/b> ce que je vais faire et pourquoi · <b>je le fais<\/b> · <b>je vérifie<\/b> côté visiteur · <b>je justifie<\/b> (cible, objectif, référencement, droit).<\/p><\/div>","x":"pratique les outils de la partie pratique les sessions récentes utilisent des cms (logiciels de gestion de contenu) comme wordpress pour un site ou un blog et prestashop pour un site e-commerce. vérifie avec ton professeur les outils et le contexte de ta session. site, blog wordpress : savoir faire contenus · créer un article (daté, pour le blog) ou une page (fixe, ex. « à propos ») organisation · catégories et étiquettes, menus médias · ajouter une image, remplir le texte alternatif référencement · titre seo, meta description, url (extension seo) interaction · modérer les commentaires, ajouter un formulaire de contact extensions · ajouter des fonctions (ex. formulaire, seo, partage) e-commerce prestashop : savoir faire catalogue · créer une catégorie, un produit, ses déclinaisons (taille, couleur), son prix et son stock fiche produit · description courte et longue, images, référencement promotions · prix spécifique, règle panier, code de réduction clients · consulter un compte, des groupes de clients commandes · suivre, changer un statut, gérer un retour statistiques · ventes, meilleures ventes, visites les outils autour analyse d'audience outils de statistiques web : visites, sources de trafic, pages vues, conversions. e-mailing créer une newsletter, segmenter la liste, programmer l'envoi, lire les statistiques. crm et grc fiche client, historique, segmentation, relances. le module grc d'un pgi partage ces données dans toute l'entreprise. visuels retoucher, recadrer, alléger une image ; créer un visuel aux couleurs de la charte. publication programmer des posts sur plusieurs réseaux, suivre les statistiques. hébergement le site est stocké chez un hébergeur ; un nom de domaine permet de le trouver. la méthode pour chaque tâche je lis la demande · j'annonce ce que je vais faire et pourquoi · je le fais · je vérifie côté visiteur · je justifie (cible, objectif, référencement, droit)."},{"t":"Données client et lexique digital","h":"<p class=\"kick tO\">Notions<\/p>\n<h1>Données client et lexique digital<\/h1>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Données<\/span><h3>Connaître le client<\/h3><div class=\"mini\"><div class=\"def\"><b>Collecte<\/b> · formulaires, achats, navigation (cookies), réseaux sociaux, service client, enquêtes<\/div><div class=\"def\"><b>Types<\/b> · identité, comportement d'achat, navigation, préférences, satisfaction<\/div><div class=\"def\"><b>Qualification<\/b> · données exactes, complètes, à jour, sans doublon<\/div><div class=\"def\"><b>Segmentation<\/b> · grouper les clients selon leur comportement pour personnaliser (ex. méthode RFM : récence, fréquence, montant)<\/div><div class=\"def\"><b>Valeur client<\/b> · ce qu'un client rapporte sur toute la durée de la relation<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">RGPD<\/span><h3>Protéger les données<\/h3><div class=\"mini\"><div class=\"def\"><b>Finalité<\/b> · collecter pour un but précis et annoncé<\/div><div class=\"def\"><b>Minimisation<\/b> · ne demander que les données utiles<\/div><div class=\"def\"><b>Base légale<\/b> · consentement, contrat, intérêt légitime…<\/div><div class=\"def\"><b>Durée<\/b> · conservation limitée (en prospection, souvent 3 ans après le dernier contact, selon la CNIL)<\/div><div class=\"def\"><b>Droits<\/b> · accès, rectification, effacement, opposition, portabilité<\/div><div class=\"def\"><b>Sécurité<\/b> · protéger contre les fuites ; signaler une violation à la CNIL<\/div><div class=\"def\"><b>Sanction<\/b> · jusqu'à 20 M€ ou 4 % du CA mondial<\/div><\/div><\/div><\/div>\n<h2>Le lexique à maîtriser<\/h2>\n<div class=\"card\"><div class=\"mini\"><div class=\"def\"><b>Persona<\/b> · client type imaginé à partir de données réelles<\/div><div class=\"def\"><b>Lead<\/b> · contact qualifié, intéressé<\/div><div class=\"def\"><b>Landing page<\/b> · page d'atterrissage d'une campagne<\/div><div class=\"def\"><b>CTA<\/b> · appel à l'action<\/div><div class=\"def\"><b>UX<\/b> · expérience utilisateur sur le site<\/div><div class=\"def\"><b>Responsive<\/b> · site adapté à tous les écrans<\/div><div class=\"def\"><b>Retargeting<\/b> · publicité pour les visiteurs déjà venus<\/div><div class=\"def\"><b>Growth hacking<\/b> · techniques rapides et peu coûteuses pour croître<\/div><div class=\"def\"><b>Marketplace<\/b> · place de marché en ligne<\/div><div class=\"def\"><b>Drive-to-store<\/b> · attirer en magasin grâce au digital<\/div><div class=\"def\"><b>Phygital<\/b> · mélange physique et digital<\/div><div class=\"def\"><b>Social selling<\/b> · vendre en s'appuyant sur les réseaux sociaux<\/div><div class=\"def\"><b>Opt-in / opt-out<\/b> · accord préalable / droit de refuser ensuite<\/div><div class=\"def\"><b>Big data<\/b> · très grands volumes de données exploités<\/div><\/div><\/div>","x":"notions données client et lexique digital données connaître le client collecte · formulaires, achats, navigation (cookies), réseaux sociaux, service client, enquêtes types · identité, comportement d'achat, navigation, préférences, satisfaction qualification · données exactes, complètes, à jour, sans doublon segmentation · grouper les clients selon leur comportement pour personnaliser (ex. méthode rfm : récence, fréquence, montant) valeur client · ce qu'un client rapporte sur toute la durée de la relation rgpd protéger les données finalité · collecter pour un but précis et annoncé minimisation · ne demander que les données utiles base légale · consentement, contrat, intérêt légitime… durée · conservation limitée (en prospection, souvent 3 ans après le dernier contact, selon la cnil) droits · accès, rectification, effacement, opposition, portabilité sécurité · protéger contre les fuites ; signaler une violation à la cnil sanction · jusqu'à 20 m€ ou 4 % du ca mondial le lexique à maîtriser persona · client type imaginé à partir de données réelles lead · contact qualifié, intéressé landing page · page d'atterrissage d'une campagne cta · appel à l'action ux · expérience utilisateur sur le site responsive · site adapté à tous les écrans retargeting · publicité pour les visiteurs déjà venus growth hacking · techniques rapides et peu coûteuses pour croître marketplace · place de marché en ligne drive-to-store · attirer en magasin grâce au digital phygital · mélange physique et digital social selling · vendre en s'appuyant sur les réseaux sociaux opt-in / opt-out · accord préalable / droit de refuser ensuite big data · très grands volumes de données exploités"},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><p class=\"sm\">Multicanal, cross-canal, omnicanal · outils de la communication unifiée · taux de décroché, DMT, résolution au 1er contact · NPS · motiver et piloter une équipe · temps de travail.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C2<\/span><p class=\"sm\">Inbound · persona · ligne et calendrier éditoriaux · community management · e-réputation et réponse aux avis · SEO, SEA · taux d'engagement.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C3<\/span><p class=\"sm\">Tunnel de conversion · taux de conversion, panier moyen, abandon de panier · leviers pour dynamiser · droit de la vente en ligne · cookies · paiement sécurisé.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Savoir calculer et interpréter tous les indicateurs (pages 05, 08, 12)<\/span>\n<span>☐ Rédiger un post, une réponse à un avis, un e-mail, un script d'appel<\/span>\n<span>☐ Faire 2 sujets d'écrit complets en 3 h (2024, 2025, 2026)<\/span>\n<span>☐ T'entraîner sur le contexte digital de ta session<\/span>\n<span>☐ Savoir créer un produit, une promo, une page, et optimiser le SEO<\/span>\n<span>☐ Connaître les règles RGPD, cookies et vente en ligne<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li><b>Écrit<\/b> : lis le contexte et les annexes, puis traite chaque dossier.<\/li>\n<li>Chaque calcul : formule, résultat, interprétation, action.<\/li>\n<li>Chaque production : adaptée au canal et à la cible.<\/li>\n<li><b>Pratique<\/b> : lis tout le sujet avant de commencer.<\/li>\n<li>Commente à voix haute ce que tu fais et pourquoi.<\/li>\n<li>Vérifie le résultat côté visiteur.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cP\" style=\"padding:18px 20px\"><p class=\"quote\">Derrière chaque outil, il y a un client : chaque action doit lui simplifier la vie ou lui donner envie d'acheter.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E5, compétences et savoirs du bloc 2 · sujets E5 de la session 2025 · circulaire nationale 2022 (CMS de la partie pratique) · CNIL (prospection, cookies) · loi n° 2023-451 du 9 juin 2023 (influence commerciale). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j c1 multicanal, cross-canal, omnicanal · outils de la communication unifiée · taux de décroché, dmt, résolution au 1er contact · nps · motiver et piloter une équipe · temps de travail. c2 inbound · persona · ligne et calendrier éditoriaux · community management · e-réputation et réponse aux avis · seo, sea · taux d'engagement. c3 tunnel de conversion · taux de conversion, panier moyen, abandon de panier · leviers pour dynamiser · droit de la vente en ligne · cookies · paiement sécurisé. plan de révision ☐ savoir calculer et interpréter tous les indicateurs (pages 05, 08, 12) ☐ rédiger un post, une réponse à un avis, un e-mail, un script d'appel ☐ faire 2 sujets d'écrit complets en 3 h (2024, 2025, 2026) ☐ t'entraîner sur le contexte digital de ta session ☐ savoir créer un produit, une promo, une page, et optimiser le seo ☐ connaître les règles rgpd, cookies et vente en ligne le jour j écrit : lis le contexte et les annexes, puis traite chaque dossier. chaque calcul : formule, résultat, interprétation, action. chaque production : adaptée au canal et à la cible. pratique : lis tout le sujet avant de commencer. commente à voix haute ce que tu fais et pourquoi. vérifie le résultat côté visiteur. derrière chaque outil, il y a un client : chaque action doit lui simplifier la vie ou lui donner envie d'acheter. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e5, compétences et savoirs du bloc 2 · sujets e5 de la session 2025 · circulaire nationale 2022 (cms de la partie pratique) · cnil (prospection, cookies) · loi n° 2023-451 du 9 juin 2023 (influence commerciale). vérifié le 16 novembre 2026."},{"t":"Le marketing d'influence","h":"<div class=\"cx\" style=\"--cx:#11916F\"><p class=\"cx-k\">Complément · C2 relation client digitale<\/p><h1 class=\"cx-h\">Le marketing d'influence<\/h1><p class=\"cx-lead\">Une marque confie à un créateur de contenu le soin de présenter son offre à sa communauté. Efficace, mais strictement encadré depuis 2023.<\/p><section class=\"cx-b\"><h2>Choisir un influenceur<\/h2><ul><li><b>Nano et micro-influenceurs<\/b> · de petites communautés très engagées : souvent plus crédibles et moins chers.<\/li><li><b>Macro et méga-influenceurs<\/b> · une très large audience, pour la notoriété, mais un coût élevé.<\/li><li><b>Critères<\/b> · cohérence avec la marque et la cible, taux d'engagement, qualité de l'audience (pas de faux abonnés), image et valeurs.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Ce qu'impose la loi du 9 juin 2023<\/h2><ul><li><b>Transparence<\/b> · mention claire « Publicité » ou « Collaboration commerciale » sur chaque contenu promotionnel.<\/li><li><b>Images<\/b> · mention « Image retouchée » ou « Image virtuelle » quand c'est le cas.<\/li><li><b>Contrat écrit<\/b> · obligatoire depuis le 1er janvier 2026 dès que la collaboration dépasse 1 000 € HT, avantages en nature compris (décret du 28 novembre 2025).<\/li><li><b>Promotions interdites<\/b> · par exemple la chirurgie esthétique ou les produits contenant de la nicotine.<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Mesurer l'efficacité<\/h2><ul><li><b>Portée et impressions<\/b> · combien de personnes ont vu le contenu.<\/li><li><b>Taux d'engagement<\/b> · interactions / portée × 100.<\/li><li><b>Ventes générées<\/b> · grâce à un code promo ou un lien propre à l'influenceur.<\/li><li><b>Coût par résultat<\/b> · coût de la campagne / nombre de clics ou de ventes.<\/li><\/ul><\/section><section class=\"cx-note\"><b>À l'écrit E5 :<\/b> si on te demande de choisir un influenceur, compare 2 profils sur des critères chiffrés (communauté, engagement, cible, coût), tranche, puis rappelle les obligations légales.<\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : loi n° 2023-451 du 9 juin 2023 · décret du 28 novembre 2025 (seuil de 1 000 € HT, en vigueur au 1er janvier 2026), présenté par vie-publique.fr et la presse spécialisée.<\/p><\/div>","x":"  complément · c2 relation client digitale  le marketing d'influence  une marque confie à un créateur de contenu le soin de présenter son offre à sa communauté. efficace, mais strictement encadré depuis 2023.   choisir un influenceur    nano et micro-influenceurs  · de petites communautés très engagées : souvent plus crédibles et moins chers.   macro et méga-influenceurs  · une très large audience, pour la notoriété, mais un coût élevé.   critères  · cohérence avec la marque et la cible, taux d'engagement, qualité de l'audience (pas de faux abonnés), image et valeurs.     ce qu'impose la loi du 9 juin 2023    transparence  · mention claire « publicité » ou « collaboration commerciale » sur chaque contenu promotionnel.   images  · mention « image retouchée » ou « image virtuelle » quand c'est le cas.   contrat écrit  · obligatoire depuis le 1er janvier 2026 dès que la collaboration dépasse 1 000 € ht, avantages en nature compris (décret du 28 novembre 2025).   promotions interdites  · par exemple la chirurgie esthétique ou les produits contenant de la nicotine.     mesurer l'efficacité    portée et impressions  · combien de personnes ont vu le contenu.   taux d'engagement  · interactions / portée × 100.   ventes générées  · grâce à un code promo ou un lien propre à l'influenceur.   coût par résultat  · coût de la campagne / nombre de clics ou de ventes.     à l'écrit e5 :  si on te demande de choisir un influenceur, compare 2 profils sur des critères chiffrés (communauté, engagement, cible, coût), tranche, puis rappelle les obligations légales.  sources vérifiées le 17 novembre 2026 : loi n° 2023-451 du 9 juin 2023 · décret du 28 novembre 2025 (seuil de 1 000 € ht, en vigueur au 1er janvier 2026), présenté par vie-publique.fr et la presse spécialisée.  "},{"t":"Centre de relation client et e-mailing","h":"<div class=\"cx\" style=\"--cx:#11916F\"><p class=\"cx-k\">Complément · C1 relation omnicanale<\/p><h1 class=\"cx-h\">Centre de relation client et e-mailing<\/h1><p class=\"cx-lead\">Deux outils au cœur de la relation à distance : la plateforme qui répond aux clients, et la campagne d'e-mails qui va vers eux.<\/p><section class=\"cx-b\"><h2>Organiser un centre de relation client (CRC)<\/h2><ul><li><b>Internalisé<\/b> · géré par l'entreprise : meilleure maîtrise de la qualité et de l'image, mais plus coûteux.<\/li><li><b>Externalisé<\/b> · confié à un prestataire, en France, dans un pays proche (nearshore) ou lointain (offshore) : moins cher et plus souple, mais moins de contrôle.<\/li><li><b>Front office / back office<\/b> · le front répond au client ; le back traite les dossiers (remboursements, litiges).<\/li><li><b>Les rôles<\/b> · téléconseiller, superviseur (pilote l'équipe et les indicateurs), chargé qualité (écoutes, évaluations), planificateur (adapte les effectifs aux pics d'appels).<\/li><\/ul><\/section><section class=\"cx-b\"><h2>Réussir une campagne d'e-mailing<\/h2><ol class=\"cx-steps\"><li><span>1<\/span><div><b>Fixer l'objectif<\/b> vendre, informer, relancer, fidéliser.<\/div><\/li><li><span>2<\/span><div><b>Choisir la cible<\/b> un segment de la base, avec un consentement valable pour les particuliers.<\/div><\/li><li><span>3<\/span><div><b>Soigner l'objet et le pré-header<\/b> le court texte affiché après l'objet.<\/div><\/li><li><span>4<\/span><div><b>Rédiger un contenu court<\/b> avec un seul appel à l'action visible, adapté au mobile.<\/div><\/li><li><span>5<\/span><div><b>Tester<\/b> un test A/B sur l'objet ou l'heure d'envoi, sur une petite partie de la liste.<\/div><\/li><li><span>6<\/span><div><b>Analyser<\/b> délivrabilité, ouverture, clic, réactivité, désinscription, ventes.<\/div><\/li><\/ol><\/section><section class=\"cx-b\"><h2>Les règles à respecter<\/h2><ul><li><b>Particuliers<\/b> · consentement préalable, sauf pour un client existant et des produits analogues.<\/li><li><b>Professionnels<\/b> · possible sans accord préalable si le message concerne sa profession, avec droit d'opposition.<\/li><li><b>Toujours<\/b> · identifier l'expéditeur et proposer une désinscription simple dans chaque message.<\/li><li><b>Signaler un abus<\/b> · un SMS publicitaire non désiré se signale au 33700.<\/li><\/ul><\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : CNIL, « La prospection commerciale par courrier électronique, SMS-MMS et automate d'appel » et « Communications par voie électronique aux prospects et clients » (10/06/2026) · art. L34-5 du Code des postes et des communications électroniques.<\/p><\/div>","x":"  complément · c1 relation omnicanale  centre de relation client et e-mailing  deux outils au cœur de la relation à distance : la plateforme qui répond aux clients, et la campagne d'e-mails qui va vers eux.   organiser un centre de relation client (crc)    internalisé  · géré par l'entreprise : meilleure maîtrise de la qualité et de l'image, mais plus coûteux.   externalisé  · confié à un prestataire, en france, dans un pays proche (nearshore) ou lointain (offshore) : moins cher et plus souple, mais moins de contrôle.   front office / back office  · le front répond au client ; le back traite les dossiers (remboursements, litiges).   les rôles  · téléconseiller, superviseur (pilote l'équipe et les indicateurs), chargé qualité (écoutes, évaluations), planificateur (adapte les effectifs aux pics d'appels).     réussir une campagne d'e-mailing    1   fixer l'objectif  vendre, informer, relancer, fidéliser.    2   choisir la cible  un segment de la base, avec un consentement valable pour les particuliers.    3   soigner l'objet et le pré-header  le court texte affiché après l'objet.    4   rédiger un contenu court  avec un seul appel à l'action visible, adapté au mobile.    5   tester  un test a/b sur l'objet ou l'heure d'envoi, sur une petite partie de la liste.    6   analyser  délivrabilité, ouverture, clic, réactivité, désinscription, ventes.      les règles à respecter    particuliers  · consentement préalable, sauf pour un client existant et des produits analogues.   professionnels  · possible sans accord préalable si le message concerne sa profession, avec droit d'opposition.   toujours  · identifier l'expéditeur et proposer une désinscription simple dans chaque message.   signaler un abus  · un sms publicitaire non désiré se signale au 33700.    sources vérifiées le 17 novembre 2026 : cnil, « la prospection commerciale par courrier électronique, sms-mms et automate d'appel » et « communications par voie électronique aux prospects et clients » (10/06/2026) · art. l34-5 du code des postes et des communications électroniques.  "},{"t":"Réseaux sociaux et site vitrine","h":"<div class=\"cx\" style=\"--cx:#11916F\"><p class=\"cx-k\">Complément · C2 relation client digitale<\/p><h1 class=\"cx-h\">Choisir ses réseaux, créer un site vitrine<\/h1><p class=\"cx-lead\">Chaque réseau a ses codes. Et un site non marchand (vitrine, blog) se prépare comme un projet.<\/p><section class=\"cx-b\"><h2>Quel réseau pour quel usage ?<\/h2><div class=\"cx-tw\"><table class=\"cx-t\"><thead><tr><th>Réseau<\/th><th>Usage principal<\/th><th>Format roi<\/th><\/tr><\/thead><tbody><tr><td>LinkedIn<\/td><td>B2B, recrutement, expertise<\/td><td>Article, post texte<\/td><\/tr><tr><td>Instagram<\/td><td>Image de marque, B2C<\/td><td>Photo, story, vidéo courte<\/td><\/tr><tr><td>TikTok<\/td><td>Public jeune, viralité<\/td><td>Vidéo courte verticale<\/td><\/tr><tr><td>Facebook<\/td><td>Communautés, évènements locaux<\/td><td>Groupe, post, évènement<\/td><\/tr><tr><td>YouTube<\/td><td>Tutoriels, démonstrations<\/td><td>Vidéo longue<\/td><\/tr><tr><td>Pinterest<\/td><td>Inspiration (déco, mode, cuisine)<\/td><td>Épingle visuelle<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"cx-b\"><h2>Créer un site vitrine<\/h2><ol class=\"cx-steps\"><li><span>1<\/span><div><b>Le cahier des charges<\/b> objectifs, cible, contenus, budget, délais.<\/div><\/li><li><span>2<\/span><div><b>L'arborescence<\/b> les pages et leurs liens (accueil, offre, à propos, contact).<\/div><\/li><li><span>3<\/span><div><b>Le nom de domaine et l'hébergeur<\/b> l'adresse du site et le serveur qui le stocke.<\/div><\/li><li><span>4<\/span><div><b>Le CMS et la charte graphique<\/b> ex. WordPress, aux couleurs de la marque.<\/div><\/li><li><span>5<\/span><div><b>Le contenu optimisé<\/b> textes utiles, mots-clés, balises title et meta description, images légères avec texte alternatif.<\/div><\/li><li><span>6<\/span><div><b>Les obligations<\/b> mentions légales, consentement aux cookies, protection des données des formulaires.<\/div><\/li><\/ol><\/section><section class=\"cx-note\"><b>Bon réflexe :<\/b> justifie toujours le choix d'un réseau par la cible (âge, usage pro ou perso) et l'objectif (notoriété, trafic, ventes).<\/section><p class=\"cx-src\">Sources vérifiées le 17 novembre 2026 : programme du bloc 2 du BTS NDRC · CNIL (cookies et formulaires) · loi pour la confiance dans l'économie numérique de 2004 (mentions légales).<\/p><\/div>","x":"  complément · c2 relation client digitale  choisir ses réseaux, créer un site vitrine  chaque réseau a ses codes. et un site non marchand (vitrine, blog) se prépare comme un projet.   quel réseau pour quel usage ?      réseau  usage principal  format roi      linkedin  b2b, recrutement, expertise  article, post texte    instagram  image de marque, b2c  photo, story, vidéo courte    tiktok  public jeune, viralité  vidéo courte verticale    facebook  communautés, évènements locaux  groupe, post, évènement    youtube  tutoriels, démonstrations  vidéo longue    pinterest  inspiration (déco, mode, cuisine)  épingle visuelle        cr
