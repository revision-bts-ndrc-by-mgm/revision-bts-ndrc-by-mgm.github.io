ommercial."},{"id":"cgeq106","q":"Que dit Boileau sur le vrai ?","o":["« Le vrai peut quelquefois n'être pas vraisemblable »","« Rien n'est vrai »","« Le vrai est toujours beau »","« Le faux est la vérité »"],"a":0,"e":"L'Art poétique, 1674 : la réalité dépasse parfois la fiction."},{"id":"cgeq107","q":"Dans le BO, quelle question finale faut-il garder en tête ?","o":["Distinguer usages utiles et nuisibles du faux, sans confondre exigence de vérité et besoin d'imaginaire","Interdire les réseaux sociaux","Choisir entre roman et cinéma","Supprimer la publicité"],"a":0,"e":"Et se demander si l'art et la fiction ne peuvent pas aider à combattre la médiocrité du faux."}],"r":[{"id":"cger0","q":"Explique ce qu'est le « mentir-vrai » et donne une œuvre qui l'illustre.","p":[{"t":"Citer Aragon","k":["aragon"]},{"t":"La fiction invente ou « ment »","k":["fiction","mens","ment ","invent","roman"]},{"t":"…pour dire une vérité sur le monde","k":["verite","vrai","reel","revel","denonc"]},{"t":"Un exemple d'œuvre","k":["truman","1984","orwell","illusion comique","illusions perdues","rashomon","operation lune","faux-monnayeurs","quichotte","borges","indes fourbes","corneille","balzac"]}],"m":"Le « mentir-vrai » est une idée de Louis Aragon : le romancier invente, il « ment », mais cette fiction permet de dire une vérité plus profonde sur l'homme et la société. Par exemple, The Truman Show (Peter Weir, 1998) raconte une histoire impossible, mais elle dénonce une vérité bien réelle : la télé-réalité et la manipulation par les écrans."},{"id":"cger1","q":"Le faux est-il toujours condamnable ? Propose un plan en 3 parties avec un exemple par partie.","p":[{"t":"I. Oui, quand il manipule","k":["manipul","tromp","propagande","infox","deepfake","mensonge"]},{"t":"II. Non, quand il révèle ou divertit","k":["revel","divert","fiction","art","plaisir","magie"]},{"t":"III. Tout dépend du contrat avec le public","k":["contrat","assum","consent","transparen","cache","depend"]},{"t":"Des exemples précis","k":["orwell","1984","truman","aragon","prestige","avis","zeuxis","magritte","tartuffe"]}],"m":"I. Oui, le faux est condamnable quand il manipule : la propagande de 1984 d'Orwell, les infox ou les faux avis clients trompent les gens. II. Mais le faux peut révéler une vérité ou divertir : la fiction dit vrai (le « mentir-vrai » d'Aragon, The Truman Show), et la magie ou le trompe-l'œil sont des plaisirs acceptés. III. Tout dépend donc du contrat avec le public : le faux assumé est légitime, le faux caché est condamnable, d'où l'importance de la transparence et de l'esprit critique."},{"id":"cger2","q":"Pourquoi les fausses informations circulent-elles si vite ? Appuie-toi sur un exemple.","p":[{"t":"L'émotion et la nouveauté","k":["emotion","nouveau","surpr","choqu","peur","colere"]},{"t":"Le partage sur les réseaux sociaux","k":["reseau","partag","viral","algorithm"]},{"t":"Un exemple ou une étude","k":["mit","six fois","6 fois","pape","brad pitt","deepfake","rumeur"]},{"t":"Le biais de confirmation","k":["biais","confirm","ce qu'on pense","ce que l'on pense","croire"]}],"m":"Les fausses informations surprennent et provoquent des émotions fortes (peur, colère), ce qui pousse à les partager sans vérifier. Les réseaux sociaux accélèrent ce partage. Une étude du MIT parue en 2018 dans Science montre qu'une fausse information atteint 1 500 personnes environ six fois plus vite qu'une vraie. Enfin, le biais de confirmation nous fait croire plus facilement ce qui confirme ce que nous pensons déjà."},{"id":"cger3","q":"Rédige une introduction d'essai pour le sujet : « Une copie vaut-elle moins que l'original ? »","p":[{"t":"Une amorce (fait, exemple)","k":["lascaux","faussaire","contrefa","musee","beltracchi","ribes","welles","replique","en 20"]},{"t":"Définir les termes","k":["copie","original","authentique","unique"]},{"t":"Une problématique (une question)","k":["?"]},{"t":"L'annonce du plan","k":["nous verrons","d'abord","dans un premier","ensuite","puis","enfin"]}],"m":"La grotte de Lascaux est fermée au public depuis 1963 : les visiteurs découvrent aujourd'hui une réplique. Une copie reproduit un objet ou une œuvre ; l'original est l'œuvre unique, authentique, créée par son auteur. Faut-il alors considérer la copie comme une imitation sans valeur, ou peut-elle avoir un intérêt propre ? Nous verrons d'abord que l'original garde une valeur unique, puis que la copie peut être utile, voire nécessaire, avant de montrer que tout dépend de l'honnêteté de la démarche."},{"id":"cger4","q":"Explique la notion d'hyperréalité et cite l'auteur qui l'a décrite.","p":[{"t":"Citer Umberto Eco","k":["eco"]},{"t":"La copie paraît plus vraie que le réel","k":["plus vrai","plus reel","copie","imitation","reel"]},{"t":"Un exemple","k":["disney","musee de cire","chateau","factice","las vegas","etats-unis","amerique","seahaven","truman"]}],"m":"L'hyperréalité désigne une situation où la copie paraît plus vraie, plus parfaite que la réalité elle-même. Umberto Eco la décrit dans La Guerre du faux, à propos de l'Amérique des années 1970 : musées de cire, châteaux reconstitués, villes factices comme Disneyland. Seahaven, la ville parfaite et fausse de The Truman Show, en est une bonne illustration."},{"id":"cger5","q":"Comment la loi encadre-t-elle le faux dans le commerce ? Donne deux exemples.","p":[{"t":"Les faux avis clients interdits","k":["faux avis","avis"]},{"t":"La transparence des influenceurs","k":["influenc","collaboration commerciale","publicite","retouch","virtuel"]},{"t":"La notion de pratique commerciale trompeuse","k":["trompeu","pratique commerciale"]},{"t":"Des dates ou des lois","k":["2022","2023","loi","omnibus"]}],"m":"La loi protège la confiance du consommateur. Depuis le 28 mai 2022, diffuser ou faire diffuser de faux avis clients est une pratique commerciale réputée trompeuse. Depuis la loi du 9 juin 2023, les influenceurs doivent signaler les publicités (« collaboration commerciale ») et indiquer les images retouchées ou virtuelles. Le droit ne supprime pas le faux : il oblige à le rendre visible."},{"id":"cger6","q":"Pourquoi aimons-nous être trompés ? Donne deux arguments.","p":[{"t":"Le plaisir de l'imitation","k":["plaisir","aristote","mimesis","imitation","zeuxis","trompe"]},{"t":"L'évasion, l'imaginaire","k":["evad","evasion","rever","imaginaire","divert","echapp"]},{"t":"On sait que c'est faux : on y consent","k":["consent","sait que","coleridge","suspension","accept","pas dupe"]},{"t":"Un exemple","k":["magie","prestige","cinema","theatre","roman","serie","jeu"]}],"m":"D'abord, l'imitation procure du plaisir : Aristote l'expliquait déjà, et les raisins de Zeuxis trompaient même les oiseaux. Ensuite, l'illusion nous permet de nous évader : au cinéma ou devant un tour de magie (Le Prestige), nous acceptons d'être trompés. C'est la « suspension volontaire de l'incrédulité » de Coleridge : nous savons que c'est faux, et c'est justement ce qui rend le plaisir possible."},{"id":"cger7","q":"Dans une question sur corpus, comment construire un bon paragraphe ? Donne un exemple.","p":[{"t":"Une idée qui répond à la question","k":["idee"]},{"t":"Une preuve : citation courte avec la ligne","k":["preuve","citation","ligne","l."]},{"t":"L'analyse de la preuve","k":["analys","procede","effet","montre"]},{"t":"Un exemple rédigé","k":["«","\""]}],"m":"Un bon paragraphe suit le schéma idée, preuve, analyse. Exemple : « L'auteur souligne d'abord la vitesse du faux (idée). Il écrit qu'une fausse information « se répand six fois plus vite » (l. 14) (preuve). Ce chiffre, tiré d'une étude, donne du poids à son propos et montre que le faux a un avantage sur le vrai (analyse). »"}],"cs":[{"id":"cgec0","t":"Corpus : les faux avis en ligne","x":["Document 1 (article inventé pour l'exercice) : « Une étude d'une association de consommateurs estime qu'un avis en ligne sur cinq serait faux ou acheté. Des sociétés vendent des lots de 50 avis cinq étoiles. Pourtant, 9 internautes sur 10 lisent les avis avant d'acheter. »","Document 2 (fable inventée) : un renard vend des œufs « frais du jour » et paie des corbeaux pour chanter ses louanges sur la place du marché. Les poules, qui pondent vraiment, ne vendent plus rien. Un jour, un œuf se casse : il est vide.","Document 3 (image décrite) : une affiche montre un smartphone couvert d'étoiles dorées ; derrière, dans l'ombre, une main tend des billets. Slogan : « Toutes les étoiles ne brillent pas. »"],"q":[{"id":"cgec0q0","q":"Comment le document 2 dénonce-t-il les faux avis ? (une idée, une preuve, une analyse)","p":[{"t":"Idée : la fable dénonce la tromperie de façon imagée","k":["fable","dénonce","denonce","image","allegorie","metaphore"]},{"t":"Preuve : les corbeaux payés pour chanter ses louanges","k":["corbeaux","paye","louanges"]},{"t":"Analyse : le faux avis fausse la concurrence et finit par se révéler (l'œuf vide)","k":["vide","poules","concurrence","se revele","verite","honnetes"]}],"m":"Le document 2 dénonce les faux avis à travers une fable : le renard paie des corbeaux pour chanter ses louanges, comme un vendeur achète de faux avis. Les poules honnêtes ne vendent plus rien : le faux fausse la concurrence. Mais l'œuf vide finit par révéler la vérité : la morale suggère que la tromperie ne dure pas."},{"id":"cgec0q1","q":"Rapprochez et distinguez les documents 1 et 3.","p":[{"t":"Point commun : les deux dénoncent les avis achetés","k":["achete","faux avis","argent","billets","denoncent"]},{"t":"Différence de forme : chiffres et faits (doc 1) / image symbolique (doc 3)","k":["chiffre","etude","image","symbol","affiche","informatif"]},{"t":"Différence de visée : informer (doc 1) / alerter, faire réagir (doc 3)","k":["informer","alerter","faire reagir","mettre en garde","slogan","persuader"]}],"m":"Les deux documents dénoncent les avis achetés : le document 1 cite des lots de 50 avis vendus, l'affiche montre une main qui tend des billets derrière les étoiles. Mais le document 1 informe avec des chiffres (un avis sur cinq serait faux), alors que le document 3 frappe par une image symbolique et un slogan qui joue sur le mot « étoiles » pour mettre le public en garde."},{"id":"cgec0q2","q":"Essai : « Peut-on encore faire confiance aux avis en ligne ? » Propose un plan en 2 ou 3 parties avec un exemple par partie.","p":[{"t":"I. Non, ou pas aveuglément : le faux est fréquent","k":["non","faux avis","achete","manipul","un sur cinq","1 sur 5"]},{"t":"II. Oui, avec esprit critique et des protections (loi, vérification)","k":["esprit critique","verifier","loi","2022","omnibus","interdit","regles"]},{"t":"Des exemples précis (corpus, actualité, NDRC)","k":["doc","document","stage","exemple","fontenelle","omnibus","influenceur"]},{"t":"Une problématique ou une nuance finale","k":["problematique","nuance","depend","conclusion","transparence","contrat"]}],"m":"Problématique : les avis en ligne sont-ils un outil de vérité ou une vitrine truquée ? I. On ne peut pas leur faire une confiance aveugle : une partie est fausse ou achetée (doc 1) et le faux fausse la concurrence (doc 2). II. Pourtant, ils restent utiles avec un esprit critique et des protections : depuis 2022, les faux avis sont une pratique réputée trompeuse ; on peut croiser les sources et lire les avis détaillés. III. La confiance dépend finalement de la transparence : avis vérifiés, réponse du vendeur, expérience vécue en stage où un client se fie aux avis."}]},{"id":"cgec1","t":"Essai : la fiction peut-elle dire la vérité ?","x":["Sujet d'essai : « La fiction peut-elle nous apprendre la vérité sur le monde ? »","Tu as 1 h 25. Tu disposes de tes références de l'année et d'un exemple de ton stage."],"q":[{"id":"cgec1q0","q":"Analyse le sujet : définis les mots-clés et formule une problématique.","p":[{"t":"Définir la fiction (récit inventé)","k":["invente","imaginaire","recit","pas reel"]},{"t":"Définir la vérité (ce qui est conforme au réel)","k":["conforme","reel","realite"]},{"t":"Une problématique qui pose la tension","k":["comment","paradoxe","peut-on","inventer","mentir","tension"]}],"m":"La fiction est un récit inventé, qui ne prétend pas être vrai ; la vérité est ce qui est conforme à la réalité. D'où le paradoxe : comment un mensonge assumé pourrait-il nous apprendre quelque chose de vrai ? Problématique : en inventant, la fiction nous éloigne-t-elle du réel, ou nous permet-elle de mieux le voir ?"},{"id":"cgec1q1","q":"Donne un argument « oui » avec un exemple précis (A.E.I.).","p":[{"t":"Argument : la fiction révèle ou dénonce le réel","k":["revele","denonce","montre","mentir-vrai","fait voir"]},{"t":"Exemple précis : auteur, titre","k":["orwell","1984","truman","balzac","illusions perdues","aragon","corneille","rashomon"]},{"t":"Interprétation : en quoi l'exemple prouve l'argument","k":["prouve","montre que","nous fait","oblige","comprendre","lucid"]}],"m":"A : la fiction peut dénoncer une manipulation mieux qu'un discours direct. E : dans 1984 (Orwell, 1949), le ministère de la Vérité réécrit le passé et la novlangue empêche de penser. I : en inventant un régime extrême, Orwell nous rend lucides sur des mécanismes bien réels de propagande ; c'est le « mentir-vrai » d'Aragon."},{"id":"cgec1q2","q":"Donne la nuance (« mais ») avec un exemple, puis ta conclusion.","p":[{"t":"Nuance : la fiction peut aussi égarer ou être confondue avec le réel","k":["egarer","confond","danger","illusion","tromper","don quichotte"]},{"t":"Exemple précis","k":["don quichotte","cervantes","operation lune","deepfake","wag the dog","infox"]},{"t":"Conclusion : tout dépend du pacte avec le lecteur / de l'esprit critique","k":["pacte","esprit critique","depend","assume","conscience","sait que"]}],"m":"Mais la fiction peut aussi égarer quand on la confond avec le réel : Don Quichotte (Cervantès) a tant lu de romans de chevalerie qu'il prend des moulins pour des géants. Conclusion : la fiction dit vrai quand le pacte de lecture est clair et que le lecteur garde son esprit critique ; c'est le faux assumé qui éclaire, le faux caché qui trompe."}]},{"id":"cgec2","t":"Introduction d'essai à rédiger","x":["Sujet : « Pourquoi aimons-nous être trompés ? »","Exemples à disposition : un tour de magie vu à la télévision, le film Le Prestige (Nolan, 2006), Zeuxis et ses raisins, un parc d'attractions."],"q":[{"id":"cgec2q0","q":"Rédige une amorce (1 ou 2 phrases).","p":[{"t":"Un fait ou une référence concrète qui accroche","k":["magie","magicien","zeuxis","raisins","prestige","parc","tour"]},{"t":"Lien avec le sujet : le plaisir d'être trompé","k":["plaisir","applaudi","aimons","consent","volontiers","trompe"]}],"m":"Chaque soir, des millions de spectateurs applaudissent un magicien qui vient de les tromper sous leurs yeux : loin de se sentir dupés, ils en redemandent."},{"id":"cgec2q1","q":"Reformule le sujet et formule la problématique.","p":[{"t":"Reformulation : on accepte, voire on recherche, l'illusion","k":["accepte","recherche","illusion","volontairement","consent"]},{"t":"Paradoxe : on condamne d'habitude le mensonge","k":["paradox","condamne","pourtant","mensonge","habituellement"]},{"t":"Problématique sous forme de question","k":["?","pourquoi","qu'est-ce","comment"]}],"m":"Être trompé est d'ordinaire vécu comme une blessure ; pourtant, au spectacle, au cinéma ou dans un parc d'attractions, nous recherchons volontairement l'illusion. Pourquoi ce faux, que nous condamnons ailleurs, devient-il ici une source de plaisir ?"},{"id":"cgec2q2","q":"Annonce un plan en une phrase.","p":[{"t":"Première partie : le plaisir de l'illusion et de l'imitation","k":["plaisir","imitation","mimesis","aristote","admir"]},{"t":"Deuxième partie : l'évasion ou ce que l'illusion nous apprend","k":["evasion","apprend","reve","imaginaire","revele"]},{"t":"Limite : seulement quand on y consent","k":["consent","limite","a condition","volontaire","sait"]}],"m":"Nous verrons que l'illusion nous procure le plaisir d'admirer une imitation réussie, qu'elle nous offre une évasion qui nous en apprend aussi sur nous-mêmes, mais que ce plaisir n'existe que si nous consentons à être trompés."}]}]},{"k":"e2","n":"Anglais","s":"E2 · LV1","c":"#D6336C","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Épreuve E2 · LV1<\/span>\n<div style=\"font-weight:800;--big:1\"><span style=\"color:#2F5BEA\" lang=\"en\">Let's talk<\/span><br><span style=\"color:#F25C2B\" lang=\"en\">business.<\/span><\/div>\n<p>L'oral d'anglais du BTS NDRC : le déroulement, une méthode pour chaque partie, des phrases toutes prêtes, le vocabulaire commercial et les erreurs à éviter.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">autant que la CEJM<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">30 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">de préparation<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">30 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">d'oral maximum<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">B2<\/span><span class=\"sm\" style=\"color:#D6D8E6\">niveau attendu<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie a · 10 min · en français<\/span><h3>Compréhension de l'écrit<\/h3><p class=\"sm\">Tu rends compte, en français, des idées essentielles d'un article en anglais sur un sujet commercial.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie b · 20 min · en anglais<\/span><h3>Expression orale en interaction<\/h3><p class=\"sm\">À partir d'un document commercial et d'une mise en situation, tu présentes, analyses et proposes une démarche, en dialogue avec l'examinateur.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>08<\/b> · Vocabulaire : digital, réseaux, emploi<\/span>\n<span><b>03<\/b> · Partie a : le compte rendu<\/span><span><b>09<\/b> · Lire un document commercial<\/span>\n<span><b>04<\/b> · Partie b : la méthode<\/span><span><b>10<\/b> · La grammaire utile<\/span>\n<span><b>05<\/b> · Les phrases toutes prêtes<\/span><span><b>11<\/b> · Erreurs, faux amis, prononciation<\/span>\n<span><b>06–07<\/b> · Vocabulaire commercial<\/span><span><b>12<\/b> · Kit minimum et jour J<\/span>\n<\/div>","x":"fiche de révision · épreuve e2 · lv1 let's talk business. l'oral d'anglais du bts ndrc : le déroulement, une méthode pour chaque partie, des phrases toutes prêtes, le vocabulaire commercial et les erreurs à éviter. coef. 3 autant que la cejm 30 min de préparation 30 min d'oral maximum b2 niveau attendu partie a · 10 min · en français compréhension de l'écrit tu rends compte, en français, des idées essentielles d'un article en anglais sur un sujet commercial. partie b · 20 min · en anglais expression orale en interaction à partir d'un document commercial et d'une mise en situation, tu présentes, analyses et proposes une démarche, en dialogue avec l'examinateur. 02 · le déroulement de l'épreuve 08 · vocabulaire : digital, réseaux, emploi 03 · partie a : le compte rendu 09 · lire un document commercial 04 · partie b : la méthode 10 · la grammaire utile 05 · les phrases toutes prêtes 11 · erreurs, faux amis, prononciation 06–07 · vocabulaire commercial 12 · kit minimum et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<div class=\"card dark\" style=\"gap:10px\"><h3>En ponctuel : 30 min de préparation, puis 30 min d'oral maximum<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700\">\n<div style=\"flex:30;display:flex;align-items:center;justify-content:center;background:#4A4E68;color:#FFFFFF\">Préparation · 30 min<\/div>\n<div class=\"fB\" style=\"flex:10;display:flex;align-items:center;justify-content:center;color:#FFFFFF\">a · 10 min<\/div>\n<div class=\"fO\" style=\"flex:20;display:flex;align-items:center;justify-content:center;color:#16182B\">b · 20 min<\/div>\n<\/div>\n<p class=\"sm\" style=\"color:#E4E5EE\">En CCF : deux situations, A (compréhension de l'écrit, 10 min) et B (expression orale, 20 min), chacune avec 15 min de préparation, et le même déroulement.<\/p><\/div>\n<h2>Les deux documents remis au début de la préparation<\/h2>\n<div class=\"g2\">\n<div class=\"card cB\"><h3>Un texte en anglais<\/h3><p class=\"sm\">Un article de presse (ou autre) sur un sujet commercial, de 50 lignes maximum. Il sert à la partie a.<\/p><\/div>\n<div class=\"card cO\"><h3>Un document commercial + une mise en situation<\/h3><p class=\"sm\">Fiche produit, page de site, plaquette de salon, offre d'emploi… avec 3 ou 4 questions ou consignes. Il sert à la partie b.<\/p><\/div>\n<\/div>\n<h2>Ce que fait le candidat<\/h2>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie a · en français<\/span><p class=\"sm\">Tu restitues de façon structurée les idées essentielles du texte. L'examinateur peut ensuite te demander des précisions.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie b · en anglais<\/span><p class=\"sm\">Tu présentes la situation et le contexte, tu analyses les besoins (cible, contexte culturel, lieu), puis tu proposes une démarche commerciale argumentée. Tu dois réagir, décrire, reformuler, argumenter, justifier, expliquer.<\/p><\/div>\n<\/div>\n<h2>Les critères de la grille nationale<\/h2>\n<table class=\"tb\"><tr><th>Critère<\/th><th>Ce qui est évalué<\/th><\/tr><tr><td data-label=\"Critère\">Fond<\/td><td data-label=\"Ce qui est évalué\">Décrire et analyser le document, prendre part à un dialogue professionnel<\/td><\/tr><tr><td data-label=\"Critère\">Forme<\/td><td data-label=\"Ce qui est évalué\">Correction de la langue et de la prononciation, être compris, aisance<\/td><\/tr><tr><td data-label=\"Critère\">Communication<\/td><td data-label=\"Ce qui est évalué\">Interagir, s'adapter aux questions de l'examinateur<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Bon à savoir<\/h3><p class=\"sm\">L'examinateur ne doit pas te poser de questions de grammaire ou de théorie, ni évaluer tes compétences techniques : il évalue ta communication. Il doit être bienveillant et relancer si tu bloques. Il n'attend pas un anglais parfait, mais <b>« une langue grammaticalement acceptable »<\/b> et une prononciation claire.<\/p><\/div>","x":"l'épreuve le déroulement de l'épreuve en ponctuel : 30 min de préparation, puis 30 min d'oral maximum préparation · 30 min a · 10 min b · 20 min en ccf : deux situations, a (compréhension de l'écrit, 10 min) et b (expression orale, 20 min), chacune avec 15 min de préparation, et le même déroulement. les deux documents remis au début de la préparation un texte en anglais un article de presse (ou autre) sur un sujet commercial, de 50 lignes maximum. il sert à la partie a. un document commercial + une mise en situation fiche produit, page de site, plaquette de salon, offre d'emploi… avec 3 ou 4 questions ou consignes. il sert à la partie b. ce que fait le candidat partie a · en français tu restitues de façon structurée les idées essentielles du texte. l'examinateur peut ensuite te demander des précisions. partie b · en anglais tu présentes la situation et le contexte, tu analyses les besoins (cible, contexte culturel, lieu), puis tu proposes une démarche commerciale argumentée. tu dois réagir, décrire, reformuler, argumenter, justifier, expliquer. les critères de la grille nationale critère ce qui est évalué fond décrire et analyser le document, prendre part à un dialogue professionnel forme correction de la langue et de la prononciation, être compris, aisance communication interagir, s'adapter aux questions de l'examinateur bon à savoir l'examinateur ne doit pas te poser de questions de grammaire ou de théorie, ni évaluer tes compétences techniques : il évalue ta communication. il doit être bienveillant et relancer si tu bloques. il n'attend pas un anglais parfait, mais « une langue grammaticalement acceptable » et une prononciation claire."},{"t":"Le compte rendu de l'article","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">a<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partie a · 10 minutes · en français<\/p><h1 style=\"--mid:1\">Le compte rendu de l'article<\/h1><\/div><\/div>\n<div class=\"card cB\" style=\"gap:8px\"><h3>En préparation : environ 12 minutes pour le texte<\/h3>\n<ol class=\"sm\"><li><b>Paratexte<\/b> : titre, source, date, auteur. Il annonce souvent le sujet.<\/li><li><b>Première lecture<\/b> pour le sens général, sans dictionnaire mental : ne bloque pas sur un mot.<\/li><li><b>Deuxième lecture<\/b> : souligne les idées clés, les chiffres, les noms, les exemples.<\/li><li><b>Regroupe<\/b> les idées en 2 ou 3 parties. Note des mots-clés, pas des phrases.<\/li><\/ol><\/div>\n<h2>Le plan du compte rendu<\/h2>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">1<\/span><b>Présenter<\/b><span>« Il s'agit d'un article de [source], publié le [date], qui traite de… »<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">2<\/span><b>L'idée principale<\/b><span>« L'auteur montre que… »<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">3<\/span><b>Le détail<\/b><span>2 ou 3 idées, avec les chiffres et exemples importants.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">4<\/span><b>Conclure<\/b><span>La conclusion de l'article ; éventuellement le lien avec le commerce.<\/span><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><h3>Les mots qui structurent (en français)<\/h3><p class=\"sm\">Tout d'abord · ensuite · par ailleurs · en revanche · cependant · par conséquent · par exemple · selon l'auteur · enfin · en conclusion.<\/p><\/div>\n<div class=\"card cB\"><h3>Les mots pour comprendre (en anglais)<\/h3><div class=\"mini\"><div class=\"def\"><b lang=\"en\">however, yet<\/b> · cependant<\/div><div class=\"def\"><b lang=\"en\">whereas, while<\/b> · alors que<\/div><div class=\"def\"><b lang=\"en\">therefore, thus<\/b> · donc<\/div><div class=\"def\"><b lang=\"en\">although<\/b> · bien que<\/div><div class=\"def\"><b lang=\"en\">according to<\/b> · selon<\/div><div class=\"def\"><b lang=\"en\">unless<\/b> · à moins que<\/div><\/div><\/div>\n<\/div>\n<div class=\"card cO\"><h3>Les pièges<\/h3><ul class=\"sm\"><li>Traduire le texte ligne par ligne : on te demande de <b>résumer<\/b>, pas de traduire.<\/li><li>Donner ton avis : ce n'est pas demandé ici.<\/li><li>Oublier les chiffres : ils montrent que tu as compris le détail.<\/li><li>Lire tes notes : regarde l'examinateur et parle naturellement.<\/li><\/ul><\/div>\n<div class=\"card cY\"><h3>Les chiffres en anglais<\/h3><p class=\"sm\"><span lang=\"en\"><b>1,500<\/b><\/span> = 1 500 (virgule pour les milliers) · <span lang=\"en\"><b>2.5<\/b><\/span> = 2,5 (point pour les décimales) · <span lang=\"en\"><b>a billion<\/b><\/span> = un milliard · <span lang=\"en\"><b>a 10% increase<\/b><\/span> = une hausse de 10 % · <span lang=\"en\"><b>to double<\/b><\/span> = doubler.<\/p><\/div>","x":"a partie a · 10 minutes · en français le compte rendu de l'article en préparation : environ 12 minutes pour le texte paratexte : titre, source, date, auteur. il annonce souvent le sujet. première lecture pour le sens général, sans dictionnaire mental : ne bloque pas sur un mot. deuxième lecture : souligne les idées clés, les chiffres, les noms, les exemples. regroupe les idées en 2 ou 3 parties. note des mots-clés, pas des phrases. le plan du compte rendu 1 présenter « il s'agit d'un article de [source], publié le [date], qui traite de… » 2 l'idée principale « l'auteur montre que… » 3 le détail 2 ou 3 idées, avec les chiffres et exemples importants. 4 conclure la conclusion de l'article ; éventuellement le lien avec le commerce. les mots qui structurent (en français) tout d'abord · ensuite · par ailleurs · en revanche · cependant · par conséquent · par exemple · selon l'auteur · enfin · en conclusion. les mots pour comprendre (en anglais) however, yet · cependant whereas, while · alors que therefore, thus · donc although · bien que according to · selon unless · à moins que les pièges traduire le texte ligne par ligne : on te demande de résumer , pas de traduire. donner ton avis : ce n'est pas demandé ici. oublier les chiffres : ils montrent que tu as compris le détail. lire tes notes : regarde l'examinateur et parle naturellement. les chiffres en anglais 1,500 = 1 500 (virgule pour les milliers) · 2.5 = 2,5 (point pour les décimales) · a billion = un milliard · a 10% increase = une hausse de 10 % · to double = doubler."},{"t":"Présenter, analyser, proposer","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">b<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partie b · 20 minutes · en anglais<\/p><h1 style=\"--mid:1\">Présenter, analyser, proposer<\/h1><\/div><\/div>\n<div class=\"g3\">\n<div class=\"card cO\"><span class=\"bign tO\" style=\"--mid:1\">1<\/span><h3>Présenter<\/h3><p class=\"sm\">La situation : qui tu es (stagiaire, commercial), l'entreprise, le produit, le document.<\/p><\/div>\n<div class=\"card cO\"><span class=\"bign tO\" style=\"--mid:1\">2<\/span><h3>Analyser les besoins<\/h3><p class=\"sm\">La cible, le contexte culturel du pays, le lieu (salon, magasin, site), les besoins du client.<\/p><\/div>\n<div class=\"card cO\"><span class=\"bign tO\" style=\"--mid:1\">3<\/span><h3>Proposer<\/h3><p class=\"sm\">Une démarche commerciale argumentée : quelle offre, quels arguments, quelle action, quel suivi.<\/p><\/div>\n<\/div>\n<div class=\"card cB\" style=\"gap:6px\"><h3>En préparation : environ 18 minutes<\/h3><ul class=\"sm\"><li>Réponds aux 3 ou 4 consignes avec des mots-clés, pas des phrases entières.<\/li><li>Prépare une introduction de 2 ou 3 phrases que tu sais dire sans hésiter.<\/li><li>Prévois 3 arguments, avec les avantages pour le client.<\/li><li>Anticipe les questions : prix, délai, concurrence, objections.<\/li><\/ul><\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple (situation fictive)<\/p><p class=\"sm\"><i>Situation : stagiaire chez une marque française de cosmétiques bio, tu rencontres un distributeur britannique sur un salon à Londres. Document : la fiche produit d'une crème.<\/i><\/p>\n<p class=\"sm\" lang=\"en\" style=\"margin-top:6px\"><b>Present.<\/b> “I'm doing an internship at a French organic cosmetics brand. Today, I'm meeting a British retailer at a trade fair in London to present our new face cream.”<\/p>\n<p class=\"sm\" lang=\"en\"><b>Analyse.<\/b> “British consumers are increasingly interested in natural and vegan products. The retailer's customers are mostly women aged 25 to 45 who care about ingredients.”<\/p>\n<p class=\"sm\" lang=\"en\"><b>Propose.<\/b> “I would suggest a trial order with a display stand and free samples. We could also offer a 10% discount on the first order and train their staff.”<\/p><\/div>\n<div class=\"card cY\"><h3>Dans le dialogue<\/h3><div class=\"g2 sm\" style=\"gap:4px 18px\"><span>L'examinateur peut jouer le client : réponds-lui comme à un vrai client.<\/span><span>Pose-lui aussi des questions : c'est une <b>interaction<\/b>.<\/span><span>Tu ne comprends pas ? Demande de répéter : c'est valorisé.<\/span><span>Tu cherches un mot ? Contourne-le avec une explication simple.<\/span><\/div><\/div>","x":"b partie b · 20 minutes · en anglais présenter, analyser, proposer 1 présenter la situation : qui tu es (stagiaire, commercial), l'entreprise, le produit, le document. 2 analyser les besoins la cible, le contexte culturel du pays, le lieu (salon, magasin, site), les besoins du client. 3 proposer une démarche commerciale argumentée : quelle offre, quels arguments, quelle action, quel suivi. en préparation : environ 18 minutes réponds aux 3 ou 4 consignes avec des mots-clés, pas des phrases entières. prépare une introduction de 2 ou 3 phrases que tu sais dire sans hésiter. prévois 3 arguments, avec les avantages pour le client. anticipe les questions : prix, délai, concurrence, objections. exemple (situation fictive) situation : stagiaire chez une marque française de cosmétiques bio, tu rencontres un distributeur britannique sur un salon à londres. document : la fiche produit d'une crème. present. “i'm doing an internship at a french organic cosmetics brand. today, i'm meeting a british retailer at a trade fair in london to present our new face cream.” analyse. “british consumers are increasingly interested in natural and vegan products. the retailer's customers are mostly women aged 25 to 45 who care about ingredients.” propose. “i would suggest a trial order with a display stand and free samples. we could also offer a 10% discount on the first order and train their staff.” dans le dialogue l'examinateur peut jouer le client : réponds-lui comme à un vrai client. pose-lui aussi des questions : c'est une interaction . tu ne comprends pas ? demande de répéter : c'est valorisé. tu cherches un mot ? contourne-le avec une explication simple."},{"t":"Les phrases qui sauvent","h":"<p class=\"kick tO\">Phrases toutes prêtes<\/p>\n<h1>Les phrases qui sauvent<\/h1>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Présenter<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I'm going to present…<\/b><br><span class=\"mut\">Je vais présenter…<\/span><\/div><div class=\"def\"><b lang=\"en\">This document is a product leaflet / a web page / a job ad.<\/b><br><span class=\"mut\">Ce document est une fiche produit / une page web / une offre d'emploi.<\/span><\/div><div class=\"def\"><b lang=\"en\">I'm a sales intern at… / I work for…<\/b><br><span class=\"mut\">Je suis stagiaire commercial chez… / Je travaille pour…<\/span><\/div><div class=\"def\"><b lang=\"en\">The aim of this meeting is to…<\/b><br><span class=\"mut\">L'objectif de cet entretien est de…<\/span><\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Structurer<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">First of all… Then… Finally…<\/b><br><span class=\"mut\">Tout d'abord… Ensuite… Enfin…<\/span><\/div><div class=\"def\"><b lang=\"en\">On the one hand… on the other hand…<\/b><br><span class=\"mut\">D'un côté… de l'autre…<\/span><\/div><div class=\"def\"><b lang=\"en\">To sum up… / All in all…<\/b><br><span class=\"mut\">Pour résumer… / En somme…<\/span><\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Gagner du temps, demander<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">Could you repeat that, please?<\/b><br><span class=\"mut\">Pouvez-vous répéter, s'il vous plaît ?<\/span><\/div><div class=\"def\"><b lang=\"en\">Sorry, I didn't catch that.<\/b><br><span class=\"mut\">Pardon, je n'ai pas compris.<\/span><\/div><div class=\"def\"><b lang=\"en\">What do you mean by…?<\/b><br><span class=\"mut\">Qu'entendez-vous par… ?<\/span><\/div><div class=\"def\"><b lang=\"en\">Let me think for a second.<\/b><br><span class=\"mut\">Laissez-moi réfléchir un instant.<\/span><\/div><div class=\"def\"><b lang=\"en\">I don't know the exact word, but it's a kind of…<\/b><br><span class=\"mut\">Je ne connais pas le mot exact, mais c'est une sorte de…<\/span><\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Argumenter, proposer<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I would suggest… / I would recommend…<\/b><br><span class=\"mut\">Je suggérerais… / Je recommanderais…<\/span><\/div><div class=\"def\"><b lang=\"en\">The main advantage is that…<\/b><br><span class=\"mut\">Le principal avantage est que…<\/span><\/div><div class=\"def\"><b lang=\"en\">This product meets your needs because…<\/b><br><span class=\"mut\">Ce produit répond à vos besoins car…<\/span><\/div><div class=\"def\"><b lang=\"en\">We could offer you…<\/b><br><span class=\"mut\">Nous pourrions vous proposer…<\/span><\/div><div class=\"def\"><b lang=\"en\">What's more… / Besides…<\/b><br><span class=\"mut\">De plus… / En outre…<\/span><\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Répondre à une objection<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I understand your point, but…<\/b><br><span class=\"mut\">Je comprends votre point de vue, mais…<\/span><\/div><div class=\"def\"><b lang=\"en\">That's a good question.<\/b><br><span class=\"mut\">C'est une bonne question.<\/span><\/div><div class=\"def\"><b lang=\"en\">It may seem expensive, however…<\/b><br><span class=\"mut\">Cela peut paraître cher, cependant…<\/span><\/div><div class=\"def\"><b lang=\"en\">In fact, it will save you money in the long run.<\/b><br><span class=\"mut\">En fait, cela vous fera économiser à long terme.<\/span><\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Donner son avis, conclure<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">In my opinion… / I think that…<\/b><br><span class=\"mut\">À mon avis… / Je pense que…<\/span><\/div><div class=\"def\"><b lang=\"en\">I agree / I don't agree with you.<\/b><br><span class=\"mut\">Je suis d'accord / pas d'accord avec vous.<\/span><\/div><div class=\"def\"><b lang=\"en\">Shall we arrange a meeting next week?<\/b><br><span class=\"mut\">Pouvons-nous prévoir un rendez-vous la semaine prochaine ?<\/span><\/div><div class=\"def\"><b lang=\"en\">I'll send you a quote by email.<\/b><br><span class=\"mut\">Je vous enverrai un devis par e-mail.<\/span><\/div><\/div><\/div><\/div>\n<\/div>","x":"phrases toutes prêtes les phrases qui sauvent présenter i'm going to present… je vais présenter… this document is a product leaflet / a web page / a job ad. ce document est une fiche produit / une page web / une offre d'emploi. i'm a sales intern at… / i work for… je suis stagiaire commercial chez… / je travaille pour… the aim of this meeting is to… l'objectif de cet entretien est de… structurer first of all… then… finally… tout d'abord… ensuite… enfin… on the one hand… on the other hand… d'un côté… de l'autre… to sum up… / all in all… pour résumer… / en somme… gagner du temps, demander could you repeat that, please? pouvez-vous répéter, s'il vous plaît ? sorry, i didn't catch that. pardon, je n'ai pas compris. what do you mean by…? qu'entendez-vous par… ? let me think for a second. laissez-moi réfléchir un instant. i don't know the exact word, but it's a kind of… je ne connais pas le mot exact, mais c'est une sorte de… argumenter, proposer i would suggest… / i would recommend… je suggérerais… / je recommanderais… the main advantage is that… le principal avantage est que… this product meets your needs because… ce produit répond à vos besoins car… we could offer you… nous pourrions vous proposer… what's more… / besides… de plus… / en outre… répondre à une objection i understand your point, but… je comprends votre point de vue, mais… that's a good question. c'est une bonne question. it may seem expensive, however… cela peut paraître cher, cependant… in fact, it will save you money in the long run. en fait, cela vous fera économiser à long terme. donner son avis, conclure in my opinion… / i think that… à mon avis… / je pense que… i agree / i don't agree with you. je suis d'accord / pas d'accord avec vous. shall we arrange a meeting next week? pouvons-nous prévoir un rendez-vous la semaine prochaine ? i'll send you a quote by email. je vous enverrai un devis par e-mail."},{"t":"Le vocabulaire commercial (1/2)","h":"<p class=\"kick tO\">Vocabulaire<\/p>\n<h1>Le vocabulaire commercial (1/2)<\/h1>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:6px;padding:12px 14px\"><span class=\"tag fB\">L'entreprise et le marché<\/span><table class=\"tb\"><tr><td lang=\"en\">a company, a firm<\/td><td>une entreprise<\/td><\/tr><tr><td lang=\"en\">a head office<\/td><td>un siège social<\/td><\/tr><tr><td lang=\"en\">a branch<\/td><td>une succursale, une agence<\/td><\/tr><tr><td lang=\"en\">a market share<\/td><td>une part de marché<\/td><\/tr><tr><td lang=\"en\">a competitor<\/td><td>un concurrent<\/td><\/tr><tr><td lang=\"en\">a target, to target<\/td><td>une cible, cibler<\/td><\/tr><tr><td lang=\"en\">a customer, a client<\/td><td>un client<\/td><\/tr><tr><td lang=\"en\">a prospect, a lead<\/td><td>un prospect<\/td><\/tr><tr><td lang=\"en\">a supplier<\/td><td>un fournisseur<\/td><\/tr><tr><td lang=\"en\">turnover (UK), revenue<\/td><td>le chiffre d'affaires<\/td><\/tr><tr><td lang=\"en\">profit, margin<\/td><td>le bénéfice, la marge<\/td><\/tr><\/table><\/div><div class=\"card cB\" style=\"gap:6px;padding:12px 14px\"><span class=\"tag fB\">Le marketing<\/span><table class=\"tb\"><tr><td lang=\"en\">a brand<\/td><td>une marque<\/td><\/tr><tr><td lang=\"en\">market research<\/td><td>une étude de marché<\/td><\/tr><tr><td lang=\"en\">a survey<\/td><td>une enquête<\/td><\/tr><tr><td lang=\"en\">advertising, an ad<\/td><td>la publicité, une pub<\/td><\/tr><tr><td lang=\"en\">a campaign<\/td><td>une campagne<\/td><\/tr><tr><td lang=\"en\">a special offer<\/td><td>une offre spéciale<\/td><\/tr><tr><td lang=\"en\">a sample<\/td><td>un échantillon<\/td><\/tr><tr><td lang=\"en\">a leaflet, a brochure<\/td><td>un dépliant, une brochure<\/td><\/tr><\/table><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:6px;padding:12px 14px\"><span class=\"tag fO\">Le produit<\/span><table class=\"tb\"><tr><td lang=\"en\">a product range<\/td><td>une gamme de produits<\/td><\/tr><tr><td lang=\"en\">features<\/td><td>les caractéristiques<\/td><\/tr><tr><td lang=\"en\">benefits<\/td><td>les avantages pour le client<\/td><\/tr><tr><td lang=\"en\">high-quality<\/td><td>de haute qualité<\/td><\/tr><tr><td lang=\"en\">eco-friendly, sustainable<\/td><td>écologique, durable<\/td><\/tr><tr><td lang=\"en\">a warranty, a guarantee<\/td><td>une garantie<\/td><\/tr><tr><td lang=\"en\">in stock / out of stock<\/td><td>en stock / en rupture<\/td><\/tr><tr><td lang=\"en\">a launch, to launch<\/td><td>un lancement, lancer<\/td><\/tr><\/table><\/div><div class=\"card cO\" style=\"gap:6px;padding:12px 14px\"><span class=\"tag fO\">Le prix et le paiement<\/span><table class=\"tb\"><tr><td lang=\"en\">a price list<\/td><td>une liste de prix<\/td><\/tr><tr><td lang=\"en\">a quote, a quotation<\/td><td>un devis<\/td><\/tr><tr><td lang=\"en\">a discount<\/td><td>une remise<\/td><\/tr><tr><td lang=\"en\">VAT<\/td><td>la TVA<\/td><\/tr><tr><td lang=\"en\">an invoice<\/td><td>une facture<\/td><\/tr><tr><td lang=\"en\">payment terms<\/td><td>les conditions de paiement<\/td><\/tr><tr><td lang=\"en\">to pay in advance / on delivery<\/td><td>payer d'avance / à la livraison<\/td><\/tr><tr><td lang=\"en\">affordable / expensive<\/td><td>abordable / cher<\/td><\/tr><tr><td lang=\"en\">value for money<\/td><td>un bon rapport qualité-prix<\/td><\/tr><tr><td lang=\"en\">cost-effective<\/td><td>rentable<\/td><\/tr><\/table><\/div><\/div>\n<\ \">Job advertisement<\/h3><p class=\"sm\">Poste, missions, profil, avantages. Es-tu le bon candidat ? Que vas-tu dire de toi ?<\/p><\/div>\n<\/div>\n<div class=\"card\" style=\"gap:6px\"><h3>La check-list rapide en préparation<\/h3><div class=\"g2 sm\" style=\"gap:4px 18px\"><span><b>Who?<\/b> Qui vend, qui achète, qui est la cible ?<\/span><span><b>What?<\/b> Quel produit ou service ?<\/span><span><b>Where?<\/b> Quel pays, quel lieu de vente ?<\/span><span><b>Why?<\/b> Quel besoin, quel problème à résoudre ?<\/span><span><b>How much?<\/b> Prix, budget, conditions ?<\/span><span><b>What next?<\/b> Quelle action proposer, quel suivi ?<\/span><\/div><\/div>\n<h2>Le contexte culturel : un critère de la partie b<\/h2>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Royaume-Uni<\/span><h3>Les codes<\/h3><div class=\"mini\"><div class=\"def\"><b>Politesse<\/b> · beaucoup de formules : <i lang='en'>please, thank you, would you mind…<\/i><\/div><div class=\"def\"><b>Ton<\/b> · indirect, nuancé, humour ; éviter d'être trop insistant<\/div><div class=\"def\"><b>Ponctualité<\/b> · importante en rendez-vous<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">États-Unis<\/span><h3>Les codes<\/h3><div class=\"mini\"><div class=\"def\"><b>Ton<\/b> · direct, enthousiaste, orienté résultats<\/div><div class=\"def\"><b>Relation<\/b> · prénoms utilisés vite, mais affaires traitées efficacement<\/div><div class=\"def\"><b>Arguments<\/b> · chiffres, bénéfices concrets, service<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Penser « adaptation »<\/h3><p class=\"sm\">Pour un marché étranger, montre que tu adaptes l'offre : langue des supports, unités (<span lang=\"en\">pounds, miles, inches<\/span>), devise (£, $), habitudes d'achat, réglementation, jours fériés et saisons, moyens de paiement préférés.<\/p><\/div>","x":"documents lire un document commercial product leaflet, product page produit, caractéristiques, avantages, prix, cible. questions à te poser : à qui s'adresse-t-il ? quels arguments mettre en avant ? website page image de la marque, offre, ton, appel à l'action. que proposerais-tu pour améliorer la page ou vendre plus ? trade fair brochure dates, lieu, exposants, visiteurs attendus. pourquoi y aller ? comment préparer le stand ? quels contacts viser ? job advertisement poste, missions, profil, avantages. es-tu le bon candidat ? que vas-tu dire de toi ? la check-list rapide en préparation who? qui vend, qui achète, qui est la cible ? what? quel produit ou service ? where? quel pays, quel lieu de vente ? why? quel besoin, quel problème à résoudre ? how much? prix, budget, conditions ? what next? quelle action proposer, quel suivi ? le contexte culturel : un critère de la partie b royaume-uni les codes politesse · beaucoup de formules : please, thank you, would you mind… ton · indirect, nuancé, humour ; éviter d'être trop insistant ponctualité · importante en rendez-vous états-unis les codes ton · direct, enthousiaste, orienté résultats relation · prénoms utilisés vite, mais affaires traitées efficacement arguments · chiffres, bénéfices concrets, service penser « adaptation » pour un marché étranger, montre que tu adaptes l'offre : langue des supports, unités ( pounds, miles, inches ), devise (£, $), habitudes d'achat, réglementation, jours fériés et saisons, moyens de paiement préférés."},{"t":"La grammaire vraiment utile","h":"<p class=\"kick tO\">Grammaire<\/p>\n<h1>La grammaire vraiment utile<\/h1>\n<p class=\"mut\">Pas besoin de tout savoir : maîtrise ces points et ton anglais sera « grammaticalement acceptable ».<\/p>\n<table class=\"tb\"><tr><th>Pour…<\/th><th>Structure<\/th><th>Exemple<\/th><\/tr><tr><td data-label=\"Pour…\">Une habitude, un fait<\/td><td data-label=\"Structure\">présent simple (-s à la 3e personne)<\/td><td data-label=\"Exemple\"><span lang='en'>The company sells organic products.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une action en cours<\/td><td data-label=\"Structure\">be + -ing<\/td><td data-label=\"Exemple\"><span lang='en'>We are launching a new range.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une action passée, datée<\/td><td data-label=\"Structure\">prétérit<\/td><td data-label=\"Exemple\"><span lang='en'>Last year, sales increased by 10%.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Un bilan jusqu'à maintenant<\/td><td data-label=\"Structure\">have + participe passé<\/td><td data-label=\"Exemple\"><span lang='en'>We have opened three new shops since 2024.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une durée<\/td><td data-label=\"Structure\">for (durée) / since (point de départ)<\/td><td data-label=\"Exemple\"><span lang='en'>I have worked here for two months.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Proposer, conseiller<\/td><td data-label=\"Structure\">could, should, would<\/td><td data-label=\"Exemple\"><span lang='en'>You should try our new model.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une condition<\/td><td data-label=\"Structure\">if + présent, will<\/td><td data-label=\"Exemple\"><span lang='en'>If you order today, you will get a discount.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une hypothèse polie<\/td><td data-label=\"Structure\">if + prétérit, would<\/td><td data-label=\"Exemple\"><span lang='en'>If we lowered the price, would you order more?<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Comparer<\/td><td data-label=\"Structure\">-er than / more … than<\/td><td data-label=\"Exemple\"><span lang='en'>It's cheaper and more efficient than the competition.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Le meilleur<\/td><td data-label=\"Structure\">the -est / the most<\/td><td data-label=\"Exemple\"><span lang='en'>It's our best-selling product.<\/span><\/td><\/tr><tr><td data-label=\"Pour…\">Une demande polie<\/td><td data-label=\"Structure\">Could you…? Would you like…?<\/td><td data-label=\"Exemple\"><span lang='en'>Would you like a sample?<\/span><\/td><\/tr><\/table>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><h3>Les questions<\/h3><div class=\"mini\"><div class=\"def\"><b lang=\"en\">What are your needs?<\/b> · Quels sont vos besoins ?<\/div><div class=\"def\"><b lang=\"en\">How many units do you need?<\/b> · Combien d'unités ?<\/div><div class=\"def\"><b lang=\"en\">When do you need it?<\/b> · Pour quand ?<\/div><div class=\"def\"><b lang=\"en\">What is your budget?<\/b> · Quel est votre budget ?<\/div><div class=\"def\"><b lang=\"en\">Who are your customers?<\/b> · Qui sont vos clients ?<\/div><\/div><\/div>\n<div class=\"card cO\"><h3>Les mots invariables<\/h3><p class=\"sm\">Pas de « s » au pluriel : <b lang=\"en\">information, advice, equipment, furniture, feedback, research, news<\/b> (verbe au singulier). Dis <span lang=\"en\">“a piece of advice”<\/span> pour « un conseil ».<\/p><\/div>\n<\/div>","x":"grammaire la grammaire vraiment utile pas besoin de tout savoir : maîtrise ces points et ton anglais sera « grammaticalement acceptable ». pour… structure exemple une habitude, un fait présent simple (-s à la 3e personne) the company sells organic products. une action en cours be + -ing we are launching a new range. une action passée, datée prétérit last year, sales increased by 10%. un bilan jusqu'à maintenant have + participe passé we have opened three new shops since 2024. une durée for (durée) / since (point de départ) i have worked here for two months. proposer, conseiller could, should, would you should try our new model. une condition if + présent, will if you order today, you will get a discount. une hypothèse polie if + prétérit, would if we lowered the price, would you order more? comparer -er than / more … than it's cheaper and more efficient than the competition. le meilleur the -est / the most it's our best-selling product. une demande polie could you…? would you like…? would you like a sample? les questions what are your needs? · quels sont vos besoins ? how many units do you need? · combien d'unités ? when do you need it? · pour quand ? what is your budget? · quel est votre budget ? who are your customers? · qui sont vos clients ? les mots invariables pas de « s » au pluriel : information, advice, equipment, furniture, feedback, research, news (verbe au singulier). dis “a piece of advice” pour « un conseil »."},{"t":"Erreurs, faux amis et prononciation","h":"<p class=\"kick tO\">Pièges<\/p>\n<h1>Erreurs, faux amis et prononciation<\/h1>\n<h2>Les erreurs typiques des francophones<\/h2>\n<table class=\"tb\"><tr><th>À ne pas dire<\/th><th>À dire<\/th><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>I am agree.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>I agree.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>I work here since two months.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>I have worked here for two months.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>It depends of the price.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>It depends on the price.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>Explain me the product.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>Explain the product to me.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>The people is happy.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>The people are happy.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>Some informations.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>Some information.<\/span><\/td><\/tr><tr><td data-label=\"À ne pas dire\"><span lang='en'>He make a good job.<\/span><\/td><td data-label=\"À dire\"><span lang='en'>He does a good job.<\/span><\/td><\/tr><\/table>\n<h2>Les faux amis<\/h2>\n<div class=\"card\"><div class=\"mini\">\n<div class=\"def\"><b lang=\"en\">actually<\/b> · en fait (pas « actuellement » = <span lang=\"en\">currently<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">eventually<\/b> · finalement (pas « éventuellement » = <span lang=\"en\">possibly<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to attend<\/b> · assister à (une réunion)<\/div>\n<div class=\"def\"><b lang=\"en\">to assist<\/b> · aider<\/div>\n<div class=\"def\"><b lang=\"en\">a commercial<\/b> · une publicité télé (un commercial = <span lang=\"en\">a sales rep<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a location<\/b> · un emplacement (une location = <span lang=\"en\">a rental<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">sensible<\/b> · raisonnable (sensible = <span lang=\"en\">sensitive<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to control<\/b> · maîtriser (contrôler = <span lang=\"en\">to check<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">an agenda<\/b> · un ordre du jour (un agenda = <span lang=\"en\">a diary, a planner<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a formation<\/b> · une formation… militaire ! (= <span lang=\"en\">training<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a stage<\/b> · une étape, une scène (un stage = <span lang=\"en\">an internship<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to achieve<\/b> · réussir, atteindre (achever = <span lang=\"en\">to finish<\/span>)<\/div>\n<\/div><\/div>\n<h2>La prononciation<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>Le « th »<\/h3><p class=\"sm\">La langue entre les dents : <span lang=\"en\"><b>think, three, the, this<\/b><\/span>. Pas « sink » ni « ze ».<\/p><\/div>\n<div class=\"card cB\"><h3>Le « h »<\/h3><p class=\"sm\">Il se souffle : <span lang=\"en\"><b>happy, hotel, help, how<\/b><\/span>.<\/p><\/div>\n<div class=\"card cB\"><h3>Le « -ed »<\/h3><p class=\"sm\">[t] <span lang=\"en\">worked<\/span> · [d] <span lang=\"en\">opened<\/span> · [id] seulement après t ou d : <span lang=\"en\">wanted, needed<\/span>.<\/p><\/di
