,"Rentable","Efficace mais cher","Gratuit"],"a":1,"e":"Ex. : a cost-effective solution."},{"id":"e2q50","q":"« A sales rep » est…","o":["Un rapport de ventes","Un commercial","Une répétition","Une réduction"],"a":1,"e":"Sales representative. Piège : a commercial = une pub télé."},{"id":"e2q51","q":"« To close a deal » signifie…","o":["Fermer un magasin","Conclure une vente, une affaire","Annuler un contrat","Perdre un client"],"a":1,"e":"A deal = un accord, une affaire."},{"id":"e2q52","q":"« To place an order » signifie…","o":["Ranger une commande","Passer commande","Annuler une commande","Livrer une commande"],"a":1,"e":"An order = une commande."},{"id":"e2q53","q":"« A trial order » est…","o":["Une commande d'essai","Un procès","Une commande annulée","Une commande en retard"],"a":0,"e":"Idéal pour un premier client hésitant."},{"id":"e2q54","q":"« To meet someone's needs » signifie…","o":["Rencontrer quelqu'un","Répondre aux besoins de quelqu'un","Avoir besoin de quelqu'un","Fixer un rendez-vous"],"a":1,"e":"This product meets your needs because…"},{"id":"e2q55","q":"« To ship » signifie…","o":["Naviguer","Expédier","Acheter","Emballer"],"a":1,"e":"Shipping costs = frais de port."},{"id":"e2q56","q":"« To apologise » signifie…","o":["Se plaindre","S'excuser","Rembourser","Remplacer"],"a":1,"e":"To complain = se plaindre."},{"id":"e2q57","q":"« After-sales service » est…","o":["Le service des ventes","Le service après-vente","Le service client avant achat","Les soldes"],"a":1,"e":"SAV."},{"id":"e2q58","q":"« A loyalty programme » est…","o":["Un programme de fidélité","Un programme royal","Un contrat de travail","Une émission de télé"],"a":0,"e":"Customer loyalty = fidélité client."},{"id":"e2q59","q":"« Feedback » ou « a review » est…","o":["Un retour, un avis","Une facture","Une plainte officielle","Un remboursement"],"a":0,"e":"Online reviews = avis en ligne."},{"id":"e2q60","q":"« An exhibitor » sur un salon est…","o":["Un visiteur","Un exposant","Un organisateur","Un vigile"],"a":1,"e":"A visitor = un visiteur."},{"id":"e2q61","q":"« The checkout » sur un site, c'est…","o":["La page d'accueil","Le passage en caisse","La sortie du site","Le contrôle qualité"],"a":1,"e":"The shopping cart = le panier."},{"id":"e2q62","q":"« Followers » sur les réseaux sociaux, ce sont…","o":["Des suiveurs de mode","Des abonnés","Des concurrents","Des influenceurs"],"a":1,"e":"A post, to post = une publication, publier."},{"id":"e2q63","q":"« Personal data » signifie…","o":["Un agenda personnel","Les données personnelles","Une date personnelle","Un dossier médical"],"a":1,"e":"Le RGPD se dit GDPR en anglais."},{"id":"e2q64","q":"« Shelf space » est…","o":["Un espace de stockage","L'espace en rayon","Un espace vide","Une étagère de bureau"],"a":1,"e":"Notion clé en grande distribution."},{"id":"e2q65","q":"« A franchisee » est…","o":["Un franchiseur","Un franchisé","Une franchise d'assurance","Un client fidèle"],"a":1,"e":"The franchisor = le franchiseur."},{"id":"e2q66","q":"« To apply for a job » signifie…","o":["Appliquer un emploi","Postuler à un emploi","Quitter un emploi","Créer un emploi"],"a":1,"e":"A job ad = une offre d'emploi."},{"id":"e2q67","q":"« Skills » signifie…","o":["Les compétences","Les erreurs","Les salaires","Les diplômes"],"a":0,"e":"Teamwork = le travail d'équipe."},{"id":"e2q68","q":"« Part-time » signifie…","o":["À temps plein","À temps partiel","En intérim","En stage"],"a":1,"e":"Full-time = à temps plein."},{"id":"e2q69","q":"« A two-year degree in sales and customer relations » décrit…","o":["Un master","Ton BTS NDRC","Un CAP","Un doctorat"],"a":1,"e":"Phrase utile pour te présenter."},{"id":"e2q70","q":"« However » signifie…","o":["Comment","Cependant","Donc","Bien que"],"a":1,"e":"Yet = cependant aussi."},{"id":"e2q71","q":"« Whereas » signifie…","o":["Où","Alors que","Donc","Ainsi"],"a":1,"e":"While peut aussi signifier « alors que »."},{"id":"e2q72","q":"« Therefore » signifie…","o":["Pourtant","Donc","Avant","Pour toujours"],"a":1,"e":"Thus = donc aussi."},{"id":"e2q73","q":"« Unless » signifie…","o":["Moins","À moins que","Sans","Pourtant"],"a":1,"e":"Ex. : unless you order today…"},{"id":"e2q74","q":"« Although » signifie…","o":["Aussi","Bien que","Toujours","Ainsi"],"a":1,"e":"Connecteur de concession."},{"id":"e2q75","q":"En anglais, « 1,500 » se lit…","o":["Un virgule cinq","Mille cinq cents","Quinze","Cent cinquante"],"a":1,"e":"La virgule sépare les milliers ; le point sert aux décimales (2.5 = 2,5)."},{"id":"e2q76","q":"« A billion » signifie…","o":["Un billion","Un milliard","Un million","Mille"],"a":1,"e":"Piège classique."},{"id":"e2q77","q":"« To double » signifie…","o":["Doubler","Douter","Diviser","Dupliquer un fichier"],"a":0,"e":"A 10% increase = une hausse de 10 %."},{"id":"e2q78","q":"Dans la Partie A, il faut…","o":["Traduire le texte ligne par ligne","Résumer de façon structurée, avec les chiffres","Donner son avis","Lire ses notes mot à mot"],"a":1,"e":"Résumer, pas traduire ; regarder l'examinateur."},{"id":"e2q79","q":"Dans la Partie B, les 3 temps sont…","o":["Present, analyse, propose","Read, translate, answer","Hello, price, goodbye","Listen, repeat, conclude"],"a":0,"e":"Présenter la situation, analyser les besoins, proposer une démarche."},{"id":"e2q80","q":"Tu n'as pas compris l'examinateur. Que dire ?","o":["Nothing","Sorry, I didn't catch that. Could you repeat, please?","Speak French!","I am agree"],"a":1,"e":"Demander de répéter est valorisé : c'est de la communication."},{"id":"e2q81","q":"Tu cherches un mot. Que dire ?","o":["Abandonner","I don't know the exact word, but it's a kind of…","Passer au français","Rester silencieux"],"a":1,"e":"Contourner avec une explication simple."},{"id":"e2q82","q":"« I would suggest… » sert à…","o":["Refuser","Proposer, recommander","S'excuser","Se présenter"],"a":1,"e":"Ou I would recommend…"},{"id":"e2q83","q":"Pour répondre poliment à une objection, on dit…","o":["You're wrong.","I understand your point, but…","No way.","That's stupid."],"a":1,"e":"Puis argumenter : it may seem expensive, however…"},{"id":"e2q84","q":"« Shall we arrange a meeting next week? » sert à…","o":["Annuler un rendez-vous","Proposer un rendez-vous pour conclure","Se plaindre","Demander un prix"],"a":1,"e":"Bonne façon de conclure par une suite concrète."},{"id":"e2q85","q":"« To sum up… » signifie…","o":["Pour additionner","Pour résumer","Pour commencer","Pour comparer"],"a":1,"e":"All in all = en somme."},{"id":"e2q86","q":"Au Royaume-Uni, le ton des affaires est plutôt…","o":["Direct et insistant","Indirect, poli et nuancé, avec de l'humour","Très familier","Agressif"],"a":1,"e":"Beaucoup de formules : please, would you mind…"},{"id":"e2q87","q":"Aux États-Unis, il faut plutôt des arguments…","o":["Vagues","Chiffrés et concrets, orientés résultats","Historiques","Uniquement émotionnels"],"a":1,"e":"Ton direct, enthousiaste ; prénoms utilisés vite."},{"id":"e2q88","q":"Adapter une offre à un marché étranger, c'est notamment adapter…","o":["Rien","La langue, les unités, la devise, les habitudes d'achat et la réglementation","Seulement le prix","Seulement le logo"],"a":1,"e":"Pounds, miles, inches, £, $, jours fériés, moyens de paiement…"},{"id":"e2q89","q":"Pour une habitude ou un fait présent, on utilise…","o":["Le présent simple","Le prétérit","Be + -ing","Le futur"],"a":0,"e":"The company sells organic products (-s à la 3e personne)."},{"id":"e2q90","q":"« Last year, sales ___ by 10%. »","o":["increase","increased","have increased","are increasing"],"a":1,"e":"Action passée et datée : prétérit."},{"id":"e2q91","q":"« We ___ three new shops since 2024. »","o":["opened","have opened","open","are opening"],"a":1,"e":"Bilan jusqu'à maintenant avec since : present perfect."},{"id":"e2q92","q":"« If we lowered the price, ___ you order more? »","o":["will","would","do","did"],"a":1,"e":"Hypothèse polie : if + prétérit, would."},{"id":"e2q93","q":"« It's our ___ product. » (good, superlatif)","o":["goodest","best-selling","more good","better"],"a":1,"e":"Le superlatif de good est best."},{"id":"e2q94","q":"Quelle forme est correcte pour « des informations » ?","o":["Some informations","Some information","An information","Informations"],"a":1,"e":"Information, advice, equipment, feedback, news : indénombrables."},{"id":"e2q95","q":"« The news ___ good. »","o":["are","is","were","be"],"a":1,"e":"News est singulier en anglais."},{"id":"e2q96","q":"Comment dire « expliquez-moi le produit » ?","o":["Explain me the product.","Explain the product to me.","Explain to me product.","Me explain the product."],"a":1,"e":"Explain something to someone."},{"id":"e2q97","q":"Comment dire « les gens sont contents » ?","o":["The people is happy.","The people are happy.","The peoples is happy.","The people be happy."],"a":1,"e":"People est pluriel."},{"id":"e2q98","q":"Comment dire « il fait du bon travail » ?","o":["He make a good job.","He does a good job.","He makes a good job.","He do a good job."],"a":1,"e":"To do a good job."},{"id":"e2q99","q":"« Currently » signifie…","o":["Couramment","Actuellement","En fait","Correctement"],"a":1,"e":"Actually = en fait (faux ami)."},{"id":"e2q100","q":"« To assist » signifie…","o":["Assister à une réunion","Aider","Insister","Assurer"],"a":1,"e":"Assister à = to attend."},{"id":"e2q101","q":"« An agenda » en anglais est…","o":["Un carnet de rendez-vous","Un ordre du jour","Un calendrier mural","Une adresse"],"a":1,"e":"Un agenda (carnet) = a diary, a planner."},{"id":"e2q102","q":"Comment dit-on « une formation » professionnelle ?","o":["A formation","Training","A course of formation","A stage"],"a":1,"e":"A formation = une formation… militaire."},{"id":"e2q103","q":"« To control » en anglais signifie surtout…","o":["Contrôler, vérifier","Maîtriser","Punir","Compter"],"a":1,"e":"Contrôler (vérifier) = to check."},{"id":"e2q104","q":"Comment se prononce le -ed de « wanted » ?","o":["[t]","[d]","[id]","Muet"],"a":2,"e":"[id] seulement après t ou d : wanted, needed. Worked [t], opened [d]."},{"id":"e2q105","q":"Comment se prononce le « th » de « think » ?","o":["Comme « s »","Langue entre les dents","Comme « z »","Comme « t »"],"a":1,"e":"Pas « sink » ni « ze »."},{"id":"e2q106","q":"Pendant la Partie B, l'examinateur joue le client. Il faut…","o":["Réciter son texte","Interagir : lui répondre et lui poser des questions","Parler sans le regarder","Attendre qu'il pose toutes les questions"],"a":1,"e":"L'interaction est un critère de la grille."}],"r":[{"id":"e2r0","q":"Présente-toi en anglais en deux phrases : ta formation et ton stage.","p":[{"t":"I'm… / I am…","k":["i'm","i am"]},{"t":"Ta formation","k":["study","studying","degree","student","bts"]},{"t":"Ton stage","k":["internship","intern","work for","working for"]}],"m":"« I'm studying for a two-year degree in sales and customer relations. I'm doing an internship at a sports equipment shop, where I advise customers and organise events. »"},{"id":"e2r1","q":"Comment dis-tu en anglais : « Pouvez-vous répéter, s'il vous plaît ? »","p":[{"t":"Could you / Can you","k":["could you","can you"]},{"t":"Repeat","k":["repeat","say that again"]},{"t":"Please","k":["please"]}],"m":"« Could you repeat that, please? » (ou « Sorry, I didn't catch that. »)"},{"id":"e2r2","q":"Traduis : « Nous pourrions vous proposer une remise de 10 % sur votre première commande. »","p":[{"t":"We could","k":["we could"]},{"t":"Offer","k":["offer"]},{"t":"A discount","k":["discount"]},{"t":"Your first order","k":["first order"]}],"m":"« We could offer you a 10% discount on your first order. »"},{"id":"e2r3","q":"Le client dit : « It's too expensive. » Réponds-lui en anglais.","p":[{"t":"Montrer que tu comprends","k":["understand","i see","good point"]},{"t":"Nuancer : but / however","k":["but","however"]},{"t":"Un argument : qualité, économies","k":["quality","save","long run","value","last","warranty"]}],"m":"« I understand your point. However, this product is high-quality and comes with a 5-year warranty, so it will save you money in the long run. »"},{"id":"e2r4","q":"Traduis : « Je vous enverrai un devis par e-mail. »","p":[{"t":"I will / I'll","k":["i will","i'll"]},{"t":"Send you","k":["send"]},{"t":"A quote","k":["quote","quotation"]},{"t":"By email","k":["email","e-mail"]}],"m":"« I'll send you a quote by email. »"},{"id":"e2r5","q":"Corrige cette phrase : « I am agree with you, it depends of the price. »","p":[{"t":"I agree (sans am)","k":["i agree"]},{"t":"It depends on","k":["depends on"]}],"m":"« I agree with you, it depends on the price. »"},{"id":"e2r6","q":"Traduis : « Ce produit est plus léger et moins cher que celui de nos concurrents. »","p":[{"t":"Lighter","k":["lighter"]},{"t":"Cheaper / less expensive","k":["cheaper","less expensive"]},{"t":"Than","k":["than"]},{"t":"Competitors","k":["competitor"]}],"m":"« This product is lighter and cheaper than our competitors' (products). »"},{"id":"e2r7","q":"Traduis : « Je travaille ici depuis deux mois. »","p":[{"t":"Present perfect : I have worked / I've been working","k":["have worked","'ve worked","have been working","'ve been working"]},{"t":"For two months","k":["for two months","for 2 months"]}],"m":"« I have worked here for two months. » (ou « I've been working here for two months. ») On utilise for avec une durée, et le present perfect, pas le présent."}],"cs":[{"id":"e2c0","t":"Trade fair in Berlin","x":["You are a sales intern at OléoBio, a French company selling organic olive oil. You are on the company's stand at a food trade fair in Berlin.","A German retailer, Ms Weber, stops at the stand. She runs 6 organic shops and is looking for a new olive oil supplier. She thinks French products are expensive.","Product sheet: 50 cl bottle, organic certified, cold-pressed, 9.90 € retail price, 10% discount on a first order of 300 bottles or more."],"q":[{"id":"e2c0q0","q":"Introduce yourself and your company to Ms Weber (2 or 3 sentences, in English).","p":[{"t":"Greeting and presentation","k":["hello","good morning","good afternoon","i'm","i am","my name"]},{"t":"Your role and company","k":["intern","work for","oleobio","company"]},{"t":"The product","k":["olive oil","organic"]}],"m":"Good morning, welcome to our stand! My name is Léa, I'm a sales intern at OléoBio, a French company that produces organic olive oil. May I show you our new cold-pressed oil?"},{"id":"e2c0q1","q":"Ms Weber says: “French products are too expensive.” Answer her objection in English.","p":[{"t":"Acknowledge the objection","k":["understand","i see","good point","that's true"]},{"t":"Argument: quality / value for money","k":["quality","value for money","organic","cold-pressed","certified"]},{"t":"Offer: 10% discount on a first order","k":["10%","10 %","discount","first order","300"]}],"m":"I understand your point. However, our oil is certified organic and cold-pressed, so your customers get premium quality: it's real value for money. What's more, we offer a 10% discount on a first order of 300 bottles or more."},{"id":"e2c0q2","q":"Propose the next step to close the conversation (in English).","p":[{"t":"Suggest a trial order or samples","k":["trial order","samples","sample","test"]},{"t":"Follow-up: send a quote / arrange a meeting","k":["quote","send you","meeting","call","email"]},{"t":"Polite closing","k":["thank you","thanks","pleasure","look forward"]}],"m":"Would you like to try some samples in two of your shops? I'll send you a quote by email for a trial order of 300 bottles. Shall we arrange a call next week? Thank you very much for your visit, I look forward to working with you."}]},{"id":"e2c1","t":"Article summary: buy now, pay later","x":["Article (written for the exercise): “Buy now, pay later (BNPL) services let shoppers split a purchase into three or four payments. In Europe, their use has doubled in five years, especially among people under 30.”","“However, consumer groups warn that 1 in 5 young users has missed a payment. From November 2026, new EU rules treat these services as consumer credit, with stricter checks before granting them.”","“Retailers say BNPL increases the average basket by up to 30%.”"],"q":[{"id":"e2c1q0","q":"Partie A, en français : présente l'article et son idée principale.","p":[{"t":"Présentation : un article sur le paiement fractionné","k":["article","paiement","fraction","plusieurs fois","bnpl","3 ou 4"]},{"t":"Idée principale : succès mais risques, d'où un encadrement","k":["succes","double","risque","encadre","regles","credit"]}],"m":"Il s'agit d'un article sur le paiement fractionné (« achetez maintenant, payez plus tard »), qui permet de régler un achat en 3 ou 4 fois. L'auteur montre que ce service connaît un grand succès en Europe, mais qu'il comporte des risques, ce qui conduit l'Union européenne à mieux l'encadrer."},{"id":"e2c1q1","q":"Partie A : donne les détails chiffrés importants, en français.","p":[{"t":"Usage doublé en 5 ans, surtout chez les moins de 30 ans","k":["double","5 ans","cinq ans","30 ans"]},{"t":"1 jeune utilisateur sur 5 a manqué un paiement","k":["1 sur 5","un sur cinq","20 %","20%"]},{"t":"Panier moyen jusqu'à + 30 % ; règles de crédit dès novembre 2026","k":["30 %","30%","panier","novembre 2026","credit"]}],"m":"Son utilisation a doublé en cinq ans, surtout chez les moins de 30 ans. Mais un jeune utilisateur sur cinq a déjà manqué un paiement. Depuis novembre 2026, ces services sont traités comme du crédit à la consommation, avec des vérifications plus strictes. Les commerçants, eux, y voient un moyen d'augmenter le panier moyen jusqu'à 30 %."},{"id":"e2c1q2","q":"Translate into English: « Le principal avantage pour le commerçant est l'augmentation du panier moyen. »","p":[{"t":"The main advantage","k":["main advantage","main benefit"]},{"t":"for the retailer","k":["retailer","shop","merchant","seller"]},{"t":"the increase in the average basket","k":["average basket","average order","increase"]}],"m":"The main advantage for the retailer is the increase in the average basket."}]},{"id":"e2c2","t":"Job interview for a sales assistant","x":["Job ad: “SportZone UK is looking for a bilingual sales assistant for its new store in Brighton. Customer service skills, teamwork, French and English required. Part-time, 25 hours a week.”","You studied for a two-year degree in sales and did an internship in a sports shop in Lyon."],"q":[{"id":"e2c2q0","q":"Present your training and experience in English.","p":[{"t":"Your training: two-year degree in sales","k":["two-year degree","degree","studying","sales and customer","bts"]},{"t":"Your internship: sports shop in Lyon","k":["internship","sports shop","lyon"]},{"t":"Use the right tense (present perfect or past)","k":["i have","i've","i did","i worked","i was"]}],"m":"I'm studying for a two-year degree in sales and customer relations. Last year, I did an internship in a sports shop in Lyon, where I advised customers and managed the shelves."},{"id":"e2c2q1","q":"Explain why you are a good candidate (2 qualities, in English).","p":[{"t":"A quality linked to customer service","k":["customer service","friendly","listen","advise","smile","patient"]},{"t":"A quality linked to teamwork","k":["teamwork","team","colleagues"]},{"t":"Languages: bilingual French and English","k":["bilingual","french","english","languages"]}],"m":"I'm a good candidate because I love customer service: I listen carefully and give good advice. I'm also used to teamwork thanks to my internship. And I speak French and English, which is useful in Brighton, where there are many French tourists."},{"id":"e2c2q2","q":"Ask the recruiter one question about the job, in English.","p":[{"t":"A correct question form","k":["could you","can you","what","when","how","would","?"]},{"t":"About the job (schedule, training, start date…)","k":["schedule","hours","training","start","team","weekend"]}],"m":"Could you tell me what the working hours are, and whether there is training at the beginning?"}]}]},{"k":"cejm","n":"CEJM","s":"E3 · Éco, droit, management","c":"#16182B","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Épreuve E3<\/span>\n<div style=\"display:flex;align-items:flex-end;gap:18px\">\n<div style=\"font-weight:800;--big:1;color:#16182B\">CEJM<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:10px\">\n<span class=\"tag fB\">Économie<\/span><span class=\"tag fP\">Droit<\/span><span class=\"tag fG\">Management<\/span>\n<\/div><\/div>\n<p><b>Culture économique, juridique et managériale<\/b> : tout le programme des deux années, la méthode pour chaque type de question et les repères à connaître par cœur.<\/p>\n<\/div>\n<h2>L'épreuve en un coup d'œil<\/h2>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">4 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">écrit, sans matériel<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">en BTS NDRC<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">missions, en général<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">≈ 10<\/span><span class=\"sm\" style=\"color:#D6D8E6\">questions au total<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>Ce que contient le sujet<\/h3><ul class=\"sm\"><li>Une <b>entreprise<\/b> présentée en introduction (le contexte).<\/li><li>Des <b>missions<\/b>, chacune avec ses questions.<\/li><li>Un <b>dossier documentaire<\/b> : articles, graphiques, extraits de loi, contrats, décisions de justice, organigrammes…<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Ce qu'on attend<\/h3><ul class=\"sm\"><li>Une réponse <b>construite et argumentée<\/b> à chaque question.<\/li><li>Les <b>trois champs<\/b> sont toujours couverts.<\/li><li>Toujours <b>relier<\/b> la réponse à l'entreprise du sujet.<\/li><\/ul><\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<p class=\"kick mut\">Exemple de répartition (session 2020, sur 40 points)<\/p>\n<div class=\"bar\" style=\"display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;color:#FFFFFF\">\n<div class=\"fB\" style=\"flex:12;display:flex;align-items:center;padding-left:14px\">Économie · 12 pts<\/div>\n<div class=\"fP\" style=\"flex:13;display:flex;align-items:center;padding-left:14px\">Droit · 13 pts<\/div>\n<div class=\"fG\" style=\"flex:15;display:flex;align-items:center;padding-left:14px\">Management · 15 pts<\/div>\n<\/div>\n<p class=\"sm mut\">Les trois matières pèsent à peu près autant : aucune ne peut être sacrifiée.<\/p>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le programme en une page<\/span><span><b>08<\/b> · Thème 3 (2/2) : risques, ressources, financement<\/span>\n<span><b>03<\/b> · Méthode générale et minutage<\/span><span><b>09<\/b> · Thème 4 : le numérique<\/span>\n<span><b>04<\/b> · Méthode par type de question<\/span><span><b>10<\/b> · Thème 5 : les mutations du travail<\/span>\n<span><b>05<\/b> · Thème 1 : l'entreprise et son environnement<\/span><span><b>11<\/b> · Thème 6 : les choix stratégiques<\/span>\n<span><b>06<\/b> · Thème 2 : la régulation<\/span><span><b>12<\/b> · Notions complémentaires<\/span>\n<span><b>07<\/b> · Thème 3 (1/2) : production, structures<\/span><span><b>13–15<\/b> · Auteurs, repères juridiques, jour J<\/span>\n<\/div>","x":"fiche de révision · épreuve e3 cejm économie droit management culture économique, juridique et managériale : tout le programme des deux années, la méthode pour chaque type de question et les repères à connaître par cœur. l'épreuve en un coup d'œil 4 h écrit, sans matériel coef. 3 en bts ndrc 3 missions, en général ≈ 10 questions au total ce que contient le sujet une entreprise présentée en introduction (le contexte). des missions , chacune avec ses questions. un dossier documentaire : articles, graphiques, extraits de loi, contrats, décisions de justice, organigrammes… ce qu'on attend une réponse construite et argumentée à chaque question. les trois champs sont toujours couverts. toujours relier la réponse à l'entreprise du sujet. exemple de répartition (session 2020, sur 40 points) économie · 12 pts droit · 13 pts management · 15 pts les trois matières pèsent à peu près autant : aucune ne peut être sacrifiée. 02 · le programme en une page 08 · thème 3 (2/2) : risques, ressources, financement 03 · méthode générale et minutage 09 · thème 4 : le numérique 04 · méthode par type de question 10 · thème 5 : les mutations du travail 05 · thème 1 : l'entreprise et son environnement 11 · thème 6 : les choix stratégiques 06 · thème 2 : la régulation 12 · notions complémentaires 07 · thème 3 (1/2) : production, structures 13–15 · auteurs, repères juridiques, jour j"},{"t":"6 thèmes, 18 questions","h":"<p class=\"kick tO\">Le programme<\/p>\n<h1>6 thèmes, 18 questions<\/h1>\n<p class=\"mut\">La 1re année pose le cadre (thèmes 1 à 3), la 2e année étudie les évolutions (thèmes 4 à 6). À l'examen, <b>tout le programme<\/b> peut tomber.<\/p>\n<div class=\"row\" style=\"gap:16px\"><span class=\"leg\"><span class=\"dot fB\"><\/span>Économie<\/span><span class=\"leg\"><span class=\"dot fP\"><\/span>Droit<\/span><span class=\"leg\"><span class=\"dot fG\"><\/span>Management<\/span><\/div>\n<div class=\"g2\" style=\"gap:10px\"><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">1<\/span><div><p class=\"kick mut\">1re année<\/p><h3>L'intégration de l'entreprise dans son environnement<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment s'établissent les relations entre l'entreprise et son environnement économique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les contrats sécurisent-ils les relations entre l'entreprise et ses partenaires ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>De quelle manière l'entreprise s'inscrit-elle dans son environnement ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">2<\/span><div><p class=\"kick mut\">1re année<\/p><h3>La régulation de l'activité économique<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel est le rôle de l'État dans la régulation économique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les activités économiques sont-elles régulées par le droit ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment l'entreprise intègre-t-elle la connaissance de son environnement dans sa prise de décision ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">3<\/span><div><p class=\"kick mut\">1re année<\/p><h3>L'organisation de l'activité de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les facteurs économiques déterminent-ils les choix de production ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment choisir une structure juridique pour l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelles réponses le droit apporte-t-il face aux risques auxquels s'expose l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment l'entreprise organise-t-elle ses ressources ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel financement pour l'entreprise ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">4<\/span><div><p class=\"kick mut\">2e année<\/p><h3>L'impact du numérique sur la vie de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le numérique transforme-t-il l'environnement des entreprises ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Dans quelle mesure le droit répond-il aux questions posées par le développement du numérique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelle est l'incidence du numérique sur le management ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">5<\/span><div><p class=\"kick mut\">2e année<\/p><h3>Les mutations du travail<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelles sont les principales évolutions du marché du travail ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le droit prend-il en considération les besoins des entreprises et des salariés ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel est l'impact des mutations du travail sur l'emploi et les conditions de travail ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"--mid:1\">6<\/span><div><p class=\"kick mut\">2e année<\/p><h3>Les choix stratégiques de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le diagnostic éclaire-t-il les choix stratégiques de l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quels sont les choix stratégiques opérés par l'entreprise ?<\/span><\/div><\/div><\/div><\/div>","x":"le programme 6 thèmes, 18 questions la 1re année pose le cadre (thèmes 1 à 3), la 2e année étudie les évolutions (thèmes 4 à 6). à l'examen, tout le programme peut tomber. économie droit management 1 1re année l'intégration de l'entreprise dans son environnement comment s'établissent les relations entre l'entreprise et son environnement économique ? comment les contrats sécurisent-ils les relations entre l'entreprise et ses partenaires ? de quelle manière l'entreprise s'inscrit-elle dans son environnement ? 2 1re année la régulation de l'activité économique quel est le rôle de l'état dans la régulation économique ? comment les activités économiques sont-elles régulées par le droit ? comment l'entreprise intègre-t-elle la connaissance de son environnement dans sa prise de décision ? 3 1re année l'organisation de l'activité de l'entreprise comment les facteurs économiques déterminent-ils les choix de production ? comment choisir une structure juridique pour l'entreprise ? quelles réponses le droit apporte-t-il face aux risques auxquels s'expose l'entreprise ? comment l'entreprise organise-t-elle ses ressources ? quel financement pour l'entreprise ? 4 2e année l'impact du numérique sur la vie de l'entreprise comment le numérique transforme-t-il l'environnement des entreprises ? dans quelle mesure le droit répond-il aux questions posées par le développement du numérique ? quelle est l'incidence du numérique sur le management ? 5 2e année les mutations du travail quelles sont les principales évolutions du marché du travail ? comment le droit prend-il en considération les besoins des entreprises et des salariés ? quel est l'impact des mutations du travail sur l'emploi et les conditions de travail ? 6 2e année les choix stratégiques de l'entreprise comment le diagnostic éclaire-t-il les choix stratégiques de l'entreprise ? quels sont les choix stratégiques opérés par l'entreprise ?"},{"t":"La méthode générale","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>La méthode générale<\/h1>\n<div class=\"card dark\" style=\"padding:18px 20px\"><p class=\"kick\" style=\"color:#FFB79A\">La règle d'or<\/p><p class=\"quote\">Toujours contextualiser : relier chaque réponse à l'entreprise du sujet. Une réponse juste mais « hors contexte » ne rapporte qu'environ un tiers des points.<\/p><p class=\"sm\" style=\"color:#D6D8E6\">Source : retours officiels de correction (académie de Besançon, session 2020).<\/p><\/div>\n<h2>Le minutage conseillé<\/h2>\n<div class=\"bar\" style=\"display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;color:#FFFFFF\">\n<div style=\"flex:25;display:flex;align-items:center;padding-left:12px;background:#16182B\">Lecture · 25 min<\/div>\n<div class=\"fB\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 1 · 1 h<\/div>\n<div class=\"fP\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 2 · 1 h<\/div>\n<div class=\"fG\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 3 · 1 h<\/div>\n<div class=\"fO\" style=\"flex:15;display:flex;align-items:center;justify-content:center;color:#16182B\">Relire<\/div>\n<\/div>\n<p class=\"sm mut\">Adapte le temps aux points : une question à 4 points mérite deux fois plus de lignes qu'une question à 2 points.<\/p>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tO\">1<\/span><b>Lire le contexte<\/b><span>Activité, taille, forme juridique, marché, dirigeant, problème posé. Surligne ce qui servira.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">2<\/span><b>Lire les questions<\/b><span>Repère le champ (éco, droit, management) et le verbe de consigne de chacune.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">3<\/span><b>Repérer les annexes<\/b><span>Note en marge quelle annexe sert à quelle question.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">4<\/span><b>Rédiger<\/b><span>Phrases complètes, une idée par paragraphe, une notion du cours par idée.<\/span><\/div>\n<\/div>\n<h2>Les verbes de consigne<\/h2>\n<table class=\"tb\">\n<tr><th>Consigne<\/th><th>Ce qu'il faut faire<\/th><\/tr>\n<tr><td data-label=\"Consigne\">Identifier, repérer<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Nommer avec le bon vocabulaire, en citant l'annexe ou le contexte. Court mais précis.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">Caractériser<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Décrire les traits essentiels d'une situation à l'aide des notions du cours.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">Analyser, montrer, expliquer<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Décomposer et expliquer le « pourquoi » et le « comment » : notion, preuve tirée du dossier, effet sur l'entreprise.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">Justifier, argumenter<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Donner des arguments appuyés sur le dossier et le cours, puis conclure.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">Vérifier, évaluer, apprécier<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Peser les éléments pour et contre, puis trancher clairement.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">Proposer, préconiser<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Une solution concrète, réaliste pour cette entreprise, et justifiée.<\/td><\/tr>\n<tr><td data-label=\"Consigne\">« À l'aide d'un raisonnement juridique »<\/td><td data-label=\"Ce qu&#x27;il faut faire\">Méthode en 4 temps : voir page 04.<\/td><\/tr>\n<\/table>\n<div class=\"card cY\"><h3>Les auteurs : un bonus, pas une obligation<\/h3><p class=\"sm\">Le jury ne sanctionne pas l'absence d'auteur ou de théorie. Mais un auteur bien placé (Porter, Mintzberg, Herzberg…) montre que tu maîtrises le cours : vois la page 13.<\/p><\/div>","x":"méthode la méthode générale la règle d'or toujours contextualiser : relier chaque réponse à l'entreprise du sujet. une réponse juste mais « hors contexte » ne rapporte qu'environ un tiers des points. source : retours officiels de correction (académie de besançon, session 2020). le minutage conseillé lecture · 25 min mission 1 · 1 h mission 2 · 1 h mission 3 · 1 h relire adapte le temps aux points : une question à 4 points mérite deux fois plus de lignes qu'une question à 2 points. 1 lire le contexte activité, taille, forme juridique, marché, dirigeant, problème posé. surligne ce qui servira. 2 lire les questions repère le champ (éco, droit, management) et le verbe de consigne de chacune. 3 repérer les annexes note en marge quelle annexe sert à quelle question. 4 rédiger phrases complètes, une idée par paragraphe, une notion du cours par idée. les verbes de consigne consigne ce qu'il faut faire identifier, repérer nommer avec le bon vocabulaire, en citant l'annexe ou le contexte. court mais précis. caractériser décrire les traits essentiels d'une situation à l'aide des notions du cours. analyser, montrer, expliquer décomposer et expliquer le « pourquoi » et le « comment » : notion, preuve tirée du dossier, effet sur l'entreprise. justifier, argumenter donner des arguments appuyés sur le dossier et le cours, puis conclure. vérifier, évaluer, apprécier peser les éléments pour et contre, puis trancher clairement. proposer, préconiser une solution concrète, réaliste pour cette entreprise, et justifiée. « à l'aide d'un raisonnement juridique » méthode en 4 temps : voir page 04. les auteurs : un bonus, pas une obligation le jury ne sanctionne pas l'absence d'auteur ou de théorie. mais un auteur bien placé (porter, mintzberg, herzberg…) montre que tu maîtrises le cours : vois la page 13."},{"t":"Une méthode par type de question","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>Une méthode par type de question<\/h1>\n<div class=\"card cP\" style=\"gap:8px\"><span class=\"tag fP\">Droit<\/span><h3>Le raisonnement juridique en 4 temps<\/h3>\n<div class=\"g4\" style=\"gap:8px\">\n<div class=\"step\" style=\"background:#FFFFFF\"><b>1 · Les faits<\/b><span>Qui ? Quoi ? Résumer juridiquement la situation (« un vendeur professionnel », « un salarié en CDI »).<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>2 · Le problème<\/b><span>Une question juridique générale : « Un consommateur peut-il… ? »<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>3 · La règle<\/b><span>La règle de droit applicable, avec sa source (article, annexe), et ses conditions.<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>4 · La solution<\/b><span>Appliquer la règle aux faits, condition par condition, puis <b>trancher<\/b> : une seule solution.<\/span><\/div>\n<\/div>\n<div class=\"ex\" style=\"margin-top:4px\"><p class=\"lab\">Exemple rédigé (cas fictif)<\/p><p class=\"sm\"><b>Faits :<\/b> Mme Ben, consommatrice, a acheté un fauteuil sur le site de la SARL Déco+ ; livrée il y a 10 jours, elle veut le renvoyer. <b>Problème :<\/b> un consommateur peut-il renoncer à un achat à distance sans donner de motif ? <b>Règle :<\/b> selon le Code de la consommation (art. L221-18), le consommateur dispose de 14 jours pour se rétracter d'un contrat conclu à distance, sans motif ; pour un bien, le délai court à partir de la réception. <b>Solution :<\/b> Mme Ben a reçu le fauteuil il y a 10 jours, elle est donc dans le délai. La SARL Déco+ doit accepter le retour et la rembourser.<\/p><\/div>\n<p class=\"sm\"><b>Attention :<\/b> le syllogisme strict n'est plus exigé, mais il faut un raisonnement argumenté qui aboutit à <b>une<\/b> solution.<\/p><\/div>\n<div class=\"g2\">\n<div class=\"card cB\" style=\"gap:6px\"><span class=\"tag fB\">Économie<\/span><h3>Répondre, puis relier au contexte<\/h3><ol class=\"sm\"><li>Définir la notion économique en jeu.<\/li><li>Expliquer le mécanisme (cause, effet).<\/li><li>Appliquer à l'entreprise avec les chiffres ou faits du dossier.<\/li><\/ol><div class=\"ex sm\" style=\"padding:10px 12px\"><p class=\"lab\">Exemple<\/p>« La hausse des taux d'intérêt renchérit le coût du crédit (mécanisme). Pour la SAS X, qui veut emprunter 200 000 € pour une nouvelle machine (annexe 3), l'investissement devient plus coûteux et sa rentabilité baisse : elle pourrait le reporter ou privilégier l'autofinancement (contexte). »<\/div><p class=\"sm\">Le tableau PESTEL n'est pas imposé : un classement clair suffit.<\/p><\/div>\n<div class=\"card cG\" style=\"gap:6px\"><span class=\"tag fG\">Management<\/span><h3>Notion, preuve, effet<\/h3><ol class=\"sm\"><li>Mobiliser la bonne notion (style de management, mécanisme de coordination, stratégie…).<\/li><li>Prouver avec un indice précis tiré du contexte ou d'une annexe.<\/li><li>Expliquer l'effet sur l'entreprise ou le proposer comme solution.<\/li><\/ol><div class=\"ex sm\" style=\"padding:10px 12px\"><p class=\"lab\">Exemple<\/p>« Le dirigeant consulte ses salariés avant de décider mais garde le dernier mot (annexe 2) : c'est un style de management consultatif, selon Likert. Il favorise l'adhésion de l'équipe tout en préservant la rapidité de décision. »<\/div><\/div>\n<\/div>","x":"méthode une méthode par type de question droit le raisonnement juridique en 4 temps 1 · les faits qui ? quoi ? résumer juridiquement la situation (« un vendeur professionnel », « un salarié en cdi »). 2 · le problème une question juridique générale : « un consommateur peut-il… ? » 3 · la règle la règle de droit applicable, avec sa source (article, annexe), et ses conditions. 4 · la solution appliquer la règle aux faits, condition par condition, puis trancher : une seule solution. exemple rédigé (cas fictif) faits : mme ben, consommatrice, a acheté un fauteuil sur le site de la sarl déco+ ; livrée il y a 10 jours, elle veut le renvoyer. problème : un consommateur peut-il renoncer à un achat à distance sans donner de motif ? règle : selon le code de la consommation (art. l221-18), le consommateur dispose de 14 jours pour se rétracter d'un contrat conclu à distance, sans motif ; pour un bien, le délai court à partir de la réception. solution : mme ben a reçu le fauteuil il y a 10 jours, elle est donc dans le délai. la sarl déco+ doit accepter le retour et la rembourser. attention : le syllogisme strict n'est plus exigé, mais il faut un raisonnement argumenté qui aboutit à une solution. économie répondre, puis relier au contexte définir la notion économique en jeu. expliquer le mécanisme (cause, effet). appliquer à l'entreprise avec les chiffres ou faits du dossier. exemple « la hausse des taux d'intérêt renchérit le coût du crédit (mécanisme). pour la sas x, qui veut emprunter 200 000 € pour une nouvelle machine (annexe 3), l'investissement devient plus coûteux et sa rentabilité baisse : elle pourrait le reporter ou privilégier l'autofinancement (contexte). » le tableau pestel n'est pas imposé : un classement clair suffit. management notion, preuve, effet mobiliser la bonne notion (style de management, mécanisme de coordination, stratégie…). prouver avec un indice précis tiré du contexte ou d'une annexe. expliquer l'effet sur l'entreprise ou le proposer comme solution. exemple « le dirigeant consulte ses salariés avant de décider mais garde le dernier mot (annexe 2) : c'est un style de management consultatif, selon likert. il favorise l'adhésion de l'équipe tout en préservant la rapidité de décision. »"},{"t":"L'entreprise dans son environnement","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 1 · 1re année<\/p><h1 style=\"--mid:1\">L'entreprise dans son environnement<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Relations économiques<\/span><span class=\"chip\">Les contrats<\/span><span class=\"chip\">Finalités et parties prenantes<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Les agents et le marché<\/h3><div class=\"mini\"><div class=\"def\"><b>Agents économiques<\/b> · ménages, entreprises, administrations publiques, banques, reste du monde ; ils échangent des flux réels (biens, travail) et monétaires<\/div><div class=\"def\"><b>Marché<\/b> · lieu de rencontre de l'offre et de la demande, qui fixe un prix d'équilibre<\/div><div class=\"def\"><b>Concurrence pure et parfaite<\/b> · 5 conditions : atomicité, homogénéité du produit, libre entrée et sortie, transparence, mobilité des facteurs. C'est un modèle théorique<\/div><div class=\"def\"><b>Structures de marché<\/b> · monopole (1 offreur), oligopole (quelques offreurs), concurrence monopolistique (produits différenciés)<\/div><div class=\"def\"><b>Barrières à l'entrée<\/b> · obstacles pour un nouvel entrant : coûts d'installation, brevets, réglementation, notoriété des marques<\/div><div class=\"def\"><b>Coopération<\/b> · alliances, partenariats, réseaux : coopérer pour partager coûts et savoir-faire<\/div><div class=\"def\"><b>Asymétrie d'information<\/b> · une partie en sait plus que l'autre (vendeur de voiture d'occasion, Akerlof). Remèdes : garanties, labels, avis<\/div><div class=\"def\"><b>Externalités<\/b> · effet d'une activité sur un tiers sans compensation : positive (pollinisation) ou négative (pollution)<\/div><div class=\"def\"><b>Banques et marché financier<\/b> · financement indirect (crédit bancaire) ou direct (actions, obligations)<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le contrat<\/h3><div class=\"mini\"><div class=\"def\"><b>Principes<\/b> · liberté contractuelle (art. 1102 C. civ.), force obligatoire : « le contrat tient lieu de loi » (art. 1103), bonne foi (art. 1104)<\/div><div class=\"def\"><b>Validité (art. 1128)<\/b> · consentement des parties, capacité de contracter, contenu licite et certain<\/div><div class=\"def\"><b>Vices du consentement<\/b> · erreur, dol (tromperie), violence : ils entraînent la nullité<\/div><div class=\"def\"><b>Formation<\/b> · une offre précise et ferme + une acceptation<\/div><div class=\"def\"><b>Clauses utiles<\/b> · clause pénale, de réserve de propriété, limitative de responsabilité, de non-concurrence<\/div><div class=\"def\"><b>Clause abusive<\/b> · crée un déséquilibre significatif : réputée non écrite<\/div><div class=\"def\"><b>Évolution<\/b> · imprévision (art. 1195) : renégocier si un changement imprévisible rend l'exécution trop onéreuse<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>L'entreprise et ses finalités<\/h3><div class=\"mini\"><div class=\"def\"><b>Finalités<\/b> · économique (profit, pérennité), sociale (emploi, salariés), sociétale (environnement, territoire)<\/div><div class=\"def\"><b>Parties prenantes<\/b> · internes (salariés, dirigeants, actionnaires) et externes (clients, fournisseurs, État, ONG) : Freeman<\/div><div class=\"def\"><b>Logique entrepreneuriale<\/b> · créer, innover, prendre des risques ; logique managériale : organiser, coordonner, optimiser<\/div><div class=\"def\"><b>Indicateurs de performance<\/b> · CA, résultat, part de marché, rentabilité, satisfaction client, turnover, absentéisme, bilan carbone<\/div><\/div><\/div><\/div>\n<\/div>","x":"1 thème 1 · 1re année l'entreprise dans son environnement relations économiques les contrats finalités et parties prenantes économie les agents et le marché agents économiques · ménages, entreprises, administrations publiques, banques, reste du monde ; ils échangent des flux réels (biens, travail) et monétaires marché · lieu de rencontre de l'offre et de la demande, qui fixe un prix d'équilibre concurrence pure et parfaite · 5 conditions : atomicité, homogénéité du produit, libre entrée et sortie, transparence, mobilité des facteurs. c'est un modèle théorique structures de marché · monopole (1 offreur), oligopole (quelques offreurs), concurrence monopolistique (produits différenciés) barrières à l'entrée · obstacles pour un nouvel entrant : coûts d'installation, brevets, réglementation, notoriété des marques coopération · alliances, partenariats, réseaux : coopérer pour partager coûts et savoir-faire asymétrie d'information · une partie en sait plus que l'autre (vendeur de voiture d'occasion, akerlof). remèdes : garanties, labels, avis externalités · effet d'une activité sur un tiers sans compensation : positive (pollinisation) ou négative (pollution) banques et marché financier · financement indirect (crédit bancaire) ou direct (actions, obligations) droit le contrat principes · liberté contractuelle (art. 1102 c. civ.), force obligatoire : « le contrat tient lieu de loi » (art. 1103), bonne foi (art. 1104) validité (art. 1128) · consentement des parties, capacité de contracter, contenu licite et certain vices du consentement · erreur, dol (tromperie), violence : ils entraînent la nullité formation · une offre précise et ferme + une acceptation clauses utiles · clause pénale, de réserve de propriété, limitative de responsabilité, de non-concurrence clause abusive · crée un déséquilibre significatif : réputée non écrite évolution · imprévision (art. 1195) : renégocier si un changement imprévisible rend l'exécution trop onéreuse management l'entreprise et ses finalités finalités · économique (profit, pérennité), sociale (emploi, salariés), sociétale (environnement, territoire) parties prenantes · internes (salariés, dirigeants, actionnaires) et externes (clients, fournisseurs, état, ong) : freeman logique entrepreneuriale · créer, innover, prendre des risques ; logique managériale : organiser, coordonner, optimiser indicateurs de performance · ca, résultat, part de marché, rentabilité, satisfaction client, turnover, absentéisme, bilan carbone"},{"t":"La régulation de l'activité économique","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 2 · 1re année<\/p><h1 style=\"--mid:1\">La régulation de l'activité économique<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Le rôle de l'État<\/span><span class=\"chip\">La régulation par le droit<\/span><span class=\"chip\">Analyser l'environnement<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>L'État et les politiques économiques<\/h3><div class=\"mini\"><div class=\"def\"><b>3 fonctions (Musgrave)<\/b> · allocation (fournir des biens publics), redistribution (réduire les inégalités), régulation ou stabilisation (croissance, emploi, prix)<\/div><div class=\"def\"><b>Croissance<\/b> · hausse durable du PIB (richesse produite). Sources : plus de travail, plus de capital, progrès technique<\/div><div class=\"def\"><b>Inflation<\/b> · hausse générale et durable des prix : par la demande, par les coûts ; elle réduit le pouvoir d'achat<\/div><div class=\"def\"><b>Chômage<\/b> · personnes sans emploi qui en cherchent un : conjoncturel, structurel, frictionnel<\/div><div class=\"def\"><b>Politique budgétaire<\/b> · dépenses et recettes publiques (impôts) : levier de l'État<\/div><div class=\"def\"><b>Politique monétaire<\/b> · taux d'intérêt directeurs : levier de la BCE, dont l'objectif est une inflation de 2 % à moyen terme<\/div><div class=\"def\"><b>Conjoncturelle / structurelle<\/b> · court terme (relance, rigueur) / long terme (formation, recherche, réformes)<\/div><div class=\"def\"><b>Limites<\/b> · mondialisation, dette publique, règles européennes (déficit et dette encadrés), politique monétaire confiée à la BCE<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>La régulation par le droit<\/h3><div class=\"mini\"><div class=\"def\"><b>Rôle du droit<\/b> · fixer les règles du jeu, protéger la partie faible, sanctionner<\/div><div class=\"def\"><b>Autorités administratives indépendantes<\/b> · Autorité de la concurrence, CNIL, AMF (marchés financiers), Arcom (audiovisuel et numérique)<\/div><div class=\"def\"><b>Pratiques anticoncurrentielles<\/b> · ententes (art. L420-1 C. com., art. 101 TFUE) et abus de position dominante (art. L420-2, art. 102 TFUE). Amende jusqu'à 10 % du CA mondial<\/div><div class=\"def\"><b>Concentrations<\/b> · contrôlées avant de se réaliser<\/div><div class=\"def\"><b>Marque<\/b> · signe distinctif déposé à l'INPI, protégé 10 ans, renouvelable sans limite<\/div><div class=\"def\"><b>Brevet<\/b> · protège une invention nouvelle, inventive et industrielle, 20 ans maximum ; contrefaçon sanctionnée<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Décider avec l'environnement<\/h3><div class=\"mini\"><div class=\"def\"><b>PESTEL<\/b> · facteurs Politiques, Économiques, Socioculturels, Technologiques, Écologiques, Légaux : opportunités et menaces<\/div><div class=\"def\"><b>Veille<\/b> · surveiller l'environnement : concurrentielle, technologique, juridique, commerciale<\/div><div class=\"def\"><b>Innovation<\/b> · de produit, de procédé, d'organisation, de commercialisation ; incrémentale ou de rupture. Source d'avantage concurrentiel<\/div><\/div><\/div><\/div>\n<\/div>","x":"2 thème 2 · 1re année la régulation de l'activité économique le rôle de l'état la régulation par le droit analyser l'environnement économie l'état et les politiques économiques 3 fonctions (musgrave) · allocation (fournir des biens publics), redistribution (réduire les inégalités), régulation ou stabilisation (croissance, emploi, prix) croissance · hausse durable du pib (richesse produite). sources : plus de travail, plus de capital, progrès technique inflation · hausse générale et durable des prix : par la demande, par les coûts ; elle réduit le pouvoir d'achat chômage · personnes sans emploi qui en cherchent un : conjoncturel, structurel, frictionnel politique budgétaire · dépenses et recettes publiques (impôts) : levier de l'état politique monétaire · taux d'intérêt directeurs : levier de la bce, dont l'objectif est une inflation de 2 % à moyen terme conjoncturelle / structurelle · court terme (relance, rigueur) / long terme (formation, recherche, réformes) limites · mondialisation, dette publique, règles européennes (déficit et dette encadrés), politique monétaire confiée à la bce droit la régulation par le droit rôle du droit · fixer les règles du jeu, protéger la partie faible, sanctionner autorités administratives indépendantes · autorité de la concurrence, cnil, amf (marchés financiers), arcom (audiovisuel et numérique) pratiques anticoncurrentielles · ententes (art. l420-1 c. com., art. 101 tfue) et abus de position dominante (art. l420-2, art. 102 tfue). amende jusqu'à 10 % du ca mondial concentrations · contrôlées avant de se réaliser marque · signe distinctif déposé à l'inpi, protégé 10 ans, renouvelable sans limite brevet · protège une invention nouvelle, inventive et industrielle, 20 ans maximum ; contrefaçon sanctionnée management décider avec l'environnement pestel · facteurs politiques, économiques, socioculturels, technologiques, écologiques, légaux : opportunités et menaces veille · surveiller l'environnement : concurrentielle, technologique, juridique, commerciale innovation · de produit, de procédé, d'organisation, de commercialisation ; incrémentale ou de rupture. source d'avantage concurrentiel"},{"t":"L'organisation de l'activité (1/2)","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 3 · 1re année<\/p><h1 style=\"--mid:1\">L'organisation de l'activité (1/2)<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Choix de production<\/span><span class=\"chip\">Structure juridique<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Les choix de production<\/h3><div class=\"mini\"><div class=\"def\"><b>Facteurs de production<\/b> · capital (machines), travail, matières premières, connaissances<\/div><div class=\"def\"><b>Productivité<\/b> · production / quantité de facteur utilisée. Des gains de productivité font baisser les coûts unitaires<\/div><div class=\"def\"><b>Coûts<\/b> · fixes (indépendants des quantités), variables (proportionnels) ; économies d'échelle quand le coût unitaire baisse avec le volume<\/div><div class=\"def\"><b>Chaîne de valeur (Porter, 1985)<\/b> · activités principales et de soutien qui créent la valeur : où l'entreprise est-elle la meilleure ?<\/div><div class=\"def\"><b>Impartition<\/b> · confier une activité à un partenaire : externalisation, sous-traitance. But : se recentrer, réduire les coûts, gagner en flexibilité. Risque : dépendance<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Choisir sa structure<\/h3><div class=\"mini\"><div class=\"def\"><b>Critères de choix<\/b> · nombre d'associés, capital, responsabilité, fiscalité, protection sociale du dirigeant, image<\/div><div class=\"def\"><b>Économie sociale et solidaire<\/b> · coopératives (1 personne = 1 voix, ex. Scop) et mutuelles : la personne prime sur le capital<\/div><\/div><\/div><\/div>\n<h2>Les structures juridiques en un tableau<\/h2>\n<table class=\"tb\">\n<tr><th>Forme<\/th><th>Associés<\/th><th>Capital<\/th><th>Responsabilité<\/th><th>À retenir<\/th><\/tr>\n<tr><td data-label=\"Forme\">EI (entreprise individuelle)<\/td><td data-label=\"Associés\">1 personne physique<\/td><td data-label=\"Capital\">Pas de capital<\/td><td data-label=\"Responsabilité\">Patrimoine personnel protégé par défaut<\/td><td data-label=\"À retenir\">Depuis le 15 mai 2022, patrimoines pro et perso séparés ; plus de création d'EIRL<\/td><\/tr>\n<tr><td data-label=\"Forme\">SARL / EURL<\/td><td data-label=\"Associés\">1 (EURL) à 100<\/td><td data-label=\"Capital\">Libre<\/td><td data-label=\"Responsabilité\">Limitée aux apports<\/td><td data-label=\"À retenir\">Gérée par un ou plusieurs gérants ; cadre assez encadré, rassurant<\/td><\/tr>\n<tr><td data-label=\"Forme\">SAS / SASU<\/td><td data-label=\"Associés\">1 (SASU) ou plus<\/td><td data-label=\"Capital\">Libre<\/td><td data-label=\"Responsabilité\">Limitée aux apports<\/td><td data-label=\"À retenir\">Grande liberté pour rédiger les statuts ; un président obligatoire<\/td><\/tr>\n<tr><td data-label=\"Forme\">SA<\/td><td data-label=\"Associés\">2 minimum (7 si cotée)<\/td><td data-label=\"Capital\">37 000 € minimum<\/td><td data-label=\"Responsabilité\">Limitée aux apports<\/td><td data-label=\"À retenir\">Pour les grands projets ; conseil d'administration<\/td><\/tr>\n<tr><td data-label=\"Forme\">Coopérative, mutuelle<\/td><td data-label=\"Associés\">Variable<\/td><td data-label=\"Capital\">Variable<\/td><td data-label=\"Responsabilité\">Selon la forme<\/td><td data-label=\"À retenir\">Gouvernance démocratique, bénéfices réinvestis<\/td><\/tr>\n<\/table>\n<div class=\"card cY\"><h3>Réflexe à l'examen<\/h3><p class=\"sm\">On te demande de conseiller une forme juridique ? Compare 2 formes sur les critères du contexte (nombre d'associés, risque, besoin de liberté), puis <b>recommande-en une<\/b> et justifie.<\/p><\/div>","x":"3 thème 3 · 1re année l'organisation de l le=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 3 · 1re année<\/p><h1 style=\"--mid:1\">L'organisation de l'activité (2/2)<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Risques et responsabilité<\/span><span class=\"chip\">Organiser les ressources<\/span><span class=\"chip\">Financement<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Risques et responsabilité<\/h3><div class=\"mini\"><div class=\"def\"><b>Inexécution du contrat (art. 1217)<\/b> · 5 sanctions : exception d'inexécution, exécution forcée en nature, réduction du prix, résolution, dommages et intérêts<\/div><div class=\"def\"><b>Responsabilité civile contractuelle<\/b> · dommage causé par l'inexécution d'un contrat (art. 1231-1)<\/div><div class=\"def\"><b>Responsabilité extracontractuelle<\/b> · hors contrat : fait personnel (art. 1240), fait des choses ou d'autrui, comme l'employeur pour ses salariés (art. 1242)<\/div><div class=\"def\"><b>3 conditions<\/b> · un fait générateur, un dommage, un lien de causalité. But : réparer<\/div><div class=\"def\"><b>Responsabilité pénale<\/b> · une infraction (contravention, délit, crime) : élément légal, matériel, moral. But : punir. Une personne morale peut être responsable (art. 121-2 C. pénal)<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Organiser les ressources<\/h3><div class=\"mini\"><div class=\"def\"><b>Ressources<\/b> · tangibles (locaux, machines, argent) et intangibles (marque, savoir-faire, image, données)<\/div><div class=\"def\"><b>Coordination (Mintzberg)<\/b> · ajustement mutuel, supervision directe, standardisation des procédés, des résultats, des qualifications, des normes<\/div><div class=\"def\"><b>Styles (Likert)<\/b> · autoritaire exploiteur, autoritaire paternaliste, consultatif, participatif<\/div><div class=\"def\"><b>Niveaux de management<\/b> · stratégique (direction), tactique ou intermédiaire, opérationnel<\/div><div class=\"def\"><b>Processus<\/b> · suite d'activités qui crée de la valeur pour le client<\/div><div class=\"def\"><b>RSE<\/b> · responsabilité sociale et environnementale : éthique, salariés, société, planète<\/div><div class=\"def\"><b>Effet d'expérience (BCG)<\/b> · le coût unitaire baisse de 20 à 30 % à chaque doublement de la production cumulée<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Gestion<\/span><h3>Le financement<\/h3><div class=\"mini\"><div class=\"def\"><b>Cycles<\/b> · exploitation (acheter, produire, vendre au quotidien) et investissement (acquérir des équipements durables)<\/div><div class=\"def\"><b>Compte de résultat<\/b> · produits − charges de l'année = résultat (bénéfice ou perte)<\/div><div class=\"def\"><b>Bilan<\/b> · photographie du patrimoine : actif (ce que l'entreprise possède) = passif (capitaux propres + dettes)<\/div><div class=\"def\"><b>Modes de financement<\/b> · autofinancement, apport ou augmentation de capital, emprunt bancaire, crédit-bail, financement participatif, aides publiques<\/div><div class=\"def\"><b>Équilibre financier<\/b> · les emplois stables (investissements) doivent être financés par des ressources stables. Trésorerie = FRNG − BFR<\/div><\/div><\/div>","x":"3 thème 3 · 1re année l'organisation de l'activité (2/2) risques et responsabilité organiser les ressources financement droit risques et responsabilité inexécution du contrat (art. 1217) · 5 rique","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">4<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 4 · 2e année<\/p><h1 style=\"--mid:1\">L'impact du numérique<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Un environnement transformé<\/span><span class=\"chip\">Le droit du numérique<\/span><span class=\"chip\">Le management et le SI<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Le numérique transforme les marchés<\/h3><div class=\"mini\"><div class=\"def\"><b>Places de marché<\/b> · plateformes qui mettent en relation vendeurs et acheteurs (Amazon, Vinted, Leboncoin)<\/div><div class=\"def\"><b>Relations d'échange<\/b> · B to B, B to C, C to C, B to G (entreprise vers administration)<\/div><div class=\"def\"><b>Externalités de réseau<\/b> · un service vaut plus quand il a plus d'utilisateurs : d'où des géants qui « raflent tout »<\/div><div class=\"def\"><b>Nouveaux modèles économiques<\/b> · gratuité financée par la publicité ou les données, freemium, abonnement, économie collaborative, usage plutôt que propriété (location, partage)<\/div><div class=\"def\"><b>Normes et standards<\/b> · règles techniques communes (USB-C, formats) qui permettent l'interopérabilité<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Numérique et management<\/h3><div class=\"mini\"><div class=\"def\"><b>Organisation du travail<\/b> · télétravail, travail collaboratif, outils partagés : plus de flexibilité, plus de coordination à distance<\/div><div class=\"def\"><b>Système d'information (SI)<\/b> · collecter, stocker, traiter et diffuser l'information (ERP, CRM)<\/div><div class=\"def\"><b>Opportunités du SI<\/b> · décisions plus rapides, connaissance client, gains de productivité<\/div><div class=\"def\"><b>Risques du SI<\/b> · cyberattaques, pannes, surcharge informationnelle, dépendance, protection des données<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le droit face au numérique<\/h3><div class=\"mini\"><div class=\"def\"><b>CNIL<\/b> · autorité administrative indépendante qui contrôle le respect des données personnelles et sanctionne<\/div><div class=\"def\"><b>RGPD (25 mai 2018)<\/b> · données collectées pour un but précis, avec une base légale (souvent le consentement), minimisées, sécurisées ; droits d'accès, de rectification, d'effacement. Amende jusqu'à 20 M€ ou 4 % du CA mondial<\/div><div class=\"def\"><b>Droit d'auteur<\/b> · protège les œuvres originales (textes, logiciels, photos) sans formalité, jusqu'à 70 ans après la mort de l'auteur<\/div><div class=\"def\"><b>Identité numérique<\/b> · e-réputation, droit à l'oubli (déréférencement)<\/div><div class=\"def\"><b>Numérique au travail<\/b> · l'employeur peut contrôler (vidéosurveillance, messagerie) si c'est justifié, proportionné et si le salarié est informé ; droit à la déconnexion<\/div><div class=\"def\"><b>Preuve électronique<\/b> · l'écrit électronique a la même valeur que l'écrit papier si l'auteur est identifié et l'intégrité garantie (art. 1366 C. civ.)<\/div><div class=\"def\"><b>Contrat de vente électronique<\/b> · informations obligatoires, récapitulatif avant validation, confirmation ; droit de rétractation de 14 jours pour le consommateur<\/div><div class=\"def\"><b>Prestation numérique<\/b> · contrats de services en ligne : conditions générales, niveau de service, données<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Lien NDRC<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">E-commerce, CRM, prospection par e-mail (consentement RGPD), avis clients, réseaux sociaux : ce thème est au cœur de ton BTS. Utilise ton expérience pour contextualiser.<\/p><\/div>","x":"4 thème 4 · 2e année l'impact du numérique un environnement transformé le droit du numérique le management et le si économie le numérique transforme les marchés places de marché · plateformes qui mettent en relation vendeurs et acheteurs (amazon, vinted, leboncoin) relations d'échange · b to b, b to c, c to c, b to g (entreprise vers administration) externalités de réseau · un service vaut plus quand il a plus d'utilisateurs : d'où des géants qui « raflent tout » nouveaux modèles économiques · gratuité financée par la publicité ou les données, freemium, abonnement, économie collaborative, usage plutôt que propriété (location, partage) normes et standards · règles techniques communes (usb-c, formats) qui permettent l'interopérabilité management numérique et management organisation du travail · télétravail, travail collaboratif, outils partagés : plus de flexibilité, plus de coordination à distance système d'information (si) · collecter, stocker, traiter et diffuser l'information (erp, crm) opportunités du si · décisions plus rapides, connaissance client, gains de productivité risques du si · cyberattaques, pannes, surcharge informationnelle, dépendance, protection des données droit le droit face au numérique cnil · autorité administrative indépendante qui contrôle le respect des données personnelles et sanctionne rgpd (25 mai 2018) · données collectées pour un but précis, avec une base légale (souvent le consentement), minimisées, sécurisées ; droits d'accès, de rectification, d'effacement. amende jusqu'à 20 m€ ou 4 % du ca mondial droit d'auteur · protège les œuvres originales (textes, logiciels, photos) sans formalité, jusqu'à 70 ans après la mort de l'auteur identité numérique · e-réputation, droit à l'oubli (déréférencement) numérique au travail · l'employeur peut contrôler (vidéosurveillance, messagerie) si c'est justifié, proportionné et si le salarié est informé ; droit à la déconnexion preuve électronique · l'écrit électronique a la même valeur que l'écrit papier si l'auteur est identifié et l'intégrité garantie (art. 1366 c. civ.) contrat de vente électronique · informations obligatoires, récapitulatif avant validation, confirmation ; droit de rétractation de 14 jours pour le consommateur prestation numérique · contrats de services en ligne : conditions générales, niveau de service, données lien ndrc e-commerce, crm, prospection par e-mail (consentement rgpd), avis clients, réseaux sociaux : ce thème est au cœur de ton bts. utilise ton expérience pour contextualiser."},{"t":"Les mutations du travail","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">5<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 5 · 2e année<\/p><h1 style=\"--mid:1\">Les mutations du travail<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Le marché du travail<\/span><span class=\"chip\">Le droit du travail<\/span><span class=\"chip\">Emploi et conditions de travail<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Le marché du travail<\/h3><div class=\"mini\"><div class=\"def\"><b>Offre et demande de travail<\/b> · l'offre vient des ménages (qui proposent leur travail), la demande des entreprises (qui embauchent)<\/div><div class=\"def\"><b>Segmentation<\/b> · marché primaire (emplois stables, bien payés) et secondaire (précaires, peu qualifiés) : Doeringer et Piore<\/div><div class=\"def\"><b>Déséquilibres<\/b> · chômage, emplois non pourvus (tensions de recrutement)<\/div><div class=\"def\"><b>Politiques de l'emploi<\/b> · passives (indemniser les chômeurs) et actives (formation, aides à l'embauche, accompagnement)<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Emploi et conditions de travail<\/h3><div class=\"mini\"><div class=\"def\"><b>GPEC<\/b> · anticiper les besoins en emplois et compétences (aujourd'hui souvent appelée GEPP) : former, recruter, faire évoluer<\/div><div class=\"def\"><b>Motivation (Herzberg)<\/b> · facteurs d'hygiène (salaire, conditions : évitent l'insatisfaction) et facteurs moteurs (reconnaissance, responsabilité : motivent)<\/div><div class=\"def\"><b>Besoins (Maslow)<\/b> · physiologiques, sécurité, appartenance, estime, accomplissement<\/div><div class=\"def\"><b>Conditions de travail<\/b> · santé, sécurité, risques psychosociaux, qualité de vie au travail, télétravail<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le droit du travail<\/h3><div class=\"mini\"><div class=\"def\"><b>Sources<\/b> · Constitution, traités européens, Code du travail, conventions collectives, accords d'entreprise, contrat, usages. Depuis 2017, l'accord d'entreprise prime sur de nombreux sujets<\/div><div class=\"def\"><b>Salarié ou indépendant<\/b> · le salarié est lié par un lien de subordination (ordres, contrôle, sanction) ; l'indépendant non<\/div><div class=\"def\"><b>Contrats<\/b> · CDI (règle), CDD et intérim (exceptions, cas limités) ; temps partiel ; alternance<\/div><div class=\"def\"><b>Période d'essai CDI<\/b> · 2 mois (employés), 3 mois (agents de maîtrise, techniciens), 4 mois (cadres), renouvelable une fois si un accord de branche le prévoit<\/div><div class=\
