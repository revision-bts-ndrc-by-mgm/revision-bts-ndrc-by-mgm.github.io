lass=\"def\"><b>Facteurs clés de succès<\/b> · ce qu'il faut maîtriser pour réussir sur un marché<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Interne<\/span><h3>Analyser l'entreprise<\/h3><div class=\"mini\"><div class=\"def\"><b>Ressources et compétences<\/b> · ce que l'entreprise a et sait faire<\/div><div class=\"def\"><b>Ressources stratégiques (Barney)<\/b> · précieuses, rares, difficiles à imiter, bien organisées : sources d'avantage concurrentiel durable<\/div><div class=\"def\"><b>Chaîne de valeur<\/b> · où l'entreprise crée-t-elle le plus de valeur ?<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>La synthèse : SWOT<\/h3><div class=\"g4 sm\" style=\"gap:8px\"><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Forces<\/b>atouts internes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Faiblesses<\/b>limites internes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Opportunités<\/b>chances externes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Menaces<\/b>risques externes<\/div><\/div><\/div>\n<h2>Les choix stratégiques<\/h2>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><h3>Par domaine d'activité<\/h3><div class=\"mini\"><div class=\"def\"><b>DAS<\/b> · domaine d'activité stratégique : un couple produits-marché avec ses clients, concurrents, technologies<\/div><div class=\"def\"><b>Domination par les coûts (Porter)<\/b> · être le moins cher (Lidl, Ryanair)<\/div><div class=\"def\"><b>Différenciation<\/b> · offrir un produit unique, perçu comme supérieur (Apple)<\/div><div class=\"def\"><b>Focalisation<\/b> · se concentrer sur une niche<\/div><div class=\"def\"><b>Matrice BCG<\/b> · classe les DAS selon la croissance du marché et la part de marché relative : vedettes, vaches à lait, dilemmes, poids morts<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><h3>Globales et modes de croissance<\/h3><div class=\"mini\"><div class=\"def\"><b>Spécialisation<\/b> · un seul métier ; recentrage : revenir à son cœur de métier<\/div><div class=\"def\"><b>Diversification<\/b> · de nouveaux métiers, liés ou non<\/div><div class=\"def\"><b>Intégration verticale<\/b> · contrôler l'amont (fournisseurs) ou l'aval (distribution)<\/div><div class=\"def\"><b>Internationalisation<\/b> · exporter, s'implanter à l'étranger<\/div><div class=\"def\"><b>Croissance interne<\/b> · par ses propres moyens : lente mais maîtrisée<\/div><div class=\"def\"><b>Croissance externe<\/b> · fusion, acquisition : rapide mais coûteuse et risquée<\/div><div class=\"def\"><b>Croissance conjointe<\/b> · alliances, partenariats, franchise, joint-venture<\/div><\/div><\/div><\/div>","x":"6 thème 6 · 2e année les choix stratégiques le diagnostic les choix stratégiques le diagnostic stratégique externe analyser l'environnement pestel · le macro-environnement : opportunités et menaces les 5 forces (porter) · intensité de la concurrence, menace de nouveaux entrants, menace des produits de substitution, pouvoir des clients, pouvoir des fournisseurs (+ rôle de l'état) facteurs clés de succès · ce qu'il faut maîtriser pour réussir sur un marché interne analyser l'entreprise ressources et compétences · ce que l'entreprise a et sait faire ressources stratégiques (barney) · précieuses, rares, difficiles à imiter, bien organisées : sources d'avantage concurrentiel durable chaîne de valeur · où l'entreprise crée-t-elle le plus de valeur ? la synthèse : swot forces atouts internes faiblesses limites internes opportunités chances externes menaces risques externes les choix stratégiques par domaine d'activité das · domaine d'activité stratégique : un couple produits-marché avec ses clients, concurrents, technologies domination par les coûts (porter) · être le moins cher (lidl, ryanair) différenciation · offrir un produit unique, perçu comme supérieur (apple) focalisation · se concentrer sur une niche matrice bcg · classe les das selon la croissance du marché et la part de marché relative : vedettes, vaches à lait, dilemmes, poids morts globales et modes de croissance spécialisation · un seul métier ; recentrage : revenir à son cœur de métier diversification · de nouveaux métiers, liés ou non intégration verticale · contrôler l'amont (fournisseurs) ou l'aval (distribution) internationalisation · exporter, s'implanter à l'étranger croissance interne · par ses propres moyens : lente mais maîtrisée croissance externe · fusion, acquisition : rapide mais coûteuse et risquée croissance conjointe · alliances, partenariats, franchise, joint-venture"},{"t":"Les notions complémentaires","h":"<p class=\"kick tO\">Programme<\/p>\n<h1>Les notions complémentaires<\/h1>\n<p class=\"mut\">Ces notions du programme officiel complètent les pages des thèmes. Elles tombent moins souvent, mais elles peuvent tomber.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Thème 2 · Économie<\/span><h3>La régulation européenne<\/h3><div class=\"mini\"><div class=\"def\"><b>Marché unique<\/b> · libre circulation des biens, des services, des capitaux et des personnes entre les pays de l'UE<\/div><div class=\"def\"><b>Politique de concurrence de l'UE<\/b> · la Commission européenne sanctionne ententes et abus de position dominante, contrôle les concentrations et les aides d'État<\/div><div class=\"def\"><b>Zone euro<\/b> · une monnaie unique, une politique monétaire unique menée par la BCE<\/div><div class=\"def\"><b>Règles budgétaires<\/b> · déficit public limité à 3 % du PIB, dette publique à 60 % du PIB (règles assouplies et réformées en 2024)<\/div><div class=\"def\"><b>Règlement / directive<\/b> · le règlement s'applique directement dans tous les pays ; la directive doit être transposée dans le droit national<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Thème 3 · Droit<\/span><h3>Les types de risques<\/h3><div class=\"mini\"><div class=\"def\"><b>Économiques<\/b> · perte de clients, arrivée d'un concurrent, baisse de la demande<\/div><div class=\"def\"><b>Financiers<\/b> · impayés, manque de trésorerie, endettement<\/div><div class=\"def\"><b>Juridiques<\/b> · litiges, non-respect d'une règle, contrefaçon<\/div><div class=\"def\"><b>Technologiques et numériques<\/b> · pannes, cyberattaques, fuite de données<\/div><div class=\"def\"><b>Humains et environnementaux<\/b> · accidents du travail, pollution, catastrophes<\/div><div class=\"def\"><b>Réponses<\/b> · prévention, assurance, clauses du contrat (limitative de responsabilité, pénale), choix d'une forme juridique à responsabilité limitée<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Thème 3 · Management<\/span><h3>Compétences et contrôle<\/h3><div class=\"mini\"><div class=\"def\"><b>Compétences<\/b> · individuelles (savoirs, savoir-faire, savoir-être) et collectives (ce que l'équipe sait faire ensemble) ; le cœur de métier réunit les compétences clés<\/div><div class=\"def\"><b>Mécanismes de contrôle<\/b> · contrôle par les règles et procédures, par les résultats (objectifs, budgets, tableaux de bord, analyse des écarts), par la culture d'entreprise<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Thème 3 · Gestion<\/span><h3>L'équilibre financier en détail<\/h3><div class=\"mini\"><div class=\"def\"><b>FRNG<\/b> · fonds de roulement net global = ressources stables − emplois stables<\/div><div class=\"def\"><b>BFR<\/b> · besoin de financement du cycle d'exploitation = stocks + créances clients − dettes fournisseurs<\/div><div class=\"def\"><b>Trésorerie nette<\/b> · FRNG − BFR : positive, l'entreprise peut payer ; négative, elle dépend de la banque<\/div><div class=\"def\"><b>CAF<\/b> · capacité d'autofinancement : les ressources que l'activité dégage pour financer l'entreprise<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Thème 4 · Management<\/span><h3>Numérique et organisation<\/h3><div class=\"mini\"><div class=\"def\"><b>Spécialisation<\/b> · le numérique permet de découper et confier les tâches à des spécialistes, en interne ou à l'extérieur<\/div><div class=\"def\"><b>Intégration<\/b> · relier les fonctions entre elles (un ERP partage les mêmes données dans toute l'entreprise)<\/div><div class=\"def\"><b>Action collective<\/b> · outils collaboratifs et plateformes facilitent le travail en équipe, même à distance ; organisation en réseau<\/div><div class=\"def\"><b>Flexibilité<\/b> · quantitative (ajuster les effectifs ou horaires) ou qualitative (polyvalence, adaptation des tâches) ; interne ou externe<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Thème 4 · Droit<\/span><h3>Droits d'utilisation<\/h3><div class=\"mini\"><div class=\"def\"><b>Licence d'utilisation<\/b> · acheter un logiciel ou une application, c'est acheter un droit d'usage, pas l'œuvre elle-même<\/div><div class=\"def\"><b>CGU<\/b> · les conditions générales d'utilisation forment le contrat entre le service et l'utilisateur<\/div><div class=\"def\"><b>Logiciel libre / propriétaire<\/b> · libre : code ouvert, modifiable ; propriétaire : usage limité par la licence<\/div><\/div><\/div><\/div>\n<\/div>","x":"programme les notions complémentaires ces notions du programme officiel complètent les pages des thèmes. elles tombent moins souvent, mais elles peuvent tomber. thème 2 · économie la régulation européenne marché unique · libre circulation des biens, des services, des capitaux et des personnes entre les pays de l'ue politique de concurrence de l'ue · la écret du 28/11/2025 sur l'influence commerciale.<\/p><\/div>","x":"  complément · thèmes 2 et 4  l'actualité juridique 2026 à citer  un exemple récent et daté montre au correcteur que tu suis l'actualité. ces règles touchent directement les entreprises et le métier commercial.   les changements de 2026    1er janvier 2026 · influence commerciale  · contrat écrit obligatoire entre marque et influenceur au-delà de 1 000 € ht. illustre la protection du consommateur et la régulation du numérique (thème 4).   janvier 2026 · alliances à l'achat  · l'autorité de la concurrence lance un bilan concurrentiel des alliances aura et concordis de la grande distribution. illustre la régulation de la concurrence (thème 2).   11 août 2026 · démarchage téléphonique  · il faut le consentement préalable du particulier pour le prospecter par téléphone ; bloctel disparaît. illustre le droit et le numérique (thème 4).   20 novembre 2026 · crédit à la consommation  · le paiement fractionné, les mini-crédits et la loa entrent dans le régime du crédit, avec une évaluation de solvabilité renforcée. illustre la protection de la partie faible (thème 2).     comment l'utiliser :  « le droit protège la partie faible au contrat : depuis le 20 novembre 2026, par exemple, le paiement en 3 fois est soumis aux règles du crédit à la consommation, avec 14 jours de rétractation. » une phrase, une date, un lien avec la notion.  sources vérifiées le 17 novembre 2026 : service-public.gouv.fr (crédit à la consommation, 27/10/2026) · cnil (prospection par téléphone, 10/06/2026) · autorité de la concurrence (9/01/2026) · décret du 28/11/2025 sur l'influence commerciale.  "}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,2,3,14]},{"n":"Le programme et les notions complémentaires","tag":"","e":false,"p":[1,11]},{"n":"L'entreprise dans son environnement","tag":"Thème 1","e":false,"p":[4]},{"n":"La régulation économique","tag":"Thème 2","e":false,"p":[5]},{"n":"L'organisation de l'activité","tag":"Thème 3","e":false,"p":[6,7]},{"n":"L'impact du numérique","tag":"Thème 4","e":false,"p":[8]},{"n":"Les mutations du travail","tag":"Thème 5","e":false,"p":[9]},{"n":"Les choix stratégiques","tag":"Thème 6","e":false,"p":[10]},{"n":"Auteurs, repères juridiques et chiffres","tag":"","e":false,"p":[12,13]},{"n":"Notions en plus, à jour 2026","tag":"Compléments","e":false,"p":[15]}],"q":[{"id":"cejmq0","q":"Que désigne la RSE ?","o":["Le résultat social de l'entreprise","La responsabilité sociale et environnementale de l'entreprise","Le registre des sociétés","La réduction des salaires"],"a":1,"e":"Prendre en compte l'éthique, les salariés, la société et la planète."},{"id":"cejmq1","q":"Que permet l'imprévision (article 1195 du Code civil) ?","o":["Annuler tout contrat","Renégocier un contrat devenu trop onéreux à cause d'un changement imprévisible","Ne pas payer","Changer de cocontractant"],"a":1,"e":"Une partie peut demander une renégociation à son cocontractant."},{"id":"cejmq2","q":"Qui sanctionne les ententes et les abus de position dominante en France ?","o":["La CNIL","L'Autorité de la concurrence","L'AMF","La Banque de France"],"a":1,"e":"Amende jusqu'à 10 % du chiffre d'affaires mondial."},{"id":"cejmq3","q":"Selon Likert, un dirigeant qui consulte ses salariés mais garde la décision a un style…","o":["autoritaire exploiteur","autoritaire paternaliste","consultatif","participatif"],"a":2,"e":"Il consulte, mais décide seul."},{"id":"cejmq4","q":"Une fusion ou un rachat d'entreprise, c'est une croissance…","o":["interne","externe","conjointe","organique"],"a":1,"e":"La croissance externe est rapide mais coûteuse et risquée."},{"id":"cejmq5","q":"Que mesure le BFR ?","o":["Le bénéfice de l'année","Le besoin de financement du cycle d'exploitation","La valeur des machines","Les dettes à long terme"],"a":1,"e":"BFR = stocks + créances clients − dettes fournisseurs."},{"id":"cejmq6","q":"Quelle est la dernière étape du raisonnement juridique ?","o":["Rappeler les faits","Poser le problème","Énoncer la règle","Appliquer la règle et trancher"],"a":3,"e":"Faits, problème, règle, puis solution : une seule solution."},{"id":"cejmq7","q":"Selon l'article 1128 du Code civil, lesquelles sont des conditions de validité du contrat ?","o":["Consentement, capacité, contenu licite et certain","Écrit, signature, prix","Bonne foi, durée, prix","Offre, acceptation, livraison"],"a":0,"e":"Consentement des parties, capacité de contracter, contenu licite et certain."},{"id":"cejmq8","q":"Quelles sont les 3 fonctions de l'État selon Musgrave ?","o":["Produire, vendre, taxer","Allocation, redistribution, régulation","Législatif, exécutif, judiciaire","Croissance, emploi, prix"],"a":1,"e":"Allocation, redistribution et régulation (stabilisation)."},{"id":"cejmq9","q":"Quel est l'objectif d'inflation de la BCE ?","o":["0 %","1 %","2 % à moyen terme","5 %"],"a":2,"e":"La BCE vise une inflation de 2 % à moyen terme."},{"id":"cejmq10","q":"Combien de temps une marque est-elle protégée ?","o":["5 ans","10 ans, renouvelable sans limite","20 ans maximum","70 ans après la mort"],"a":1,"e":"10 ans, renouvelable indéfiniment."},{"id":"cejmq11","q":"Quelle forme de société exige un capital minimum de 37 000 € ?","o":["SARL","SAS","SA","EURL"],"a":2,"e":"La SA ; SARL et SAS ont un capital libre."},{"id":"cejmq12","q":"Depuis le 15 mai 2022, l'entrepreneur individuel…","o":["a un patrimoine unique","a un patrimoine professionnel séparé de son patrimoine personnel","doit créer une EIRL","doit avoir 2 associés"],"a":1,"e":"Séparation des patrimoines de plein droit ; l'EIRL ne peut plus être créée."},{"id":"cejmq13","q":"Quelles sont les 3 conditions de la responsabilité civile ?","o":["Faute, amende, prison","Fait générateur, dommage, lien de causalité","Contrat, signature, témoin","Infraction, élément moral, sanction"],"a":1,"e":"Il faut un fait générateur, un dommage et un lien de causalité."},{"id":"cejmq14","q":"Durée maximale de la période d'essai initiale d'un cadre en CDI ?","o":["2 mois","3 mois","4 mois","6 mois"],"a":2,"e":"2 mois (employés), 3 mois (agents de maîtrise), 4 mois (cadres)."},{"id":"cejmq15","q":"Délai de rétractation d'une rupture conventionnelle ?","o":["7 jours","14 jours","15 jours calendaires","1 mois"],"a":2,"e":"15 jours calendaires, puis homologation par la Dreets."},{"id":"cejmq16","q":"Selon Herzberg, le salaire est…","o":["un facteur moteur","un facteur d'hygiène","un besoin d'accomplissement","sans effet"],"a":1,"e":"Il évite l'insatisfaction mais ne suffit pas à motiver."},{"id":"cejmq17","q":"Qui est l'auteur des « 5 forces » de la concurrence ?","o":["Mintzberg","Porter","Likert","Barney"],"a":1,"e":"Michael Porter."},{"id":"cejmq18","q":"Trésorerie nette =","o":["CA − charges","FRNG − BFR","Actif − passif","Ressources stables + dettes"],"a":1,"e":"Trésorerie = fonds de roulement net global − besoin en fonds de roulement."},{"id":"cejmq19","q":"Amende maximale prévue par le RGPD ?","o":["1 M€","20 M€ ou 4 % du CA mondial","10 % du CA","100 000 €"],"a":1,"e":"Jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial."},{"id":"cejmq20","q":"Quels sont les vices du consentement ?","o":["Erreur, dol, violence","Retard, oubli, faute","Prix, délai, qualité","Fraude, vol, abus"],"a":0,"e":"Ils entraînent la nullité du contrat."},{"id":"cejmq21","q":"Le dol est…","o":["une erreur de calcul","une tromperie pour obtenir le consentement","un retard de paiement","une clause du contrat"],"a":1,"e":"C'est un vice du consentement."},{"id":"cejmq22","q":"Que dit l'article 1103 du Code civil ?","o":["Le contrat légalement formé tient lieu de loi à ceux qui l'ont fait","Tout contrat doit être écrit","Le prix est libre","Le contrat peut être rompu à tout moment"],"a":0,"e":"C'est la force obligatoire du contrat."},{"id":"cejmq23","q":"Une clause abusive est…","o":["valable","réputée non écrite","punie de prison","obligatoire"],"a":1,"e":"Elle crée un déséquilibre significatif entre les parties."},{"id":"cejmq24","q":"Quels sont les 3 éléments d'une infraction pénale ?","o":["Légal, matériel, moral","Faute, dommage, lien","Offre, acceptation, prix","Plainte, enquête, procès"],"a":0,"e":"Il faut un texte, un acte et une intention (ou une faute)."},{"id":"cejmq25","q":"La responsabilité civile vise à…, la responsabilité pénale vise à…","o":["punir / réparer","réparer / punir","informer / sanctionner","prévenir / réparer"],"a":1,"e":"Civil : réparer le dommage. Pénal : punir l'auteur."},{"id":"cejmq26","q":"Lequel est un exemple d'externalité négative ?","o":["Une abeille qui pollinise un verger voisin","La pollution d'une usine qui gêne les riverains","Une baisse de prix","Une prime aux salariés"],"a":1,"e":"Effet subi par un tiers sans compensation."},{"id":"cejmq27","q":"En concurrence pure et parfaite, l'« atomicité » signifie…","o":["des produits identiques","beaucoup d'acheteurs et de vendeurs, aucun ne pèse sur le prix","une information parfaite","la libre entrée"],"a":1,"e":"C'est l'une des 5 conditions du modèle."},{"id":"cejmq28","q":"Un oligopole, c'est un marché avec…","o":["un seul offreur","quelques offreurs","une infinité d'offreurs","un seul acheteur"],"a":1,"e":"Ex. : téléphonie mobile, compagnies aériennes."},{"id":"cejmq29","q":"Les externalités de réseau signifient qu'un service…","o":["coûte plus cher avec plus d'utilisateurs","vaut plus quand il a plus d'utilisateurs","est gratuit","est interdit"],"a":1,"e":"D'où des géants du numérique qui « raflent tout »."},{"id":"cejmq30","q":"Ce qui caractérise le salarié, c'est…","o":["un salaire élevé","un lien de subordination avec l'employeur","un CDI","un bureau"],"a":1,"e":"Ordres, contrôle et pouvoir de sanction de l'employeur."},{"id":"cejmq31","q":"Le CDD est…","o":["la règle","l'exception, réservé à des cas limités","interdit","toujours renouvelable sans limite"],"a":1,"e":"Le CDI reste la forme normale du contrat de travail."},{"id":"cejmq32","q":"Dans la matrice BCG, une « vache à lait » est un domaine…","o":["à forte croissance et faible part de marché","à faible croissance et forte part de marché","en déclin et sans part de marché","très innovant"],"a":1,"e":"Il rapporte de l'argent qui finance les autres activités."},{"id":"cejmq33","q":"Selon l'effet d'expérience, à chaque doublement de la production cumulée, le coût unitaire baisse de…","o":["5 %","20 à 30 %","50 %","rien"],"a":1,"e":"C'est l'effet d'expérience mis en évidence par le BCG."},{"id":"cejmq34","q":"Le droit d'auteur protège une œuvre…","o":["après dépôt à l'INPI","sans formalité, jusqu'à 70 ans après la mort de l'auteur","20 ans","10 ans renouvelables"],"a":1,"e":"Contrairement à la marque ou au brevet, aucun dépôt n'est nécessaire."},{"id":"cejmq35","q":"Quel auteur parle de « destruction créatrice » ?","o":["Keynes","Schumpeter","Solow","Musgrave"],"a":1,"e":"L'innovation détruit d'anciennes activités et en crée de nouvelles."},{"id":"cejmq36","q":"Selon Freeman, les parties prenantes sont…","o":["seulement les actionnaires","tous les acteurs concernés par l'activité de l'entreprise","les concurrents","l'État"],"a":1,"e":"Salariés, clients, fournisseurs, État, ONG, actionnaires…"},{"id":"cejmq37","q":"Lesquels sont des agents économiques ?","o":["Ménages, entreprises, administrations, banques, reste du monde","Seulement les entreprises et l'État","Clients, fournisseurs et concurrents","Salariés, cadres et dirigeants"],"a":0,"e":"On compte 5 agents : ménages, entreprises, administrations publiques, banques (institutions financières) et reste du monde."},{"id":"cejmq38","q":"Un marché, c'est…","o":["Un magasin où l'on vend des produits","La rencontre de l'offre et de la demande, qui fixe un prix","Un contrat entre deux entreprises","L'ensemble des clients d'une entreprise"],"a":1,"e":"Le marché est le lieu, réel ou virtuel, où l'offre et la demande se rencontrent et fixent un prix d'équilibre."},{"id":"cejmq39","q":"Laquelle n'est PAS une condition de la concurrence pure et parfaite ?","o":["Atomicité","Transparence de l'information","Différenciation des produits","Libre entrée et sortie"],"a":2,"e":"La CPP suppose au contraire des produits homogènes. Les 5 conditions : atomicité, homogénéité, libre entrée/sortie, transparence, mobilité des facteurs."},{"id":"cejmq40","q":"Un marché avec un seul offreur est un…","o":["Oligopole","Monopole","Monopsone","Marché concurrentiel"],"a":1,"e":"Monopole : 1 offreur. Oligopole : quelques offreurs."},{"id":"cejmq41","q":"La concurrence monopolistique, c'est…","o":["Un seul vendeur protégé par l'État","Beaucoup de vendeurs aux produits différenciés","Deux vendeurs qui s'entendent","Un marché sans prix"],"a":1,"e":"Chaque entreprise a un petit « monopole » sur son produit différencié (marque, design), mais la concurrence reste forte."},{"id":"cejmq42","q":"Un brevet ou une forte notoriété des marques en place sont des exemples de…","o":["Externalités","Barrières à l'entrée","Économies d'échelle","Facteurs d'hygiène"],"a":1,"e":"Les barrières à l'entrée freinent l'arrivée de nouveaux concurrents : coûts d'installation, brevets, réglementation, notoriété."},{"id":"cejmq43","q":"Quel auteur a illustré l'asymétrie d'information avec le marché des voitures d'occasion ?","o":["Keynes","Akerlof","Pigou","Solow"],"a":1,"e":"George Akerlof (1970), « The Market for Lemons »."},{"id":"cejmq44","q":"Quel remède limite l'asymétrie d'information ?","o":["Une baisse des prix","Une garantie ou un label","Une augmentation de capital","Une clause pénale"],"a":1,"e":"Garanties, labels et avis clients réduisent l'écart d'information entre vendeur et acheteur."},{"id":"cejmq45","q":"Quel auteur propose une taxe pour corriger les externalités négatives ?","o":["Pigou","Porter","Barney","Mayo"],"a":0,"e":"Arthur Pigou : la « taxe pigouvienne » fait payer au pollueur le coût qu'il impose aux autres."},{"id":"cejmq46","q":"Le crédit bancaire est un financement…","o":["Direct","Indirect","Interne","Participatif"],"a":1,"e":"Financement indirect : la banque sert d'intermédiaire. Le financement direct passe par le marché financier (actions, obligations)."},{"id":"cejmq47","q":"Quel article du Code civil pose le principe de bonne foi dans les contrats ?","o":["Art. 1102","Art. 1104","Art. 1240","Art. 1366"],"a":1,"e":"Art. 1102 : liberté contractuelle. Art. 1103 : force obligatoire. Art. 1104 : bonne foi."},{"id":"cejmq48","q":"Pour qu'un contrat soit formé, il faut…","o":["Un écrit signé devant notaire","Une offre précise et ferme et une acceptation","Un paiement immédiat","L'accord d'un juge"],"a":1,"e":"Le contrat se forme par la rencontre d'une offre (précise et ferme) et d'une acceptation."},{"id":"cejmq49","q":"Un vice du consentement entraîne…","o":["La résolution du contrat","La nullité du contrat","Une amende pénale","Une simple renégociation"],"a":1,"e":"Erreur, dol et violence entraînent la nullité : le contrat disparaît comme s'il n'avait jamais existé."},{"id":"cejmq50","q":"Quelle est la différence entre nullité et résolution ?","o":["Aucune, ce sont des synonymes","La nullité sanctionne un problème de formation, la résolution une inexécution","La nullité est pénale, la résolution civile","La résolution concerne seulement les contrats de travail"],"a":1,"e":"Nullité = contrat mal formé. Résolution = contrat bien formé mais mal exécuté."},{"id":"cejmq51","q":"La clause de réserve de propriété permet au vendeur…","o":["De rester propriétaire tant que le prix n'est pas entièrement payé","De fixer une pénalité de retard","D'interdire au salarié de travailler chez un concurrent","De limiter sa responsabilité"],"a":0,"e":"Si l'acheteur ne paie pas, le vendeur peut récupérer le bien."},{"id":"cejmq52","q":"Une clause fixant à l'avance l'indemnité due en cas d'inexécution est une clause…","o":["De non-concurrence","Pénale","Abusive","De réserve de propriété"],"a":1,"e":"La clause pénale fixe forfaitairement les dommages et intérêts."},{"id":"cejmq53","q":"Combien de sanctions de l'inexécution prévoit l'article 1217 du Code civil ?","o":["2","3","5","7"],"a":2,"e":"Exception d'inexécution, exécution forcée en nature, réduction du prix, résolution, dommages et intérêts."},{"id":"cejmq54","q":"Un client refuse de payer tant que le fournisseur n'a pas livré : c'est…","o":["La résolution","L'exception d'inexécution","L'imprévision","La réduction du prix"],"a":1,"e":"L'exception d'inexécution permet de suspendre sa propre obligation tant que l'autre n'exécute pas la sienne."},{"id":"cejmq55","q":"Un employeur est responsable des dommages causés par ses salariés sur le fondement…","o":["Du fait d'autrui (art. 1242)","De la responsabilité pénale","Du contrat de travail uniquement","De l'imprévision"],"a":0,"e":"L'article 1242 prévoit la responsabilité du fait des choses et du fait d'autrui, dont celle de l'employeur (commettant)."},{"id":"cejmq56","q":"Une société peut-elle être pénalement responsable ?","o":["Non, seules les personnes physiques le peuvent","Oui, selon l'article 121-2 du Code pénal","Seulement si c'est une SA","Seulement en cas de crime"],"a":1,"e":"Les personnes morales peuvent être déclarées pénalement responsables (art. 121-2 C. pénal)."},{"id":"cejmq57","q":"Les trois catégories d'infractions sont…","o":["Faute, dommage, lien","Contravention, délit, crime","Amende, prison, travail","Légal, matériel, moral"],"a":1,"e":"Contravention, délit et crime. (Légal, matériel, moral sont les éléments constitutifs.)"},{"id":"cejmq58","q":"Quelles sont les finalités de l'entreprise ?","o":["Économique seulement","Économique, sociale et sociétale","Fiscale et juridique","Commerciale et financière"],"a":1,"e":"Économique (profit, pérennité), sociale (emploi, salariés), sociétale (environnement, territoire)."},{"id":"cejmq59","q":"Les actionnaires sont des parties prenantes…","o":["Externes","Internes","Publiques","Secondaires"],"a":1,"e":"Parties prenantes internes : salariés, dirigeants, actionnaires. Externes : clients, fournisseurs, État, ONG…"},{"id":"cejmq60","q":"Créer, innover, prendre des risques relève de la logique…","o":["Managériale","Entrepreneuriale","Bureaucratique","Juridique"],"a":1,"e":"Logique entrepreneuriale : créer et innover. Logique managériale : organiser, coordonner, optimiser."},{"id":"cejmq61","q":"La croissance économique, c'est…","o":["Une hausse générale des prix","Une hausse durable du PIB","Une baisse du chômage","Une hausse des taux d'intérêt"],"a":1,"e":"La croissance est l'augmentation durable de la richesse produite, mesurée par le PIB."},{"id":"cejmq62","q":"L'inflation est…","o":["Une baisse des prix","Une hausse générale et durable des prix","Une hausse du PIB","Une hausse ponctuelle d'un seul prix"],"a":1,"e":"Elle réduit le pouvoir d'achat. Elle peut venir de la demande ou des coûts."},{"id":"cejmq63","q":"Le chômage lié au temps de passage d'un emploi à un autre est…","o":["Conjoncturel","Structurel","Frictionnel","Saisonnier"],"a":2,"e":"Frictionnel : délai de recherche. Conjoncturel : ralentissement de l'activité. Structurel : inadéquation durable."},{"id":"cejmq64","q":"Qui mène la politique monétaire dans la zone euro ?","o":["Le gouvernement français","La Banque centrale européenne","La Commission européenne","Le Parlement européen"],"a":1,"e":"La BCE agit surtout via ses taux directeurs."},{"id":"cejmq65","q":"Une baisse d'impôts pour relancer la consommation relève de la politique…","o":["Monétaire","Budgétaire","Structurelle de formation","De concurrence"],"a":1,"e":"La politique budgétaire joue sur les dépenses et recettes publiques."},{"id":"cejmq66","q":"Quelle autorité contrôle les marchés financiers en France ?","o":["CNIL","AMF","ARCOM","DGCCRF"],"a":1,"e":"AMF : Autorité des marchés financiers. CNIL : données. ARCOM : audiovisuel et numérique."},{"id":"cejmq67","q":"Amende maximale pour une entente ou un abus de position dominante ?","o":["1 % du CA national","10 % du CA mondial","20 M€ fixes","4 % du CA mondial"],"a":1,"e":"Jusqu'à 10 % du chiffre d'affaires mondial. (L
