chise, joint-venture."},{"id":"cejmq122","q":"Selon l'UE, la règle de déficit public est de…","o":["1 % du PIB","3 % du PIB","60 % du PIB","10 % du PIB"],"a":1,"e":"Déficit limité à 3 % du PIB, dette à 60 % (règles réformées en 2024)."},{"id":"cejmq123","q":"Un règlement européen…","o":["Doit être transposé en droit national","S'applique directement dans tous les pays","N'a qu'une valeur de conseil","Ne concerne que la zone euro"],"a":1,"e":"La directive, elle, doit être transposée."},{"id":"cejmq124","q":"Selon Solow, la croissance vient surtout…","o":["Du travail des enfants","Du progrès technique","De l'inflation","Des importations"],"a":1,"e":"Robert Solow : le progrès technique est le moteur principal."},{"id":"cejmq125","q":"Selon Keynes, en cas de chômage, l'État doit…","o":["Ne rien faire","Relancer la demande","Augmenter les impôts","Réduire les salaires"],"a":1,"e":"Relance budgétaire pour soutenir la demande et l'emploi."},{"id":"cejmq126","q":"Le contrôle par objectifs, budgets et tableaux de bord est un contrôle…","o":["Par la culture","Par les résultats","Par les règles","Par la supervision directe"],"a":1,"e":"On compare les résultats aux objectifs (analyse des écarts)."},{"id":"cejmq127","q":"Le taux de turnover mesure…","o":["Les ventes par salarié","La rotation du personnel (départs et remplacements)","L'absentéisme","La part de marché"],"a":1,"e":"Indicateur social de performance : un turnover élevé peut révéler un problème de motivation."},{"id":"cejmq128","q":"Depuis le 11 août 2026, prospecter un particulier par téléphone exige…","o":["Son inscription sur Bloctel","Son consentement préalable","Un courrier recommandé","Rien"],"a":1,"e":"Bloctel disparaît : on passe à l'opt-in."},{"id":"cejmq129","q":"Le 20 novembre 2026, quelle réforme entre en vigueur ?","o":["La réforme du crédit à la consommation","Le RGPD","La loi Doubin","La réforme des retraites"],"a":0,"e":"Le paiement fractionné et la LOA entrent dans le régime du crédit."},{"id":"cejmq130","q":"Ces réformes de 2026 illustrent surtout…","o":["La liberté contractuelle totale","La protection de la partie faible par le droit","La fin du droit de la consommation","La politique monétaire"],"a":1,"e":"Exemple daté à placer en thème 2 ou 4."}],"r":[{"id":"cejmr0","q":"Un cadre en CDI voit sa période d'essai de 4 mois renouvelée, alors qu'aucun accord de branche ne le prévoit. Est-ce légal ? Rédige un raisonnement juridique.","p":[{"t":"Les faits résumés juridiquement","k":["cadre","cdi","salarie"]},{"t":"Le problème juridique","k":["peut-il","peut il","renouvel","periode d'essai"]},{"t":"La règle : 4 mois, renouvelable seulement si un accord de branche le prévoit","k":["accord de branche","4 mois","code du travail","l1221"]},{"t":"Une solution claire","k":["illegal","pas legal","pas possible","ne peut pas","irregulier","non"]}],"m":"Faits : un salarié cadre en CDI a une période d'essai de 4 mois, que l'employeur renouvelle. Problème : un employeur peut-il renouveler la période d'essai d'un cadre sans accord de branche ? Règle : le Code du travail (art. L1221-19 et suivants) fixe la période d'essai d'un cadre à 4 mois maximum ; elle ne peut être renouvelée qu'une fois, et seulement si un accord de branche étendu le prévoit et si le contrat le stipule. Solution : ici, aucun accord de branche ne le prévoit, donc le renouvellement n'est pas légal."},{"id":"cejmr1","q":"Mme Durand a acheté une robe sur un site internet. Elle l'a reçue il y a 10 jours et veut la renvoyer sans donner de raison. Le peut-elle ?","p":[{"t":"Identifier le droit de rétractation","k":["retract"]},{"t":"Le délai de 14 jours","k":["14"]},{"t":"Vente à distance, depuis la réception du bien","k":["distance","en ligne","internet","reception"]},{"t":"Une solution claire","k":["oui","elle peut","dans le delai"]}],"m":"Faits : une consommatrice a acheté un bien à distance et l'a reçu il y a 10 jours. Problème : un consommateur peut-il renoncer à un achat à distance sans motif ? Règle : le Code de la consommation (art. L221-18) lui donne 14 jours pour se rétracter, sans motif ; pour un bien, le délai court à partir de la réception. Solution : Mme Durand est dans le délai (10 jours), elle peut renvoyer la robe et être remboursée."},{"id":"cejmr2","q":"Explique la différence entre politique budgétaire et politique monétaire.","p":[{"t":"Budgétaire : menée par l'État","k":["etat","gouvernement"]},{"t":"Elle joue sur les dépenses et les impôts","k":["depense","impot","recette","budget"]},{"t":"Monétaire : menée par la BCE","k":["bce","banque centrale"]},{"t":"Elle joue sur les taux d'intérêt","k":["taux"]}],"m":"La politique budgétaire est menée par l'État : il agit sur l'économie par ses dépenses publiques et ses recettes (impôts). La politique monétaire est menée, dans la zone euro, par la Banque centrale européenne : elle agit surtout sur les taux d'intérêt directeurs, avec pour objectif une inflation de 2 % à moyen terme."},{"id":"cejmr3","q":"Qu'est-ce qu'une asymétrie d'information ? Comment une entreprise peut-elle la réduire ?","p":[{"t":"Une partie en sait plus que l'autre","k":["en sait plus","plus d'information","information","une partie"]},{"t":"Un exemple ou Akerlof","k":["akerlof","occasion","voiture"]},{"t":"Des solutions : garantie, label, avis, transparence","k":["garantie","label","avis","transparen","certif"]}],"m":"Il y a asymétrie d'information quand une partie à l'échange en sait plus que l'autre : le vendeur d'une voiture d'occasion connaît ses défauts, pas l'acheteur (Akerlof, 1970). Le client se méfie et hésite à acheter. L'entreprise peut la réduire en donnant des garanties, en obtenant des labels ou certifications, en publiant des avis clients et en étant transparente sur ses produits."},{"id":"cejmr4","q":"Compare la SARL et la SAS sur trois critères.","p":[{"t":"Le nombre d'associés","k":["associe","100","eurl","sasu"]},{"t":"Le capital","k":["capital","libre"]},{"t":"La responsabilité limitée aux apports","k":["responsabilite","apports","limitee"]},{"t":"La liberté des statuts et la direction","k":["statut","liberte","gerant","president","souple"]}],"m":"Associés : la SARL accueille de 1 (EURL) à 100 associés ; la SAS, 1 (SASU) ou plus, sans maximum. Capital : libre dans les deux cas. Responsabilité : limitée aux apports dans les deux. La grande différence est la souplesse : la SAS permet de rédiger librement ses statuts et est dirigée par un président, alors que la SARL, dirigée par un gérant, est plus encadrée par la loi."},{"id":"cejmr5","q":"Explique la théorie de Herzberg et applique-la à une entreprise qui veut motiver ses salariés.","p":[{"t":"Les facteurs d'hygiène","k":["hygiene"]},{"t":"Les facteurs moteurs","k":["moteur","motiv"]},{"t":"Exemple d'hygiène : salaire, conditions","k":["salaire","condition","prime"]},{"t":"Exemple de moteur : reconnaissance, responsabilités","k":["reconnaiss","responsabilit","autonom","evolution"]}],"m":"Herzberg distingue les facteurs d'hygiène (salaire, conditions de travail), qui évitent l'insatisfaction sans motiver, et les facteurs moteurs (reconnaissance, responsabilités, autonomie), qui motivent vraiment. Une entreprise qui veut motiver ne doit donc pas seulement augmenter les salaires : elle doit aussi reconnaître le travail de ses salariés, leur confier des responsabilités et leur offrir des perspectives d'évolution."},{"id":"cejmr6","q":"Qu'est-ce que le RGPD ? Cite trois obligations pour une entreprise.","p":[{"t":"Protéger les données personnelles","k":["donnees personnelles","donnee","rgpd"]},{"t":"Une base légale, souvent le consentement","k":["consentement","base legale"]},{"t":"Finalité, minimisation, sécurité, durée","k":["finalite","minimis","securi","duree","conserv"]},{"t":"Les droits des personnes ou les sanctions","k":["droit d'acces","effacement","rectification","opposition","cnil","amende","4 %"]}],"m":"Le RGPD est le règlement européen sur la protection des données personnelles, appliqué depuis le 25 mai 2018. Une entreprise doit notamment : collecter les données pour un but précis avec une base légale (souvent le consentement) ; ne collecter que les données utiles et les sécuriser ; respecter les droits des personnes (accès, rectification, effacement). La CNIL contrôle et peut infliger une amende jusqu'à 20 M€ ou 4 % du CA mondial."},{"id":"cejmr7","q":"Présente les stratégies génériques de Porter avec un exemple pour chacune.","p":[{"t":"Domination par les coûts","k":["cout","domination","moins cher"]},{"t":"Différenciation","k":["differenciation","unique"]},{"t":"Focalisation (niche)","k":["focalisation","niche"]},{"t":"Des exemples d'entreprises","k":["lidl","ryanair","apple","aldi","rolex","easyjet"]}],"m":"Porter distingue trois stratégies : la domination par les coûts (être le moins cher, comme Lidl ou Ryanair) ; la différenciation (proposer une offre perçue comme unique, comme Apple) ; la focalisation (se concentrer sur une niche, par exemple une marque de matériel pour un seul sport)."}],"cs":[{"id":"cejmc0","t":"La boulangerie Pain & Co","x":["Léa dirige la SARL Pain & Co, une boulangerie de 6 salariés à Tours. Le 3 mars, elle commande un four à la société FourPro pour 18 000 € HT, livraison promise le 15 avril.","Le four n'est toujours pas livré le 30 mai. Léa a dû louer un four de remplacement (2 400 €). FourPro explique que son propre fournisseur est en retard.","Par ailleurs, Léa hésite à embaucher un boulanger en CDD pour l'été, car elle a peur que l'activité baisse à la rentrée."],"q":[{"id":"cejmc0q0","q":"Rédige un raisonnement juridique : Léa peut-elle obtenir réparation de FourPro ?","p":[{"t":"Les faits et le problème juridique","k":["contrat","vente","retard","livraison","peut-elle","peut elle"]},{"t":"La règle : inexécution du contrat (art. 1217 et 1231-1 C. civ.)","k":["1217","inexecution","1231","dommages et interets","dommages-interets"]},{"t":"L'application : le retard cause un dommage (location de 2 400 €)","k":["2 400","2400","location","dommage","prejudice"]},{"t":"Une solution claire","k":["oui","peut obtenir","doit reparer","doit payer","reparation"]}],"m":"Faits : la SARL Pain & Co a acheté un four à FourPro, livraison promise le 15 avril, toujours pas livré fin mai. Problème : un acheteur peut-il obtenir réparation quand le vendeur n'exécute pas son obligation de livrer à temps ? Règle : selon l'article 1217 du Code civil, en cas d'inexécution, le créancier peut notamment demander des dommages et intérêts ; l'article 1231-1 oblige le débiteur à réparer le préjudice causé par le retard. Le retard d'un fournisseur de FourPro ne l'exonère pas, car ce n'est pas un cas de force majeure imprévisible et irrésistible. Solution : Léa peut obtenir des dommages et intérêts, au moins les 2 400 € de location, et peut aussi demander la livraison forcée ou la résolution du contrat."},{"id":"cejmc0q1","q":"Quelles autres sanctions de l'inexécution Léa pourrait-elle choisir ? Cites-en deux.","p":[{"t":"Exécution forcée en nature (exiger la livraison)","k":["execution forcee","forcer","exiger la livraison","en nature"]},{"t":"Résolution du contrat","k":["resolution","annuler","mettre fin","rompre"]},{"t":"Autre : exception d'inexécution ou réduction du prix","k":["exception","ne pas payer","suspendre","reduction du prix"]}],"m":"L'article 1217 prévoit 5 sanctions. Léa peut exiger l'exécution forcée en nature (la livraison du four), demander la résolution du contrat (y mettre fin et être remboursée), invoquer l'exception d'inexécution (ne pas payer tant que le four n'est pas livré), obtenir une réduction du prix, et cumuler avec des dommages et intérêts."},{"id":"cejmc0q2","q":"Léa hésite à embaucher. Quel contrat lui conseilles-tu, et pourquoi ?","p":[{"t":"Le CDD saisonnier ou d'accroissement temporaire d'activité","k":["cdd","saisonnier","accroissement","temporaire"]},{"t":"Le CDI est la règle, le CDD une exception à justifier","k":["exception","cdi","regle","motif","cas limites"]},{"t":"Lien avec la crainte de Léa : le contrat prend fin à une date prévue","k":["fin","terme","date","rentree","flexibilite"]}],"m":"Le CDI est le contrat de droit commun, mais le CDD est possible dans des cas limités, notamment pour un accroissement temporaire d'activité ou un emploi saisonnier. Ici, le pic d'activité de l'été justifie un CDD : il prend fin à une date prévue, ce qui répond à la crainte de Léa d'une baisse d'activité à la rentrée."}]},{"id":"cejmc1","t":"La start-up VéloVert","x":["VéloVert, une SAS créée en 2023, loue des vélos électriques par abonnement mensuel via une application. Elle a 12 000 abonnés dans 3 villes.","Un concurrent international vient de s'installer avec des prix 20 % plus bas. VéloVert mise sur un service de réparation en 24 h et des vélos fabriqués en France.","L'appli collecte la position GPS des vélos et les données de paiement des clients."],"q":[{"id":"cejmc1q0","q":"Quelle stratégie générique de Porter VéloVert suit-elle ? Justifie avec le texte.","p":[{"t":"La différenciation","k":["differenciation","differencier"]},{"t":"Preuve : réparation en 24 h, fabrication française","k":["24 h","24h","reparation","france","francais"]},{"t":"Elle ne peut pas être la moins chère : le concurrent est 20 % moins cher","k":["20 %","20%","moins cher","prix","cout"]}],"m":"VéloVert suit une stratégie de différenciation (Porter) : elle propose une offre perçue comme supérieure, avec la réparation en 24 h et des vélos fabriqués en France. Elle ne peut pas jouer la domination par les coûts, puisque le concurrent est 20 % moins cher ; elle doit donc justifier un prix plus élevé par la qualité de service."},{"id":"cejmc1q1","q":"Identifie 2 menaces et 2 opportunités pour VéloVert (diagnostic externe).","p":[{"t":"Menace : l'arrivée d'un concurrent moins cher","k":["concurrent","nouvel entrant","20 %","20%","moins cher"]},{"t":"Autre menace (ex. réglementation, prix de l'énergie, vol)","k":["reglementation","vol","rgpd","energie","batterie","meteo"]},{"t":"Opportunité : la mobilité durable et le made in France","k":["ecologi","durable","made in france","mobilite","environnement"]},{"t":"Autre opportunité (ex. aides publiques, villes qui développent les pistes)","k":["aide","piste","ville","collectivite","abonnement","teletravail"]}],"m":"Menaces : l'arrivée d'un concurrent international moins cher (nouvel entrant), le risque de vol et de dégradation, une réglementation plus stricte sur les données. Opportunités : l'essor de la mobilité durable, l'attrait pour le made in France, les aides des collectivités et le développement des pistes cyclables."},{"id":"cejmc1q2","q":"Quelles obligations du RGPD VéloVert doit-elle respecter pour les données GPS et de paiement ?","p":[{"t":"Une finalité précise et une base légale","k":["finalite","but","base legale","consentement","contrat"]},{"t":"Minimiser et sécuriser les données","k":["minimis","securis","protege","necessaire"]},{"t":"Informer les clients et respecter leurs droits (accès, effacement…)","k":["informer","droit","acces","effacement","rectification","opposition"]},{"t":"Sanction possible : jusqu'à 20 M€ ou 4 % du CA mondial","k":["20 m","4 %","4%","sanction","amende","cnil"]}],"m":"VéloVert doit collecter ces données pour une finalité précise (localiser les vélos, encaisser l'abonnement) avec une base légale (le contrat), ne garder que les données nécessaires, les sécuriser, informer les clients et respecter leurs droits d'accès, de rectification et d'effacement. La CNIL peut sanctionner jusqu'à 20 M€ ou 4 % du CA mondial."}]},{"id":"cejmc2","t":"Le magasin Déco+ et son équipe","x":["Karim manage les 8 vendeurs du magasin Déco+. Le chiffre d'affaires baisse et l'absentéisme augmente.","Karim décide seul des plannings et des objectifs, sans consulter l'équipe. Les vendeurs disent manquer de reconnaissance.","La direction propose une prime de 100 € par mois pour relancer la motivation."],"q":[{"id":"cejmc2q0","q":"Caractérise le style de management de Karim (Likert).","p":[{"t":"Style autoritaire","k":["autoritaire","directif"]},{"t":"Preuve : il décide seul, sans consulter","k":["seul","sans consulter","ne consulte","impose"]},{"t":"Conséquence : démotivation, absentéisme","k":["absenteisme","demotiv","motivation","baisse"]}],"m":"Karim a un style de management autoritaire selon Likert : il décide seul des plannings et des objectifs, sans consulter son équipe. Ce style peut expliquer la démotivation des vendeurs, visible dans la hausse de l'absentéisme et la baisse du CA."},{"id":"cejmc2q1","q":"La prime de 100 € suffira-t-elle ? Réponds avec Herzberg.","p":[{"t":"Le salaire est un facteur d'hygiène","k":["hygiene","facteur d'hygiene"]},{"t":"Il évite l'insatisfaction mais ne motive pas durablement","k":["insatisfaction","ne motive pas","ne suffit pas","pas suffisant"]},{"t":"Il faut des facteurs moteurs : reconnaissance, responsabilité","k":["reconnaissance","moteur","responsabilit","autonomie"]}],"m":"Selon Herzberg, la rémunération est un facteur d'hygiène : elle évite l'insatisfaction mais ne crée pas de motivation durable. Comme les vendeurs se plaignent surtout d'un manque de reconnaissance, la prime ne suffira pas : il faut agir sur les facteurs moteurs (reconnaissance, responsabilités, participation aux décisions)."},{"id":"cejmc2q2","q":"Propose deux actions concrètes à Karim.","p":[{"t":"Associer l'équipe aux décisions (style participatif ou consultatif)","k":["participatif","consultatif","consulter","associer","reunion","impliquer"]},{"t":"Valoriser et reconnaître le travail (félicitations, challenges)","k":["feliciter","valoriser","reconnaissance","challenge","remercier"]},{"t":"Fixer des objectifs clairs et partagés, ou former","k":["objectif","smart","former","formation","entretien"]}],"m":"Karim peut adopter un style plus participatif : construire les plannings et les objectifs avec l'équipe lors d'une réunion hebdomadaire. Il peut aussi valoriser les réussites (félicitations en public, challenge collectif récompensé) et proposer des entretiens individuels avec des objectifs SMART et des formations."}]}]},{"k":"e4","n":"Négociation-vente","s":"E4 · Relation client","c":"#2F5BEA","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 1 · Épreuve E4<\/span>\n<div style=\"font-weight:800;--big:1\"><span style=\"color:#2F5BEA\">Relation client<\/span><br><span style=\"color:#F25C2B\">&amp; négociation-vente<\/span><\/div>\n<p>L'épreuve la plus lourde de ton BTS. Tout pour la réussir : le déroulement, les fiches E4, les 4 compétences, les techniques de vente, les calculs et le droit utile.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 5<\/span><span class=\"sm\" style=\"color:#D6D8E6\">la plus forte du BTS<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Oral<\/span><span class=\"sm\" style=\"color:#D6D8E6\">sur tes 2 fiches E4<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">1 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">en ponctuel, après 40 min de préparation<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">20 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">de simulation de vente<\/span><\/div>\n<\/div>\n<h2>Les 4 compétences évaluées<\/h2>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><h3>Cibler et prospecter la clientèle<\/h3><p class=\"sm\">Analyser le portefeuille, choisir des cibles, prospecter, évaluer, développer ses réseaux.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C2<\/span><h3>Négocier et accompagner la relation client<\/h3><p class=\"sm\">Découvrir le client, négocier, vendre une solution adaptée, construire une relation durable.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C3<\/span><h3>Organiser et animer un évènement commercial<\/h3><p class=\"sm\">Salon, portes ouvertes, animation de point de vente : organiser, animer, faire le bilan.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C4<\/span><h3>Exploiter et mutualiser l'information commerciale<\/h3><p class=\"sm\">Collecter, analyser, partager l'information ; faire des propositions.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>09<\/b> · C2 : B2B, réclamations, fidélisation<\/span>\n<span><b>03<\/b> · Réussir ses fiches E4<\/span><span><b>10<\/b> · C3 : l'évènement commercial<\/span>\n<span><b>04–05<\/b> · C1 : portefeuille et prospection<\/span><span><b>11<\/b> · C4 : l'information commerciale<\/span>\n<span><b>06<\/b> · C2 : la communication<\/span><span><b>12<\/b> · Les calculs commerciaux<\/span>\n<span><b>07–08<\/b> · C2 : les étapes de la vente<\/span><span><b>13<\/b> · Le droit utile<\/span>\n<span><\/span><span><b>14–15<\/b> · La simulation, kit et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 1 · épreuve e4 relation client & négociation-vente l'épreuve la plus lourde de ton bts. tout pour la réussir : le déroulement, les fiches e4, les 4 compétences, les techniques de vente, les calculs et le droit utile. coef. 5 la plus forte du bts oral sur tes 2 fiches e4 1 h en ponctuel, après 40 min de préparation 20 min de simulation de vente les 4 compétences évaluées c1 cibler et prospecter la clientèle analyser le portefeuille, choisir des cibles, prospecter, évaluer, développer ses réseaux. c2 négocier et accompagner la relation client découvrir le client, négocier, vendre une solution adaptée, construire une relation durable. c3 organiser et animer un évènement commercial salon, portes ouvertes, animation de point de vente : organiser, animer, faire le bilan. c4 exploiter et mutualiser l'information commerciale collecter, analyser, partager l'information ; faire des propositions. 02 · le déroulement de l'épreuve 09 · c2 : b2b, réclamations, fidélisation 03 · réussir ses fiches e4 10 · c3 : l'évènement commercial 04–05 · c1 : portefeuille et prospection 11 · c4 : l'information commerciale 06 · c2 : la communication 12 · les calculs commerciaux 07–08 · c2 : les étapes de la vente 13 · le droit utile 14–15 · la simulation, kit et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">Ta forme dépend de ton statut : en lycée ou en CFA habilité, c'est en général le CCF ; en candidat libre ou dans certains centres, c'est l'épreuve ponctuelle. Vérifie auprès de ton établissement.<\/p>\n<div class=\"card dark\" style=\"gap:10px\"><h3>L'épreuve ponctuelle : 40 min de préparation, puis 1 h d'oral en 3 temps<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700\">\n<div class=\"fB\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">1 · Ciblage et prospection · 20 min<\/div>\n<div class=\"fO\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#16182B\">2 · Simulation · 20 min<\/div>\n<div class=\"fG\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">3 · Information · 20 min<\/div>\n<\/div>\n<div class=\"g3 sm\" style=\"color:#E4E5EE\"><span>Tu présentes ta démarche de ciblage et de prospection (10 min max), puis entretien avec le jury (10 min max).<\/span><span>À partir d'une « fiche-sujet » qui modifie une de tes deux fiches : une vente ou un échange sur un évènement, joué avec un membre du jury. Puis échange sur ta prestation.<\/span><span>Tu présentes comment tu as exploité et partagé l'information sur tes deux activités (10 min max), puis entretien (10 min max).<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>Le CCF : 2 situations<\/h3><ul class=\"sm\"><li><b>Situation A<\/b> : ciblage, prospection, exploitation et partage de l'information, à partir des activités de ton dossier, évalués pendant la formation.<\/li><li><b>Situation B<\/b> : une simulation de 20 min sur une fiche-sujet remise à l'avance, suivie d'un échange et d'une analyse de ta prestation.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Le jury<\/h3><ul class=\"sm\"><li>En ponctuel : un professeur du bloc 1 et un professionnel.<\/li><li>En CCF : tes professeurs du bloc 1, parfois avec des professionnels.<\/li><li>Seule ta <b>prestation<\/b> est notée, pas le dossier lui-même.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>La fiche-sujet de la simulation<\/h3><p class=\"sm\">Elle reprend une de tes deux activités en changeant des paramètres : un autre client, une objection nouvelle, un budget réduit, un délai plus court… Les changements sont importants mais réalistes. Pendant la préparation, tu peux utiliser ton dossier et tes propres outils numériques, chargés à l'avance.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\">\n<tr><th>Compétence<\/th><th>Critères de la grille nationale<\/th><\/tr>\n<tr><td data-label=\"Compétence\" class=\"tB\">C1 · Cibler, prospecter<\/td><td data-label=\"Critères de la grille nationale\">Analyse pertinente du portefeuille, prospects bien qualifiés, cohérence entre ciblage et prospection, efficacité des choix, usage pertinent des réseaux<\/td><\/tr>\n<tr><td data-label=\"Compétence\" class=\"tO\">C2 · Négocier<\/td><td data-label=\"Critères de la grille nationale\">Qualité de la relation, efficacité de la négociation, solution adaptée et personnalisée, qualité du diagnostic, engagements respectés, relation enrichie<\/td><\/tr>\n<tr><td data-label=\"Compétence\" class=\"tP\">C3 · Évènement<\/td><td data-label=\"Critères de la grille nationale\">Choix pertinent, organisation efficace malgré les contraintes, qualité de l'animation, bilan quantitatif et qualitatif juste, suivi rigoureux des contacts<\/td><\/tr>\n<tr><td data-label=\"Compétence\" class=\"tG\">C4 · Information<\/td><td data-label=\"Critères de la grille nationale\">Information pertinente et de qualité, bien sélectionnée et hiérarchisée, analyses et propositions de qualité<\/td><\/tr>\n<\/table>","x":"l'épreuve le déroulement de l'épreuve ta forme dépend de ton statut : en lycée ou en cfa habilité, c'est en général le ccf ; en candidat libre ou dans certains centres, c'est l'épreuve ponctuelle. vérifie auprès de ton établissement. l'épreuve ponctuelle : 40 min de préparation, puis 1 h d'oral en 3 temps 1 · ciblage et prospection · 20 min 2 · simulation · 20 min 3 · information · 20 min tu présentes ta démarche de ciblage et de prospection (10 min max), puis entretien avec le jury (10 min max). à partir d'une « fiche-sujet » qui modifie une de tes deux fiches : une vente ou un échange sur un évènement, joué avec un membre du jury. puis échange sur ta prestation. tu présentes comment tu as exploité et partagé l'information sur tes deux activités (10 min max), puis entretien (10 min max). le ccf : 2 situations situation a : ciblage, prospection, exploitation et partage de l'information, à partir des activités de ton dossier, évalués pendant la formation. situation b : une simulation de 20 min sur une fiche-sujet remise à l'avance, suivie d'un échange et d'une analyse de ta prestation. le jury en ponctuel : un professeur du bloc 1 et un professionnel. en ccf : tes professeurs du bloc 1, parfois avec des professionnels. seule ta prestation est notée, pas le dossier lui-même. la fiche-sujet de la simulation elle reprend une de tes deux activités en changeant des paramètres : un autre client, une objection nouvelle, un budget réduit, un délai plus court… les changements sont importants mais réalistes. pendant la préparation, tu peux utiliser ton dossier et tes propres outils numériques, chargés à l'avance. ce que le jury regarde compétence critères de la grille nationale c1 · cibler, prospecter analyse pertinente du portefeuille, prospects bien qualifiés, cohérence entre ciblage et prospection, efficacité des choix, usage pertinent des réseaux c2 · négocier qualité de la relation, efficacité de la négociation, solution adaptée et personnalisée, qualité du diagnostic, engagements respectés, relation enrichie c3 · évènement choix pertinent, organisation efficace malgré les contraintes, qualité de l'animation, bilan quantitatif et qualitatif juste, suivi rigoureux des contacts c4 · information information pertinente et de qualité, bien sélectionnée et hiérarchisée, analyses et propositions de qualité"},{"t":"Réussir ses fiches E4","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Réussir ses fiches E4<\/h1>\n<div class=\"card dark\" style=\"padding:16px 20px\"><p class=\"kick\" style=\"color:#FFB79A\">Attention<\/p><p>Un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante ou non signée) rend l'épreuve <b>non valide<\/b> : tu ne peux pas la passer, et donc pas obtenir le diplôme cette année-là.<\/p><\/div>\n<h2>Ce que contient le dossier<\/h2>\n<div class=\"g3\">\n<div class=\"card cO\"><span class=\"tag fO\">Fiche 1<\/span><h3>Négociation-vente et accompagnement de la relation client<\/h3><p class=\"sm\">Une vraie vente que tu as menée ou observée en entreprise.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">Fiche 2<\/span><h3>Organisation et animation d'un évènement commercial<\/h3><p class=\"sm\">Un vrai évènement : salon, portes ouvertes, animation en magasin…<\/p><\/div>\n<div class=\"card\"><span class=\"tag\" style=\"background:#16182B\">En plus<\/span><h3>Annexes et attestations<\/h3><p class=\"sm\">Une annexe recto-verso par fiche qui présente l'offre commerciale, et les attestations de stage ou de travail.<\/p><\/div>\n<\/div>\n<p class=\"sm mut\">Les fiches suivent le modèle national, avec toutes les rubriques remplies. Elles sont tapées à l'ordinateur et déposées dans les délais fixés par ton académie (ex. Île-de-France 2026 : dépôt sur Cyclades début avril).<\/p>\n<h2>Les 3 analyses que chaque fiche doit contenir<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>L'analyse en amont<\/h3><p class=\"sm\">Comment tu as ciblé et prospecté le client ou les visiteurs : portefeuille, cible, fichier, méthode, résultats.<\/p><\/div>\n<div class=\"card cG\"><h3>L'analyse de l'information<\/h3><p class=\"sm\">Le marché, le client, le secteur, la veille, et comment tu as partagé l'information (CRM, compte rendu, réunion).<\/p><\/div>\n<div class=\"card cY\"><h3>L'analyse réflexive<\/h3><p class=\"sm\">Ce qui a marché, ce qui n'a pas marché, ce que tu ferais autrement. Le jury y tient beaucoup.<\/p><\/div>\n<\/div>\n<h2>Les conseils qui font la différence<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li><b>Chiffre tout<\/b> : nombre de contacts, taux de transformation, CA, marge, budget, coût par contact.<\/li><li><b>Choisis des activités riches<\/b> : une vente avec de vraies objections, une négociation de prix, un évènement que tu as vraiment organisé.<\/li><li><b>Sois honnête<\/b> : une activité observée est acceptée, mais dis-le.<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li><b>Connais tes fiches par cœur<\/b> : le jury va modifier un paramètre pour la simulation.<\/li><li><b>Prépare l'offre<\/b> : prix, caractéristiques, concurrents, conditions de vente. C'est ta base pour argumenter.<\/li><li><b>Relis<\/b> : orthographe et présentation donnent la première impression.<\/li><\/ul><\/div>\n<\/div>","x":"l'épreuve réussir ses fiches e4 attention un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante ou non signée) rend l'épreuve non valide : tu ne peux pas la passer, et donc pas obtenir le diplôme cette année-là. ce que contient le dossier fiche 1 négociation-vente et accompagnement de la relation client une vraie vente que tu as menée ou observée en entreprise. fiche 2 organisation et animation d'un évènement commercial un vrai évènement : salon, portes ouvertes, animation en magasin… en plus annexes et attestations une annexe recto-verso par fiche qui présente l'offre commerciale, et les attestations de stage ou de travail. les fiches suivent le modèle national, avec toutes les rubriques remplies. elles sont tapées à l'ordinateur et déposées dans les délais fixés par ton académie (ex. île-de-france 2026 : dépôt sur cyclades début avril). les 3 analyses que chaque fiche doit contenir l'analyse en amont comment tu as ciblé et prospecté le client ou les visiteurs : portefeuille, cible, fichier, méthode, résultats. l'analyse de l'information le marché, le client, le secteur, la veille, et comment tu as partagé l'information (crm, compte rendu, réunion). l'analyse réflexive ce qui a marché, ce qui n'a pas marché, ce que tu ferais autrement. le jury y tient beaucoup. les conseils qui font la différence chiffre tout : nombre de contacts, taux de transformation, ca, marge, budget, coût par contact. choisis des activités riches : une vente avec de vraies objections, une négociation de prix, un évènement que tu as vraiment organisé. sois honnête : une activité observée est acceptée, mais dis-le. connais tes fiches par cœur : le jury va modifier un paramètre pour la simulation. prépare l'offre : prix, caractéristiques, concurrents, conditions de vente. c'est ta base pour argumenter. relis : orthographe et présentation donnent la première impression."},{"t":"Analyser le portefeuille et cibler","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Cibler et prospecter · 1/2<\/p><h1 style=\"--mid:1\">Analyser le portefeuille et cibler<\/h1><\/div><\/div><p class=\"mut\">Avant de prospecter, il faut savoir qui sont tes clients, lesquels rapportent, et qui viser.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Politique commerciale<\/span><h3>Le cadre<\/h3><div class=\"mini\"><div class=\"def\"><b>Marketing stratégique<\/b> · choisir ses marchés : segmentation, ciblage, positionnement<\/div><div class=\"def\"><b>Marketing opérationnel<\/b> · le mix (4P) : produit, prix, distribution (place), communication (promotion)<\/div><div class=\"def\"><b>Positionnement<\/b> · la place que l'on veut occuper dans l'esprit du client face aux concurrents<\/div><div class=\"def\"><b>Marketing relationnel<\/b> · conquérir puis fidéliser : il coûte moins cher de garder un client que d'en trouver un nouveau<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Segmenter<\/span><h3>Les critères<\/h3><div class=\"mini\"><div class=\"def\"><b>B2C<\/b> · géographiques, sociodémographiques (âge, revenu, CSP), psychographiques (style de vie), comportementaux (fréquence, fidélité)<\/div><div class=\"def\"><b>B2B<\/b> · secteur, taille (effectif, CA), localisation, potentiel, statut (client, ancien client, prospect)<\/div><div class=\"def\"><b>Cible<\/b> · le segment que l'on choisit de viser en priorité, selon son potentiel et sa rentabilité<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Analyser le portefeuille<\/span><h3>Les indicateurs<\/h3><div class=\"mini\"><div class=\"def\"><b>CA et marge par client<\/b> · qui rapporte vraiment ?<\/div><div class=\"def\"><b>Fréquence d'achat, panier moyen<\/b> · comment achète-t-il ?<\/div><div class=\"def\"><b>Taux de fidélité, taux d'attrition<\/b> · qui reste, qui part ?<\/div><div class=\"def\"><b>Taux de recrutement<\/b> · part de nouveaux clients sur la période<\/div><div class=\"def\"><b>Valeur client<\/b> · ce qu'un client rapporte sur toute la durée de la relation<\/div><div class=\"def\"><b>Potentiel<\/b> · ce qu'il pourrait acheter de plus<\/div><\/div><\/div>\n<div class=\"card cY\" style=\"gap:6px\"><h3>La méthode ABC (loi de Pareto)<\/h3><p class=\"sm\">On classe les clients par CA décroissant. Souvent, environ <b>20 % des clients font 80 % du CA<\/b> (règle empirique, à vérifier sur tes chiffres).<\/p>\n<div class=\"bar\" style=\"display:flex;height:34px;border-radius:10px;overflow:hidden;font-weight:700;color:#FFFFFF\"><div class=\"fB\" style=\"flex:20;display:flex;align-items:center;justify-content:center\">A · à choyer<\/div><div style=\"flex:30;display:flex;align-items:center;justify-content:center;background:#6F86E8\">B · à développer<\/div><div style=\"flex:50;display:flex;align-items:center;justify-content:center;background:#9AA3C7;color:#16182B\">C · à rentabiliser<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"card dark\"><h3>Le réflexe jury<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">« Pourquoi avez-vous choisi ce client ou cette cible ? » Réponds avec des chiffres : sa part du CA, son potentiel, son ancienneté, son segment.<\/p><\/div>","x":"c1 cibler et prospecter · 1/2 analyser le portefeuille et cibler avant de prospecter, il faut savoir qui sont tes clients, lesquels rapportent, et qui viser. politique commerciale le cadre marketing stratégique · choisir ses marchés : segmentation, ciblage, positionnement marketing opérationnel · le mix (4p) : produit, prix, distribution (place), communication (promotion) positionnement · la place que l'on veut occuper dans l'esprit du client face aux concurrents marketing relationnel · conquérir puis fidéliser : il coûte moins cher de garder un client que d'en trouver un nouveau segmenter les critères b2c · géographiques, sociodémographiques (âge, revenu, csp), psychographiques (style de vie), comportementaux (fréquence, fidélité) b2b · secteur, taille (effectif, ca), localisation, potentiel, statut (client, ancien client, prospect) cible · le segment que l'on choisit de viser en priorité, selon son potentiel et sa rentabilité analyser le portefeuille les indicateurs ca et marge par client · qui rapporte vraiment ? fréquence d'achat, panier moyen · comment achète-t-il ? taux de fidélité, taux d'attrition · qui reste, qui part ? taux de recrutement · part de nouveaux clients sur la période valeur client · ce qu'un client rapporte sur toute la durée de la relation potentiel · ce qu'il pourrait acheter de plus la méthode abc (loi de pareto) on classe les clients par ca décroissant. souvent, environ 20 % des clients font 80 % du ca (règle empirique, à vérifier sur tes chiffres). a · à choyer b · à développer c · à rentabiliser le réflexe jury « pourquoi avez-vous choisi ce client ou cette cible ? » réponds avec des chiffres : sa part du ca, son potentiel, son ancienneté, son segment."},{"t":"Prospecter et évaluer","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Cibler et prospecter · 2/2<\/p><h1 style=\"--mid:1\">Prospecter et évaluer<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">1<\/span><b>Fixer l'objectif<\/b><span>SMART : spécifique, mesurable, atteignable, réaliste, temporel. Ex. 10 rendez-vous en 3 semaines.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">2<\/span><b>Construire le fichier<\/b><span>Fichier interne, achat ou location, annuaires, LinkedIn, salons. Puis le qualifier.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">3<\/span><b>Choisir les outils<\/b><span>Téléphone, e-mailing, réseaux sociaux, visites, salons, recommandation.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"--mid:1\">4<\/span><b>Évaluer<\/b><span>Taux de réponse, de rendez-vous, de transformation, coût par contact, retour sur investissement.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Téléphone<\/span><h3>Le plan d'appel CROC<\/h3><div class=\"mini\"><div class=\"def\"><b>Contact<\/b> · se présenter, vérifier qu'on parle à la bonne personne<\/div><div class=\"def\"><b>Raison<\/b> · pourquoi on appelle, avec une accroche centrée sur le client<\/div><div class=\"def\"><b>Objectif<\/b> · obtenir le rendez-vous en proposant deux créneaux (alternative)<\/div><div class=\"def\"><b>Conclusion<\/b> · reformuler l'accord, remercier, confirmer par écrit<\/div><div class=\"def\"><b>Barrage de l'assistant<\/b> · rester courtois, être précis, demander le meilleur moment pour rappeler<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Qualifier<\/span><h3>Un prospect qualifié<\/h3><div class=\"mini\"><div class=\"def\"><b>Besoin<\/b> · a-t-il un besoin réel ?<\/div><div class=\"def\"><b>Budget<\/b> · a-t-il les moyens ?<\/div><div class=\"def\"><b>Décideur<\/b> · parle-t-on à celui qui décide ?<\/div><div class=\"def\"><b>Délai<\/b> · quand compte-t-il acheter ?<\/div><div class=\"def\"><b>Réseaux professionnels<\/b> · CCI, clubs d'entreprises, LinkedIn, salons, parrainage : ils apportent des recommandations, la source de prospects la plus efficace<\/div><\/div><\/div><\/div>\n<h2>Les indicateurs d'évaluation<\/h2>\n<table class=\"tb\">\n<tr><th>Indicateur<\/th><th>Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr>\n<tr><td data-label=\"Indicateur\">Taux de joignabilité<\/td><td data-label=\"Calcul\">contacts joints / appels passés × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">La qualité du fichier<\/td><\/tr>\n<tr><td data-label=\"Indicateur\">Taux de rendez-vous<\/td><td data-label=\"Calcul\">rendez-vous obtenus / contacts joints × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'efficacité de ton discours<\/td><\/tr>\n<tr><td data-label=\"Indicateur\">Taux de transformation<\/td><td data-label=\"Calcul\">ventes / rendez-vous × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">L'efficacité en entretien<\/td><\/tr>\n<tr><td data-label=\"Indicateur\">Coût par contact<\/td><td data-label=\"Calcul\">coût total de l'action / nombre de contacts<\/td><td data-label=\"Ce qu&#x27;il mesure\">La rentabilité de la méthode<\/td><\/tr>\n<tr><td data-label=\"Indicateur\">Retour sur investissement<\/td><td data-label=\"Calcul\">(marge générée − coût) / coût × 100<\/td><td data-label=\"Ce qu&#x27;il mesure\">Si l'action a rapporté plus qu'elle n'a coûté<\/td><\/tr>\n<\/table>\n<div class=\"card cY\"><h3>Attention au droit<\/h3><p class=\"sm\">Depuis le 11 août 2026, appeler un particulier pour le prospecter exige son <b>consentement préalable<\/b> (Bloctel a disparu). En e-mail aussi, il faut l'accord préalable des particuliers. Les règles B2B sont plus souples : vois la page 13.<\/p><\/div>","x":"c1 cibler et prospecter · 2/2 prospecter et évaluer 1 fixer l'objectif smart : spécifique, mesurable, atteignable, réaliste, temporel. ex. 10 rendez-vous en 3 semaines. 2 construire le fichier fichier interne, achat ou location, annuaires, linkedin, salons. puis le qualifier. 3 choisir les outils téléphone, e-mailing, réseaux sociaux, visites, salons, recommandation. 4 évaluer taux de réponse, de rendez-vous, de transformation, coût par contact, retour sur investissement. téléphone le plan d'appel croc contact · se présenter, vérifier qu'on parle à la bonne personne raison · pourquoi on appelle, avec une accroche centrée sur le client objectif · obtenir le rendez-vous en proposant deux créneaux (alternative) conclusion · reformuler l'accord, remercier, confirmer par écrit barrage de l'assistant · rester courtois, être précis, demander le meilleur moment pour rappeler qualifier un prospect qualifié besoin · a-t-il un besoin réel ? budget · a-t-il les moyens ? décideur · parle-t-on à celui qui décide ? délai · quand compte-t-il acheter ? réseaux professionnels · cci, clubs d'entreprises, linkedin, salons, parrainage : ils apportent des recommandations, la source de prospects la plus efficace les indicateurs d'évaluation indicateur calcul ce qu'il mesure taux de joignabilité contacts joints / appels passés × 100 la qualité du fichier taux de rendez-vous rendez-vous obtenus / contacts joints × 100 l'efficacité de ton discours taux de transformation ventes / rendez-vous × 100 l'efficacité en entretien coût par contact coût total de l'action / nombre de contacts la rentabilité de la méthode retour sur investissement (marge générée − coût) / coût × 100 si l'action a rapporté plus qu'elle n'a coûté attention au droit depuis le 11 août 2026, appeler un particulier pour le prospecter exige son consentement préalable (bloctel a disparu). en e-mail aussi, il faut l'accord préalable des particuliers. les règles b2b sont plus souples : vois la page 13."},{"t":"La communication interpersonnelle","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 1/4<\/p><h1 style=\"--mid:1\">La communication interpersonnelle<\/h1><\/div><\/div><p class=\"mut\">Avant les techniques de vente, il y a la relation. C'est le premier critère du jury : la qualité de la relation interpersonnelle.<\/p>\n<div class=\"card cO\" style=\"gap:8px\"><h3>Le schéma de la communication<\/h3>\n<div style=\"display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap\"><span class=\"chip\">Émetteur<\/span><span>→<\/span><span class=\"chip\">Message (code)<\/span><span>→<\/span><span class=\"chip\">Canal<\/span><span>→<\/span><span class=\"chip\">Récepteur<\/span><span>→<\/span><span class=\"chip\">Feedback<\/span><\/div>\n<p class=\"sm\">Les « bruits » (fatigue, vocabulaire technique, environnement bruyant) déforment le message : d'où l'importance de reformuler et de vérifier la compréhension.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Les 3 canaux<\/span><h3>Verbal, paraverbal, non verbal<\/h3><div class=\"mini\"><div class=\"def\"><b>Verbal<\/b> · les mots choisis : positifs, précis, adaptés au client<\/div><div class=\"def\"><b>Paraverbal<\/b> · la voix : ton, débit, volume, silences<\/div><div class=\"def\"><b>Non verbal<\/b> · posture, regard, sourire, gestes, distance<\/div><div class=\"def\"><b>Mehrabian (7 %, 38 %, 55 %)<\/b> · souvent cité, mais seulement valable pour exprimer des émotions : à citer avec prudence<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Écouter<\/span><h3>L'écoute active<\/h3><div class=\"mini\"><div class=\"def\"><b>Attitude<\/b> · regarder, acquiescer, ne pas couper, prendre des notes<\/div><div class=\"def\"><b>Reformulation écho<\/b> · reprendre les mots du client<\/div><div class=\"def\"><b>Reformulation résumé<\/b> · « Si je comprends bien, vous cherchez… »<\/div><div class=\"def\"><b>Empathie<\/b> · comprendre le point de vue du client sans forcément l'approuver<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Questionner<\/span><h3>Les types de questions<\/h3><div class=\"mini\"><div class=\"def\"><b>Ouverte<\/b> · fait parler : « Comment utilisez-vous… ? »<\/div><div class=\"def\"><b>Fermée<\/b> · oui ou non : pour valider<\/div><div class=\"def\"><b>Alternative<\/b> · deux choix : « mardi ou jeudi ? »<\/div><div class=\"def\"><b>Relais<\/b> · relance : « C'est-à-dire ? »<\/div><div class=\"def\"><b>Entonnoir<\/b> · aller du général au précis<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Les relations<\/span><h3>Repères psychologiques<\/h3><div class=\"mini\"><div class=\"def\"><b>Analyse transactionnelle (Berne)<\/b> · trois états du moi : Parent, Adulte, Enfant. Le vendeur vise l'Adulte-Adulte : calme, factuel<\/div><div class=\"def\"><b>Positions de vie<\/b> · « je suis OK, tu es OK » : la relation gagnant-gagnant<\/div><div class=\"def\"><b>Rapport de force<\/b> · savoir qui a le pouvoir (taille, urgence, alternatives) pour adapter sa stratégie<\/div><\/div><\/div><\/div>\n<\/div>","x":"c2 négocier · 1/4 la communication interpersonnelle avant les techniques de vente, il y a la relation. c'est le premier critère du jury : la qualité de la relation interpersonnelle. le schéma de la communication émetteur → message (code) → canal → récepteur → feedback les « bruits » (fatigue, vocabulaire technique, environnement bruyant) déforment le message : d'où l'importance de reformuler et de vérifier la compréhension. les 3 canaux verbal, paraverbal, non verbal verbal · les mots choisis : positifs, précis, adaptés au client paraverbal · la voix : ton, débit, volume, silences non verbal · posture, regard, sourire, gestes, distance mehrabian (7 %, 38 %, 55 %) · souvent cité, mais seulement valable pour exprimer des émotions : à citer avec prudence écouter l'écoute active attitude · regarder, acquiescer, ne pas couper, prendre des notes reformulation écho · reprendre les mots du client reformulation résumé · « si je comprends bien, vous cherchez… » empathie · comprendre le point de vue du client sans forcément l'approuver questionner les types de questions ouverte · fait parler : « comment utilisez-vous… ? » fermée · oui ou non : pour valider alternative · deux choix : « mardi ou jeudi ? » relais · relance : « c'est-à-dire ? » entonnoir · aller du général au précis les relations repères psychologiques analyse transactionnelle (berne) · trois états du moi : parent, adulte, enfant. le vendeur vise l'adulte-adulte : calme, factuel positions de vie · « je suis ok, tu es ok » : la relation gagnant-gagnant rapport de force · savoir qui a le pouvoir (taille, urgence, alternatives) pour adapter sa stratégie"},{"t":"Les étapes de la vente (1/2)","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 2/4<\/p><h1 style=\"--mid:1\">Les étapes de la vente (1/2)<\/h1><\/div><\/div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span class=\"tag fO\">1 Préparer<\/span><span class=\"tag fO\">2 Prendre contact<\/span><span class=\"tag fO\">3 Découvrir<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">4 Argumenter<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">5 Traiter les objections<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">6 Négocier le prix<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">7 Conclure<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">8 Prendre congé<\/span><\/div>\n<div class=\"card cO\"><h3>1 · Préparer l'entretien<\/h3>\n<div class=\"g2 sm\" style=\"gap:6px 18px\"><span><b>Objectifs<\/b> : un objectif idéal et un objectif minimum (ce qu'on accepte au pire).<\/span><span><b>Fiche client<\/b> : historique, besoins connus, interlocuteurs, CA, litiges passés.<\/span><span><b>Argumentaire<\/b> : 3 ou 4 arguments forts, avec preuves.<\/span><span><b>Marges de manœuvre<\/b> : prix plancher, remises possibles, concessions et contreparties.<\/span><span><b>Objections probables<\/b> et réponses prêtes.<\/span><span><b>Outils<\/b> : catalogue, tablette, échantillons, simulateur, bon de commande.<\/span><\/div><\/div>\n<div class=\"card cO\"><h3>2 · Prendre contact : la règle des 4 × 20<\/h3>\n<div class=\"g4 sm\" style=\"gap:8px\"><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 secondes<\/b>la première impression se joue tout de suite<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 premiers mots<\/b>bonjour, présentation, objet de la visite<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 premiers gestes<\/b>poignée de main, posture ouverte<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 cm du visage<\/b>le sourire et le regard<\/div><\/div><\/div>\n<div class=\"card cO\" style=\"gap:8px\"><h3>3 · Découvrir les besoins : l'étape la plus importante<\/h3>\n<p class=\"sm\">Le client doit parler 70 % du temps. Utilise <b>QQOQCCP<\/b> (qui, quoi, où, quand, comment, combien, pourquoi) et repère ses motivations avec <b>SONCAS<\/b> :<\/p>\n<div style=\"display:grid;gap:6px\">\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">S<\/span><b class=\"sm\">Sécurité<\/b><span class=\"mini\">garantie, fiabilité<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">O<\/span><b class=\"sm\">Orgueil<\/b><span class=\"mini\">prestige, image<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">N<\/span><b class=\"sm\">Nouveauté<\/b><span class=\"mini\">innovation, mode<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">C<\/span><b class=\"sm\">Confort<\/b><span class=\"mini\">simplicité, gain de temps<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">A<\/span><b class=\"sm\">Argent<\/b><span class=\"mini\">prix, économies<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"--mid:1\">S<\/span><b class=\"sm\">Sympathie<\/b><span class=\"mini\">relation, confiance<\/span><\/div>\n<\/div>\n<p class=\"sm\">On ajoute souvent un <b>E<\/b> (SONCASE) pour l'<b>Environnement<\/b> : produits durables, éthiques.<\/p>\n<p class=\"sm\"><b>Finir par une reformulation<\/b> : « Si je résume, vous cherchez… est-ce bien cela ? » Le client dit « oui » : tu peux argumenter.<\/p><\/div>","x":"c2 négocier · 2/4 les étapes de la vente (1/2) 1 préparer 2 prendre contact 3 découvrir 4 argumenter 5 traiter les objections 6 négocier le prix 7 conclure 8 prendre congé 1 · préparer l'entretien objectifs : un objectif idéal et un objectif minimum (ce qu'on accepte au pire). fiche client : historique, besoins connus, interlocuteurs, ca, litiges passés. argumentaire : 3 ou 4 arguments forts, avec preuves. marges de manœuvre : prix plancher, remises possibles, concessions et contreparties. objections probables et réponses prêtes. outils : catalogue, tablette, échantillons, simulateur, bon de commande. 2 · prendre contact : la règle des 4 × 20 20 secondes la première impression se joue tout de suite 20 premiers mots bonjour, présentation, objet de la visite 20 premiers gestes poignée de main, posture ouverte 20 cm du visage le sourire et le regard 3 · découvrir les besoins : l'étape la plus importante le client doit parler 70 % du temps. utilise qqoqccp (qui, quoi, où, quand, comment, combien, pourquoi) et repère ses motivations avec soncas : s sécurité garantie, fiabilité o orgueil prestige, image n nouveauté innovation, mode c confort simplicité, gain de temps a argent prix, économies s sympathie relation, confiance on ajoute souvent un e (soncase) pour l' environnement : produits durables, éthiques. finir par une reformulation : « si je résume, vous cherchez… est-ce bien cela ? » le client dit « oui » : tu peux argumenter."},{"t":"Les étapes de la vente (2/2)","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 3/4<\/p><h1 style=\"--mid:1\">Les étapes de la vente (2/2)<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\" style=\"gap:6px\"><h3>4 · Argumenter avec la méthode CAP<\/h3>\n<div class=\"g3\" style=\"gap:6px\"><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Caractéristique<\/b><span class=\"mini\">ce qu'est le produit<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Avantage<\/b><span class=\"mini\">ce que ça apporte au client<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Preuve<\/b><span class=\"mini\">démonstration, chiffre, avis, label<\/span><\/div><\/div>\n<p class=\"sm\"><i>« Ce fauteuil a une mousse haute densité (C) : il garde sa forme pendant des années (A). Il est garanti 10 ans, et je vous laisse l'essayer (P). »<\/i> Choisis les arguments qui répondent à son mobile SONCAS.<\/p><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>5 · Traiter les objections<\/h3><p class=\"sm\">Une objection est un signe d'intérêt. Méthode : <b>écouter<\/b> sans couper, <b>reformuler<\/b> ou questionner, <b>répondre<\/b>, <b>valider<\/b> (« Cela répond-il à votre question ? »).<\/p>\n<div class=\"mini\"><div class=\"def\"><b>Oui, mais<\/b> · accepter puis nuancer<\/div><div class=\"def\"><b>Boomerang<\/b> · retourner l'objection en argument (« C'est justement pour ça que… »)<\/div><div class=\"def\"><b>Compensation<\/b> · reconnaître un défaut, mettre en avant un avantage plus fort<\/div><div class=\"def\"><b>Preuve<\/b> · démonstration, témoignage, chiffre<\/div><div class=\"def\"><b>Questionnement<\/b> · « Qu'entendez-vous par trop cher ? »<\/div><div class=\"def\"><b>Report<\/b> · « J'y reviens dans un instant » (si le prix arrive trop tôt)<\/div><\/div><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\" style=\"gap:6px\"><h3>6 · Présenter et défendre le prix<\/h3><ul class=\"sm\"><li>Annoncer le prix <b>après<\/b> les avantages, sans hésiter ni s'excuser.<\/li><li><b>Sandwich<\/b> : un avantage, le prix, un autre avantage.<\/li><li><b>Division<\/b> : « soit 1,20 € par jour ».<\/li><li><b>Comparaison<\/b> avec le coût de ne rien faire.<\/li><li>Toute concession contre une <b>contrepartie<\/b> : « Si vous commandez aujourd'hui, alors… »<\/li><li>Des concessions de plus en plus petites, jamais sous le prix plancher.<\/li><\/ul><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>7 · Conclure<\/h3><p class=\"sm\">Repérer les <b>signaux d'achat<\/b> : questions sur la livraison, le paiement, le client qui reprend le produit en main.<\/p><div class=\"mini\"><div class=\"def\"><b>Alternative<\/b> · « En noir ou en gris ? »<\/div><div class=\"def\"><b>Récapitulative<\/b> · résumer les avantages acceptés, puis demander l'accord<\/div><div class=\"def\"><b>Implicite<\/b> · faire comme si c'était décidé : « Je vous la livre mardi ? »<\/div><div class=\"def\"><b>Dernier argument<\/b> · garder un petit avantage pour la fin<\/div><\/div><\/div>\n<\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>8 · Prendre congé et préparer la suite<\/h3><div class=\"g3 sm\" style=\"gap:8px\"><span><b>Rassurer<\/b> : féliciter le client pour son choix, rappeler la suite (livraison, installation).<\/span><span><b>Vente additionnelle<\/b> : montée en gamme (<i>up-selling<\/i>) ou produit complémentaire (<i>cross-selling<\/i>).<\/span><span><b>Fidéliser<\/b> : demander une recommandation, programmer un suivi, saisir l'entretien dans le CRM.<\/span><\/div><\/div>","x":"c2 négocier · 3/4 les étapes de la vente (2/2) 4 · argumenter avec la méthode cap caractéristique ce qu'est le produit avantage ce que ça apporte au client preuve démonstration, der-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 4/4<\/p><h1 style=\"--mid:1\">B2B, réclamations et fidélisation<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">B2B<\/span><h3>Le centre d'achat<\/h3><div class=\"mini\"><div class=\"def\"><b>Principe<\/b> · en entreprise, plusieurs personnes participent à la décision (Webster et Wind)<\/div><div class=\"def\"><b>Utilisateur<\/b> · celui qui utilisera le produit<\/div><div class=\"def\"><b>Prescripteur<\/b> · celui qui recommande (technicien, consultant)<\/div><div class=\"def\"><b>Acheteur<\/b> · celui qui négocie et passe commande<\/div><div class=\"def\"><b>Décideur<\/b> · celui qui signe<\/div><div class=\"def\"><b>Filtre<\/b> · celui qui contrôle l'accès (assistant)<\/div><div class=\"def\"><b>B2G (vendre au public)<\/b> · marchés publics : appel d'offres, égalité de traitement des candidats, transparence, choix selon des critères annoncés<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Négocier<\/span><h3>Deux logiques<\/h3><div class=\"mini\"><div class=\"def\"><b>Négociation distributive<\/b> · gagnant-perdant : on se partage un gâteau fixe, rapport de force<\/div><div class=\"def\"><b>Négociation intégrative<\/b> · gagnant-gagnant : on cherche à agrandir le gâteau<\/div><div class=\"def\"><b>Négociation raisonnée (Harvard, Fisher et Ury)<\/b> · traiter séparément les personnes et le problème, se concentrer sur les intérêts plutôt que les positions, imaginer plusieurs options, utiliser des critères objectifs<\/div><div class=\"def\"><b>MESORE<\/b> · meilleure solution de rechange : ce que tu feras si l'accord échoue. Plus elle est bonne, plus tu es fort<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Litiges<\/span><h3>Traiter une réclamation<\/h3><div class=\"mini\"><div class=\"def\"><b>1 · Écouter<\/b> · laisser le client s'exprimer, sans se justifier<\/div><div class=\"def\"><b>2 · Montrer de l'empathie<\/b> · « Je comprends votre mécontentement »<\/div><div class=\"def\"><b>3 · Comprendre<\/b> · questionner, vérifier les faits<\/div><div class=\"def\"><b>4 · Proposer une solution<\/b> · échange, geste commercial, réparation<\/div><div class=\"def\"><b>5 · Suivre<\/b> · rappeler le client : la réclamation devient une occasion de fidéliser<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Accompagner<\/span><h3>Fidéliser<\/h3><div class=\"mini\"><div class=\"def\"><b>Suivi après-vente<\/b> · appel de satisfaction, installation, formation, SAV<\/div><div class=\"def\"><b>Mesurer la satisfaction<\/b> · enquêtes, avis, NPS (pourcentage de promoteurs moins pourcentage de détracteurs)<\/div><div class=\"def\"><b>Outils<\/b> · programmes de fidélité, offres personnalisées, newsletters, invitations à des évènements<\/div><div class=\"def\"><b>CRM<\/b> · garder l'historique de chaque client pour personnaliser la relation<\/div><div class=\"def\"><b>Valeur client<\/b> · plus un client reste longtemps, plus il rapporte : c'est l'objectif de la fidélisation<\/div><\/div><\/div><\/div>\n<\/div>","x":"c2 négocier · 4/4 b2b, réclamations et fidélisation b2b le centre d'achat principe · en entreprise, plusieurs personnes participent à la décision (webster et wind) utilisateur · celui qui utilisera le produit prescripteur · celui qui recommande (technicien, consultant) acheteur · celui qui négocie et passe commande décideur · celui qui signe filtre · celui qui contrôle l'accès (assistant) b2g (vendre au public) · marchés publics : appel e, webinaire…<\/p><div class=\"g4\"><div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">1<\/span><b>Objectifs et cible<\/b><span>Objectifs SMART : notoriété, prospection, ventes, fidélisation. Qui veut-on attirer ?<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">2<\/span><b>Budget<\/b><span>Location, stand, matériel, communication, personnel, cadeaux, déplacements. Comparer avec les gains attendus.<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">3<\/span><b>Rétroplanning<\/b><span>Toutes les tâches, du jour J vers aujourd'hui, avec un responsable et une date.<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"--mid:1\">4<\/span><b>Logistique<\/b><span>Lieu, matériel, autorisations, sécurité, stocks, équipe et briefing.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Communication<\/span><h3>Avant, pendant, après<\/h3><div class=\"mini\"><div class=\"def\"><b>Avant<\/b> · invitations ciblées, e-mailing aux clients qui ont donné leur accord, réseaux sociaux, affichage, presse locale<\/div><div class=\"def\"><b>Pendant<\/b> · accueil, démonstrations, animations (jeu, dégustation), collecte des coordonnées avec consentement<\/div><div class=\"def\"><b>Après<\/b> · remerciements, relance des contacts, offres de suivi, publication sur les réseaux<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Animer<\/span><h3>Le jour J<\/h3><div class=\"mini\"><div class=\"def\"><b>Accueil<\/b> · aller vers les visiteurs, accrocher par une question ouverte<\/div><div class=\"def\"><b>Démonstration<\/b> · faire essayer, montrer l'avantage concret<\/div><div class=\"def\"><b>Qualifier les contacts<\/b> · noter besoin, potentiel, délai sur une fiche contact ou une tablette<\/div><div class=\"def\"><b>Équipe<\/b> · rôles clairs, horaires, objectifs par personne<\/div><\/div><\/div><\/div>\n<h2>Le bilan : quantitatif et qualitatif<\/h2>\n<div class=\"g2\">\n<div class=\"card cP\"><h3>Quantitatif<\/h3><ul class=\"sm\"><li>Nombre de visiteurs, de contacts, de contacts qualifiés.<\/li><li>Nombre de ventes, CA, panier moyen, marge.<\/li><li>Coût total, coût par contact, retour sur investissement.<\/li><li>Comparaison objectifs / résultats, en %.<\/li><\/ul><\/div>\n<div class=\"card cP\"><h3>Qualitatif<\/h3><ul class=\"sm\"><li>Satisfaction des visiteurs et de l'équipe.<\/li><li>Image, retombées sur les réseaux.<\/li><li>Remarques des clients, informations sur les concurrents.<\/li><li>Ce qui a marché, ce qu'on changera la prochaine fois.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Le suivi, c'est là que se joue la note<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Le jury évalue la rigueur du suivi des contacts : saisie dans le CRM, relance rapide, rendez-vous fixés, ventes conclues après l'évènement. Prépare ces chiffres.<\/p><\/div>","x":"c3 organiser et animer l'évènement commercial salon, foire, portes ouvertes, démonstration, lancement de produit, animation de point de vente, webinaire… 1 objectifs et cible objectifs smart : notoriété, prospection, ventes, fidélisation. qui veut-on attirer ? 2 budget location, stand, matériel, communication, personnel, cadeaux, déplacements. comparer avec les gains attendus. 3 rétroplanning toutes les tâches, du jour j vers aujourd'hui, avec un responsable et une date. 4 logistique lieu, matériel, autorisations, sécurité, stocks, équipe et briefing. communication avant, pendant, après avant · invitations ciblées, e-mailing aux clients qui ont donné leur accord, réseaux sociaux, affichage, presse locale pendant · accueil, démonstrations, animations (jeu, dégustation), collecte des coordonnées avec consentement après · remerciements, relance des contacts, offres de suivi, publication sur les réseaux animer le jour j accueil · aller vers les visiteurs, accrocher par une que \n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#16182B\">Proposer<\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Collecter<\/span><h3>La veille et les sources<\/h3><div class=\"mini\"><div class=\"def\"><b>Veille<\/b> · commerciale (clients), concurrentielle (prix, offres), technologique, juridique<\/div><div class=\"def\"><b>Sources internes<\/b> · CRM, ventes, comptes rendus de visite, SAV, réclamations<\/div><div class=\"def\"><b>Sources externes<\/b> · salons, presse, sites des concurrents, réseaux sociaux, études, avis clients<\/div><div class=\"def\"><b>Qualifier les données<\/b> · vérifier, compléter, supprimer les doublons, mettre à jour ; respecter le RGPD<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Outils<\/span><h3>Le système d'information commerciale<\/h3><div class=\"mini\"><div class=\"def\"><b>CRM<\/b> · la base de la relation client : historique, contacts, opportunités, relances<\/div><div class=\"def\"><b>PGI (ERP)<\/b> · logiciel qui partage les mêmes données dans toute l'entreprise<\/div><div class=\"def\"><b>Outils mobiles<\/b> · tablette, application de tournées, géolocalisation, agenda partagé<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Partager<\/span><h3>Faire remonter l'information<\/h3><div class=\"mini\"><div class=\"def\"><b>Compte rendu de visite<\/b> · faits, informations nouvelles, suite à donner<\/div><div class=\"def\"><b>Reporting<\/b> · tableaux de bord réguliers pour le manager<\/div><div class=\"def\"><b>Supports<\/b> · réunions, intranet, réseau social d'entreprise, outils collaboratifs<\/div><div class=\"def\"><b>Sélectionner et hiérarchiser<\/b> · ne transmettre que l'utile, au bon destinataire, dans le bon ordre<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Analyser<\/span><h3>Statistiques utiles<\/h3><div class=\"mini\"><div class=\"def\"><b>Tendance<\/b> · l'évolution dans le temps (en %)<\/div><div class=\"def\"><b>Position<\/b> · moyenne, médiane<\/div><div class=\"def\"><b>Dispersion<\/b> · écart-type : les valeurs sont-elles proches ou éloignées de la moyenne ?<\/div><div class=\"def\"><b>Prévision<\/b> · moyenne mobile, ajustement linéaire (droite de tendance), coefficients saisonniers<\/div><div class=\"def\"><b>Graphiques<\/b> · courbe pour une évolution, barres pour comparer, secteurs pour une répartition<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Ce que le jury attend en partie 3<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Quelles informations as-tu recueillies pendant tes deux activités ? Comment les as-tu sélectionnées et partagées ? Qu'as-tu proposé à ton entreprise à partir de ces informations ? Une proposition concrète et chiffrée fait la différence.<\/p><\/div>","x":"c4 exploiter et mutualiser l'information commerciale collecter, analyser, partager, puis proposer : c'est la 3e partie de l'oral en ponctuel. collecter sélectionner analyser partager proposer collecter la veille et les sources veille · commerciale (clients), concurrentielle (prix, offres), technologique, juridique sources internes · crm, ventes, comptes rendus de visite, sav, réclamations sources externes · salons, presse, sites des concurrents, réseaux sociaux, études, avis clients qualifier les données · vérifier, compléter, supprimer les doublons, mettre à jour ; respecter le rgpd outils le système d'information commerciale crm · la base de la relation client : historique, contacts, opportunités, relances pgi (erp) · logiciel qui partage les mêmes données dans toute l'entreprise outils mobiles · tablette, application de tournées, géolocalisation, agenda partagé partager faire remonter l'information compte rendu de visite · faits, informations nouvelles, suite à donner reporting · tableaux de bord réguliers pour le manager supports · réunions, intranet, réseau social d'entreprise, outils collaboratifs sélectionner et hiérarchiser · ne transmettre que l'utile, au bon destinataire, dans le bon ordre analyser statistiques utiles tendance · l'évolution dans le temps (en %) position · moyenne, médiane dispersion · écart-type : les valeurs sont-elles proches ou éloignées de la moyenne ? prévision · moyenne mobile, ajustement linéaire (droite de tendance), coefficients saisonniers graphiques · courbe pour une évolution, barres pour comparer, secteurs pour une répartition ce que le jury attend en partie 3 quelles informations as-tu recueillies pendant tes deux activités ? comment les as-tu sélectionnées et partagées ? qu'as-tu proposé à ton entreprise à partir de ces informations ? une proposition concrète et chiffrée fait la différence."},{"t":"Les calculs commerciaux à maîtriser","h":"<p class=\"kick tO\">Calculs<\/p>\n<h1>Les calculs commerciaux à maîtriser<\/h1>\n<p class=\"mut\">Le jury te demandera souvent de chiffrer : marge, remise maximale, rentabilité d'une action. Exemple suivi : un produit acheté 40 € HT, vendu 60 € HT.<\/p>\n<table class=\"tb\"><tr><th>Calcul<\/th><th>Formule<\/th><th>Exemple<\/th><\/tr><tr><td data-label=\"Calcul\">Marge brute unitaire<\/td><td data-label=\"Formule\">PV HT − coût d'achat HT<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">60 − 40 = 20 €<\/td><\/tr><tr><td data-label=\"Calcul\">Taux de marge<\/td><td data-label=\"Formule\">marge / coût d'achat HT × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">20 / 40 = 50 %<\/td><\/tr><tr><td data-label=\"Calcul\">Taux de marque<\/td><td data-label=\"Formule\">marge / PV HT × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">20 / 60 = 33,3 %<\/td><\/tr><tr><td data-label=\"Calcul\">Prix TTC (TVA 20 %)<\/td><td data-label=\"Formule\">PV HT × 1,20<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">60 × 1,20 = 72 €<\/td><\/tr><tr><td data-label=\"Calcul\">Prix HT depuis le TTC<\/td><td data-label=\"Formule\">PV TTC / 1,20<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">72 / 1,20 = 60 €<\/td><\/tr><tr><td data-label=\"Calcul\">Coefficient multiplicateur<\/td><td data-label=\"Formule\">PV TTC / coût d'achat HT<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">72 / 40 = 1,8<\/td><\/tr><tr><td data-label=\"Calcul\">Évolution<\/td><td data-label=\"Formule\">(valeur finale − valeur initiale) / valeur initiale × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">de 200 à 230 : + 15 %<\/td><\/tr><tr><td data-label=\"Calcul\">Panier moyen<\/td><td data-label=\"Formule\">CA / nombre de ventes<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">4 500 / 150 = 30 €<\/td><\/tr><tr><td data-label=\"Calcul\">Taux de transformation<\/td><td data-label=\"Formule\">acheteurs / visiteurs × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">45 / 300 = 15 %<\/td><\/tr><tr><td data-label=\"Calcul\">Part de marché<\/td><td data-label=\"Formule\">CA de l'entreprise / CA du marché × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">2 M / 20 M = 10 %<\/td><\/tr><tr><td data-label=\"Calcul\">Marge sur coût variable<\/td><td data-label=\"Formule\">CA − charges variables<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">100 000 − 60 000 = 40 000 €<\/td><\/tr><tr><td data-label=\"Calcul\">Seuil de rentabilité<\/td><td data-label=\"Formule\">charges fixes / taux de marge sur coût variable<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">30 000 / 0,40 = 75 000 € de CA<\/td><\/tr><tr><td data-label=\"Calcul\">Retour sur investissement<\/td><td data-label=\"Formule\">(marge générée − coût) / coût × 100<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">(6 000 − 4 000) / 4 000 = 50 %<\/td><\/tr><tr><td data-label=\"Calcul\">Coût par contact<\/td><td data-label=\"Formule\">coût de l'action / nombre de contacts<\/td><td data-label=\"Exemple\" class=\"tO\" style=\"font-weight:600\">4 000 / 200 = 20 €<\/td><\/tr><\/table>\n<div class=\"g2\">\n<div class=\"card cO\"><h3>Les réductions<\/h3><div class=\"mini\"><div class=\"def\"><b>Rabais<\/b> · pour un défaut de qualité ou de conformité<\/div><div class=\"def\"><b>Remise<\/b> · pour une quantité ou un client fidèle, sur la facture<\/div><div class=\"def\"><b>Ristourne<\/b> · en fin de période, sur le CA cumulé<\/div><div class=\"def\"><b>Escompte<\/b> · pour un paiement anticipé<\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Le piège classique<\/h3><p class=\"sm\">Deux remises successives de 10 % ne font <b>pas<\/b> 20 % : la seconde s'applique au prix déjà réduit. 100 € − 10 % = 90 €, puis − 10 % = 81 €, soit 19 % au total.<\/p><\/div>\n<\/div>","x":"calculs les calculs commerciaux à maîtriser le jury te demandera souvent de chiffrer : marge, remise maximale, rentabilité d'une action. exemple suivi : un produit acheté 40 € ht, vendu 60 € ht. calcul formule exemple marge brute unitaire pv ht − coût d'achat ht 60 − 40 = 20 € taux de marge marge / coût d'achat ht × 100 20 / 40 = 50 % taux de marque marge / pv ht × 100 20 / 60 = 33,3 % prix ttc (tva 20 %) pv ht × 1,20 60 × 1,20 = 72 € prix ht depuis le ttc pv ttc / 1,20 72 / 1,20 = 60 € coefficient multiplicateur pv ttc / coût d'achat ht 72 / 40 = 1,8 évolution (valeur finale − valeur initiale) / valeur initiale × 100 de 200 à 230 : + 15 % panier moyen ca / nombre de ventes 4 500 / 150 = 30 € taux de transformation acheteurs / visiteurs × 100 45 / 300 = 15 % part de marché ca de l'entreprise / ca du marché × 100 2 m / 20 m = 10 % marge sur coût variable ca − charges variables 100 000 − 60 000 = 40 000 € seuil de rentabilité charges fixes / taux de marge sur coût variable 30 000 / 0,40 = 75 000 € de ca retour sur investissement (marge générée − coût) / coût × 100 (6 000 − 4 000) / 4 000 = 50 % coût par contact coût de l'action / nombre de contacts 4 000 / 200 = 20 € les réductions rabais · pour un défaut de qualité ou de conformité remise · pour une quantité ou un client fidèle, sur la facture ristourne · en fin de période, sur le ca cumulé escompte · pour un paiement anticipé le piège classique deux remises successives de 10 % ne font pas 20 % : la seconde s'applique au prix déjà réduit. 100 € − 10 % = 90 €, puis − 10 % = 81 €, soit 19 % au total."},{"t":"Le droit utile pour vendre","h":"<p class=\"kick tP\">Droit<\/p>\n<h1>Le droit utile pour vendre<\/h1>\n<h2>Prospecter dans les règles<\/h2>\n<table class=\"tb\">\n<tr><th>Canal<\/th><th>Vers un particulier (B2C)<\/th><th>Vers un professionnel (B2B)<\/th><\/tr>\n<tr><td data-label=\"Canal\">E-mail, SMS<\/td><td data-label=\"Vers un particulier (B2C)\">Consentement préalable obligatoire (case non pré-cochée). Exception : un client déjà existant, pour des produits analogues<\/td><td data-label=\"Vers un professionnel (B2B)\">Possible sans accord préalable si le message concerne sa profession ; il doit être informé et pouvoir s'opposer<\/td><\/tr>\n<tr><td data-label=\"Canal\">Téléphone<\/td><td data-label=\"Vers un particulier (B2C)\"><b>Depuis le 11 août 2026<\/b> : consentement préalable obligatoire. Bloctel a disparu<\/td><td data-label=\"Vers un professionnel (B2B)\">Possible, avec droit d'opposition<\/td><\/tr>\n<tr><td data-label=\"Canal\">Dans tous les cas<\/td><td data-label=\"Vers un particulier (B2C)\" colspan=\"2\">Identifier l'émetteur, offrir un moyen simple de se désinscrire, collecter le minimum de données (RGPD)<\/td><\/tr>\n<\/table>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Contrat de vente<\/span><h3>Les bases<\/h3><div c
